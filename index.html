\nビスケットの一袋\n\n「アメリカ英語では、書類一式や情報のまとまりを packet と呼ぶ場合もあります。」\n\nThe teacher handed out information packets.\n\n先生は資料一式を配りました。\n\n「parcel は配送される小包、packet は小さな包みや情報のまとまりという違いがあります。」\n\nshipment\n\nシップメント\n\n核イメージ：輸送される貨物、または出荷・輸送\n\nThe shipment arrived at the warehouse.\n\n貨物が倉庫に到着しました。\n\n「先輩、shipment は物流やビジネスで重要な単語です。」\n\n「parcel は個々の小包に注目しますが、shipment は輸送される貨物のまとまりや出荷そのものに注目します。」\n\nThe company shipped 500 units in one shipment.\n\nその会社は500個の商品を一度の出荷で送りました。\n\n「大量の商品をまとめて輸送する場面では、shipment がよく使われます。」\n\ndelivery\n\nディリヴァリー\n\n核イメージ：荷物や商品を目的地に届けること\n\nThe delivery is scheduled for tomorrow.\n\n配達は明日の予定です。\n\n「先輩、delivery は荷物そのものより、『届ける行為・サービス』に注目することが多いです。」\n\nThe parcel is ready for delivery.\n\nその小包は配達の準備ができています。\n\n「この文では、parcel が荷物、delivery が配達です。」\n\n「ただし、a delivery が『配達された品物』を指す場合もあります。文脈で判断してくださいね。」\n\nbundle\n\nバンドル\n\n核イメージ：複数のものを束ねたひとまとまり\n\nHe carried a bundle of newspapers.\n\n彼は新聞の束を運んでいました。\n\n「bundle は、複数のものをまとめたり束ねたりした状態に注目します。」\n\nThe software is sold as a bundle.\n\nそのソフトウェアはセット商品として販売されています。\n\n「先輩、parcel は配送する小包、bundle は束ねたものやセットになったものです。」\n\n「どちらも『まとまり』ですが、bundle の方が複数のものを一緒にした感覚が強いんです。」\n\n### 同じ場面で比較\n\n「先輩、ネット通販で商品を購入した場面を想像してください。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| parcel | My parcel arrived. | 小包・荷物 |\n| package | My package arrived. | 包装された荷物 |\n| packet | I opened a packet of sugar. | 小さな包み・袋 |\n| shipment | The shipment was delayed. | 出荷・輸送貨物 |\n| delivery | Delivery is scheduled for Monday. | 配達・届けること |\n| bundle | I bought a bundle of products. | まとめられたセット |\n\n「先輩、特に parcel・shipment・delivery は、物流の文章を読むときに区別できると便利ですよ。」\n\n## 理解確認｜3問\n\nQ1. 『昨日、小包を受け取った』として自然なのは？\n\nI received a parcel yesterday.I received a deliverying yesterday.I received a land yesterday.\n\nQ2. parcel と shipment の違いは？\n\n完全に同じ使い方parcel は個々の小包、shipment は出荷・輸送される貨物のまとまりに注目shipment は土地の一区画だけを意味する\n\nQ3. part and parcel of the job の意味は？\n\nその仕事につきものその仕事を郵送することその仕事の土地を購入すること\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- parcel：小包、荷物、土地の一区画\n- parcels：小包の複数形\n- send a parcel：小包を送る\n- receive a parcel：小包を受け取る\n- track a parcel：小包の配送状況を追跡する\n- a parcel of land：土地の一区画\n- parcel out：分割して配る\n- part and parcel of ～：～につきもの\n- package：包装された荷物、セット\n- packet：小さな包み・袋\n- shipment：出荷、輸送貨物\n- delivery：配達、配送\n- bundle：束、セット\n\n一文記憶\n\nI received a parcel containing several books.\n\n私は数冊の本が入った小包を受け取りました。\n\n「先輩、今日のポイントは、parcel が『区切られたひとまとまり』というイメージを持つことです。」\n\n「荷物なら一つの小包、土地なら一区画、parcel out なら全体を分けて配る。こう考えれば、意味をばらばらに暗記しなくて済みますね。」\n\n次は 第43語｜Develop です。"}, {"name": "Develop", "text": "# 第43語｜Develop\n\n発音：/dɪˈveləp/（ディヴェロップ）｜動詞\n\n「先輩、今日の単語は develop です。『開発する』という意味はご存じかもしれませんね。」\n\n「ですが、develop は『成長する』『発達する』『能力を身につける』『病気を発症する』など、かなり幅広い場面で使われる重要単語なんです。」\n\nThe company developed a new product.\n\nその会社は新製品を開発しました。\n\nChildren develop at different rates.\n\n子どもはそれぞれ異なる速度で発達します。\n\n「先輩、製品開発と子どもの成長は、別々の意味に見えませんか？」\n\n「実は、共通するイメージがあります。それは、まだ完成していないものが、時間や過程を経て形になり、変化していくことです。」\n\n「今日は develop の意味の広がりと、grow、improve、create、evolve との違いを理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、develop には大きく6つの意味があります。」\n\n① 開発する\n\nThey developed a new app.\n\n彼らは新しいアプリを開発しました。\n\n「アイデアや技術を、実際に使えるものへと形にすることです。」\n\n② 成長する・発達する\n\nThe baby is developing normally.\n\nその赤ちゃんは順調に発達しています。\n\n「体や能力が時間とともに変化し、育っていくことですね。」\n\n③ 能力・習慣などを身につける\n\nI want to develop my English skills.\n\n私は英語力を伸ばしたいです。\n\n「練習や経験を通じて、能力を育てるイメージです。」\n\n④ 発展する・発達させる\n\nThe city developed rapidly.\n\nその都市は急速に発展しました。\n\n「都市や経済、産業などが発展する場合にも使います。」\n\n⑤ 病気・問題などが生じる\n\nHe developed a fever.\n\n彼は熱が出ました。\n\n「先輩、ここは注意です。develop は必ずしも良い変化を表すわけではありません。」\n\n⑥ 状況・事態が展開する\n\nThe situation developed unexpectedly.\n\n状況は予想外の方向に展開しました。\n\n「物事が時間の経過とともに変化していくことを表します。」\n\n核イメージ：時間や過程を経て、何かが形になったり、変化したりする\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは develop と似た単語を比較します。」\n\n「特に grow、improve、create は日本語訳が重なることがありますが、どの段階に注目するかが違うんです。」\n\ndevelop\n\nディヴェロップ\n\n核イメージ：過程を経て形になる・発達する\n\nThe company developed a new technology.\n\nその会社は新しい技術を開発しました。\n\n「先輩、develop は完成までの過程や、時間をかけた変化に注目する単語です。」\n\ngrow\n\nグロウ\n\n核イメージ：大きくなる・量が増える・成長する\n\nThe company grew rapidly.\n\nその会社は急速に成長しました。\n\n「grow は、規模や数量が増えること、あるいは生物が成長することに注目します。」\n\nThe child is growing quickly.\n\nその子どもは急速に成長しています。\n\n「develop は能力や構造が発達すること、grow は大きさや規模が増えることを強調しやすいんです。」\n\nThe company developed new products as it grew.\n\nその会社は成長する中で新製品を開発しました。\n\n「先輩、両方を同じ文で使うこともできますよ。」\n\nimprove\n\nインプルーヴ\n\n核イメージ：今より良い状態にする\n\nWe need to improve the system.\n\n私たちはそのシステムを改善する必要があります。\n\n「先輩、improve は『良くする』という方向が明確です。」\n\n「develop は新しく作ることや発達することにも使えますが、improve は既存のものをより良い状態にすることに重点があります。」\n\nWe developed a new system.\n\n私たちは新しいシステムを開発しました。\n\nWe improved the existing system.\n\n私たちは既存のシステムを改善しました。\n\n「この違いは仕事で特に重要ですね。」\n\ncreate\n\nクリエイト\n\n核イメージ：新しいものを生み出す\n\nShe created a new design.\n\n彼女は新しいデザインを作りました。\n\n「create は、何かを新しく生み出すことに注目します。」\n\nThe team developed a new product.\n\nチームは新製品を開発しました。\n\n「develop は、アイデアを検討し、試作し、改良するような過程を含むことが多いです。」\n\n「create は生み出すこと、develop は形になるまで育てること。こう区別すると理解しやすいですよ。」\n\nevolve\n\nイヴォルヴ\n\n核イメージ：時間をかけて形や性質が変化する\n\nTechnology continues to evolve.\n\n技術は進化し続けています。\n\n「evolve は、長い時間をかけた段階的な変化や進化を表します。」\n\nThe company evolved from a small shop into a global brand.\n\nその会社は小さな店から世界的なブランドへと発展しました。\n\n「develop も発展を表せますが、evolve は段階的に姿を変えていくことを強調します。」\n\n「なお、evolve も必ずしも『良い方向への進化』だけを意味するわけではありません。」\n\nexpand\n\nイクスパンド\n\n核イメージ：範囲・規模・領域を広げる\n\nThe company expanded its business overseas.\n\nその会社は海外へ事業を拡大しました。\n\n「expand は、広さや範囲が拡大することに注目します。」\n\nThe company developed its overseas business.\n\nその会社は海外事業を発展させました。\n\n「こちらの develop は、事業の内容や仕組みを育てていく感覚です。」\n\n「先輩、expand は広げる、develop は育てる。この違いですね。」\n\n### 同じ場面で比較\n\n「先輩、会社が新しい事業を始める場面で整理してみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| develop | Develop a new product. | 開発の過程 |\n| grow | Grow the business. | 規模の成長 |\n| improve | Improve the product. | 品質・状態の改善 |\n| create | Create a new product. | 新しいものの創出 |\n| evolve | The business evolved. | 段階的な変化 |\n| expand | Expand the business. | 事業範囲の拡大 |\n\n「先輩、例えば『新製品を開発して、品質を改善し、販売地域を拡大した』なら、develop、improve、expand をそれぞれ使い分けられます。」\n\nWe developed a new product, improved its quality, and expanded our market.\n\n私たちは新製品を開発し、その品質を改善して、市場を拡大しました。\n\n「同じ会社の活動でも、どの変化に注目するかによって動詞が変わるんです。」\n\n## 理解確認｜3問\n\nQ1. 『その会社は新製品を開発した』として自然なのは？\n\nThe company developed a new product.The company buried a new product.The company fiercely a new product.\n\nQ2. develop と improve の違いとして最も適切なのは？\n\n完全に同じ意味develop は発達・開発の過程、improve はより良い状態にすることに注目improve は病気を発症するという意味\n\nQ3. 『彼は金融に興味を持つようになった』として自然なのは？\n\nHe developed an interest in finance.He developed finance into interest.He developed interested on finance.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- develop：開発する、発達する、成長する、発症する\n- development：開発、発展、発達\n- developed：発達した、開発された\n- developing：発展中の、開発中の\n- develop skills：能力を伸ばす\n- develop a habit：習慣が身につく\n- develop an interest in ～：～に興味を持つようになる\n- develop into ～：～へと発展する\n- develop a disease：病気を発症する\n- grow：大きくなる、成長する\n- improve：改善する\n- create：生み出す\n- evolve：段階的に変化する\n- expand：拡大する\n\n一文記憶\n\nWe develop our skills through practice and experience.\n\n私たちは練習と経験を通じて能力を伸ばします。\n\n「先輩、develop を見たら、『開発する』だけで終わらせないでください。」\n\n「時間や過程を経て、何かが形になったり変化したりする。このイメージがあれば、製品開発、能力の発達、経済発展、病気の発症までつながります。」\n\n「それから、develop は必ずしも良い変化を意味しないことも重要ですよ。」\n\n次は 第44語｜Familiar です。"}, {"name": "Familiar", "text": "# 第44語｜Familiar\n\n発音：/fəˈmɪliər/（ファミリア）｜形容詞\n\n「先輩、今日の単語は familiar です。『よく知っている』『見覚えがある』『なじみのある』という意味ですね。」\n\n「でも先輩、次の二つの英文を見てください。」\n\nThis place looks familiar.\n\nこの場所には見覚えがあります。\n\nI'm familiar with this system.\n\n私はこのシステムをよく知っています。\n\n「どちらも familiar ですが、主語が違いますよね。」\n\n「実は、familiar は『見覚えがある対象』にも『その対象を知っている人』にも使えるんです。」\n\n「今日はこの違いと、familiar、similar、common、accustomed などの使い分けを理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な意味を4つ押さえましょう。」\n\n① 見覚えがある・聞き覚えがある\n\nHis face looks familiar.\n\n彼の顔には見覚えがあります。\n\n「以前どこかで見たような感覚ですね。誰なのかを思い出せなくても使えます。」\n\n② よく知っている・詳しい\n\nI'm familiar with Excel.\n\n私はExcelをよく知っています。\n\n「be familiar with ～ で『～をよく知っている』『～に精通している』という意味になります。」\n\n③ なじみのある・慣れ親しんだ\n\nI miss the familiar streets of my hometown.\n\n故郷の見慣れた通りが恋しいです。\n\n「長い間接してきたので、親しみを感じるという意味です。」\n\n④ 親しげな・なれなれしい\n\nHe was too familiar with the customers.\n\n彼は顧客に対してなれなれしすぎました。\n\n「先輩、familiar には、距離感が近すぎるという否定的な意味もあります。」\n\n核イメージ：以前から知っていて、未知のものではない\n\n「先輩、familiar は必ずしも『好き』という意味ではありません。あくまで、知っている・なじみがあるという感覚が中心です。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「familiar と似た単語には、『知っている』『慣れている』『似ている』『よくある』などがあります。でも、意味の中心はそれぞれ違うんです。」\n\nfamiliar\n\nファミリア\n\n核イメージ：以前から知っていて、なじみがある\n\nI'm familiar with this system.\n\n私はこのシステムをよく知っています。\n\n「先輩、知識や経験があるため、未知のものではないという感覚です。」\n\nsimilar\n\nスィミラー\n\n核イメージ：二つ以上のものが似ている\n\nThis building is similar to the one near my house.\n\nこの建物は私の家の近くにある建物に似ています。\n\n「先輩、similar は『知っているかどうか』ではなく、『二つのものが似ているか』に注目します。」\n\nThis place looks familiar.\n\nこの場所には見覚えがあります。\n\nThis place looks similar to my hometown.\n\nこの場所は私の故郷に似ています。\n\n「familiar は見覚え、similar は類似性。ここを混同しないでくださいね。」\n\ncommon\n\nカモン\n\n核イメージ：多くの人や場所に共通している・よく見られる\n\nThis is a common mistake.\n\nこれはよくある間違いです。\n\n「common は、頻度や一般性に注目します。」\n\nThis is a familiar mistake.\n\nこれは見覚えのある間違いです。\n\n「こちらは『以前にも見たことがある間違い』という意味になります。」\n\n「先輩、common は多くの人に起こる、familiar は自分や特定の人にとって見覚えがある、という違いです。」\n\naccustomed\n\nアカスタムド\n\n核イメージ：繰り返し経験して、慣れている\n\nI'm accustomed to working under pressure.\n\n私はプレッシャーの中で働くことに慣れています。\n\n「accustomed to ～ は、環境や行動に慣れているという意味です。」\n\n「familiar with ～ は、対象を知っている・経験があるという意味です。」\n\nI'm familiar with the software.\n\n私はそのソフトウェアをよく知っています。\n\nI'm accustomed to using the software every day.\n\n私はそのソフトウェアを毎日使うことに慣れています。\n\n「先輩、知っていることと、日常的に行うことに慣れていることは違いますよね。」\n\nrecognizable\n\nレコグナイザブル\n\n核イメージ：見たり聞いたりすれば、それと分かる\n\nHer voice is instantly recognizable.\n\n彼女の声は聞けばすぐに誰の声か分かります。\n\n「recognizable は『識別できる』という意味です。」\n\n「familiar は見覚えや聞き覚えがある状態ですが、recognizable はそれが何か、誰かを認識できることに重点があります。」\n\nHis face looks familiar, but I can't recognize him.\n\n彼の顔には見覚えがありますが、誰なのか分かりません。\n\n「先輩、このように familiar でも、必ずしも正体を思い出せるとは限らないんです。」\n\nknowledgeable\n\nナレジャブル\n\n核イメージ：十分な知識を持っている\n\nShe is knowledgeable about finance.\n\n彼女は金融について豊富な知識を持っています。\n\n「knowledgeable は、知識の豊富さを表します。」\n\nI'm familiar with accounting.\n\n私は会計についてある程度知っています。\n\nI'm knowledgeable about accounting.\n\n私は会計について豊富な知識を持っています。\n\n「先輩、familiar は知っている状態、knowledgeable は十分な知識がある状態を強調します。」\n\n「だから、familiar と言っただけで専門家だとは限りません。」\n\n### 同じ場面で比較\n\n「先輩、新しい業務システムについて話す場面を想像してください。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| familiar | I'm familiar with it. | 知識や経験がある |\n| similar | It's similar to the old system. | 別のシステムに似ている |\n| common | It's a common system. | 広く使われている |\n| accustomed | I'm accustomed to using it. | 使用することに慣れている |\n| recognizable | The interface is recognizable. | 見れば識別できる |\n| knowledgeable | I'm knowledgeable about it. | 豊富な知識がある |\n\n「先輩、特に familiar with と similar to の違いは、必ず覚えてください。」\n\nI'm familiar with this software.\n\n私はこのソフトウェアをよく知っています。\n\nThis software is similar to the one I used before.\n\nこのソフトウェアは以前使っていたものに似ています。\n\n「前者は知識、後者は類似性です。ここが違います。」\n\n## 理解確認｜3問\n\nQ1. 『私はこの手順をよく知っています』として自然なのは？\n\nI'm familiar with this procedure.I'm familiar to this procedure.I'm similar with this procedure.\n\nQ2. familiar と similar の違いは？\n\n完全に同じ意味familiar は見覚え・知識、similar は二つのものの類似性similar は仕事に慣れているという意味\n\nQ3. 『その名前には聞き覚えがあります』として自然なのは？\n\nThat name sounds familiar.That name sounds accustomed.That name sounds knowledgeable.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- familiar：見覚えがある、よく知っている、なじみのある\n- be familiar with ～：～をよく知っている\n- be familiar to ～：～にとってなじみがある\n- look familiar：見覚えがある\n- sound familiar：聞き覚えがある\n- become familiar with ～：～に詳しくなる\n- unfamiliar：なじみがない、よく知らない\n- familiarity：なじみ、熟知\n- similar：似ている\n- common：よくある、一般的な\n- accustomed：慣れている\n- recognizable：識別できる\n- knowledgeable：豊富な知識がある\n\n一文記憶\n\nI'm familiar with this system because I've used it before.\n\n私は以前このシステムを使ったことがあるので、よく知っています。\n\n「先輩、今日のポイントは familiar = 以前から知っていて、未知のものではない という感覚です。」\n\n「そして、I'm familiar with it. と It's familiar to me. の違いを忘れないでください。」\n\n「知っている人を主語にするのか、なじみのある対象を主語にするのか。そこが分かれば、familiar を自然に使えるようになりますよ。」\n\n次は 第45語｜Detect です。"}, {"name": "Detect", "text": "# 第45語｜Detect\n\n発音：/dɪˈtekt/（ディテクト）｜動詞\n\n「先輩、今日の単語は detect です。基本的な意味は『検出する』『発見する』『感知する』です。」\n\n「でも、find と同じ『見つける』で覚えてしまうと、重要なニュアンスを見落としてしまいますよ。」\n\nThe system detected an error.\n\nそのシステムはエラーを検出しました。\n\nThe doctor detected signs of infection.\n\n医師は感染の兆候を発見しました。\n\n「先輩、どちらも最初からはっきり見えていたわけではないものを見つけていますよね。」\n\n「detect の核となるイメージは、すぐには分からないものの存在や兆候を、観察・検査・機器などによって見つけ出すことです。」\n\n「今日は find、discover、notice、identify、recognize との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、detect の使い方は大きく4つに整理できます。」\n\n① 異常・問題を検出する\n\nThe software detected a security threat.\n\nそのソフトウェアはセキュリティ上の脅威を検出しました。\n\n「目に見えない問題や、気づきにくい異常を見つける場合ですね。」\n\n② 機器で感知する\n\nThe sensor detects movement.\n\nそのセンサーは動きを感知します。\n\n「センサー、カメラ、検査装置などが何かの存在を捉える場合にも使います。」\n\n③ 兆候を察知する\n\nI detected a slight change in his attitude.\n\n私は彼の態度にわずかな変化を感じ取りました。\n\n「先輩、機械だけではありません。人間が微妙な変化を察知するときにも使えるんです。」\n\n④ 調査・検査によって発見する\n\nThe test detected a small amount of the substance.\n\nその検査では、その物質が少量検出されました。\n\n「科学、医療、品質管理などでよく使われます。」\n\n核イメージ：隠れているもの・気づきにくいものの存在を捉える\n\n「先輩、重要なのは『見つけた』という結果だけでなく、発見しにくいものを捉えたという点ですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは『見つける』『気づく』に関係する単語を比較します。」\n\n「似た意味でも、発見する対象・方法・発見後にどこまで分かったかによって、使う単語が変わるんです。」\n\ndetect\n\nディテクト\n\n核イメージ：見つけにくいものの存在や兆候を捉える\n\nThe system detected an error.\n\nシステムはエラーを検出しました。\n\n「先輩、検査・観察・センサーなどによって異常や兆候を見つける場合によく使います。」\n\nfind\n\nファインド\n\n核イメージ：探していたものや、存在するものを見つける\n\nI found my wallet under the desk.\n\n私は机の下で財布を見つけました。\n\n「find は、日常的な『見つける』を幅広く表します。」\n\nWe found a mistake in the report.\n\n私たちは報告書の間違いを見つけました。\n\n「先輩、detect と意味が重なることもありますが、find は必ずしも高度な検査や隠れた兆候を連想させません。」\n\n「単純に『見つけた』なら、まず find を考えるといいですね。」\n\ndiscover\n\nディスカヴァー\n\n核イメージ：それまで知られていなかった事実やものを発見する\n\nScientists discovered a new species.\n\n科学者たちは新種を発見しました。\n\n「discover は、新しい知識や事実を得ることに注目します。」\n\nThe researchers discovered a new treatment method.\n\n研究者たちは新しい治療法を発見しました。\n\n「先輩、detect は『存在や兆候を捉える』こと、discover は『それまで知らなかった事実を明らかにする』ことに重点があります。」\n\n「例えば、装置が未知の信号を detect し、その信号の正体について新しい事実を discover する、という流れも考えられます。」\n\nnotice\n\nノウティス\n\n核イメージ：見たり聞いたりして、あることに気づく\n\nI noticed a small mistake in the document.\n\n私は書類の小さな間違いに気づきました。\n\n「notice は、意識が向いて『あ、そうだ』と気づく感覚です。」\n\nShe noticed that he looked tired.\n\n彼女は彼が疲れているように見えることに気づきました。\n\n「先輩、detect は隠れた兆候や異常を捉えるニュアンスが強く、notice は知覚によって気づくことを広く表します。」\n\n「人の表情の変化なら、両方使える場合がありますが、detect の方が微妙な兆候を読み取った印象になりやすいです。」\n\nidentify\n\nアイデンティファイ\n\n核イメージ：何なのか・誰なのかを特定する\n\nThe police identified the suspect.\n\n警察は容疑者を特定しました。\n\n「identify は、対象の正体や種類を明らかにすることに注目します。」\n\nThe system detected a problem but couldn't identify the cause.\n\nシステムは問題を検出しましたが、原因を特定できませんでした。\n\n「先輩、この違いは非常に重要です。」\n\n「detect は『何かある』と捉えること、identify は『それが何か』を特定することです。」\n\n「検出と特定は、必ずしも同時にできるとは限らないんですよ。」\n\nrecognize\n\nレコグナイズ\n\n核イメージ：以前の知識や経験と結びつけて、それと分かる\n\nI recognized her voice immediately.\n\n私はすぐに彼女の声だと分かりました。\n\n「recognize は、知っているものを見聞きして認識することを表します。」\n\nThe software can recognize faces.\n\nそのソフトウェアは顔を認識できます。\n\n「先輩、detect a face なら『顔が存在することを検出する』。」\n\n「recognize a face なら、顔の特徴を認識することです。文脈によっては誰の顔かを判別する意味にもなります。」\n\n「つまり、検出と認識は別の処理なんです。」\n\n### 同じ場面で比較\n\n「先輩、システムが異常を調べる場面で整理しましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| detect | The system detected an error. | 異常の存在を検出 |\n| find | We found an error. | 間違いを見つけた |\n| discover | We discovered a hidden flaw. | 知らなかった欠陥を発見 |\n| notice | I noticed an error. | 間違いに気づいた |\n| identify | We identified the cause. | 原因を特定した |\n| recognize | The system recognized the pattern. | パターンを認識した |\n\n「先輩、特に detect と identify の違いは、ITや品質管理の英文を読むときに重要です。」\n\nThe sensor detected a problem, and the engineer identified its cause.\n\nセンサーが問題を検出し、技術者がその原因を特定しました。\n\n「先輩、検出した段階では問題の存在が分かっただけで、原因はまだ分かっていないかもしれません。」\n\n「だから、detect と identify は分けて考える必要があるんです。」\n\n## 理解確認｜3問\n\nQ1. 『システムがエラーを検出した』として自然なのは？\n\nThe system detected an error.The system familiar an error.The system parcel an error.\n\nQ2. detect と identify の違いとして最も適切なのは？\n\n完全に同じ意味detect は存在や兆候を捉える、identify は正体や原因を特定するidentify は小包を送るという意味\n\nQ3. 『そのセンサーは動きを感知する』として自然なのは？\n\nThe sensor detects movement.The sensor develops movement into.The sensor is familiar movement.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- detect：検出する、発見する、感知する、察知する\n- detection：検出、発見\n- detector：検出器、探知機\n- detectable：検出可能な\n- undetectable：検出できない\n- detect an error：エラーを検出する\n- detect a problem：問題を検出する\n- detect movement：動きを感知する\n- early detection：早期発見\n- find：見つける\n- discover：未知の事実を発見する\n- notice：気づく\n- identify：特定する\n- recognize：認識する\n\n一文記憶\n\nThe system detected a problem before it became serious.\n\nそのシステムは問題が深刻になる前に検出しました。\n\n「先輩、今日のポイントは、detect が単なる『見つける』ではなく、見つけにくいものの存在や兆候を捉えるという意味を持つことです。」\n\n「そして、検出したからといって、正体や原因まで特定できたとは限りません。」\n\n「detect は検出、identify は特定。この違いをしっかり覚えてくださいね。」\n\n次は 第46語｜Reimbursement です。"}, {"name": "Reimbursement", "text": "# 第46語｜Reimbursement\n\n発音：/ˌriːɪmˈbɝːsmənt/（リーインバースメント）｜名詞\n\n「先輩、今日の単語は reimbursement です。意味は 『立て替えた費用の払い戻し』『経費の精算』『費用の償還』 です。」\n\n「特に会社の経理、出張費、交通費、医療費などの英文でよく登場します。」\n\nI submitted a request for reimbursement.\n\n私は経費の払い戻しを申請しました。\n\nThe company reimbursed me for my travel expenses.\n\n会社は私が立て替えた出張費を払い戻してくれました。\n\n「先輩、ここで一つ質問です。」\n\n「会社からお金を受け取るなら、payment や salary と何が違うのでしょう？」\n\n「答えは、自分が先に支払った費用を、後から負担すべき相手に返してもらうという点です。」\n\n「今日は refund、compensation、repayment、allowance との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの使い方を覚えてください。」\n\n① 経費の払い戻し\n\nEmployees can request reimbursement for business expenses.\n\n従業員は業務上の経費の払い戻しを申請できます。\n\n「会社のために従業員が先に支払った費用を、後から会社が負担する場合ですね。」\n\n② 医療費などの償還\n\nThe insurance company approved the reimbursement.\n\n保険会社は費用の払い戻しを承認しました。\n\n「保険の契約条件に従って、支払った費用が後から戻ってくる場合にも使います。」\n\n③ 払い戻される金額そのもの\n\nThe reimbursement was $150.\n\n払い戻し額は150ドルでした。\n\n「先輩、reimbursement は払い戻しという仕組みだけでなく、払い戻される金額を指すこともあります。」\n\n核イメージ：先に負担した費用を、後から返してもらう\n\n「給与や報酬のように、新たに稼いだお金ではないという点が重要です。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「reimbursement、refund、compensation、repayment は、どれも『お金を受け取る』『返してもらう』という場面で登場します。」\n\n「ですが、なぜお金が戻ってくるのかが違うんです。」\n\nreimbursement\n\nリーインバースメント\n\n核イメージ：立て替えた費用を後から返してもらう\n\nI received reimbursement for my travel expenses.\n\n私は出張費の払い戻しを受けました。\n\n「先輩、会社の経費精算や、保険による費用の償還が典型例です。」\n\nrefund\n\nリーファンド\n\n核イメージ：購入代金など、すでに支払ったお金が戻る\n\nI requested a refund for the defective product.\n\n私は不良品の返金を求めました。\n\n「先輩、refund は返品、キャンセル、過払いなどによって支払った代金が戻る場面でよく使います。」\n\nThe store gave me a full refund.\n\n店は私に全額返金してくれました。\n\n「reimbursement は費用の立て替えや負担の精算、refund は購入代金などの返金に注目するんです。」\n\n「ただし、実際には両方の語が使える場面もあります。」\n\ncompensation\n\nカンペンセイション\n\n核イメージ：損失・被害・労働などに対する埋め合わせや対価\n\nThe company paid compensation for the damage.\n\n会社はその損害に対して補償金を支払いました。\n\n「compensation は『補償』『賠償』『報酬』などを表します。」\n\nEmployees receive compensation for their work.\n\n従業員は労働に対する報酬を受け取ります。\n\n「先輩、reimbursement は実際に負担した費用の払い戻しに重点があります。」\n\n「一方、compensation は損害の埋め合わせや、労働の対価など、より広い意味を持つんです。」\n\n「金額も、必ずしも立て替えた費用と一致するわけではありません。」\n\nrepayment\n\nリーペイメント\n\n核イメージ：借りたお金や負債を返す\n\nHe made a repayment on his loan.\n\n彼はローンの返済を行いました。\n\n「repayment は『返済』という意味でよく使います。」\n\nThe loan repayment is due next month.\n\nローンの返済期限は来月です。\n\n「先輩、reimbursement は立て替えた経費を返してもらうこと。」\n\n「repayment は借りたお金を返すことです。」\n\n「同じ『返す』でも、元のお金の性質が違うんですね。」\n\nallowance\n\nアラウアンス\n\n核イメージ：一定の目的のために支給される手当・一定額\n\nEmployees receive a monthly transportation allowance.\n\n従業員には毎月、通勤手当が支給されます。\n\n「allowance は、一定の目的のために支給される手当や、認められた金額を表します。」\n\nThe company provides a meal allowance.\n\n会社は食事手当を支給しています。\n\n「先輩、reimbursement は実際に支払った費用を後から精算する形が典型的です。」\n\n「allowance は、一定額をあらかじめ、または定期的に支給する場合などにも使われます。」\n\n「ただし、会社の制度によって支給方法は異なりますよ。」\n\npayment\n\nペイメント\n\n核イメージ：お金を支払うこと全般\n\nThe payment will be made tomorrow.\n\n支払いは明日行われます。\n\n「payment は最も広い単語です。」\n\n「商品の代金、サービス料金、給与、返済など、さまざまな支払いに使えます。」\n\nThe reimbursement payment was delayed.\n\n払い戻しの支払いが遅れました。\n\n「先輩、payment は『支払い』という行為そのもの。」\n\n「reimbursement は、その支払いが『立て替えた費用の払い戻し』であることまで表しているんです。」\n\n### 同じ場面で比較\n\n「先輩、会社からお金を受け取る場合でも、理由によって英語が変わります。」\n\n| 単語 | 何のお金か | 典型的な場面 |\n| --- | --- | --- |\n| reimbursement | 立て替えた費用の払い戻し | 出張費・経費精算 |\n| refund | 支払済み代金の返金 | 返品・キャンセル |\n| compensation | 損害の補償・労働の対価 | 損害補償・報酬 |\n| repayment | 借入金などの返済 | ローン・借金 |\n| allowance | 特定目的の手当 | 通勤手当・食事手当 |\n| payment | 支払い全般 | 代金・料金など |\n\n「先輩、特に reimbursement と refund は混同しやすいので、具体例で覚えましょう。」\n\nI bought a defective laptop and received a refund.\n\n不良品のノートパソコンを購入し、返金を受けました。\n\nI bought a laptop for work and received reimbursement from my company.\n\n仕事用のノートパソコンを購入し、会社から費用の払い戻しを受けました。\n\n「前者は店から購入代金が戻っています。後者は会社のために支払った費用を会社が負担しています。」\n\n「同じノートパソコンでも、お金が戻る理由が違うんです。」\n\n## 理解確認｜3問\n\nQ1. 『出張費の払い戻しを申請した』として自然なのは？\n\nI requested reimbursement for my travel expenses.I requested a salary for my travel expenses.I requested a loan repayment for my travel expenses.\n\nQ2. reimbursement と refund の違いは？\n\n完全に同じ意味で、常に置き換えられるreimbursement は立て替えた費用の精算、refund は購入代金などの返金によく使うrefund は借金の返済だけを表す\n\nQ3. 『この費用は精算の対象です』として自然なのは？\n\nThis expense is reimbursable.This expense is familiar.This expense is fierce.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- reimbursement：立て替えた費用の払い戻し、経費精算\n- reimburse：払い戻す\n- reimburse 人 for 費用：人に費用を払い戻す\n- reimbursable：払い戻し可能な\n- request reimbursement：払い戻しを申請する\n- submit a reimbursement claim：経費精算の請求を提出する\n- receive reimbursement：払い戻しを受ける\n- full reimbursement：全額払い戻し\n- refund：購入代金などの返金\n- compensation：補償、賠償、報酬\n- repayment：借入金などの返済\n- allowance：手当\n- payment：支払い全般\n\n一文記憶\n\nI paid for the business trip myself and later received reimbursement from my company.\n\n私は出張費を自分で立て替え、後から会社から払い戻しを受けました。\n\n「先輩、reimbursement を見たら、まず 『先に自分が支払う → 後から返してもらう』 という流れを思い浮かべてください。」\n\n「そして、返品による返金なら refund、損害の補償なら compensation、借金の返済なら repayment です。」\n\n「お金が戻る理由まで理解していれば、経理の英文でも迷いにくくなりますよ。」\n\n次は 第47語｜Procedure です。"}, {"name": "Procedure", "text": "# 第47語｜Procedure\n\n発音：/prəˈsiːdʒər/（プロスィージャー）｜名詞\n\n「先輩、今日の単語は procedure です。仕事でもTOEICでも頻繁に登場する、重要な単語ですよ。」\n\n「意味は 『手順』『手続き』『決められた処理方法』 です。」\n\nPlease follow the correct procedure.\n\n正しい手順に従ってください。\n\nWe need to complete the application procedure.\n\n私たちは申請手続きを完了する必要があります。\n\n「先輩、ここで一つ考えてみてください。」\n\n「procedure と process は、どちらも『手順』『過程』と訳されます。では、何が違うのでしょう？」\n\n「答えは、\\*\\*procedure は『どう進めるべきかという決められた手順』、process は『物事が進んでいく一連の流れ』\\*\\*に重点があることです。」\n\n「今日は process、method、step、protocol、policy との違いまで整理しますね。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえましょう。」\n\n① 作業手順\n\nFollow the safety procedures.\n\n安全手順に従ってください。\n\n「作業を安全かつ正確に進めるために決められた順番や方法です。」\n\n② 事務手続き\n\nThe procedure requires several documents.\n\nその手続きには複数の書類が必要です。\n\n「申請、承認、登録などの事務処理でも使います。」\n\n③ 医療処置\n\nThe doctor explained the procedure.\n\n医師はその処置について説明しました。\n\n「先輩、procedure は医療分野では『処置』『施術』を表すこともあります。必ずしも手術だけを意味するわけではありません。」\n\n④ 正式な進め方・決められた手続き\n\nThere is a procedure for handling complaints.\n\n苦情に対応するための決められた手順があります。\n\n「個人の判断だけではなく、組織として定められた進め方を表すことが多いんです。」\n\n核イメージ：目的を達成するために決められた、一連の手順\n\n「先輩、procedure は単に『何をするか』ではなく、『どのような順序・方法で進めるか』に注目する単語です。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは『手順』『方法』『流れ』『規則』に関係する単語を比較します。」\n\n「似ているようでも、何を重視しているかが違いますよ。」\n\nprocedure\n\nプロスィージャー\n\n核イメージ：決められた順番・やり方\n\nPlease follow the procedure.\n\n手順に従ってください。\n\n「先輩、特に組織や業務で決められた、具体的な手続き・手順に注目します。」\n\nprocess\n\nプロセス\n\n核イメージ：始まりから終わりまでの一連の流れ\n\nThe hiring process takes several weeks.\n\n採用プロセスには数週間かかります。\n\n「process は、物事が進んでいく全体の流れに注目します。」\n\nThe company changed its hiring procedures.\n\nその会社は採用手続きを変更しました。\n\n「こちらの procedures は、具体的な申請方法や確認手順などを指します。」\n\n「先輩、process は全体の流れ、procedure は具体的な進め方と考えると理解しやすいですよ。」\n\n「ただし、両者は文脈によって重なります。」\n\nmethod\n\nメソッド\n\n核イメージ：目的を達成するための方法・手法\n\nWe developed a new method of analyzing data.\n\n私たちはデータを分析する新しい方法を開発しました。\n\n「method は『どんな方法で行うか』に注目します。」\n\n「例えば、データ分析には複数の methods があるかもしれません。」\n\n「一方、procedure は、その方法を実際に実施するときの順序や手続きまで含むことがあります。」\n\nThis method is effective, but the procedure is complicated.\n\nこの方法は効果的ですが、実施手順は複雑です。\n\n「先輩、方法が優れていても、実際の手順が簡単とは限りませんよね。」\n\nstep\n\nステップ\n\n核イメージ：一連の流れの中の一つの段階\n\nThe first step is to check the documents.\n\n最初の段階は書類を確認することです。\n\n「先輩、step は手順全体ではなく、その中の一つの段階を表します。」\n\nThe procedure consists of five steps.\n\nその手順は5つの段階で構成されています。\n\n「つまり、procedure は手順全体、step はその中の一工程という関係です。」\n\n「ただし、step 自体が『対策』『措置』を意味することもあります。」\n\nprotocol\n\nプロウトコール\n\n核イメージ：正式に定められた規約・手順\n\nThe hospital follows strict safety protocols.\n\nその病院は厳格な安全手順に従っています。\n\n「protocol は、医療、研究、外交、通信などの分野でよく使われます。」\n\n「procedure と似ていますが、protocol は標準化された正式な規約や取り決めという性格が強い場合があります。」\n\nThe devices communicate using the same protocol.\n\nそれらの機器は同じ通信プロトコルを使って通信します。\n\n「先輩、ITでいう protocol は、通信するためのルールや約束事です。」\n\n「作業手順そのものを意味するとは限りません。」\n\npolicy\n\nポリスィー\n\n核イメージ：組織が定める方針・規定\n\nThe company has a strict reimbursement policy.\n\nその会社には厳格な経費精算規定があります。\n\n「policy は『何を認めるか』『どのような方針で運営するか』を定めるものです。」\n\n「一方、procedure は『その方針に従って、具体的にどう行動するか』を定めます。」\n\nThe policy requires approval, and the procedure explains how to obtain it.\n\n規定では承認が必要とされており、手順にはその承認の取得方法が説明されています。\n\n「先輩、これは特に重要です。」\n\n「policy は方針・ルール、procedure は具体的な実行手順です。」\n\n### 一つの業務で比較\n\n「先輩、経費精算を例にして、単語の役割を整理しましょう。」\n\n| 単語 | 経費精算での意味 | 注目する点 |\n| --- | --- | --- |\n| policy | 経費精算規定 | 何が認められるか |\n| process | 経費精算の全体の流れ | 申請から支払いまで |\n| procedure | 具体的な申請・確認手順 | どう進めるか |\n| step | 領収書の添付などの一工程 | 個々の段階 |\n| method | 経費を処理する方法 | どんな方法を使うか |\n| protocol | 正式に定められた取り決め | 標準化されたルール |\n\n「先輩、ここで一つ例文です。」\n\nThe company updated its reimbursement policy and revised the approval procedure.\n\nその会社は経費精算規定を更新し、承認手順を見直しました。\n\n「policy は経費精算の規定、procedure は承認を進める具体的な手順です。」\n\n「両方を区別できれば、会社の英文資料も読みやすくなりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『正しい手順に従ってください』として自然なのは？\n\nPlease follow the correct procedure.Please develop the correct procedure yesterday.Please detect the correct procedure.\n\nQ2. procedure と process の違いとして最も適切なのは？\n\n完全に同じ意味で、常に置き換えられるprocedure は具体的な手順、process は一連の流れに注目するprocess は医療処置だけを表す\n\nQ3. policy と procedure の違いは？\n\npolicy は方針・規定、procedure は具体的な実行手順policy は一つの段階、procedure は給与どちらも必ず医療分野でしか使わない\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- procedure：手順、手続き、医療処置\n- procedures：複数の手順・手続き\n- procedural：手続き上の、手順に関する\n- follow a procedure：手順に従う\n- establish a procedure：手順を確立する\n- review a procedure：手順を見直す\n- standard operating procedure（SOP）：標準作業手順\n- application procedure：申請手続き\n- approval procedure：承認手続き\n- process：一連の流れ・過程\n- method：方法・手法\n- step：一つの段階\n- protocol：正式な規約・手順\n- policy：方針・規定\n\n一文記憶\n\nPlease follow the correct procedure to avoid mistakes.\n\nミスを防ぐために、正しい手順に従ってください。\n\n「先輩、procedure を見たら、\\*\\*『目的を達成するために決められた具体的な手順』\\*\\*を思い浮かべてください。」\n\n「そして、process は全体の流れ、method は方法、step は一工程、policy は方針・規定です。」\n\n「特に仕事では、手順を暗記するだけでなく、『なぜその工程が必要なのか』まで理解することが大切ですよ。」\n\n次は 第48語｜Expense です。"}, {"name": "Expense", "text": "# 第48語｜Expense\n\n発音：/ɪkˈspens/（イクスペンス）｜名詞\n\n「先輩、今日の単語は expense です。経理や会計、出張、日常の買い物など、幅広い場面で使われる重要な単語ですよ。」\n\n「基本的な意味は 『費用』『経費』『出費』 です。」\n\nThe company reduced its operating expenses.\n\nその会社は営業費用を削減しました。\n\nMy travel expenses were reimbursed.\n\n私の出張費は精算されました。\n\n「先輩、ここで一つ質問です。expense と cost は、どちらも『費用』と訳せますよね。では、違いは何でしょう？」\n\n「簡単に言えば、cost は『何かに必要な金額』、expense は『支出や会計上の費用』に注目することが多いんです。」\n\n「今日は cost、price、fee、charge、expenditure との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な意味を4つ押さえましょう。」\n\n① 費用・経費\n\nThe company has high operating expenses.\n\nその会社は営業費用が多額です。\n\n「事業を運営するために発生する費用ですね。」\n\n② 出費・支出\n\nMoving to a new city involves many expenses.\n\n新しい街への引っ越しには多くの出費が伴います。\n\n「生活の中で発生するさまざまな出費にも使います。」\n\n③ ～の費用で・～を犠牲にして\n\nat the expense of ～\n\n～を犠牲にして\n\nHe worked at the expense of his health.\n\n彼は健康を犠牲にして働きました。\n\n「先輩、expense はお金以外の『犠牲』『代償』という意味でも使われます。」\n\n④ 費用を負担する・経費として計上する\n\nThe company expensed the equipment purchase.\n\n会社はその設備購入額を費用として計上しました。\n\n「これは動詞としての使い方です。ただし、会計上、設備の購入額を直ちに費用計上できるかどうかは、会計基準や資産の性質によって異なります。」\n\n核イメージ：何かを行うために負担する費用や代償\n\n「先輩、expense は『お金が出ていくこと』だけでなく、『何かを得るために負担するもの』という感覚を持っています。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは expense と似た単語を比較します。」\n\n「『費用』と訳せる単語はたくさんありますが、何のお金なのか、どの立場から見ているのかによって使い分けるんです。」\n\nexpense\n\nイクスペンス\n\n核イメージ：負担する費用・出費\n\nThe company reduced its expenses.\n\nその会社は経費を削減しました。\n\n「先輩、会計や経費精算でよく使う単語です。」\n\ncost\n\nコスト\n\n核イメージ：何かを得たり実行したりするために必要な金額・負担\n\nThe cost of the project was higher than expected.\n\nそのプロジェクトの費用は予想より高くなりました。\n\n「cost は、商品やサービス、事業活動などにかかる金額を幅広く表します。」\n\nThe company reduced production costs.\n\nその会社は生産コストを削減しました。\n\n「先輩、expense は費用や出費としての側面を強調し、cost は必要な金額や原価に注目することが多いです。」\n\n「ただし、両者は重なる場面もあります。」\n\nprice\n\nプライス\n\n核イメージ：商品やサービスに付けられた価格\n\nThe price of this laptop is $1,000.\n\nこのノートパソコンの価格は1,000ドルです。\n\n「price は、商品やサービスの販売価格を表します。」\n\nThe price of the product increased.\n\nその商品の価格が上昇しました。\n\n「先輩、price は『いくらで売られているか』、expense は『どんな費用を負担したか』という違いです。」\n\n「例えば、会社がノートパソコンを購入した場合、販売店が提示した金額は price、会社側の支出や会計上の費用を考えるときは expense が関係します。」\n\nfee\n\nフィー\n\n核イメージ：特定のサービスや手続きに対して支払う料金\n\nThe bank charges a monthly fee.\n\nその銀行は月額手数料を請求します。\n\n「fee は、サービスの利用料、専門家への報酬、手数料などによく使います。」\n\nThe registration fee is $50.\n\n登録料は50ドルです。\n\n「先輩、fee は『何に対する料金か』が比較的はっきりしています。」\n\n「expense は、それを支払う側から見た出費や費用を表せます。」\n\nThe registration fee was included in my travel expenses.\n\n登録料は私の出張費に含まれていました。\n\n「このように、一つの fee が expenses の一部になることもあるんです。」\n\ncharge\n\nチャージ\n\n核イメージ：請求される料金・請求すること\n\nThere is an additional charge for delivery.\n\n配送には追加料金がかかります。\n\n「charge は、商品やサービスに対して請求される料金を表します。」\n\nThe hotel charged me for parking.\n\nホテルは私に駐車料金を請求しました。\n\n「先輩、charge は『請求する側の行為』にも注目できる単語です。」\n\n「expense は、その料金を支払う側から見た費用になることがあります。」\n\n「つまり、同じお金でも立場によって呼び方が変わるんです。」\n\nexpenditure\n\nイクスペンディチャー\n\n核イメージ：お金を支出すること・支出額\n\nGovernment expenditure increased.\n\n政府支出が増加しました。\n\n「expenditure は、政府、企業、予算、財務報告などの文脈でよく使われる、比較的フォーマルな単語です。」\n\nCapital expenditure increased this year.\n\n今年は設備投資などの資本的支出が増加しました。\n\n「先輩、expenditure は支出そのものに注目します。」\n\n「一方、会計上の expense は、損益計算における費用という意味を持ちます。」\n\n「支出した時点と費用計上する時点が異なることもあるため、会計では区別が重要です。」\n\n### 同じ場面で比較\n\n「先輩、会社が新しい機械を購入する場面で整理しましょう。」\n\n| 単語 | 注目するもの | 例 |\n| --- | --- | --- |\n| price | 販売価格 | 機械の販売価格 |\n| cost | 必要な金額・原価 | 機械の取得コスト |\n| fee | 特定のサービス料金 | 設置サービス料 |\n| charge | 請求される料金 | 配送追加料金 |\n| expenditure | 支出 | 機械購入のための支出 |\n| expense | 出費・会計上の費用 | 維持費・減価償却費など |\n\n「先輩、ここで注意してください。」\n\n「機械の購入代金が100万円だったとしても、会計上、その100万円がすべて購入時の expense になるとは限りません。」\n\n「固定資産として計上され、減価償却によって費用化される場合もあります。」\n\n「この違いまで理解できれば、expense を単なる『お金が出ていくこと』として覚えるより、ずっと正確に使えますよ。」\n\n## 理解確認｜3問\n\nQ1. 『会社は経費を削減した』として自然なのは？\n\nThe company reduced its expenses.The company familiar its expenses.The company detected its expenses into.\n\nQ2. price と expense の違いとして最も適切なのは？\n\n完全に同じ意味price は販売価格、expense は費用・出費に注目するexpense は商品に付けられた販売価格だけを意味する\n\nQ3. at the expense of one's health の意味は？\n\n健康を犠牲にして健康診断の料金を支払って健康保険を申請して\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- expense：費用、経費、出費\n- expenses：複数の費用・経費\n- expensive：高価な\n- business expenses：業務経費\n- travel expenses：出張費\n- living expenses：生活費\n- operating expenses：営業費用\n- expense report：経費精算書\n- reduce expenses：経費を削減する\n- cover expenses：費用を負担する\n- at one's own expense：自己負担で\n- at the expense of ～：～を犠牲にして\n- cost：必要な金額・原価\n- price：販売価格\n- fee：特定のサービス料金\n- charge：請求される料金\n- expenditure：支出\n\n一文記憶\n\nThe company reduced its operating expenses to improve profitability.\n\nその会社は収益性を改善するために営業費用を削減しました。\n\n「先輩、今日のポイントは expense = 何かを行うために負担する費用や代償 という感覚です。」\n\n「そして、cost は必要な金額、price は販売価格、fee は特定のサービス料金、expenditure は支出そのものに注目します。」\n\n「特に会計では、『現金を支払ったこと』と『費用として計上すること』は必ずしも同じではありません。この違いを忘れないでくださいね。」\n\n次は 第49語｜Require です。"}, {"name": "Require", "text": "# 第49語｜Require\n\n発音：/rɪˈkwaɪər/（リクワイア）｜動詞\n\n「先輩、今日の単語は require です。意味は『必要とする』『要求する』『義務づける』ですね。」\n\n「仕事の英文、TOEIC、契約書、申請手続きなどで非常によく登場します。」\n\nThis job requires experience.\n\nこの仕事には経験が必要です。\n\nEmployees are required to wear ID cards.\n\n従業員は社員証を着用することが義務づけられています。\n\n「先輩、どちらも require ですが、少し違いますよね。」\n\n「最初の文は『経験が必要だ』、二つ目は『社員証の着用が義務だ』という意味です。」\n\n「この二つに共通するのは、何かを達成したり、条件を満たしたりするために、欠かせないものがあるという感覚です。」\n\n「今日は need、demand、request、necessitate、oblige との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの意味を整理しましょう。」\n\n① 必要とする\n\nThis task requires concentration.\n\nこの作業には集中力が必要です。\n\n「作業を適切に行うために、集中力が欠かせないという意味です。」\n\n② 条件として要求する\n\nThe position requires at least three years of experience.\n\nその職種には少なくとも3年の経験が求められます。\n\n「採用条件や資格要件など、何かを満たすための条件を表します。」\n\n③ 義務づける\n\nThe law requires companies to keep certain records.\n\n法律は企業に一定の記録を保存することを義務づけています。\n\n「先輩、法律や規則によって、何かをしなければならない場合にも使うんです。」\n\n核イメージ：ある目的・条件を満たすために、何かが不可欠である\n\n「require は、単に『欲しい』という気持ちよりも、客観的な必要性や条件を表すことが多い単語ですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「require、need、demand、request は、どれも日本語では『必要とする』『求める』と訳されることがあります。」\n\n「でも、必要性なのか、強い要求なのか、丁寧な依頼なのかによって使う単語が変わりますよ。」\n\nrequire\n\nリクワイア\n\n核イメージ：条件として不可欠である・義務づける\n\nThis job requires experience.\n\nこの仕事には経験が必要です。\n\n「先輩、客観的な条件や規則に基づく必要性を表すことが多い単語です。」\n\nneed\n\nニード\n\n核イメージ：何かが必要である\n\nI need more time.\n\n私にはもっと時間が必要です。\n\n「need は日常会話でも仕事でも使える、最も一般的な『必要』です。」\n\nWe need more information.\n\n私たちにはさらに情報が必要です。\n\n「先輩、require は need よりもフォーマルで、条件としての必要性を強調することが多いです。」\n\nThe application requires additional information.\n\nその申請には追加情報が必要です。\n\n「ただし、need と require は置き換えられる場面もあります。」\n\ndemand\n\nディマンド\n\n核イメージ：強く要求する・厳しい負担を求める\n\nThe workers demanded better working conditions.\n\n労働者たちはより良い労働条件を強く要求しました。\n\n「demand は、相手に対して強く求めるニュアンスがあります。」\n\nThis job demands patience.\n\nこの仕事には忍耐力が求められます。\n\n「先輩、このように、人が要求する場合だけでなく、仕事などが多くの能力や努力を必要とする場合にも使います。」\n\n「require は必要条件、demand は強い要求や高い負担を感じさせやすい単語です。」\n\nrequest\n\nリクウェスト\n\n核イメージ：相手に何かをしてほしいと依頼する\n\nI requested additional information.\n\n私は追加情報を依頼しました。\n\n「request は、誰かに何かをしてほしいと伝える行為です。」\n\nThe company requires additional information.\n\n会社は追加情報を必要としています。\n\n「こちらの require は、情報が条件として必要だという意味です。」\n\n「先輩、request は依頼すること、require は必要条件であること。この違いが大切です。」\n\n「request されたことが、必ずしも義務とは限りません。」\n\nnecessitate\n\nナセスィテイト\n\n核イメージ：ある事情によって、別の行動が必要になる\n\nThe damage necessitated immediate repairs.\n\nその損傷によって、直ちに修理する必要が生じました。\n\n「necessitate は『～を必要にする』『～を余儀なくさせる』という、比較的フォーマルな単語です。」\n\n「require は必要性を広く表しますが、necessitate はある出来事が原因となって、別の対応が必要になるという因果関係を強調します。」\n\nThe change in regulations necessitated a review of the procedure.\n\n規則の変更によって、その手順の見直しが必要になりました。\n\n「先輩、ニュースやビジネス文書で見かけることがありますよ。」\n\noblige\n\nアブライジ\n\n核イメージ：義務や事情によって、行動せざるを得なくする\n\nThe contract obliges the company to provide support.\n\nその契約は会社にサポートを提供する義務を課しています。\n\n「oblige は、法律、契約、道義的な義務などによって、何かをしなければならない状態にすることです。」\n\nThe law requires companies to keep records.\n\n法律は企業に記録の保存を義務づけています。\n\n「この文では require と oblige の意味が近くなります。」\n\n「ただし先輩、oblige は人や組織に課される義務を強調しやすく、require は条件として必要なものまで幅広く表せます。」\n\n「This task obliges concentration. とは通常言いませんが、This task requires concentration. は自然です。」\n\n### 同じ場面で比較\n\n「先輩、会社が従業員に書類を提出してもらう場面で整理しましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| require | The company requires identification. | 必要条件 |\n| need | We need identification. | 一般的な必要性 |\n| demand | The manager demanded an explanation. | 強い要求 |\n| request | The manager requested the documents. | 依頼・要請 |\n| necessitate | The change necessitated new documents. | 事情によって必要になる |\n| oblige | The rules oblige employees to submit documents. | 義務づける |\n\n「先輩、特に require と request は形も似ているので注意してください。」\n\nThe company requires employees to submit the form.\n\n会社は従業員にその書類の提出を義務づけています。\n\nThe company requested that employees submit the form.\n\n会社は従業員にその書類を提出するよう求めました。\n\n「前者は義務・必要条件という意味が強く、後者は依頼・要請という意味です。」\n\n「ただし、request も文脈によっては強い要請になることがあります。単語だけで強制力を断定しないでくださいね。」\n\n## 理解確認｜3問\n\nQ1. 『この仕事には経験が必要です』として自然なのは？\n\nThis job requires experience.This job requests experience from itself.This job familiar experience.\n\nQ2. require と request の違いとして最も適切なのは？\n\n完全に同じ意味require は必要条件や義務、request は依頼・要請に注目するrequest は必ず法律上の義務を表す\n\nQ3. 『すべての応募者は書類を提出する必要があります』として自然なのは？\n\nAll applicants are required to submit the documents.All applicants are required submit the documents.All applicants are require to submitting the documents.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- require：必要とする、要求する、義務づける\n- required：必須の、要求された\n- requirement：要件、必要条件\n- require + 名詞：～を必要とする\n- require + 人 + to do：人に～することを求める\n- be required to do：～することを義務づけられる\n- required documents：必要書類\n- meet the requirements：要件を満たす\n- minimum requirements：最低要件\n- need：一般的に必要とする\n- demand：強く要求する\n- request：依頼する\n- necessitate：事情によって必要にする\n- oblige：義務づける\n\n一文記憶\n\nThis position requires strong communication skills and attention to detail.\n\nこの職種には高いコミュニケーション能力と細部への注意力が求められます。\n\n「先輩、今日のポイントは require = 何かを達成したり、条件を満たしたりするために不可欠である という感覚です。」\n\n「そして、need は一般的な必要性、request は依頼、demand は強い要求、oblige は義務づけることに注目します。」\n\n「特に be required to do と meet the requirements は、仕事の英文で何度も出てきます。必ず覚えておいてくださいね。」\n\n次は 第50語｜Request です。"}, {"name": "Request", "text": "# 第50語｜Request\n\n発音：/rɪˈkwest/（リクウェスト）｜動詞・名詞\n\n「先輩、今日の単語は request です。いよいよ50語目ですね。」\n\n「意味は 『依頼する』『要請する』『申請する』、名詞では 『依頼』『要請』『申請』 です。」\n\nI requested additional information.\n\n私は追加情報を依頼しました。\n\nYour request has been approved.\n\nあなたの申請は承認されました。\n\n「先輩、ここで昨日の require を思い出してください。」\n\n「require は『必要条件として求める』、request は『相手に何かをしてほしいと伝える』という違いがありましたね。」\n\n「でも、ask、demand、apply とはどう違うのでしょう？」\n\n「今日はそこまで整理して、ビジネス英語で自然に使えるようにしましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 依頼する\n\nI requested a copy of the document.\n\n私はその書類のコピーを依頼しました。\n\n「相手に何かをしてもらったり、提供してもらったりするよう求める場合です。」\n\n② 要請する\n\nThe manager requested an explanation.\n\n管理職は説明を求めました。\n\n「仕事などのフォーマルな場面でよく使います。」\n\n③ 申請する\n\nI requested paid leave.\n\n私は有給休暇を申請しました。\n\n「会社の制度に基づいて休暇や承認などを求める場合にも使えます。」\n\n④ 依頼・申請（名詞）\n\nWe received your request.\n\n私たちはあなたの依頼を受け取りました。\n\n「先輩、request は動詞にも名詞にもなるんです。」\n\n核イメージ：相手に何かをしてほしいと、意思を伝えて求める\n\n「ただ必要なだけではなく、相手に向けて求める行為が中心ですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは request と似た単語を比較します。」\n\n「『求める』と訳せても、依頼なのか、強い要求なのか、正式な申請なのかによって単語が変わりますよ。」\n\nrequest\n\nリクウェスト\n\n核イメージ：相手に何かをしてほしいと正式・丁寧に求める\n\nI requested additional information.\n\n私は追加情報を依頼しました。\n\n「先輩、ビジネスや手続きでよく使う、ややフォーマルな単語です。」\n\nask\n\nアスク\n\n核イメージ：質問する・頼む\n\nI asked him for help.\n\n私は彼に助けを求めました。\n\n「ask は日常会話で最もよく使う『尋ねる・頼む』です。」\n\nI asked my manager to check the document.\n\n私は上司に書類を確認してもらうよう頼みました。\n\n「先輩、request は ask よりフォーマルで、公式な依頼や申請という印象を与えることが多いです。」\n\nI requested a copy of the document.\n\n私はその書類のコピーを依頼しました。\n\n「日常会話なら ask、ビジネス文書なら request が自然な場合が多いですね。」\n\nrequire\n\nリクワイア\n\n核イメージ：必要条件として求める・義務づける\n\nThe company requires employees to wear ID cards.\n\n会社は従業員に社員証の着用を義務づけています。\n\n「require は、何かが必要条件になっていることを表します。」\n\nThe manager requested that employees wear ID cards.\n\n管理職は従業員に社員証を着用するよう求めました。\n\n「先輩、request は依頼や要請、require は必要性や義務に注目します。」\n\n「綴りも似ていますが、意味の中心は違いますよ。」\n\ndemand\n\nディマンド\n\n核イメージ：強く要求する\n\nThe customer demanded an explanation.\n\n顧客は説明を強く要求しました。\n\n「demand は、相手に対して強く求めるニュアンスがあります。」\n\nThe customer requested an explanation.\n\n顧客は説明を求めました。\n\n「こちらの request は、より中立的でフォーマルな依頼です。」\n\n「先輩、demand は強い要求、request は依頼・要請という違いがあります。」\n\n「ただし、demand が必ず怒りを伴うわけではありません。」\n\napply\n\nアプライ\n\n核イメージ：制度や募集に対して正式に申し込む\n\nI applied for a new position.\n\n私は新しい職種に応募しました。\n\n「apply は、求人、学校、許可、資格、制度などに申し込む場合によく使います。」\n\nI applied for a visa.\n\n私はビザを申請しました。\n\n「先輩、request は依頼全般に使えますが、apply は正式な応募・申請手続きを行うことに注目します。」\n\nI requested a copy of the report.\n\n私は報告書のコピーを依頼しました。\n\n「報告書のコピーを頼むなら request が自然ですが、求人に応募するなら通常 apply for a job です。」\n\nappeal\n\nアピール\n\n核イメージ：強く訴えかける・不服を申し立てる\n\nThe organization appealed for donations.\n\nその団体は寄付を呼びかけました。\n\n「appeal は、人の気持ちや判断に訴えかけることを表します。」\n\nHe appealed the decision.\n\n彼はその決定に不服を申し立てました。\n\n「先輩、appeal には『上訴する』『不服を申し立てる』という意味もあります。」\n\n「request は一般的な依頼ですが、appeal は訴えかけることや決定への異議申し立てというニュアンスが強い場合があります。」\n\n### 同じ場面で比較\n\n「先輩、会社で書類の提出を求める場面で整理しましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| ask | I asked him for the document. | 日常的に頼む |\n| request | I requested the document. | 正式・丁寧に依頼する |\n| require | The procedure requires the document. | 必要条件である |\n| demand | The manager demanded the document. | 強く要求する |\n| apply | I applied for a permit. | 制度に申請する |\n| appeal | I appealed the decision. | 決定に不服を申し立てる |\n\n「先輩、特に request と require は、前の単語とセットで覚えると効果的です。」\n\nThe company requested additional documents.\n\n会社は追加書類を求めました。\n\nThe procedure requires additional documents.\n\nその手続きには追加書類が必要です。\n\n「前者は会社が依頼する行為、後者は手続きの必要条件です。」\n\n「この違いを理解していれば、ビジネス英文で迷いにくくなりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『私は追加情報を依頼しました』として自然なのは？\n\nI requested additional information.I required additional information to someone.I appealed additional information yesterday.\n\nQ2. request と require の違いとして最も適切なのは？\n\n完全に同じ意味request は依頼・要請、require は必要条件や義務に注目するrequire は必ず質問するという意味\n\nQ3. 『あなたの申請は承認されました』として自然なのは？\n\nYour request has been approved.Your request has been familiar.Your request has been demanded into.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- request：依頼する、要請する、申請する／依頼、要請、申請\n- request + 名詞：～を依頼する\n- request that + 主語 + 動詞の原形：～するよう求める\n- make a request：依頼する\n- submit a request：申請を提出する\n- approve a request：申請を承認する\n- reject / deny a request：申請を却下する\n- at someone's request：誰かの依頼で\n- upon request：依頼があれば\n- ask：日常的に頼む・尋ねる\n- require：必要とする・義務づける\n- demand：強く要求する\n- apply：正式に申し込む・応募する\n- appeal：訴えかける・不服を申し立てる\n\n一文記憶\n\nI submitted a request for approval, and my manager approved it.\n\n私は承認申請を提出し、上司がそれを承認しました。\n\n「先輩、今日のポイントは request = 相手に何かをしてほしいと伝えて求めること です。」\n\n「そして、依頼しただけでは承認されたことにはなりません。request、review、approve という流れも一緒に覚えてくださいね。」\n\n「これで50語目まで進みました。次からも、一語ずつ確実に理解していきましょう。」\n\n次は 第51語｜Handle です。"}, {"name": "Handle", "text": "# 第51語｜Handle\n\n発音：/ˈhændəl/（ハンドゥル）｜動詞・名詞\n\n「先輩、今日の単語は handle です。」\n\n「仕事の英文でも日常会話でも、かなり使い道の広い単語ですよ。」\n\nI'll handle this problem.\n\nこの問題は私が対処します。\n\nCan you handle this task?\n\nこの仕事を担当できますか？\n\nBe careful when handling the equipment.\n\nその機器を取り扱うときは注意してください。\n\n「先輩、同じ handle なのに、『対処する』『担当する』『取り扱う』と訳が変わっていますね。」\n\n「でも、全部を別々の意味として暗記する必要はありません。」\n\n「handle の核となるイメージは、何かを自分の手で扱い、適切にコントロールすることです。」\n\n「今日は deal with、manage、cope with、address、tackle、operate との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、handle はまず5つの使い方を押さえてください。」\n\n① 問題に対処する\n\nWe need to handle this issue carefully.\n\n私たちはこの問題に慎重に対処する必要があります。\n\n「問題を放置せず、必要な対応を進めるという意味です。」\n\n② 仕事を担当する・処理する\n\nShe handles customer inquiries.\n\n彼女は顧客からの問い合わせを担当しています。\n\n「単に仕事を持っているだけでなく、実際に対応しているという感覚があります。」\n\n③ 物を取り扱う\n\nPlease handle these documents with care.\n\nこれらの書類は丁寧に取り扱ってください。\n\n「物理的に何かを扱う場合ですね。」\n\n④ 状況や感情にうまく対応する\n\nHe handles pressure well.\n\n彼はプレッシャーにうまく対処します。\n\n「先輩、人が難しい状況をコントロールする能力を表すこともできます。」\n\n⑤ 取っ手・持ち手（名詞）\n\nThe handle of the door is broken.\n\nドアの取っ手が壊れています。\n\n「先輩、実は名詞の『取っ手』を思い浮かべると、動詞の意味も覚えやすくなるんです。」\n\n核イメージ：手に取って、自分の管理下で扱う\n\n「物でも仕事でも問題でも、自分が関わって適切に扱うという感覚ですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「handle と似た意味の単語は多いですが、対応するのか、管理するのか、困難に耐えるのか、解決に向けて取り組むのかによって使い分けます。」\n\nhandle\n\nハンドゥル\n\n核イメージ：自分の管理下で適切に扱う・対処する\n\nI'll handle the customer complaint.\n\nその顧客からの苦情は私が対応します。\n\n「先輩、実際に仕事や問題を引き受け、処理することに注目します。」\n\ndeal with\n\nディール ウィズ\n\n核イメージ：問題や状況に向き合い、対応する\n\nWe need to deal with this issue.\n\n私たちはこの問題に対処する必要があります。\n\n「deal with は非常に幅広く使える表現です。」\n\nI deal with customer inquiries every day.\n\n私は毎日、顧客からの問い合わせに対応しています。\n\n「先輩、handle は『実際に処理する・扱う』という印象があり、deal with は『問題や相手に向き合って対応する』という意味で広く使えます。」\n\n「ただし、多くの場面で置き換え可能ですよ。」\n\nmanage\n\nマネジ\n\n核イメージ：全体を管理し、うまく運営する\n\nShe manages a team of ten employees.\n\n彼女は10人の従業員からなるチームを管理しています。\n\n「manage は、仕事、人、時間、資源などを管理・運営する場合によく使います。」\n\nI managed to finish the report on time.\n\n私は何とか時間どおりに報告書を完成させました。\n\n「先輩、manage to do には『何とか～する』という意味もあります。」\n\n「handle は個別の仕事や問題への対応、manage は全体の管理や困難を乗り越えて達成することに注目しやすいんです。」\n\ncope with\n\nコウプ ウィズ\n\n核イメージ：困難やストレスに耐えながら対処する\n\nShe is learning to cope with stress.\n\n彼女はストレスへの対処法を学んでいます。\n\n「cope with は、困難な状況を何とか乗り切るという感覚があります。」\n\nHe struggled to cope with the workload.\n\n彼は仕事量に対処するのに苦労しました。\n\n「先輩、handle pressure はプレッシャーをうまく扱う能力に注目します。」\n\n「一方、cope with pressure は、プレッシャーという困難に耐えながら対応する印象が強いです。」\n\n「必ずしも問題を解決することまでは意味しません。」\n\naddress\n\nアドレス\n\n核イメージ：問題を認識し、改善・解決に向けて取り組む\n\nWe need to address the underlying problem.\n\n私たちは根本的な問題に取り組む必要があります。\n\n「address は、問題を取り上げて対策を講じるという意味でよく使います。」\n\nThe company introduced measures to address employee concerns.\n\n会社は従業員の懸念に対処するための措置を導入しました。\n\n「先輩、handle は実際の対応や処理に注目します。」\n\n「address は、問題を放置せず、改善に向けて取り組むことに重点があります。」\n\n「ニュースやビジネス文書で特によく見かける表現です。」\n\ntackle\n\nタクル\n\n核イメージ：難しい問題に積極的に立ち向かう\n\nThe government is trying to tackle inflation.\n\n政府はインフレに対処しようとしています。\n\n「tackle は、困難な課題に正面から取り組むという力強いニュアンスがあります。」\n\nWe need to tackle the problem immediately.\n\n私たちはその問題に直ちに取り組む必要があります。\n\n「先輩、handle は対応・処理すること全般に使えます。」\n\n「tackle は、難しい問題に積極的に挑む姿勢を強調するんです。」\n\noperate\n\nアパレイト\n\n核イメージ：機械やシステムを操作・運転する\n\nOnly trained employees can operate this machine.\n\n訓練を受けた従業員だけがこの機械を操作できます。\n\n「operate は、機械や設備を動かす・操作することに注目します。」\n\nPlease handle the machine carefully.\n\nその機械は慎重に取り扱ってください。\n\n「先輩、handle は機械を扱うこと、operate は機械を実際に動かして操作することです。」\n\n「同じ機械でも、注目する動作が違いますね。」\n\n### 同じ場面で比較\n\n「先輩、会社で問題が発生した場面を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| handle | I'll handle the issue. | 問題を引き受けて対処する |\n| deal with | I'll deal with the issue. | 問題に向き合って対応する |\n| manage | I'll manage the project. | 全体を管理・運営する |\n| cope with | I'll cope with the pressure. | 困難や負担に耐えて対処する |\n| address | I'll address the issue. | 問題を取り上げ改善に向けて取り組む |\n| tackle | I'll tackle the issue. | 難題に積極的に立ち向かう |\n| operate | I'll operate the machine. | 機械を操作する |\n\n「先輩、ここでもう一つ、重要な単語を比較しておきます。」\n\nhandle と solve\n\nI handled the complaint.\n\n私はその苦情に対応しました。\n\nI solved the problem.\n\n私はその問題を解決しました。\n\n「前者は対応したこと、後者は解決したことを表しています。」\n\n「つまり、対応したという事実と、問題が解決したという結果は別なんです。」\n\n「仕事の報告でも、この違いは大切ですよ。」\n\n## 理解確認｜3問\n\nQ1. 『この問題は私が対処します』として自然なのは？\n\nI'll handle this problem.I'll handle with this problem.I'll be handled this problem.\n\nQ2. handle と solve の違いとして最も適切なのは？\n\nhandle は対処すること、solve は解決することに注目する完全に同じ意味で、常に置き換えられるsolve は機械を操作することだけを意味する\n\nQ3. 『彼女はストレスに対処するのに苦労した』として自然なのは？\n\nShe struggled to cope with stress.She struggled to operate stress.She struggled to request stress.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- handle：対処する、担当する、取り扱う／取っ手\n- handle a problem：問題に対処する\n- handle a request：依頼・申請を処理する\n- handle a complaint：苦情に対応する\n- handle pressure：プレッシャーに対処する\n- handle with care：丁寧に取り扱う\n- I can handle it.：私が対応できます\n- deal with：問題や状況に向き合って対応する\n- manage：管理する、何とかやり遂げる\n- cope with：困難に耐えながら対処する\n- address：問題の改善・解決に向けて取り組む\n- tackle：難しい問題に積極的に取り組む\n- operate：機械を操作する\n- solve：問題を解決する\n\n一文記憶\n\nI can handle this problem, but I may need some help.\n\nこの問題には私が対処できますが、少し助けが必要かもしれません。\n\n「先輩、今日のポイントは handle = 自分の手で扱い、適切にコントロールする という感覚です。」\n\n「物を扱うことから、仕事を処理すること、問題に対処することまで意味が広がっています。」\n\n「そして、handle は必ずしも『解決した』という意味ではありません。solve との違いも忘れないでくださいね。」\n\n次は 第52語｜Submit です。"}, {"name": "Submit", "text": "# 第52語｜Submit\n\n発音：/səbˈmɪt/（サブミット）｜動詞\n\n「先輩、今日の単語は submit です。」\n\n「仕事の英文では、書類・申請書・報告書などを\\*\\*『提出する』\\*\\*という意味で非常によく使います。」\n\nPlease submit the report by Friday.\n\n金曜日までに報告書を提出してください。\n\nI submitted an expense report yesterday.\n\n私は昨日、経費精算書を提出しました。\n\n「でも先輩、submit には『提出する』以外に、\\*\\*『服従する』『従う』\\*\\*という意味もあるんです。」\n\n「一見、関係なさそうですよね。でも、核となるイメージを理解するとつながります。」\n\n「今日は send、hand in、turn in、file、present、surrender との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえてください。」\n\n① 書類などを提出する\n\nPlease submit the required documents.\n\n必要書類を提出してください。\n\n「仕事や学校などで、決められた相手に正式に提出する場合です。」\n\n② 申請する・審査に出す\n\nI submitted a request for approval.\n\n私は承認申請を提出しました。\n\n「先輩、ここでは提出しただけで、まだ承認されたわけではありません。」\n\n③ 意見・提案などを提示する\n\nShe submitted a proposal to the committee.\n\n彼女は委員会に提案書を提出しました。\n\n「書類だけでなく、検討してもらうための意見や提案にも使えます。」\n\n④ 服従する・従う\n\nHe refused to submit to their demands.\n\n彼は彼らの要求に屈することを拒みました。\n\n「submit to ～ で『～に服従する』『～に屈する』です。」\n\n核イメージ：自分の手元にあるものを、相手の判断や権限の下に差し出す\n\n「書類なら『提出する』、自分自身なら『相手の権限に従う』という意味につながるんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『提出する』『送る』『差し出す』という単語は似ていますが、単に送るのか、正式に提出するのか、役所に届け出るのかによって使い分けます。」\n\nsubmit\n\nサブミット\n\n核イメージ：相手の判断・確認のために正式に差し出す\n\nI submitted the report to my manager.\n\n私は上司に報告書を提出しました。\n\n「先輩、正式な提出や審査に回すというニュアンスがあります。」\n\nsend\n\nセンド\n\n核イメージ：何かを相手のところへ送る\n\nI sent the file by email.\n\n私はそのファイルをメールで送りました。\n\n「send は送るという行為そのものに注目します。」\n\nI sent the report to my manager.\n\n私は上司に報告書を送りました。\n\n「先輩、これは単に報告書を送ったという意味です。」\n\nI submitted the report to my manager.\n\n私は上司に報告書を提出しました。\n\n「こちらは正式に提出したという意味が強くなります。」\n\n「ただし、メールで送ることが正式な提出になる場合もありますよ。」\n\nhand in\n\nハンド イン\n\n核イメージ：課題や書類を提出する\n\nPlease hand in your homework.\n\n宿題を提出してください。\n\n「hand in は、学校の課題や書類を提出するときによく使います。」\n\nI handed in my resignation letter.\n\n私は辞表を提出しました。\n\n「先輩、submit より日常的で、会話でも使いやすい表現です。」\n\n「ただし、hand in は必ず手渡しするという意味ではありません。オンライン提出にも使われます。」\n\nturn in\n\nターン イン\n\n核イメージ：課題や書類を提出する\n\nI turned in my assignment yesterday.\n\n私は昨日、課題を提出しました。\n\n「turn in は、特にアメリカ英語で課題や書類の提出によく使われます。」\n\nPlease turn in your timesheet by Friday.\n\n金曜日までに勤務時間記録表を提出してください。\n\n「先輩、hand in と非常によく似ています。」\n\n「submit はよりフォーマル、turn in は会話的という違いがあります。」\n\n「ちなみに turn in には『寝る』『警察に引き渡す』など別の意味もありますよ。」\n\nfile\n\nファイル\n\n核イメージ：正式な制度に従って届け出る・申請する\n\nI filed my tax return.\n\n私は確定申告書を提出しました。\n\n「file は、税務、法律、行政などの正式な手続きでよく使います。」\n\nThe company filed a complaint.\n\n会社は正式に苦情を申し立てました。\n\n「先輩、submit は提出全般、file は制度や手続きに従って正式に届け出ることを強調します。」\n\n「また、file には『書類を整理・保管する』という意味もあります。」\n\npresent\n\nプリゼント\n\n核イメージ：相手に示す・提示する\n\nShe presented her proposal to the board.\n\n彼女は取締役会に提案を提示しました。\n\n「present は、相手に情報や提案を示して説明するという意味でよく使います。」\n\nHe presented the results at the meeting.\n\n彼は会議で結果を発表しました。\n\n「先輩、submit は正式に提出すること、present は相手に見せたり説明したりすることに注目します。」\n\n「提案書を提出するなら submit a proposal、会議で提案を説明するなら present a proposal が自然ですね。」\n\nsurrender\n\nサレンダー\n\n核イメージ：抵抗をやめて降伏する・明け渡す\n\nThe soldiers surrendered.\n\n兵士たちは降伏しました。\n\n「surrender は、抵抗をやめて相手に従うという意味です。」\n\nHe refused to surrender.\n\n彼は降伏することを拒みました。\n\n「先輩、submit to ～ も『～に屈する』という意味を持ちますが、surrender は特に抵抗をやめて降伏するという結果を強調します。」\n\nHe submitted to their authority.\n\n彼は彼らの権威に従いました。\n\n「submit は権威や要求に従うこと、surrender は抵抗をやめて降伏することに注目するんです。」\n\n### 同じ場面で比較\n\n「先輩、会社で書類を扱う場面を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| send | I sent the report. | 送る行為 |\n| submit | I submitted the report. | 正式に提出する |\n| hand in | I handed in the report. | 書類を提出する |\n| turn in | I turned in the report. | 書類を提出する・会話的 |\n| file | I filed the tax return. | 正式に届け出る |\n| present | I presented the report. | 相手に示す・説明する |\n| surrender | He surrendered. | 降伏する |\n\n「先輩、特に send と submit の違いは、仕事で非常に重要です。」\n\nI sent the application.\n\n私は申請書を送りました。\n\nI submitted the application.\n\n私は申請書を提出しました。\n\n「前者は送ったこと、後者は正式に提出したことに注目します。」\n\n「そして、submit しただけでは approve されたことにはなりません。この流れも忘れないでくださいね。」\n\n## 理解確認｜3問\n\nQ1. 『金曜日までに報告書を提出してください』として自然なのは？\n\nPlease submit the report by Friday.Please submit the report until Friday.Please submit to the report by Friday.\n\nQ2. submit と send の違いとして最も適切なのは？\n\nsubmit は正式な提出、send は送る行為に注目する完全に同じ意味で、常に置き換えられるsend は書類を送るときには使えない\n\nQ3. 『彼は圧力に屈することを拒んだ』として自然なのは？\n\nHe refused to submit to pressure.He refused to submit pressure a report.He refused to file pressure.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- submit：提出する、提示する、服従する\n- submit A to B：AをBに提出する\n- submit something for approval：承認のために提出する\n- submit something by + 期限：期限までに提出する\n- submit a request：申請を提出する\n- submit an expense report：経費精算書を提出する\n- submit to ～：～に従う・屈する\n- submission：提出・提出物・服従\n- submitted：submit の過去形・過去分詞\n- send：送る\n- hand in：提出する\n- turn in：提出する\n- file：正式に届け出る・申請する\n- present：提示する・発表する\n- surrender：降伏する\n\n一文記憶\n\nI submitted the required documents to my manager for approval.\n\n私は承認を得るために必要書類を上司に提出しました。\n\n「先輩、今日のポイントは submit = 相手の判断や権限の下に差し出す という感覚です。」\n\n「書類なら『提出する』、権威や圧力に対してなら『従う・屈する』という意味になります。」\n\n「そして、send は送ること、submit は正式に提出することに注目します。」\n\n「仕事では submit a report、submit a request、submit something for approval を使えるようにしておきましょうね。」\n\n次は 第53語｜Notify です。"}, {"name": "Notify", "text": "# 第53語｜Notify\n\n発音：/ˈnoʊtɪfaɪ/（ノウティファイ）｜動詞\n\n「先輩、今日の単語は notify です。」\n\n「意味は 『通知する』『知らせる』『正式に連絡する』 ですね。」\n\nPlease notify me when the documents arrive.\n\n書類が届いたら私に知らせてください。\n\nAll employees were notified of the change.\n\nすべての従業員に変更が通知されました。\n\n「先輩、ここで一つ質問です。」\n\n「notify と tell は、どちらも『知らせる』と訳せますよね。では、何が違うのでしょう？」\n\n「tell は日常的に情報を伝えること、notify は相手が知る必要のある情報を、明確に通知することに重点があります。」\n\n「特に会社の連絡、申請結果、規則の変更、システム通知などで使われます。」\n\n「今日は inform、tell、announce、alert、remind、report との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 変更を通知する\n\nThe company notified employees of the new policy.\n\n会社は従業員に新しい規定を通知しました。\n\n「規則や予定などが変更されたことを知らせる場面です。」\n\n② 結果を通知する\n\nApplicants will be notified of the results.\n\n応募者には結果が通知されます。\n\n「採用、試験、審査などの結果を知らせる場合ですね。」\n\n③ 問題や異常を知らせる\n\nPlease notify your supervisor immediately.\n\n直ちに上司に知らせてください。\n\n「先輩、問題が発生したとき、関係者に必要な情報を伝える場合にも使います。」\n\n④ システムが通知する\n\nThe app notifies users of new messages.\n\nそのアプリはユーザーに新着メッセージを通知します。\n\n「人だけでなく、アプリやシステムを主語にすることもできます。」\n\n核イメージ：相手が知る必要のある情報を、明確に届ける\n\n「先輩、単に会話するのではなく、『この情報を相手に知らせる必要がある』という感覚が中心です。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『知らせる』という英語はたくさんありますが、誰に、何を、どのような目的で伝えるかによって使い分けるんです。」\n\nnotify\n\nノウティファイ\n\n核イメージ：必要な情報を明確に通知する\n\nThe company notified employees of the change.\n\n会社は従業員に変更を通知しました。\n\n「先輩、公式な連絡や、相手が知る必要のある情報を伝える場合によく使います。」\n\ninform\n\nインフォーム\n\n核イメージ：情報を与えて、相手に事情を知らせる\n\nPlease inform me of any changes.\n\n変更があれば私に知らせてください。\n\n「inform は、情報を伝えること全般に使えるフォーマルな単語です。」\n\nThe manager informed us about the new procedure.\n\n管理職は私たちに新しい手順について知らせました。\n\n「先輩、notify は通知する行為に注目し、inform は相手に情報を伝えることに注目します。」\n\n「ただし、多くのビジネス場面で置き換えられますよ。」\n\ntell\n\nテル\n\n核イメージ：相手に言葉で伝える\n\nPlease tell me what happened.\n\n何が起こったのか教えてください。\n\n「tell は日常会話で非常によく使う『伝える』『話す』です。」\n\nI told my manager about the problem.\n\n私は上司にその問題について伝えました。\n\n「先輩、notify はややフォーマルで、正式な通知や重要な連絡に使われることが多いです。」\n\n「tell はもっと幅広く、日常的な会話にも使えます。」\n\nannounce\n\nアナウンス\n\n核イメージ：多くの人に向けて正式に発表する\n\nThe company announced a new policy.\n\n会社は新しい方針を発表しました。\n\n「announce は、ニュースや決定事項を公に発表する場合によく使います。」\n\nThe government announced new measures.\n\n政府は新しい対策を発表しました。\n\n「先輩、notify は特定の相手に通知すること、announce は広く発表することに注目します。」\n\n「ただし、社内全体への発表など、両方が使える場面もあります。」\n\nalert\n\nアラート\n\n核イメージ：危険や重要な問題に注意を向けさせる\n\nThe system alerted us to a security issue.\n\nシステムは私たちにセキュリティ上の問題を警告しました。\n\n「alert は、相手に注意や警戒を促す意味が強い単語です。」\n\nThe app alerts users when suspicious activity is detected.\n\nそのアプリは不審な動きが検出されるとユーザーに警告します。\n\n「先輩、notify は通知全般、alert は危険や重要な異常に気づかせることに重点があります。」\n\n「alert が必ず危険を意味するわけではありませんが、注意喚起のニュアンスが強いですね。」\n\nremind\n\nリマインド\n\n核イメージ：忘れないように思い出させる\n\nPlease remind me about the meeting.\n\n会議のことを思い出させてください。\n\n「remind は、相手が忘れないように記憶を呼び起こすことです。」\n\nThe system reminded employees to submit their reports.\n\nシステムは従業員に報告書を提出するようリマインドしました。\n\n「先輩、notify は情報を通知すること、remind はすでに知っていることなどを思い出させることに注目します。」\n\n「例えば、会議の日時変更を知らせるなら notify、会議の前日に忘れないよう知らせるなら remind が自然です。」\n\nreport\n\nリポート\n\n核イメージ：事実や状況を報告する\n\nPlease report any problems to your supervisor.\n\n問題があれば上司に報告してください。\n\n「report は、事実、出来事、状況などを整理して伝えることに注目します。」\n\nThe employee reported the incident immediately.\n\nその従業員は事故を直ちに報告しました。\n\n「先輩、notify は相手に知らせる行為、report は何が起こったかなどの事実を報告することに重点があります。」\n\n「問題発生時の連絡では、両方が使えることもありますよ。」\n\n### 同じ場面で比較\n\n「先輩、会社でシステム障害が発生した場面を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| notify | We notified employees of the outage. | 関係者に通知する |\n| inform | We informed employees about the outage. | 情報を伝える |\n| tell | We told employees about the outage. | 言葉で知らせる |\n| announce | We announced the outage. | 広く発表する |\n| alert | We alerted users to the outage. | 注意を促す |\n| remind | We reminded users about the maintenance. | 忘れないように知らせる |\n| report | We reported the outage to IT. | 発生した事実を報告する |\n\n「先輩、ここで特に覚えてほしいのは notify と remind の違いです。」\n\nPlease notify me if the schedule changes.\n\n予定が変更されたら知らせてください。\n\nPlease remind me about the meeting tomorrow.\n\n明日の会議について思い出させてください。\n\n「前者は新しい情報を伝えること、後者は忘れないように知らせることです。」\n\n「そして、alert は重要な異常や危険への注意喚起、announce は広く発表することに注目します。」\n\n## 理解確認｜3問\n\nQ1. 『変更があれば私に通知してください』として自然なのは？\n\nPlease notify me of any changes.Please notify to me any changes.Please notify any changes me to.\n\nQ2. notify と remind の違いとして最も適切なのは？\n\nnotify は情報を知らせること、remind は思い出させること完全に同じ意味で、常に置き換えられるremind は危険を警告することだけを意味する\n\nQ3. 『応募者には結果が通知されます』として自然なのは？\n\nApplicants will be notified of the results.Applicants will notify of the results.Applicants will be notify to the results.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- notify：通知する、知らせる\n- notification：通知\n- notify 人 of 内容：人に内容を通知する\n- notify 人 about 内容：人に内容について知らせる\n- notify 人 that ～：人に～ということを通知する\n- notify 人 when ～：～したときに人に知らせる\n- be notified of ～：～について通知される\n- in advance：事前に\n- prior notification：事前通知\n- notification settings：通知設定\n- inform：情報を伝える\n- tell：言葉で伝える\n- announce：広く発表する\n- alert：注意を促す・警告する\n- remind：思い出させる\n- report：事実や状況を報告する\n\n一文記憶\n\nPlease notify me immediately if there are any changes to the schedule.\n\n予定に変更があれば、直ちに私に知らせてください。\n\n「先輩、今日のポイントは notify = 相手が知る必要のある情報を明確に届ける という感覚です。」\n\n「そして、inform は情報を伝えること、announce は広く発表すること、alert は注意を促すこと、remind は思い出させることに注目します。」\n\n「特に notify someone of something は、仕事の英文で何度も使います。語順ごと覚えてくださいね。」\n\n次は 第54語｜Itinerary です。"}, {"name": "Itinerary", "text": "# 第54語｜Itinerary\n\n発音：/aɪˈtɪnəˌreri/（アイティナレリー）｜名詞\n\n「先輩、今日の単語は itinerary です。」\n\n「意味は 『旅程』『旅行日程』『旅行の行程表』 ですね。」\n\nCould you send me your itinerary?\n\n旅行の日程表を送っていただけますか？\n\nOur itinerary includes three cities.\n\n私たちの旅程には3つの都市が含まれています。\n\n「先輩、schedule も『予定表』と訳せますよね。では、itinerary とは何が違うのでしょう？」\n\n「schedule は予定全般を表しますが、itinerary は特に旅行や出張で、いつ・どこへ・どのように移動するかをまとめた行程に注目するんです。」\n\n「今日は schedule、agenda、plan、route、timetable、reservation との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの使い方を押さえましょう。」\n\n① 旅行の旅程・行程表\n\nI prepared an itinerary for our trip.\n\n私は旅行の行程表を作成しました。\n\n「いつ、どこへ行き、何をするかをまとめたものですね。」\n\n② 出張日程\n\nPlease review the business trip itinerary.\n\n出張の行程表を確認してください。\n\n「先輩、ビジネス英語でも非常によく使います。」\n\n③ 予約・移動情報をまとめた旅程表\n\nThe airline emailed me my itinerary.\n\n航空会社から旅程表がメールで届きました。\n\n「航空券の予約確認メールなどに、itinerary と書かれていることがあります。」\n\n「ただし、旅程表そのものが航空券や搭乗券と同じとは限りませんよ。」\n\n核イメージ：旅行の出発から帰着までの流れを、順番に並べたもの\n\n「先輩、単なる予定ではなく、移動や訪問先を含む『旅の流れ』を意識してくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「itinerary と似た単語は、どれも『予定』に関係します。でも、時間、行動内容、移動経路、予約情報のどこに注目するかで使い分けるんです。」\n\nitinerary\n\nアイティナレリー\n\n核イメージ：旅行や出張の行程を順番にまとめたもの\n\nOur itinerary includes a visit to Osaka.\n\n私たちの旅程には大阪への訪問が含まれています。\n\n「先輩、旅行の全体的な流れを表す単語です。」\n\nschedule\n\nスケジュール\n\n核イメージ：いつ何をするかという時間的な予定\n\nMy schedule is packed this week.\n\n今週は予定がぎっしり詰まっています。\n\n「schedule は、仕事、勉強、会議、旅行など、幅広い予定に使います。」\n\nThe meeting is scheduled for 3 p.m.\n\n会議は午後3時に予定されています。\n\n「先輩、schedule は時間的な予定全般、itinerary は旅行や出張の行程に特化しています。」\n\n「旅行の予定表を travel schedule と呼ぶこともできますが、訪問先や移動の流れを強調したいなら itinerary が自然です。」\n\nagenda\n\nアジェンダ\n\n核イメージ：会議で話し合う項目・議題\n\nLet's review the agenda before the meeting.\n\n会議の前に議題を確認しましょう。\n\n「agenda は、会議や討論で扱う内容を整理したものです。」\n\nThe first item on the agenda is the budget.\n\n議題の最初の項目は予算です。\n\n「先輩、itinerary は旅行でどこへ行くか、agenda は会議で何を話し合うかに注目します。」\n\n「なお、イベントのプログラムや予定内容を agenda と呼ぶこともありますよ。」\n\nplan\n\nプラン\n\n核イメージ：これから何をするかという計画全般\n\nWe made a plan for our vacation.\n\n私たちは休暇の計画を立てました。\n\n「plan は非常に幅広い単語です。」\n\nOur plan is to visit Kyoto and Osaka.\n\n私たちの計画は京都と大阪を訪れることです。\n\n「先輩、plan は目的や大まかな方針だけでも成立します。」\n\n「一方、itinerary は旅行の訪問先や行動の順序を具体的にまとめたものです。」\n\n「つまり、plan は計画全般、itinerary は旅行の具体的な行程という違いですね。」\n\nroute\n\nルート\n\n核イメージ：目的地までの道筋・経路\n\nWhat's the best route to the station?\n\n駅までの最適な経路は何ですか？\n\n「route は、どの道を通って移動するかに注目します。」\n\nWe chose a scenic route through the mountains.\n\n私たちは山を通る景色の良いルートを選びました。\n\n「先輩、itinerary は『どこを、いつ訪れるか』、route は『どの道を通るか』という違いです。」\n\n「旅程の中に移動ルートが含まれることはありますが、同じものではありません。」\n\ntimetable\n\nタイムテイブル\n\n核イメージ：時刻を一覧にした表\n\nPlease check the train timetable.\n\n電車の時刻表を確認してください。\n\n「timetable は、電車やバスの発着時刻、授業時間などをまとめた表です。」\n\nThe new timetable starts next Monday.\n\n新しい時刻表は来週月曜日から適用されます。\n\n「先輩、itinerary は旅行全体の行程、timetable は時刻の一覧に注目します。」\n\n「なお、timetable は特にイギリス英語でよく使われ、アメリカ英語では schedule が使われる場面も多いです。」\n\nreservation\n\nレザヴェイション\n\n核イメージ：席や部屋などを事前に確保する予約\n\nI made a hotel reservation.\n\n私はホテルを予約しました。\n\n「reservation は、ホテル、レストラン、座席などの予約を表します。」\n\nPlease confirm your reservation.\n\n予約内容を確認してください。\n\n「先輩、itinerary は旅行全体の予定、reservation はその中の個別の予約です。」\n\n「旅行の旅程表にホテルの予約情報が記載されることはありますが、旅程表と予約そのものは別ですよ。」\n\n### 同じ旅行で比較してみましょう\n\n「先輩、京都と大阪を旅行する場合、それぞれの単語はこう使い分けられます。」\n\n| 単語 | 注目するもの | 例 |\n| --- | --- | --- |\n| itinerary | 旅行の行程全体 | 1日目は京都、2日目は大阪 |\n| schedule | 時間的な予定 | 10時に出発、14時に観光 |\n| agenda | 会議やイベントの議題 | 出張先での会議の議題 |\n| plan | 計画全般 | 京都と大阪を旅行する計画 |\n| route | 移動経路 | 京都から大阪への経路 |\n| timetable | 時刻表 | 電車の発着時刻 |\n| reservation | 予約 | ホテルや座席の予約 |\n\n「先輩、特に itinerary と schedule は似ていますが、itinerary は旅行や出張の行程、schedule は予定全般です。」\n\n「そして、route は移動する道筋、reservation は予約そのもの。ここまで区別できれば十分実用的ですよ。」\n\n## 理解確認｜3問\n\nQ1. 『旅行の行程表を送ってください』として自然なのは？\n\nPlease send me the travel itinerary.Please send me the meeting agenda.Please send me the train route only.\n\nQ2. itinerary と route の違いとして最も適切なのは？\n\nitinerary は旅程全体、route は移動経路に注目する完全に同じ意味で、常に置き換えられるroute はホテルの予約だけを意味する\n\nQ3. 『天候のため旅程を変更した』として自然なのは？\n\nWe changed our itinerary because of the weather.We changed our reservation into weather.We changed our itinerary because the weather of.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- itinerary：旅程、旅行日程、行程表\n- travel itinerary：旅行日程表\n- flight itinerary：フライト旅程表\n- business trip itinerary：出張行程表\n- prepare an itinerary：旅程表を作成する\n- review an itinerary：旅程表を確認する\n- change an itinerary：旅程を変更する\n- finalize an itinerary：旅程を確定する\n- detailed itinerary：詳細な行程表\n- schedule：予定表・時間的な予定\n- agenda：会議の議題・議事日程\n- plan：計画全般\n- route：移動経路\n- timetable：時刻表\n- reservation：予約\n\n一文記憶\n\nI prepared a detailed itinerary for our business trip to Osaka.\n\n私は大阪への出張に向けて、詳細な行程表を作成しました。\n\n「先輩、今日のポイントは itinerary = 旅行や出張の流れを順番にまとめたもの という感覚です。」\n\n「schedule は予定全般、route は移動経路、reservation は予約。似ているようでも、注目する部分が違います。」\n\n「特に prepare an itinerary と review the itinerary は、仕事でも旅行でも使いやすいので覚えておいてくださいね。」\n\n次は 第55語｜Approval です。"}, {"name": "Approval", "text": "# 第55語｜Approval\n\n発音：/əˈpruːvəl/（アプルーヴァル）｜名詞\n\n「先輩、今日の単語は approval です。」\n\n「意味は主に 『承認』『許可』『賛同』 です。」\n\nMy request is awaiting approval.\n\n私の申請は承認待ちです。\n\nThe manager gave his approval.\n\n上司は承認しました。\n\n「先輩、ここで質問です。approval と permission は、どちらも『許可』と訳されることがありますよね。では、何が違うのでしょう？」\n\n「permission は『してもよいという許可』、approval は『内容を確認して、よいと認めること』に重点があります。」\n\n「そして、approval には単なる手続き上の承認だけでなく、『考えや行動への賛同』という意味もあるんです。」\n\n「今日は permission、authorization、consent、agreement、acceptance、endorsement との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 申請や書類の承認\n\nThe expense report requires approval.\n\nその経費精算書には承認が必要です。\n\n「内容を確認し、正式に認めるという意味ですね。」\n\n② 許可\n\nYou need your manager's approval before making the purchase.\n\nその購入を行う前に上司の承認が必要です。\n\n「会社の決裁などでよく使います。」\n\n③ 提案への賛同\n\nThe proposal received widespread approval.\n\nその提案は広く賛同を得ました。\n\n「先輩、approval は必ずしも申請書の承認だけではありません。」\n\n④ 人からの評価・好意的な反応\n\nShe always seeks her parents' approval.\n\n彼女はいつも両親から認めてもらおうとしています。\n\n「この場合は『自分を認めてほしい』という心理的な意味ですね。」\n\n核イメージ：内容や行動を評価して『よい』と認めること\n\n「先輩、approval は、相手の判断によって認められるという感覚が中心なんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『承認』『許可』『同意』という日本語は似ていますが、何を認めるのか、誰の意思が必要なのか、どんな手続きなのかによって単語が変わります。」\n\napproval\n\nアプルーヴァル\n\n核イメージ：内容や行為を評価して『よい』と認める\n\nThe proposal received approval.\n\nその提案は承認を受けました。\n\n「先輩、申請や提案の承認、考えへの賛同などに使います。」\n\npermission\n\nパーミション\n\n核イメージ：何かをしてもよいという許可\n\nYou need permission to enter this area.\n\nこの区域に入るには許可が必要です。\n\n「permission は、行為を行うことが許されているかどうかに注目します。」\n\nI asked for permission to leave early.\n\n私は早退する許可を求めました。\n\n「先輩、approval は内容を認めること、permission は行為を許すことに重点があります。」\n\n「ただし、会社の承認が行動の許可になる場合など、意味が重なることもあります。」\n\nauthorization\n\nオーソライゼイション\n\n核イメージ：権限を持つ人や組織が正式に許可すること\n\nThe payment requires authorization.\n\nその支払いには正式な承認が必要です。\n\n「authorization は、権限に基づく正式な許可や認可を表します。」\n\nOnly authorized personnel can access the system.\n\n権限を与えられた担当者だけがそのシステムにアクセスできます。\n\n「先輩、approval は内容を認めること、authorization は正式な権限を与えたり、権限に基づいて許可したりすることに注目します。」\n\n「セキュリティや支払いの文脈でもよく使います。」\n\nconsent\n\nコンセント\n\n核イメージ：本人が理解し、自分の意思で同意すること\n\nWe need your consent before sharing your information.\n\nあなたの情報を共有する前に、あなたの同意が必要です。\n\n「consent は、本人の意思による同意を表します。」\n\nShe gave her consent to the procedure.\n\n彼女はその手続きに同意しました。\n\n「先輩、approval は内容を認めること、consent は本人が同意することに重点があります。」\n\n「特に個人情報、医療、契約などの場面で重要な単語です。」\n\nagreement\n\nアグリーメント\n\n核イメージ：考えが一致すること・合意すること\n\nWe reached an agreement.\n\n私たちは合意に達しました。\n\n「agreement は、複数の人や組織の間で意見や条件が一致することです。」\n\nBoth parties signed the agreement.\n\n両当事者はその契約書に署名しました。\n\n「先輩、approval は一方が内容を認めること、agreement は当事者間で合意することに注目します。」\n\n「なお、agreement には『契約書』という意味もありますよ。」\n\nacceptance\n\nアクセプタンス\n\n核イメージ：申し出や状況などを受け入れること\n\nThe university sent me a letter of acceptance.\n\n大学から合格通知が届きました。\n\n「acceptance は、申し出、提案、応募などを受け入れることです。」\n\nThe offer received immediate acceptance.\n\nその申し出はすぐに受け入れられました。\n\n「先輩、approval は内容をよいと認めること、acceptance は受け入れることに重点があります。」\n\n「承認されたことと、受け入れられたことが重なる場面もありますが、中心となる意味は異なります。」\n\nendorsement\n\nエンドースメント\n\n核イメージ：公に支持すること・推薦すること\n\nThe proposal received strong endorsement from experts.\n\nその提案は専門家から強い支持を得ました。\n\n「endorsement は、誰かの考えや提案を支持・推薦することです。」\n\nThe candidate received the organization's endorsement.\n\nその候補者はその団体から支持を受けました。\n\n「先輩、approval は承認や好意的な評価、endorsement は積極的な支持や推薦に重点があります。」\n\n「特に政治、ビジネス、広告などで使われる単語ですね。」\n\n### 同じ場面で比較\n\n「先輩、会社で新しいシステムを導入する場面を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| approval | We need management approval. | 経営陣の承認 |\n| permission | We need permission to use the system. | 使用する許可 |\n| authorization | We need authorization to access the data. | 権限に基づくアクセス許可 |\n| consent | We need the users' consent. | 利用者本人の同意 |\n| agreement | We reached an agreement. | 当事者間の合意 |\n| acceptance | The proposal gained acceptance. | 提案が受け入れられること |\n| endorsement | The proposal received expert endorsement. | 専門家による支持・推薦 |\n\n「先輩、特に approval と permission と authorization は仕事で混同しやすい単語です。」\n\n「approval は内容を認めること、permission は行為を許すこと、authorization は権限に基づく正式な許可です。」\n\n「この3つを区別できれば、申請や承認の英文がかなり読みやすくなりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『その申請は承認待ちです』として自然なのは？\n\nThe application is pending approval.The application is pending permissioned.The application is approvaling.\n\nQ2. approval と permission の違いとして最も適切なのは？\n\napproval は内容を認めること、permission は行為を許すことに注目する完全に同じ意味で、常に置き換えられるpermission は正式な契約書だけを意味する\n\nQ3. 『承認を得るために提案書を提出しました』として自然なのは？\n\nI submitted the proposal for approval.I approvaled the proposal for submit.I submitted the proposal to approving.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- approval：承認、許可、賛同\n- approve：承認する・賛成する\n- get approval：承認を得る\n- obtain approval：承認を取得する\n- receive approval：承認を受ける\n- give approval：承認を与える\n- seek approval：承認を求める\n- pending approval：承認待ち\n- subject to approval：承認を条件とする\n- submit something for approval：承認のために提出する\n- approve of ～：～に賛成する\n- permission：行為を行う許可\n- authorization：権限に基づく正式な許可\n- consent：本人の同意\n- agreement：合意・契約\n- acceptance：受け入れること\n- endorsement：積極的な支持・推薦\n\n一文記憶\n\nI submitted the expense report for approval, but I'm still waiting for my manager's decision.\n\n私は経費精算書を承認のために提出しましたが、まだ上司の判断を待っています。\n\n「先輩、今日のポイントは approval = 内容や行動を評価して『よい』と認めること です。」\n\n「そして、request は申請、submit は提出、approval は承認。ここまで学んだ単語が一つの業務の流れとしてつながりましたね。」\n\n「単語を別々に覚えるより、submit a request → review the request → give approval という流れで覚えると、仕事でも使いやすくなりますよ。」\n\n次は 第56語｜Obtain です。"}, {"name": "Obtain", "text": "# 第56語｜Obtain\n\n発音：/əbˈteɪn/（アブテイン）｜動詞\n\n「先輩、今日の単語は obtain です。」\n\n「意味は 『手に入れる』『取得する』『獲得する』 ですね。」\n\nI obtained permission from my manager.\n\n私は上司から許可を得ました。\n\nThe company obtained the necessary documents.\n\n会社は必要な書類を入手しました。\n\n「先輩、ここで質問です。get も『手に入れる』ですよね。では、どうしてわざわざ obtain を使うのでしょう？」\n\n「それは、obtain には手続きや努力などを経て、必要なものを取得するというニュアンスがあるからです。」\n\n「特に、許可・資格・情報・証明書・承認など、ビジネスや公的な場面でよく使われます。」\n\n「今日は get、acquire、gain、earn、secure、receive、attain との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 必要なものを入手する\n\nWe need to obtain more information.\n\n私たちはさらに情報を入手する必要があります。\n\n「情報や書類など、必要なものを手に入れる場合です。」\n\n② 許可・承認を取得する\n\nYou must obtain approval before proceeding.\n\n作業を進める前に承認を得なければなりません。\n\n「先輩、前回の approval とつながりましたね。」\n\n③ 資格・免許などを取得する\n\nShe obtained a professional qualification.\n\n彼女は専門資格を取得しました。\n\n「正式な資格や免許を取得する場合にも使います。」\n\n④ 努力や手続きを経て獲得する\n\nThe researchers obtained reliable data.\n\n研究者たちは信頼できるデータを得ました。\n\n「調査や作業の結果として情報を得る場合にも自然です。」\n\n核イメージ：必要なものを、自分の手元に確保する\n\n「先輩、obtain は『手に入れる』という結果に注目します。手続きや努力を伴うことは多いですが、必ず苦労したという意味ではありませんよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『手に入れる』という単語はたくさんありますが、単に得るのか、努力して獲得するのか、権利として確保するのかによって使い分けるんです。」\n\nobtain\n\nアブテイン\n\n核イメージ：必要なものを取得する\n\nWe obtained the necessary approval.\n\n私たちは必要な承認を得ました。\n\n「先輩、情報、許可、資格などを正式に取得する場面でよく使います。」\n\nget\n\nゲット\n\n核イメージ：何かを手に入れる・得る\n\nI got a new laptop.\n\n私は新しいノートパソコンを手に入れました。\n\n「get は非常に幅広く使える日常的な単語です。」\n\nI got permission from my manager.\n\n私は上司から許可を得ました。\n\n「先輩、obtain も同じ意味で使えますが、よりフォーマルな響きがあります。」\n\nI obtained permission from my manager.\n\n私は上司から許可を取得しました。\n\n「日常会話なら get、正式な書類やビジネス文書なら obtain が自然な場合が多いです。」\n\nacquire\n\nアクワイア\n\n核イメージ：何かを自分のものとして獲得・習得する\n\nShe acquired new skills.\n\n彼女は新しい技能を身につけました。\n\n「acquire は、知識、技能、財産、企業などを獲得する場合によく使います。」\n\nThe company acquired a smaller business.\n\nその会社は小規模な企業を買収しました。\n\n「先輩、obtain は必要なものを取得すること、acquire は自分の資産や能力として獲得することに注目します。」\n\n「企業買収の acquisition も、この単語の名詞形ですね。」\n\ngain\n\nゲイン\n\n核イメージ：努力や経験などによって増やす・得る\n\nHe gained valuable experience.\n\n彼は貴重な経験を積みました。\n\n「gain は、経験、知識、信頼、利益などを得る場合によく使います。」\n\nThe company gained market share.\n\nその会社は市場シェアを拡大しました。\n\n「先輩、obtain は取得すること、gain は経験や努力などを通じて何かが増える・得られることに注目します。」\n\n「特に gain experience は定番表現です。」\n\nearn\n\nアーン\n\n核イメージ：努力や働きの対価として得る\n\nShe earns a good salary.\n\n彼女は高い給与を得ています。\n\n「earn は、働いた結果としてお金を得る場合によく使います。」\n\nHe earned the respect of his colleagues.\n\n彼は同僚からの尊敬を勝ち取りました。\n\n「先輩、obtain は取得すること全般、earn は努力や行動に見合うものを得ることに注目します。」\n\n「お金だけでなく、信頼や尊敬にも使えるんです。」\n\nsecure\n\nスィキュア\n\n核イメージ：必要なものを確実に確保する\n\nWe secured funding for the project.\n\n私たちはそのプロジェクトの資金を確保しました。\n\n「secure は、資金、契約、場所、権利などを確保する場合によく使います。」\n\nThe company secured a major contract.\n\nその会社は大型契約を獲得しました。\n\n「先輩、obtain は手に入れること、secure は必要なものを確実に確保することに注目します。」\n\n「特に競争や交渉を経て獲得する場面でよく使われます。」\n\nreceive\n\nリスィーヴ\n\n核イメージ：送られたもの・与えられたものを受け取る\n\nI received an email from my manager.\n\n私は上司からメールを受け取りました。\n\n「receive は、何かが自分のところに届いて受け取ることです。」\n\nShe received an award.\n\n彼女は賞を受け取りました。\n\n「先輩、obtain は必要なものを取得すること、receive は相手から届いたものを受け取ることに注目します。」\n\n「例えば、申請して許可を取得したなら obtain permission、許可通知を受け取ったなら receive a notification です。」\n\nattain\n\nアテイン\n\n核イメージ：努力して目標や水準に到達する\n\nShe attained a high level of proficiency.\n\n彼女は高い習熟度に達しました。\n\n「attain は、目標、水準、地位、成果などに到達する場合によく使います。」\n\nThe company attained its sales target.\n\nその会社は売上目標を達成しました。\n\n「先輩、obtain は何かを取得すること、attain は目標や水準に到達することに注目します。」\n\n「綴りは似ていますが、obtain は『手に入れる』、attain は『到達する』と覚えると区別しやすいですよ。」\n\n### 同じ場面で比較\n\n「先輩、会社で必要なものを得る場面を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| get | I got the information. | 手に入れる |\n| obtain | I obtained the information. | 正式・確実に取得する |\n| acquire | I acquired new skills. | 能力や資産として獲得する |\n| gain | I gained experience. | 経験などを積んで得る |\n| earn | I earned their trust. | 努力の結果として得る |\n| secure | I secured the funding. | 必要なものを確保する |\n| receive | I received the document. | 届いたものを受け取る |\n| attain | I attained my goal. | 目標に到達する |\n\n「先輩、特に obtain と acquire と attain は混同しやすいので、もう一度確認しましょう。」\n\nI obtained a certificate.\n\n私は証明書を取得しました。\n\nI acquired new skills.\n\n私は新しい技能を身につけました。\n\nI attained my goal.\n\n私は目標を達成しました。\n\n「obtain は取得、acquire は獲得・習得、attain は到達です。」\n\n「この3つの違いを覚えておくと、TOEICやビジネス英文でも役立ちますよ。」\n\n## 理解確認｜3問\n\nQ1. 『上司から承認を得ました』として自然なのは？\n\nI obtained approval from my manager.I obtained to approval from my manager.I was obtained approval by my manager.\n\nQ2. obtain と attain の違いとして最も適切なのは？\n\nobtain は取得すること、attain は目標や水準に到達すること完全に同じ意味で、常に置き換えられるattain は書類を受け取ることだけを意味する\n\nQ3. 『彼女は貴重な経験を積みました』として最も自然なのは？\n\nShe gained valuable experience.She obtained a valuable experience every day.She secured to experience valuable.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- obtain：手に入れる、取得する、獲得する\n- obtain A from B：BからAを入手する\n- obtain approval：承認を得る\n- obtain permission：許可を得る\n- obtain information：情報を入手する\n- obtain a certificate：証明書を取得する\n- obtain a license：免許を取得する\n- obtain access to ～：～へのアクセス権を得る\n- get：手に入れる\n- acquire：獲得する・習得する\n- gain：経験や利益などを得る\n- earn：努力や働きの対価として得る\n- secure：必要なものを確保する\n- receive：受け取る\n- attain：目標や水準に到達する\n\n一文記憶\n\nI obtained the necessary approval from my manager before starting the project.\n\n私はプロジェクトを開始する前に、上司から必要な承認を得ました。\n\n「先輩、今日のポイントは obtain = 必要なものを手元に確保する という感覚です。」\n\n「そして、request は求めること、submit は提出すること、approval は承認、obtain は取得すること。」\n\n「ここまで学んだ単語が、仕事の一連の流れとしてつながりましたね。」\n\n「単語を別々に覚えるのではなく、request approval → submit an application → obtain approval という流れで覚えると、意味がずっと定着しやすくなりますよ。」\n\n次は 第57語｜Slightly です。"}, {"name": "Slightly", "text": "# 第57語｜Slightly\n\n発音：/ˈslaɪtli/（スライトリー）｜副詞\n\n「先輩、今日の単語は slightly です。」\n\n「意味は 『少し』『わずかに』『若干』 ですね。」\n\nThe price increased slightly.\n\n価格がわずかに上昇しました。\n\nI'm slightly tired.\n\n私は少し疲れています。\n\n「先輩、a little も『少し』ですよね。では、どうして slightly を使うのでしょう？」\n\n「slightly は、変化や違い、程度が小さいことを、比較的客観的に表すときに便利なんです。」\n\n「今日は a little、a bit、somewhat、marginally、barely、hardly、moderately との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは slightly の使い方を4つに整理します。」\n\n① 変化がわずかである\n\nSales increased slightly.\n\n売上はわずかに増加しました。\n\n「増加はしたけれど、大幅ではないという意味です。」\n\n② 違いが小さい\n\nThis model is slightly different.\n\nこのモデルは少し異なります。\n\n「先輩、同じではないけれど、違いは小さいんです。」\n\n③ 状態や程度が少しだけ当てはまる\n\nI'm slightly nervous.\n\n私は少し緊張しています。\n\n「強い緊張ではなく、軽い緊張ですね。」\n\n④ 数値や位置が少しずれている\n\nThe temperature is slightly above average.\n\n気温は平均をわずかに上回っています。\n\n「ニュースやデータの説明でよく使います。」\n\n核イメージ：基準からほんの少しだけ動いている\n\n「先輩、slightly は『ゼロではないけれど、大きくもない』という程度を表します。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが重要です。」\n\n「『少し』と訳される英語でも、話し手の感覚や変化の程度によってニュアンスが違います。」\n\nslightly\n\nスライトリー\n\n核イメージ：程度や変化がわずかである\n\nThe price increased slightly.\n\n価格はわずかに上昇しました。\n\n「先輩、数字や比較、状態の違いを落ち着いて説明する場面に向いています。」\n\na little\n\nア リトル\n\n核イメージ：量や程度が少しある\n\nI'm a little tired.\n\n私は少し疲れています。\n\n「a little は日常会話でとても自然です。」\n\nThe room is a little cold.\n\n部屋は少し寒いです。\n\n「先輩、slightly は比較的客観的でややフォーマル、a little は日常的で柔らかい表現です。」\n\n「ただし、程度の小ささ自体はどちらでも表せますよ。」\n\na bit\n\nア ビット\n\n核イメージ：ちょっとだけ\n\nI'm a bit busy right now.\n\n今はちょっと忙しいです。\n\n「a bit は会話的で、a little と非常によく似ています。」\n\nThis task is a bit difficult.\n\nこの仕事はちょっと難しいです。\n\n「先輩、a bit は軽く『ちょっと』と言いたいときに便利です。」\n\n「slightly difficult も文法的には可能ですが、会話では a bit difficult の方が自然に響く場面が多いですね。」\n\nsomewhat\n\nサムワット\n\n核イメージ：ある程度・いくぶん\n\nThe results were somewhat disappointing.\n\n結果はいくぶん期待外れでした。\n\n「somewhat は、程度が一定程度あることを表します。」\n\nThe new system is somewhat complicated.\n\n新しいシステムはやや複雑です。\n\n「先輩、slightly は小さな程度を強調しますが、somewhat は『ある程度』という意味で、必ずしもごく小さいとは限りません。」\n\n「そのため、somewhat の方が強く感じられることもあります。」\n\nmarginally\n\nマージナリー\n\n核イメージ：差がごくわずかである\n\nProfits increased marginally.\n\n利益はごくわずかに増加しました。\n\n「marginally は、数値や成果の差が小さい場合によく使います。」\n\nThe new method is marginally more efficient.\n\n新しい方法は効率がわずかに高いです。\n\n「先輩、slightly とよく似ていますが、marginally は特に『差がごく小さい』ことを強調し、経済やビジネスの分析でも使われます。」\n\n「marginal は『限界の』『わずかな』などの意味を持つ形容詞ですよ。」\n\nbarely\n\nベアリー\n\n核イメージ：ぎりぎり・かろうじて\n\nI barely passed the exam.\n\n私はぎりぎり試験に合格しました。\n\n「barely は、何とか基準を満たしたという意味で使えます。」\n\nI could barely hear him.\n\n彼の声はかろうじて聞こえました。\n\n「先輩、slightly は程度が小さいこと、barely は基準をぎりぎり満たすことや、ほとんどできないことに注目します。」\n\n「同じ『少し』でも、意味はかなり違いますね。」\n\nhardly\n\nハードリー\n\n核イメージ：ほとんど～ない\n\nI hardly know him.\n\n私は彼のことをほとんど知りません。\n\n「hardly は否定に近い意味を持ちます。」\n\nThe price has hardly changed.\n\n価格はほとんど変わっていません。\n\n「先輩、slightly changed は『少し変わった』ですが、hardly changed は『ほとんど変わっていない』です。」\n\n「ここは間違えないでくださいね。」\n\nmoderately\n\nマデレットリー\n\n核イメージ：適度に・中程度に\n\nThe exercise was moderately difficult.\n\nその運動は中程度の難しさでした。\n\n「moderately は、極端ではない中くらいの程度を表します。」\n\nPrices increased moderately.\n\n価格は緩やかに上昇しました。\n\n「先輩、slightly は小さな変化、moderately は中程度の変化や程度に注目します。」\n\n「必ずしも同じ強さではないんです。」\n\n### 同じ場面で比較\n\n「先輩、商品の価格が変わった場面を考えてみましょう。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| slightly | The price increased slightly. | わずかに上昇 |\n| a little | The price went up a little. | 少し上がった |\n| a bit | The price went up a bit. | ちょっと上がった |\n| somewhat | The price is somewhat higher. | ある程度高い |\n| marginally | The price increased marginally. | ごく小幅な上昇 |\n| barely | The price barely increased. | ほとんど上がらなかった |\n| hardly | The price has hardly changed. | ほぼ変化なし |\n| moderately | The price increased moderately. | 緩やかな上昇 |\n\n「先輩、特に slightly、barely、hardly の違いは重要です。」\n\nSales increased slightly.\n\n売上はわずかに増加しました。\n\nSales barely increased.\n\n売上はほとんど増加しませんでした。\n\nSales hardly changed.\n\n売上はほとんど変化しませんでした。\n\n「slightly は小さな増加があったこと、barely は増加がぎりぎりと言えるほど小さいこと、hardly は変化がほぼないことに注目します。」\n\n## 理解確認｜3問\n\nQ1. 『価格がわずかに上昇しました』として自然なのは？\n\nThe price increased slightly.The price slightly increase.The price was slightly increase.\n\nQ2. slightly と hardly の違いとして適切なのは？\n\nslightly はわずかに、hardly はほとんど～ないどちらも必ず大幅な変化を意味するhardly は slightly より常に大きな変化を意味する\n\nQ3. 『このモデルは前のモデルより少し安いです』として自然なのは？\n\nThis model is slightly cheaper than the previous one.This model is slightly cheap than the previous one.This model is slight cheaper from the previous one.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- slightly：少し、わずかに、若干\n- slight：わずかな（形容詞）\n- slightly different：少し異なる\n- slightly higher：わずかに高い\n- slightly lower：わずかに低い\n- increase slightly：わずかに増加する\n- decrease slightly：わずかに減少する\n- slightly above average：平均をわずかに上回る\n- a little：少し（日常的）\n- a bit：ちょっと（会話的）\n- somewhat：ある程度・いくぶん\n- marginally：ごくわずかに\n- barely：かろうじて・ぎりぎり\n- hardly：ほとんど～ない\n- moderately：適度に・中程度に\n\n一文記憶\n\nThe new system is slightly faster and slightly more efficient than the old one.\n\n新しいシステムは以前のものより、わずかに速く、効率も少し高くなっています。\n\n「先輩、今日のポイントは slightly = 基準からほんの少しだけずれている という感覚です。」\n\n「特に、slightly higher、slightly lower、slightly different、increase slightly は、ニュースや仕事の資料でもよく使います。」\n\n「そして、barely や hardly は意味が違うので、同じ『少し』として覚えないでくださいね。」\n\n次は 第58語｜Detail です。"}, {"name": "Detail", "text": "# 第58語｜Detail\n\n発音：/ˈdiːteɪl/（ディーテイル）｜名詞・動詞\n\n「先輩、今日の単語は detail です。」\n\n「基本の意味は 『詳細』『細部』『詳しく説明する』 ですね。」\n\nPlease check the details.\n\n詳細を確認してください。\n\nCould you explain that in more detail?\n\nそれについて、もう少し詳しく説明していただけますか？\n\n「先輩、ここで質問です。detail と information は、どちらも『情報』に関係しますよね。では、何が違うのでしょう？」\n\n「information は情報全般ですが、detail は物事を構成する一つ一つの具体的な部分に注目します。」\n\n「例えば『来週、会議があります』というのは情報です。でも『何曜日の何時から、どこで、誰が参加するのか』というのが詳細なんです。」\n\n「今日は information、specifics、particulars、description、explanation、feature、aspect との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえましょう。」\n\n① 詳細・細部（名詞）\n\nI need more details about the project.\n\nそのプロジェクトについて、もっと詳しい情報が必要です。\n\n「details は、具体的な情報を一つ一つ指しています。」\n\n② 細かい部分（名詞）\n\nPay attention to the details.\n\n細部に注意を払ってください。\n\n「先輩、全体だけでなく、細かな部分まで見るという意味ですね。」\n\n③ 詳しく説明する（動詞）\n\nThe report details the causes of the problem.\n\nその報告書は問題の原因を詳しく説明しています。\n\n「detail は動詞としても使えます。」\n\n④ 詳細な情報を表す決まり文句\n\nPlease explain the procedure in detail.\n\n手順を詳しく説明してください。\n\n「in detail = 詳しく は特に重要です。」\n\n核イメージ：全体を構成する細かな部分を、一つずつ見ていく\n\n「先輩、detail は『全体』に対する『細部』という関係で覚えると、意味がつかみやすいですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『情報』『詳細』『説明』という言葉は似ていますが、情報全体なのか、個別の事実なのか、それとも説明する行為なのかによって使い分けるんです。」\n\ndetail\n\nディーテイル\n\n核イメージ：全体を構成する細かな部分\n\nPlease check every detail.\n\n一つ一つの細部を確認してください。\n\n「先輩、全体ではなく、その中の具体的な部分に注目します。」\n\ninformation\n\nインフォメイション\n\n核イメージ：知識や判断の材料になる情報全般\n\nI need more information about the product.\n\nその製品について、もっと情報が必要です。\n\n「information は、事実や知識などの情報全般を表します。」\n\nThe website provides useful information.\n\nそのウェブサイトは役立つ情報を提供しています。\n\n「先輩、detail は具体的な細部、information は情報全般です。」\n\n「なお、information は通常、不可算名詞なので informations とはしません。」\n\nspecifics\n\nスピスィフィクス\n\n核イメージ：曖昧ではない具体的な事項\n\nLet's discuss the specifics of the plan.\n\nその計画の具体的な内容について話し合いましょう。\n\n「specifics は、抽象的な話から一歩進んだ具体的な事項を表します。」\n\nWe haven't decided on the specifics yet.\n\n私たちはまだ具体的な内容を決めていません。\n\n「先輩、details は細部全般、specifics は特に具体的に確定させるべき事項に注目します。」\n\n「『具体的にはどうするの？』と聞きたい場面に向いていますね。」\n\nparticulars\n\nパーティキュラーズ\n\n核イメージ：個別の具体的な事実・事項\n\nPlease provide the particulars of the incident.\n\nその出来事の詳しい事実関係を教えてください。\n\n「particulars は、個別の事実や詳細事項を表します。」\n\nThe form asks for personal particulars.\n\nその用紙では個人情報の詳細事項が求められています。\n\n「先輩、details と似ていますが、particulars はややフォーマルで、書類や正式な説明などで使われることがあります。」\n\n「日常会話なら details の方が使いやすいですよ。」\n\ndescription\n\nディスクリプション\n\n核イメージ：特徴や様子を言葉で描写すること\n\nThe website has a detailed product description.\n\nそのウェブサイトには詳しい商品説明があります。\n\n「description
