he data.\n\n特定の従業員はそのデータにアクセスできます。\n\n「先輩、誰なのかを具体的に示さず、対象を限定しています。」\n\nspecific\n\nスペシフィック\n\n核イメージ：具体的に特定された\n\nI have a specific question.\n\n具体的な質問があります。\n\n「specific は、対象や内容が具体的に絞られていることを表します。」\n\nPlease give me a specific example.\n\n具体的な例を挙げてください。\n\n「先輩、certain は『ある特定の』とぼかす場合がありますが、specific は具体性に重点があります。」\n\nparticular\n\nパーティキュラー\n\n核イメージ：多くのものの中から一つを取り出す\n\nI'm interested in this particular issue.\n\n私はこの特定の問題に関心があります。\n\n「particular は、複数の対象の中から一つを取り出して注目するイメージです。」\n\nIs there any particular reason?\n\n何か特別な理由があるのですか？\n\n「先輩、certain と particular は近いですが、particular は選び出した対象への注目が強いことがあります。」\n\nsome\n\nサム\n\n核イメージ：いくつかの・一部の\n\nSome employees work remotely.\n\n一部の従業員はリモートで働いています。\n\n「some は、単純に一部の人や物を表します。」\n\nCertain employees work remotely.\n\n特定の従業員はリモートで働いています。\n\n「先輩、certain の方が、何らかの条件や特徴で対象が限定されている響きを持つことがあります。」\n\na degree of\n\nア・ディグリー・オヴ\n\n核イメージ：ある程度の度合い\n\nThe job requires a degree of flexibility.\n\nその仕事にはある程度の柔軟性が必要です。\n\n「a certain degree of と近い意味です。」\n\nA certain degree of uncertainty is unavoidable.\n\nある程度の不確実性は避けられません。\n\n「先輩、a certain degree of は程度があることを示しながら、具体的な数値は示さない表現です。」\n\n## 使い分け早見表\n\n| 単語 | 核イメージ | 代表例 |\n| --- | --- | --- |\n| certain | 確信している・特定の | I'm certain. |\n| sure | 自分の中で確信がある | Are you sure? |\n| confident | 自信がある | I'm confident. |\n| definite | 明確に定まっている | a definite answer |\n| guaranteed | 保証されている | guaranteed success |\n| inevitable | 避けられない | inevitable change |\n| specific | 具体的に特定された | a specific example |\n| particular | 多くの中から取り出した特定の | this particular issue |\n| some | いくつかの・一部の | some people |\n| a degree of | ある程度の | a degree of flexibility |\n\n「先輩、特に certain・sure・confident と certain・specific・particular は混同しやすい組み合わせです。」\n\n「前者は確信の性質、後者は対象の特定の仕方を意識してください。」\n\n## 理解確認｜3問\n\nQ1. 『彼が正しいと確信しています』として自然なのは？\n\nI'm certain that he's right.I'm certain him right.I'm certain to him right.\n\nQ2. Certain employees have access to the data. の意味は？\n\n特定の従業員はそのデータにアクセスできます。確信している従業員だけがそのデータを作りました。すべての従業員がそのデータにアクセスできます。\n\nQ3. a certain amount of time の意味は？\n\nある程度の時間確実にゼロの時間特定の一人の時間\n\n## 30秒復習\n\n「先輩、最後に重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| be certain that ～ | ～だと確信している |\n| be certain of / about ～ | ～について確信している |\n| be certain to do ～ | 必ず～する |\n| make certain that ～ | ～であることを確実に確認する |\n| certain people | ある特定の人々 |\n| a certain person | ある人物 |\n| a certain amount of ～ | ある程度の～ |\n| to a certain extent | ある程度まで |\n| for certain | 確実に |\n| certainly | 確かに・もちろん |\n| certainty | 確実性・確信 |\n| uncertain | 不確かな |\n| uncertainty | 不確実性 |\n\n一文記憶\n\nI'm certain that certain people need a certain amount of time to make a decision.\n\nある特定の人々が決断を下すには、ある程度の時間が必要だと私は確信しています。\n\n「先輩、この一文には certain の3つの重要な意味が入っています。」\n\n「最初は『確信している』、2番目は『特定の』、3番目は『ある程度の』です。」\n\n「certain は、後ろに続く言葉によって意味を判断する。 これを忘れないでくださいね。」\n\n次は 第86語｜Thing です。"}, {"name": "Thing", "text": "# 第86語｜Thing\n\n発音：/θɪŋ/（スィング）｜名詞\n\n意味：物・こと・事柄・状況・問題・大切なこと\n\n「先輩、今日の単語は thing です。」\n\n「……先輩、今『こんな簡単な単語まで勉強するんですか？』と思いませんでした？」\n\n「ふふ、甘いですよ。thing は簡単に見えて、英語らしい表現を理解するうえで、とても重要な単語なんです。」\n\n例えば、こちらを見てください。\n\nThat's the thing.\n\nそこが問題なんです。／そこが重要な点なんです。\n\nThe thing is, I don't have enough time.\n\n実は、時間が足りないんです。\n\nIt's not my thing.\n\nそれは私の好みではありません。\n\nI have a thing for old books.\n\n私は古い本に目がないんです。\n\n「先輩、どれも thing が使われていますが、『物』と訳すと不自然ですよね。」\n\n「thing の核イメージは、名前を具体的に言わずに、何か一つの対象・事柄を指すことです。」\n\n「この感覚を身につければ、英語の会話がずっと自然に理解できるようになりますよ。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは thing の代表的な5つの使い方を押さえましょう。」\n\n① 物・物体\n\nWhat's that thing on the table?\n\nテーブルの上にあるあれは何ですか？\n\n「名前が分からない物を指しています。」\n\n② こと・事柄\n\nI have a lot of things to do.\n\nやることがたくさんあります。\n\n「ここでは物ではなく、作業や用事を指しています。」\n\n③ 状況・事情\n\nThings are getting better.\n\n状況は良くなってきています。\n\n「things は、周囲の状況全体を指すこともあります。」\n\n④ 重要な点・問題\n\nThe thing is, we don't have enough money.\n\n問題は、十分なお金がないことなんです。\n\n「先輩、これは日常会話で特に重要な表現です。」\n\n⑤ 好み・得意分野\n\nCooking isn't really my thing.\n\n料理はあまり私の得意分野ではありません。\n\n「my thing は、自分が好きなことや得意なことを表せるんですよ。」\n\n核イメージ：名前を具体的に言わず、ある対象・事柄をひとまとまりに指す\n\n目に見える対象 → 物\n\n行動・出来事 → こと\n\n話の中心 → 問題・重要な点\n\n自分に合う対象 → 好み・得意分野\n\n「先輩、thing は非常に抽象度が高い単語です。だからこそ、物にも出来事にも考えにも使えるんですね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語との比較です。」\n\n「thing は意味が非常に広いので、何を指しているかによって、適切な類義語が変わるんです。」\n\nthing\n\nスィング\n\n核イメージ：名前を具体的に言わず、物や事柄を指す\n\nThere are a few things I want to discuss.\n\n話し合いたいことがいくつかあります。\n\n「先輩、thing は物にも事柄にも使える、非常に幅広い単語です。」\n\nstuff\n\nスタフ\n\n核イメージ：物や事柄をまとめて、ざっくり指す\n\nI have a lot of stuff to do.\n\nやることがたくさんあります。\n\n「stuff は、個々のものを数えるより、ひとまとまりとして捉える単語です。」\n\nThere's a lot of stuff in my bag.\n\nバッグの中にはいろいろな物が入っています。\n\n「先輩、thing は数えられますが、stuff は通常、数えられません。」\n\n「また、stuff はかなり口語的な表現です。」\n\nobject\n\nオブジェクト\n\n核イメージ：形のある具体的な物体\n\nThere was a strange object in the sky.\n\n空に奇妙な物体がありました。\n\n「object は、目に見える物体を指すことが多いです。」\n\nThe museum displays ancient objects.\n\nその博物館には古代の物品が展示されています。\n\n「先輩、thing は抽象的な事柄にも使えますが、object は物理的な対象に重点があります。」\n\nitem\n\nアイテム\n\n核イメージ：一覧や集まりの中の一つの項目\n\nThere are five items on the list.\n\nリストには5つの項目があります。\n\n「item は、商品・項目・品目など、一つずつ区別できるものを指します。」\n\nPlease check each item carefully.\n\n各項目を注意深く確認してください。\n\n「先輩、thing は幅広い言い方、item は一覧や分類の中の一つというイメージです。」\n\n「仕事の資料では item の方が具体的で適切なことも多いですよ。」\n\nmatter\n\nマター\n\n核イメージ：検討・対応が必要な事柄や問題\n\nWe need to discuss this matter.\n\n私たちはこの件について話し合う必要があります。\n\n「matter は、問題・案件・事柄などを表します。」\n\nThis is a serious matter.\n\nこれは重大な問題です。\n\n「先輩、thing は幅広い『こと』、matter は検討や対応の対象となる『事柄』に重点があります。」\n\n「matter の方が少し改まった響きになることがあります。」\n\nissue\n\nイシュー\n\n核イメージ：議論・解決が必要な問題や論点\n\nWe need to address this issue.\n\n私たちはこの問題に対処する必要があります。\n\n「issue は、議論や対応が必要な問題・論点を表します。」\n\nThe report highlights several important issues.\n\nその報告書はいくつかの重要な問題を取り上げています。\n\n「先輩、thing は単なる『こと』でも使えますが、issue は問題や論点という意味がはっきりしています。」\n\naspect\n\nアスペクト\n\n核イメージ：物事をある角度から見た一つの側面\n\nWe need to consider every aspect of the problem.\n\n私たちはその問題のあらゆる側面を考慮する必要があります。\n\n「aspect は、物事の一部分や側面を表します。」\n\nOne important aspect is cost.\n\n重要な側面の一つは費用です。\n\n「先輩、thing は対象そのものを広く指しますが、aspect は対象の中の特定の側面に注目します。」\n\npoint\n\nポイント\n\n核イメージ：話や議論の中の重要な点\n\nThat's a good point.\n\nそれは良い指摘ですね。\n\n「point は、主張や説明の中の要点を指します。」\n\nThe main point is that we need more time.\n\n重要なのは、もっと時間が必要だということです。\n\n「先輩、thing は幅広い事柄、point は議論の焦点や要点に重点があります。」\n\n「That's the thing. と That's the point. は似ていますが、後者は『そこが要点だ』という意味が明確です。」\n\nevent\n\nイヴェント\n\n核イメージ：実際に起こった出来事\n\nThe event changed his life.\n\nその出来事は彼の人生を変えました。\n\n「event は、実際に起こった出来事を指します。」\n\nSeveral important events occurred last year.\n\n昨年はいくつかの重要な出来事が起こりました。\n\n「先輩、thing は物や事柄全般、event は時間の中で起こる出来事に重点があります。」\n\nbelongings\n\nビロンギングズ\n\n核イメージ：自分が所有している持ち物\n\nPlease keep your belongings with you.\n\n持ち物は手元に置いてください。\n\n「belongings は、個人の持ち物を表します。」\n\nHe packed all his belongings.\n\n彼は自分の持ち物をすべて荷造りしました。\n\n「先輩、things も持ち物を指せますが、belongings は所有物という意味が明確です。」\n\n## 使い分け早見表\n\n| 単語 | 核イメージ | 代表例 |\n| --- | --- | --- |\n| thing | 物・こと・事柄全般 | things to do |\n| stuff | まとめて捉える物・事柄 | a lot of stuff |\n| object | 具体的な物体 | a strange object |\n| item | 一覧の中の一項目 | an item on the list |\n| matter | 検討・対応する事柄 | an important matter |\n| issue | 問題・論点 | address an issue |\n| aspect | 物事の一側面 | an important aspect |\n| point | 話の要点・指摘 | a good point |\n| event | 起こった出来事 | an important event |\n| belongings | 個人の持ち物 | personal belongings |\n\n「先輩、thing は便利ですが、具体的な単語を使える場面では、issue、item、aspect などを選ぶと、意味がより正確に伝わります。」\n\n「ただし、日常会話では thing のような幅広い単語を使うこと自体が自然なんですよ。」\n\n## 理解確認｜3問\n\nQ1. The thing is, we don't have enough time. の意味として自然なのは？\n\n問題は、十分な時間がないことなんです。その物は時間を持っていません。時間という物を買いました。\n\nQ2. It's not my thing. の意味は？\n\nそれは私の好みや得意分野ではありません。それは私の所有物ではありません。それは私が作った物です。\n\nQ3. thing と stuff の違いとして適切なのは？\n\nthing は数えられる名詞、stuff は通常数えられない名詞thing は必ず人間を指すstuff は必ず一つずつ数えられる\n\n## 30秒復習\n\n「先輩、最後に重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| thing | 物・こと・事柄 |\n| things to do | やること |\n| The thing is, ～ | 実は・問題は～ |\n| That's the thing. | そこが問題・重要な点 |\n| the important thing | 重要なこと |\n| the last thing I want | 最も望まないこと |\n| It's not my thing. | 私の好みではない |\n| have a thing for ～ | ～に目がない |\n| one thing leads to another | 次々と出来事がつながる |\n| first thing | 真っ先に |\n| for one thing | 理由の一つとして |\n| little things | 細かいこと |\n| stuff | いろいろな物・事柄 |\n| object | 物体 |\n| item | 項目 |\n| matter | 事柄・問題 |\n| issue | 問題・論点 |\n| aspect | 側面 |\n| point | 要点 |\n| event | 出来事 |\n| belongings | 持ち物 |\n\n一文記憶\n\nThe thing is, there are so many things I want to do, but I don't have enough time.\n\n実は、やりたいことがたくさんあるのに、十分な時間がないんです。\n\n「先輩、この一文では thing が2回登場していますね。」\n\n「最初の The thing is は『実は・問題は』、2番目の things は『やりたいこと』です。」\n\n「thing は、具体的な名前を言わずに、物や事柄をひとまとまりとして指す単語。 このイメージを覚えておいてください。」\n\n「簡単な単語ほど、使い方の幅が広いものです。先輩、油断しないでくださいね。」\n\n次は 第87語｜Give someone the benefit of the doubt です。"}, {"name": "Give someone the benefit of the doubt", "text": "# 第87語｜Give someone the benefit of the doubt\n\n発音：/ɡɪv ˈsʌmwʌn ðə ˈbenɪfɪt əv ðə daʊt/\n\nカタカナ：ギヴ・サムワン・ザ・ベネフィット・オヴ・ザ・ダウト\n\n意味：疑わしい点があっても、相手を信じる／悪意があったと決めつけず、好意的に解釈する\n\n「先輩、今日の表現は少し長いですね。でも、意味を理解すると、英語だけでなく人間関係でも役立つ表現なんですよ。」\n\n例えば、友人が約束の時間に遅れてきたとしましょう。\n\nHe might have a good reason. Let's give him the benefit of the doubt.\n\n何か正当な理由があるのかもしれません。ひとまず彼を信じてみましょう。\n\n「先輩、ここで重要なのは、相手が正しいと証明されたわけではないということです。」\n\n「遅刻した理由はまだ分かりません。それでも、いきなり『怠け者だ』『約束を軽く考えている』と決めつけず、事情がある可能性を認めるんです。」\n\n「これが give someone the benefit of the doubt の中心的な意味ですよ。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは表現を分解してみましょう。」\n\n| 部分 | 意味 |\n| --- | --- |\n| give | 与える |\n| someone | 誰かに |\n| the benefit | 有利な扱い・恩恵 |\n| of the doubt | 疑いが残っていることによる |\n\n「直訳に近い形では『疑いがあることによる利益を相手に与える』です。」\n\n「少し不自然ですよね。自然な日本語にすると、疑わしい点があっても、相手に有利な解釈をするとなります。」\n\n核イメージ：証拠が足りないとき、悪い方に決めつけない\n\n本当の事情が分からない\n\n悪い理由も、正当な理由も考えられる\n\nひとまず相手に有利な解釈をする\n\n基本例文\n\nI'll give you the benefit of the doubt.\n\nひとまずあなたを信じることにします。\n\nShe gave him the benefit of the doubt.\n\n彼女は疑わしい点があっても、彼を信じることにしました。\n\n「先輩、これは『無条件で信頼する』ではありません。疑いが残っているからこそ使う表現なんです。」\n\n## 類義語・近義語との違い\n\n「先輩、ここからは似た意味の表現を比較しましょう。」\n\n「どれも『信じる』『理解する』という方向性を持っていますが、何を重視するかが違います。」\n\ngive someone the benefit of the doubt\n\n核イメージ：疑いが残っていても、相手に有利に判断する\n\nI'll give her the benefit of the doubt.\n\nひとまず彼女を信じます。\n\n「先輩、今日の中心表現です。疑いがあることが前提なんですよ。」\n\ntrust\n\nトラスト\n\n核イメージ：相手の誠実さや能力を信頼する\n\nI trust her judgment.\n\n私は彼女の判断を信頼しています。\n\n「trust は、相手への信頼そのものです。」\n\n「先輩、give someone the benefit of the doubt は、疑いがある場面で暫定的に好意的な判断をすることです。必ずしも深い信頼関係があるとは限りません。」\n\nbelieve\n\nビリーヴ\n\n核イメージ：相手の言葉や内容を本当だと思う\n\nI believe what she said.\n\n私は彼女の言ったことを信じています。\n\n「believe は、話の内容を真実だと思うことです。」\n\n「一方、give someone the benefit of the doubt は、まだ真実か確信できない状態でも使えます。」\n\nassume good intentions\n\nアスーム・グッド・インテンションズ\n\n核イメージ：相手に悪意はなかったと考える\n\nTry to assume good intentions when someone makes a mistake.\n\n誰かがミスをしたときは、悪意がなかったと考えてみてください。\n\n「先輩、こちらは特に『相手の意図』に注目しています。」\n\n「give someone the benefit of the doubt は、意図だけでなく、説明の真偽や行動の理由などにも使えます。」\n\nwithhold judgment\n\nウィズホウルド・ジャッジメント\n\n核イメージ：判断を保留する\n\nWe should withhold judgment until we know the facts.\n\n事実が分かるまで判断を控えるべきです。\n\n「先輩、ここは大切な違いです。」\n\n「withhold judgment は良いとも悪いとも決めません。一方、give someone the benefit of the doubt は、疑いがある中で相手に有利な解釈をします。」\n\nkeep an open mind\n\nキープ・アン・オープン・マインド\n\n核イメージ：先入観を持たず、可能性を受け入れる\n\nKeep an open mind until you've heard both sides.\n\n双方の話を聞くまでは、先入観を持たないでください。\n\n「これは考え方を柔軟に保つ表現です。」\n\n「give someone the benefit of the doubt は、特定の人への好意的な判断を表します。」\n\nbe understanding\n\nビー・アンダースタンディング\n\n核イメージ：相手の事情や感情に理解を示す\n\nPlease be understanding if she's late.\n\n彼女が遅れても、事情を理解してあげてください。\n\n「先輩、こちらは思いやりのある態度を表します。」\n\n「give someone the benefit of the doubt は、疑わしい状況で相手を悪く決めつけないという判断に重点があります。」\n\ncut someone some slack\n\nカット・サムワン・サム・スラック\n\n核イメージ：相手に厳しくしすぎず、大目に見る\n\nHe's new to the job. Cut him some slack.\n\n彼はまだ仕事を始めたばかりです。少し大目に見てあげてください。\n\n「cut someone some slack は、失敗や不十分な行動に対して寛容になることです。」\n\n「先輩、give someone the benefit of the doubt は『本当の事情が分からない』ことが重要ですが、cut someone some slack は事情が分かっている場合にも使えます。」\n\ntake someone's word for it\n\nテイク・サムワンズ・ワード・フォー・イット\n\n核イメージ：相手の言葉をそのまま信用する\n\nI haven't checked the numbers, but I'll take your word for it.\n\n数字は確認していませんが、あなたの言葉を信じます。\n\n「これは相手の説明を信用する表現です。」\n\n「give someone the benefit of the doubt は、疑わしい点がある中で好意的に解釈するという意味が強いですね。」\n\n## 使い分け早見表\n\n| 表現 | 核イメージ |\n| --- | --- |\n| give someone the benefit of the doubt | 疑いがあっても好意的に判断 |\n| trust | 相手を信頼する |\n| believe | 言葉や内容を本当だと思う |\n| assume good intentions | 悪意がなかったと考える |\n| withhold judgment | 判断を保留する |\n| keep an open mind | 先入観を持たない |\n| be understanding | 事情や感情に理解を示す |\n| cut someone some slack | 大目に見る |\n| take someone's word for it | 相手の言葉を信用する |\n\n「先輩、特に withhold judgment との違いは重要ですよ。」\n\n「判断を保留するのか、それとも相手に有利な判断をするのか。この二つは似ているようで違うんです。」\n\n## 理解確認｜3問\n\nQ1. give someone the benefit of the doubt の意味として最も適切なのは？\n\n疑わしい点があっても、ひとまず相手を好意的に解釈する相手が必ず正しいと証明する相手のミスをすべて許す\n\nQ2. 『彼女には何か事情があるのかもしれません。ひとまず信じましょう』として自然なのは？\n\nShe may have a good reason. Let's give her the benefit of the doubt.She may have a good reason. Let's give her the doubt of the benefit.She may have a good reason. Let's give the benefit her doubt.\n\nQ3. withhold judgment との違いは？\n\nwithhold judgment は判断を保留し、benefit of the doubt は相手に有利な解釈をする両方とも相手の行動を無条件で許すwithhold judgment は相手を罰するという意味\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| give someone the benefit of the doubt | 疑わしくてもひとまず信じる |\n| give him the benefit of the doubt | ひとまず彼を信じる |\n| give her the benefit of the doubt | ひとまず彼女を信じる |\n| give people the benefit of the doubt | 人をすぐに悪く決めつけない |\n| benefit | 利益・恩恵 |\n| doubt | 疑い・疑念 |\n| trust | 信頼する |\n| believe | 信じる |\n| assume good intentions | 悪意がないと考える |\n| withhold judgment | 判断を保留する |\n| keep an open mind | 先入観を持たない |\n| be understanding | 理解を示す |\n| cut someone some slack | 大目に見る |\n| take someone's word for it | 相手の言葉を信用する |\n\n一文記憶\n\nI don't know the whole story, so I'll give him the benefit of the doubt.\n\n事情のすべてを知っているわけではないので、ひとまず彼を信じることにします。\n\n「先輩、今日のポイントは 疑いがあることと、相手を悪く決めつけることは別ということです。」\n\n「相手を好意的に解釈しながら、必要な確認はする。そういう姿勢を表す言葉なんですよ。」\n\n「……もちろん、先輩が同じ失敗を何度も繰り返したら、私だって毎回 the benefit of the doubt を与えるわけにはいきませんからね。」\n\n「でも、最初から決めつけたりはしません。ちゃんと事情を聞きますよ。」\n\n次は 第88語｜Bully です。"}, {"name": "Bully", "text": "# 第88語｜Bully\n\n発音：/ˈbʊl.i/（ブリー）｜動詞・名詞\n\n意味：いじめる／威圧する／弱い立場の相手を脅して従わせる／いじめっ子\n\n「先輩、今日の単語は bully です。」\n\n「『いじめる』という意味で覚えているかもしれませんが、それだけでは不十分ですよ。学校でのいじめだけでなく、職場での威圧、SNSでの攻撃、相手を脅して従わせる行為にも使われるんです。」\n\nまずは、この3文を見てください。\n\nHe was bullied at school.\n\n彼は学校でいじめられていました。\n\nThe manager bullied his employees into working overtime.\n\nその管理職は従業員を威圧して残業させました。\n\nDon't be a bully.\n\n弱い立場の人をいじめるような人にならないでください。\n\n「先輩、2番目の英文が特に重要です。bully は、ただ嫌なことを言うだけではありません。」\n\n「力関係や威圧を利用して、相手を傷つけたり、思いどおりに動かしたりする。これが中心的なイメージなんです。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは bully の3つの使い方を押さえましょう。」\n\n① 動詞：いじめる・威圧する\n\nSome students bullied him because he was different.\n\n一部の生徒は、彼がほかの人と違うという理由でいじめました。\n\n「相手を繰り返し傷つけたり、力関係を利用して威圧したりする行為ですね。」\n\n② 動詞：脅して何かをさせる\n\nThey bullied her into apologizing.\n\n彼らは彼女を威圧して謝罪させました。\n\n「先輩、これは bully someone into doing という重要な構文です。」\n\n③ 名詞：いじめっ子・威圧的な人\n\nHe was a bully in high school.\n\n彼は高校時代、いじめっ子でした。\n\n「bully は行為を表す動詞だけでなく、そのような行動をする人を指す名詞にもなるんです。」\n\n核イメージ：威圧や力関係を利用して、相手を傷つけたり支配したりする\n\n力関係の不均衡\n\n威圧・脅し・繰り返される攻撃\n\n相手を傷つける・従わせる\n\n「ただし先輩、bully は必ずしも身体的な暴力を意味しません。言葉や社会的な圧力による行為にも使えます。」\n\n## 類義語・近義語との違い\n\n「先輩、ここからが重要ですよ。」\n\n「bully に似た単語はたくさんありますが、攻撃の方法・目的・継続性によって使い分けます。」\n\nbully\n\nブリー\n\n核イメージ：力や威圧を利用して相手を傷つける・従わせる\n\nHe bullied his classmates.\n\n彼は同級生をいじめました。\n\n「先輩、相手を威圧したり、力関係を利用したりするニュアンスが中心です。」\n\ntease\n\nティーズ\n\n核イメージ：からかう・冗談を言って反応を引き出す\n\nHis friends teased him about his haircut.\n\n友人たちは彼の髪型をからかいました。\n\n「tease は軽い冗談として使われることもあります。」\n\n「でも先輩、相手が嫌がっているのに執拗に続ければ、いじめになることもあります。tease だから無害とは限りません。」\n\nharass\n\nハラス\n\n核イメージ：相手を繰り返し困らせる・嫌がらせをする\n\nShe was harassed by a coworker.\n\n彼女は同僚から嫌がらせを受けました。\n\n「harass は迷惑行為や嫌がらせに重点があります。」\n\n「bully は力関係や威圧を強く連想させますが、harass は必ずしもそのような力関係を必要としません。」\n\nintimidate\n\nインティミデイト\n\n核イメージ：恐怖や威圧感を与える\n\nHe tried to intimidate the witness.\n\n彼は証人を威圧しようとしました。\n\n「intimidate は相手を怖がらせることに重点があります。」\n\n「先輩、bully は継続的ないじめや支配的な行動にも使われますが、intimidate は恐怖を与える行為そのものに焦点があります。」\n\nthreaten\n\nスレトゥン\n\n核イメージ：不利益や危害を加えると脅す\n\nHe threatened to fire her.\n\n彼は彼女を解雇すると脅しました。\n\n「threaten は脅しの内容を示すことができます。」\n\n「bully は、必ずしも明示的な脅迫を伴いません。威圧的な態度や繰り返される攻撃でも成立します。」\n\npick on\n\nピック・オン\n\n核イメージ：特定の相手を狙っていじめる・難癖をつける\n\nWhy do you always pick on him?\n\nどうしていつも彼ばかりいじめるんですか？\n\n「先輩、pick on は、ある人を標的にして繰り返し嫌なことをするイメージです。」\n\n「bully よりも口語的で、軽いからかいから深刻ないじめまで使われます。」\n\nmock\n\nモック\n\n核イメージ：相手をばかにする・嘲笑する\n\nThey mocked his pronunciation.\n\n彼らは彼の発音をばかにしました。\n\n「mock は言葉や態度によって嘲笑することです。」\n\n「bully は威圧や支配を含む広い行為ですが、mock は特に嘲笑という方法に焦点があります。」\n\nabuse\n\nアビューズ\n\n核イメージ：人を虐待する・ひどく扱う\n\nHe was verbally abused by his supervisor.\n\n彼は上司から言葉による虐待を受けました。\n\n「abuse は身体的・精神的な虐待や暴言など、深刻な不当な扱いを表します。」\n\n「先輩、bully と重なる場面もありますが、abuse の方が深刻な加害行為を指すことがあります。」\n\ngang up on\n\nギャング・アップ・オン\n\n核イメージ：複数人で一人を集中的に攻撃する\n\nThey ganged up on him during the meeting.\n\n彼らは会議中、集団で彼を攻撃しました。\n\n「先輩、これは次に勉強する表現です。」\n\n「bully は一人でも集団でも使えますが、gang up on は複数人が結束して一人を攻撃することが中心です。」\n\n## 使い分け早見表\n\n| 単語・表現 | 核イメージ |\n| --- | --- |\n| bully | 威圧や力関係を利用していじめる |\n| tease | からかう |\n| harass | 嫌がらせをする |\n| intimidate | 怖がらせて威圧する |\n| threaten | 危害や不利益を加えると脅す |\n| pick on | 特定の相手を狙っていじめる |\n| mock | ばかにする・嘲笑する |\n| abuse | 虐待する・ひどく扱う |\n| gang up on | 複数人で一人を攻撃する |\n\n「先輩、特に bully・harass・intimidate の違いを意識してください。」\n\n「bully は力関係を利用したいじめ、harass は嫌がらせ、intimidate は恐怖を与える威圧です。」\n\n「重なる場面もありますが、注目する部分が違うんですよ。」\n\n## 理解確認｜3問\n\nQ1. bully の核イメージとして最も適切なのは？\n\n力や威圧を利用して相手をいじめたり従わせたりする相手を丁寧に説得する相手の意見に賛成する\n\nQ2. 『上司は彼を威圧して残業させた』として自然なのは？\n\nThe boss bullied him into working overtime.The boss bullied him to working overtime.The boss bullied him into work overtime.\n\nQ3. bully と gang up on の違いは？\n\nbully は一人でも集団でも使えるが、gang up on は複数人による集中的な攻撃bully は必ず複数人で行うgang up on は相手を褒めるという意味\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| bully | いじめる・威圧する |\n| a bully | いじめっ子・威圧的な人 |\n| be bullied | いじめられる |\n| bully someone into doing | 威圧して～させる |\n| bully someone out of doing | 威圧して～するのをやめさせる |\n| bullying | いじめ |\n| cyberbullying | ネット上のいじめ |\n| workplace bullying | 職場でのいじめ |\n| tease | からかう |\n| harass | 嫌がらせをする |\n| intimidate | 威圧する |\n| threaten | 脅す |\n| pick on | 特定の相手をいじめる |\n| mock | 嘲笑する |\n| abuse | 虐待する |\n| gang up on | 集団で攻撃する |\n\n一文記憶\n\nThe manager bullied his employees into working overtime.\n\nその管理職は従業員を威圧して残業させました。\n\n「先輩、bully は単なる『いじめる』ではなく、力関係や威圧を利用して、相手を傷つけたり従わせたりするというイメージで覚えてください。」\n\n「それから、bully someone into doing は重要構文です。ここは確実に押さえておきましょう。」\n\n次は 第89語｜Gang up on someone です。"}, {"name": "Gang up on someone", "text": "# 第89語｜Gang up on someone\n\n発音：/ɡæŋ ʌp ɑːn ˈsʌmwʌn/（ギャング・アップ・オン・サムワン）\n\n意味：複数人で一人を攻撃する／集団で責め立てる／寄ってたかって非難する\n\n「先輩、今日の表現は gang up on someone です。」\n\n「前回の bully と関係が深い表現ですが、決定的な違いがあるんです。」\n\nまず、この英文を見てください。\n\nEveryone ganged up on him during the meeting.\n\n会議中、みんなが寄ってたかって彼を責め立てました。\n\n「先輩、ここで重要なのは、単に彼が批判されたということではありません。」\n\n「複数の人が一人を相手にして、集中的に攻撃する。その不均衡な構図が、この表現の中心なんです。」\n\n「しかも、必ずしも身体的な暴力ではありません。言葉による非難、SNSでの集団攻撃、職場での集中的な責め立てにも使えるんですよ。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは表現を3つに分けてみましょう。」\n\n| 部分 | イメージ |\n| --- | --- |\n| gang | 集団・仲間 |\n| up | 集まって一つになる感覚 |\n| on someone | 誰か一人を標的にする |\n\n「全体では、複数人が結束して、特定の相手に敵対するという意味になります。」\n\n① 集団で攻撃する\n\nSeveral students ganged up on him.\n\n複数の生徒が集団で彼を攻撃しました。\n\n② 寄ってたかって非難する\n\nThey ganged up on her for making a mistake.\n\n彼らは彼女がミスをしたことで、寄ってたかって責めました。\n\n③ 一人に対して複数人が対抗する\n\nI felt like everyone was ganging up on me.\n\nみんなが結託して私を責めているように感じました。\n\n「先輩、3番目では felt like も登場していますね。」\n\n「これは実際に全員が結託していたと断定しているわけではなく、本人にはそう感じられたという表現です。」\n\n核イメージ：多数が一人を標的にする\n\n複数人\n\n一人\n\nThey ganged up on him.\n\n彼らは集団で彼を攻撃しました。\n\n「先輩、人数の多さだけでなく、複数人が同じ相手に向かう構図を意識してください。」\n\n## 類義語・近義語との違い\n\n「先輩、ここからは似た表現を比較しましょう。」\n\n「gang up on は、単に攻撃するという意味ではなく、複数人が一人を標的にすることが中心です。」\n\ngang up on\n\nギャング・アップ・オン\n\n核イメージ：複数人が結束して一人を攻撃する\n\nThey ganged up on him.\n\n彼らは集団で彼を攻撃しました。\n\n「先輩、人数の不均衡と敵対的な結束がポイントです。」\n\nbully\n\nブリー\n\n核イメージ：威圧や力関係を利用していじめる\n\nHe bullied his classmates.\n\n彼は同級生をいじめました。\n\n「bully は一人でも集団でも行えます。」\n\n「先輩、gang up on は集団であることが重要ですが、bully は威圧やいじめの性質に重点があります。」\n\nteam up against\n\nチーム・アップ・アゲンスト\n\n核イメージ：共通の相手に対抗するため協力する\n\nThe two teams teamed up against a stronger opponent.\n\nその2チームは、より強い相手に対抗するため協力しました。\n\n「team up against は、共通の相手に対抗するための協力です。」\n\n「gang up on は敵対的・不公平な集団攻撃という印象を与えやすいんです。」\n\npile on\n\nパイル・オン\n\n核イメージ：次々に批判や攻撃を重ねる\n\nPeople piled on after his controversial comment.\n\n彼の物議を醸す発言の後、人々が次々に批判を浴びせました。\n\n「先輩、pile on は、すでに批判されている相手にさらに攻撃が重なるイメージです。」\n\n「gang up on は集団として相手に向かうこと、pile on は批判が次々に積み重なることに重点があります。」\n\nattack\n\nアタック\n\n核イメージ：相手を攻撃する\n\nThey attacked his argument.\n\n彼らは彼の主張を攻撃しました。\n\n「attack は非常に広い単語で、身体的な攻撃にも言葉による批判にも使えます。」\n\n「先輩、gang up on は複数人が特定の相手に向かう構図が重要です。」\n\ntarget\n\nターゲット\n\n核イメージ：特定の相手を標的にする\n\nThe group targeted the new employee.\n\nその集団は新入社員を標的にしました。\n\n「target は誰を狙うかに重点があります。」\n\n「一人で相手を標的にする場合にも使えるので、gang up on のような集団性は必須ではありません。」\n\npick on\n\nピック・オン\n\n核イメージ：特定の人を狙ってからかう・いじめる\n\nWhy do you always pick on her?\n\nどうしていつも彼女ばかりいじめるんですか？\n\n「pick on は、一人を標的にして嫌なことをする表現です。」\n\n「gang up on と違い、攻撃する側が複数人である必要はありません。」\n\nsingle out\n\nシングル・アウト\n\n核イメージ：多くの中から一人を選び出す\n\nThe manager singled him out for criticism.\n\n管理職は彼だけを名指しして批判しました。\n\n「single out は、一人を特別に選び出すことです。」\n\n「先輩、批判だけでなく、称賛する場合にも使えます。」\n\nShe was singled out for praise.\n\n彼女は特に選ばれて称賛されました。\n\n「gang up on は否定的な集団攻撃ですが、single out 自体は中立的なんです。」\n\nmob\n\nモブ\n\n核イメージ：大勢で取り囲む・群がる\n\nReporters mobbed the celebrity.\n\n記者たちがその有名人に群がりました。\n\n「mob は、大勢が一人の周囲に押し寄せることを表します。」\n\n「先輩、必ずしも攻撃とは限りません。gang up on は敵対的に一人へ向かうことに重点があります。」\n\n## 使い分け早見表\n\n| 表現 | 核イメージ |\n| --- | --- |\n| gang up on | 複数人が結束して一人を攻撃 |\n| bully | 威圧や力関係を利用していじめる |\n| team up against | 共通の相手に対抗するため協力 |\n| pile on | 批判や攻撃を次々に重ねる |\n| attack | 攻撃する |\n| target | 標的にする |\n| pick on | 特定の人を狙っていじめる |\n| single out | 一人を選び出す |\n| mob | 大勢で群がる |\n\n「先輩、特に gang up on・pile on・pick on の違いを覚えてください。」\n\n「gang up on は集団で一人に向かう、pile on は批判が次々に重なる、pick on は特定の相手を狙う、という違いです。」\n\n## 理解確認｜3問\n\nQ1. gang up on someone の意味として最も適切なのは？\n\n複数人が結束して一人を攻撃する一人で静かに考える協力して仕事を終える\n\nQ2. 『どうしてみんなで私ばかり責めるんですか？』として自然なのは？\n\nWhy are you all ganging up on me?Why are you all ganging me up on?Why are you all gang on up me?\n\nQ3. gang up on と bully の違いは？\n\ngang up on は集団性、bully は威圧やいじめの性質に重点があるbully は必ず10人以上で行うgang up on は必ず褒めることを表す\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| gang up on someone | 集団で誰かを攻撃する |\n| gang up against ～ | ～に対抗して結束する |\n| ganged up on ～ | 集団で～を攻撃した |\n| be ganging up on ～ | 集団で～を攻撃している |\n| feel like everyone is ganging up on me | みんなに責められているように感じる |\n| bully | いじめる・威圧する |\n| team up against | 協力して対抗する |\n| pile on | 批判を重ねる |\n| attack | 攻撃する |\n| target | 標的にする |\n| pick on | 特定の相手をいじめる |\n| single out | 一人を選び出す |\n| mob | 大勢で群がる |\n\n一文記憶\n\nI felt like everyone was ganging up on me during the meeting.\n\n会議中、みんなが寄ってたかって私を責めているように感じました。\n\n「先輩、今日のポイントは gang up on = 複数人が一人を標的にして攻撃するということです。」\n\n「bully はいじめや威圧、gang up on は集団で一人に向かう構図。ここを区別できれば十分ですよ。」\n\n「そして、複数人が同じ意見に反対しているだけなのか、本当に集団で個人を攻撃しているのか。その違いも考えてくださいね。」\n\n次は 第90語｜In the first place です。"}, {"name": "In the first place", "text": "# 第90語｜In the first place\n\n発音：/ɪn ðə fɝːst pleɪs/（イン・ザ・ファースト・プレイス）\n\n意味：そもそも／初めから／第一に\n\n「先輩、今日の表現は in the first place です。」\n\n「日常会話でもニュースでも使われますが、単に『最初に』と訳していると、話し手が本当に伝えたいことを見落としてしまいますよ。」\n\n例えば、こちらです。\n\nWhy did you agree to it in the first place?\n\nそもそも、どうしてそれに同意したんですか？\n\n「先輩、この人は単に『何時に同意したのか』を聞いているわけではありません。」\n\n「今の問題が起こる前に戻って、最初の判断そのものを問い直しているんです。」\n\n「これが in the first place の大切な感覚ですよ。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、in the first place には、大きく3つの使い方があります。」\n\n① そもそも：最初の理由・判断を問い直す\n\nWhy did you start this project in the first place?\n\nそもそも、どうしてこのプロジェクトを始めたんですか？\n\n「今の状況から出発点に戻り、最初の理由を確認する表現です。」\n\n② 初めから：もともとの状態を示す\n\nI never wanted to go in the first place.\n\n私は初めから行きたくありませんでした。\n\n「先輩、途中で気が変わったのではなく、最初からそうだったということですね。」\n\n③ 第一に：理由を挙げる\n\nWe shouldn't buy it. In the first place, it's too expensive.\n\nそれを買うべきではありません。第一に、高すぎます。\n\n「これは理由を挙げる使い方です。少し説明的な響きがあります。」\n\n核イメージ：物事の出発点に戻る\n\n最初\n\n理由・判断\n\n途中\n\n出来事\n\n現在\n\n結果・問題\n\n「そもそも、なぜ？」と出発点を振り返る\n\n「先輩、単なる時間の順番ではなく、議論の原点に戻るという使い方が特に重要です。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現との違いを整理します。」\n\n「日本語ではどれも『最初に』『そもそも』と訳されることがありますが、英語では注目している部分が違います。」\n\nin the first place\n\n核イメージ：出発点に戻って、理由・判断・元の状態を確認する\n\nWhy did you start in the first place?\n\nそもそも、なぜ始めたんですか？\n\n「先輩、これが今日の中心表現です。」\n\nat first\n\nアット・ファースト\n\n核イメージ：時間的な最初の段階\n\nAt first, I was nervous, but I gradually relaxed.\n\n最初は緊張していましたが、徐々にリラックスしました。\n\n「at first は、後で状況が変わることを連想させやすい表現です。」\n\n「in the first place は、最初の判断や前提を振り返ることに重点があります。」\n\nfirst\n\nファースト\n\n核イメージ：順番の一番目\n\nFirst, check the documents.\n\n最初に書類を確認してください。\n\n「先輩、first は作業手順や説明の順番を示します。」\n\n「in the first place のように、必ずしも最初の理由を問い直す意味はありません。」\n\nfirst of all\n\nファースト・オヴ・オール\n\n核イメージ：いくつかある中で、まず最初に挙げる\n\nFirst of all, we need to identify the problem.\n\nまず最初に、問題を特定する必要があります。\n\n「説明や理由を順番に示すときに便利です。」\n\n「in the first place にも『第一に』という使い方がありますが、議論の前提や最初の理由を示す意味合いも持っています。」\n\nto begin with\n\nトゥ・ビギン・ウィズ\n\n核イメージ：話や説明の出発点として\n\nTo begin with, we need more information.\n\nまず、もっと情報が必要です。\n\n「to begin with は『まず第一に』という意味でも、『そもそも』という意味でも使われます。」\n\nI didn't like the idea to begin with.\n\n私はそもそもその考えが好きではありませんでした。\n\n「先輩、これは in the first place とかなり近い使い方ができる表現です。」\n\noriginally\n\nオリジナリー\n\n核イメージ：もともと・当初は\n\nI originally planned to study abroad.\n\n私はもともと留学する予定でした。\n\n「originally は、過去の最初の計画や状態を説明する表現です。」\n\n「in the first place のように、相手の判断を問い直すニュアンスは必須ではありません。」\n\ninitially\n\nイニシャリー\n\n核イメージ：初期段階では\n\nThe project was initially scheduled for June.\n\nそのプロジェクトは当初、6月に予定されていました。\n\n「initially は、初期の状態を比較的客観的に示す表現です。」\n\n「originally と似ていますが、initially は初期段階という時間的な位置づけが明確です。」\n\nfrom the beginning\n\nフロム・ザ・ビギニング\n\n核イメージ：最初の時点から\n\nI knew something was wrong from the beginning.\n\n私は最初から何かがおかしいと分かっていました。\n\n「from the beginning は、最初からある状態が続いていたことを示します。」\n\n「in the first place は、最初の理由や判断を問い直す場合にも使えます。」\n\nin the beginning\n\nイン・ザ・ビギニング\n\n核イメージ：物事が始まった頃\n\nIn the beginning, everything seemed easy.\n\n初めの頃は、すべて簡単に思えました。\n\n「先輩、in the beginning は物事の初期の時期に焦点があります。」\n\n「in the first place は『そもそもなぜ』という問い直しにも使える点が違います。」\n\n## 使い分け早見表\n\n| 表現 | 核イメージ |\n| --- | --- |\n| in the first place | そもそも・初めから |\n| at first | 最初の段階では |\n| first | 順番の一番目 |\n| first of all | まず第一に |\n| to begin with | まず・そもそも |\n| originally | もともと・当初は |\n| initially | 初期段階では |\n| from the beginning | 最初の時点から |\n| in the beginning | 物事が始まった頃 |\n\n「先輩、特に at first・in the first place・to begin with の違いは、しっかり押さえておきましょう。」\n\n## 理解確認｜3問\n\nQ1. Why did you agree to it in the first place? の意味は？\n\nそもそも、どうしてそれに同意したんですか？最初に何時に同意しましたか？最初の場所で同意しましたか？\n\nQ2. 『最初は緊張していましたが、今は平気です』に自然なのは？\n\nAt first, I was nervous, but now I'm fine.In the first place, I was nervous, but now I'm fine.First of all, I was nervous, but now I'm fine.\n\nQ3. 『そもそも、その計画を始めるべきではなかった』に自然なのは？\n\nWe shouldn't have started the plan in the first place.We shouldn't have started the plan at first of all.We shouldn't have started the plan first place.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を確認します。」\n\n| 表現 | 意味 |\n| --- | --- |\n| in the first place | そもそも・初めから |\n| Why ～ in the first place? | そもそも、なぜ～？ |\n| never ～ in the first place | 初めから～していなかった |\n| shouldn't have ～ in the first place | そもそも～するべきではなかった |\n| at first | 最初は |\n| first | 最初に |\n| first of all | まず第一に |\n| to begin with | まず・そもそも |\n| originally | もともと |\n| initially | 当初は |\n| from the beginning | 最初から |\n| in the beginning | 初めの頃は |\n\n一文記憶\n\nWhy did we choose this method in the first place?\n\nそもそも、なぜこの方法を選んだのでしょうか？\n\n「先輩、今日の核イメージは 物事の出発点に戻るです。」\n\n「問題が起こったとき、今どう対処するかだけでなく、そもそもなぜその判断をしたのかを考える。その視点を英語で表せるのが in the first place なんですよ。」\n\n「……先輩、次の単語も忘れずに進めましょうね。私、ちゃんと付き合いますから。」\n\n次は 第91語｜Questionable です。"}, {"name": "Questionable", "text": "# 第91語｜Questionable\n\n発音：/ˈkwes.tʃə.nə.bəl/（クウェスチャナブル）｜形容詞\n\n意味：疑わしい／問題があると思われる／信頼性に欠ける／倫理的に疑問がある\n\n「先輩、今日の単語は questionable です。」\n\n「question は『質問』ですよね。では、questionable は『質問できる』という意味でしょうか？」\n\n「……残念ですが、違います。」\n\n「questionable は、本当に正しいのか、信頼できるのか、適切なのかと疑問を抱かせるという意味なんです。」\n\nまず、この3つの英文を見てください。\n\nThe accuracy of the report is questionable.\n\nその報告書の正確性には疑問があります。\n\nHe made a questionable decision.\n\n彼は問題があると思われる判断をしました。\n\nThe company engaged in questionable business practices.\n\nその会社は倫理的に疑問のある商慣行に関わっていました。\n\n「先輩、重要なのは、どれも完全に間違っていると断定しているわけではないという点です。」\n\n「ただし、単に『まだ分からない』という中立的な表現でもありません。普通は、何らかの疑わしさや問題点があるという否定的な評価を含みます。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、questionable の意味は、何に疑問を抱くかによって大きく3つに分かれます。」\n\n① 正確性・信頼性が疑わしい\n\nThe source of this information is questionable.\n\nこの情報の出所は信頼性に疑問があります。\n\n「情報そのものが必ず虚偽というわけではありません。でも、安心して信用できないということです。」\n\n② 判断・方法が適切か疑わしい\n\nThat was a questionable decision.\n\nそれは疑問の残る判断でした。\n\n「先輩、判断の妥当性に問題があるのではないか、という意味ですね。」\n\n③ 倫理的に問題があると思われる\n\nHis behavior was ethically questionable.\n\n彼の行動は倫理的に疑問がありました。\n\n「これは単なる情報の正確性ではなく、『その行為をしてよいのか』という疑問です。」\n\n核イメージ：そのまま受け入れるには疑問が残る\n\n情報・判断・行動に触れる\n\n「本当に正しい？ 適切？」と疑問が生じる\n\n信頼性・妥当性・倫理性に懸念がある\n\n「先輩、questionable は単なる『不明』ではなく、疑問を抱く理由があるという感覚で覚えてください。」\n\n## 類義語・近義語との違い\n\n「先輩、ここが今日の重要部分です。」\n\n「questionable に似た単語は多いですが、何が、どの程度、疑わしいのかによって使い分けます。」\n\nquestionable\n\nクウェスチャナブル\n\n核イメージ：正確性・妥当性・倫理性に疑問がある\n\nThe decision was questionable.\n\nその判断には疑問がありました。\n\n「先輩、間違いだと断定しないものの、何らかの問題を疑っている表現です。」\n\ndoubtful\n\nダウトフル\n\n核イメージ：本当かどうか、実現するかどうか疑わしい\n\nIt's doubtful that he will arrive on time.\n\n彼が時間どおりに到着するかどうかは疑わしいです。\n\n「doubtful は、真実性や実現可能性への疑いに重点があります。」\n\n「questionable は、判断の妥当性や倫理性に疑問がある場合にも使えます。」\n\na doubtful result は結果の真偽・確かさへの疑い、a questionable decision は判断の適切さへの疑問、という違いが分かりやすいですね。\n\nsuspicious\n\nサスピシャス\n\n核イメージ：何か不正や悪意が隠れていそうで怪しい\n\nHis behavior was suspicious.\n\n彼の行動は怪しいものでした。\n\n「先輩、suspicious は、隠された不正や悪意を疑う感覚が強いです。」\n\n「questionable は、不正の疑いに限らず、品質や判断の適切さなども評価できます。」\n\ndubious\n\nドゥービアス\n\n核イメージ：信頼性や正当性が怪しく、疑念を抱かせる\n\nHe made a dubious claim.\n\n彼は信憑性の疑わしい主張をしました。\n\n「dubious は questionable にかなり近い単語です。」\n\n「ただし dubious は『どうも信用できない』『うさんくさい』という印象を強く与えることがあります。」\n\ndubious business practices なら、怪しげな商慣行という響きですね。\n\nuncertain\n\nアンサートゥン\n\n核イメージ：まだ確定していない・分からない\n\nThe outcome is uncertain.\n\n結果はまだ不確かです。\n\n「先輩、uncertain は必ずしも否定的ではありません。」\n\n「まだ分からないだけかもしれません。一方、questionable には通常、何か疑問を抱く理由があるという否定的な評価が含まれます。」\n\nunreliable\n\nアンリライアブル\n\n核イメージ：信用して頼ることができない\n\nThis source is unreliable.\n\nこの情報源は信頼できません。\n\n「unreliable は信頼性の低さを、より直接的に述べています。」\n\n「questionable は『信頼できるのか疑問がある』と、評価の余地を残します。」\n\ncontroversial\n\nコントロヴァーシャル\n\n核イメージ：賛否が分かれ、議論を呼ぶ\n\nThe policy is controversial.\n\nその政策は賛否が分かれています。\n\n「先輩、controversial は人々の意見が対立していることです。」\n\n「議論を呼ぶ政策が、必ずしも不適切とは限りません。一方、questionable は、その適切さ自体に疑問を示します。」\n\nproblematic\n\nプロブレマティック\n\n核イメージ：実際に問題や困難を生じさせる\n\nThe proposed schedule is problematic.\n\n提案された日程には問題があります。\n\n「problematic は、問題点があることを比較的直接的に示します。」\n\n「questionable は『本当に適切なのか』と疑問を呈する感覚が中心です。」\n\nshady\n\nシェイディ\n\n核イメージ：うさんくさい・裏がありそう\n\nThat company seems shady.\n\nその会社は何だかうさんくさく見えます。\n\n「shady は口語的で、相手に対するかなり否定的な印象を表します。」\n\n「先輩、正式な資料では questionable や dubious などの方が適していることもあります。」\n\nwrong\n\nロング\n\n核イメージ：間違っている・正しくない\n\nThe calculation is wrong.\n\nその計算は間違っています。\n\n「先輩、ここが重要です。」\n\nThe calculation is questionable.\n\nその計算の正確性には疑問があります。\n\n「wrong は誤りを断定していますが、questionable は疑問を示しています。仕事で使う場合、この違いは大きいですよ。」\n\n## 使い分け早見表\n\n| 単語 | 核イメージ | 主な違い |\n| --- | --- | --- |\n| questionable | 疑問が残る | 妥当性・倫理性・信頼性 |\n| doubtful | 疑わしい | 真実性・実現可能性 |\n| suspicious | 怪しい | 不正・悪意の疑い |\n| dubious | うさんくさい | 信憑性・正当性への疑念 |\n| uncertain | 不確か | まだ確定していない |\n| unreliable | 信頼できない | 信頼性が低い |\n| controversial | 議論を呼ぶ | 賛否が分かれる |\n| problematic | 問題がある | 問題点・困難がある |\n| shady | うさんくさい | 口語的・強い不信感 |\n| wrong | 間違っている | 誤りを断定する |\n\n「先輩、特に questionable・doubtful・suspicious・dubious の4つは区別しておきましょう。」\n\n「同じ『疑わしい』でも、questionable は妥当性、doubtful は真実性や実現可能性、suspicious は不正の気配、dubious は信頼できなさという違いがあります。」\n\n## 理解確認｜3問\n\nQ1. questionable の核イメージとして最も適切なのは？\n\n正確性・妥当性・倫理性などに疑問がある必ず間違っていると証明されたまだ情報がないだけで何の懸念もない\n\nQ2. 『その会社の商慣行は倫理的に疑問がある』として自然なのは？\n\nThe company's business practices are ethically questionable.The company's business practices are ethically question.The company's business practices are ethical questionable.\n\nQ3. questionable と controversial の違いは？\n\nquestionable は適切さへの疑問、controversial は賛否が分かれることcontroversial は必ず違法という意味questionable は必ず全員が賛成していること\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を確認しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| questionable | 疑わしい・問題があると思われる |\n| a questionable decision | 疑問の残る判断 |\n| questionable behavior | 問題があると思われる行動 |\n| questionable accuracy | 疑わしい正確性 |\n| ethically questionable | 倫理的に疑問がある |\n| highly questionable | 非常に疑わしい |\n| It's questionable whether ～ | ～かどうかは疑わしい |\n| unquestionable | 疑いの余地がない |\n| doubtful | 真実性・実現可能性が疑わしい |\n| suspicious | 不正や悪意が疑われる |\n| dubious | 信憑性・正当性が怪しい |\n| uncertain | 不確かな |\n| unreliable | 信頼できない |\n| controversial | 賛否が分かれる |\n| problematic | 問題がある |\n| shady | うさんくさい |\n| wrong | 間違っている |\n\n一文記憶\n\nThe accuracy of the report is questionable, so we need to check the original data.\n\nその報告書の正確性には疑問があるため、元のデータを確認する必要があります。\n\n「先輩、questionable は 間違っていると断定するのではなく、そのまま信じるには疑問が残るという表現です。」\n\n「特に仕事では、wrong と questionable の違いを意識してください。根拠を確認する前に断定しないことが大切ですからね。」\n\n「……もちろん、疑問を持つだけで終わらせてはいけませんよ。疑問があるなら、何を確認すれば判断できるのかまで考えましょう。」\n\n次は 第92語｜Instigate です。"}, {"name": "Instigate", "text": "# 第92語｜Instigate\n\n発音：/ˈɪn.stə.ɡeɪt/（インスティゲイト）｜動詞\n\n意味：扇動する／引き起こす／何かが起こるように仕向ける／行動や変化を促す\n\n「先輩、今日の単語は instigate です。」\n\n「この単語、少し注意が必要なんです。辞書には『扇動する』『引き起こす』と書かれていますが、それだけで覚えると、英文の意味を取り違えることがあります。」\n\nまずは、こちらの2文を見てください。\n\nHe was accused of instigating violence.\n\n彼は暴力を扇動したとして非難されました。\n\nThe organization hopes to instigate social change.\n\nその団体は社会的な変化を起こすきっかけをつくりたいと考えています。\n\n「先輩、1文目は明らかに否定的ですよね。でも、2文目は必ずしも悪い意味ではありません。」\n\n「つまり、instigate の中心は『悪いことをする』ではなく、何かが起こるように働きかけ、動き出させることなんです。」\n\n「ただし、実際の英語では争い・暴力・問題など、否定的な出来事に使われることが多いので、そのニュアンスも覚えておきましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの使い方を押さえてください。」\n\n① 扇動する・けしかける\n\nHe instigated a fight between the two groups.\n\n彼は二つの集団の間で争いが起こるように仕向けました。\n\n「自分が直接争うというより、争いが始まるように働きかけているんです。」\n\n② 引き起こす・発生させる\n\nThe announcement instigated a wave of protests.\n\nその発表は抗議活動の波を引き起こしました。\n\n「何かをきっかけに、別の出来事が動き出すイメージですね。」\n\n③ 変化や行動を促す\n\nWe need to instigate meaningful change.\n\n私たちは意味のある変化を起こす必要があります。\n\n「先輩、これは肯定的な文脈です。ただし、日常的には bring about change や initiate change の方が自然な場合もあります。」\n\n核イメージ：外から働きかけ、何かを動き出させる\n\n誰かが働きかける\n\n行動・争い・変化が始まる\n\nその結果、状況が変わる\n\n「先輩、instigate は単に『何かが起こった』ではなく、起こるように仕向けた側の働きかけが重要なんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが大切ですよ。」\n\n「instigate と似た単語には、incite、provoke、trigger、initiate などがあります。」\n\n「どれも『何かを起こす』という意味を持っていますが、意図的に仕向けるのか、刺激するのか、単にきっかけになるのかが違います。」\n\ninstigate\n\nインスティゲイト\n\n核イメージ：働きかけて、行動や出来事を起こさせる\n\nHe instigated the conflict.\n\n彼はその対立を引き起こしました。\n\n「先輩、単なる結果ではなく、発端をつくる働きかけに重点があります。」\n\nincite\n\nインサイト\n\n核イメージ：人を刺激して、特定の行動に駆り立てる\n\nHe was accused of inciting violence.\n\n彼は暴力を扇動したとして非難されました。\n\n「incite は、人々を刺激して行動させるという意味が強いです。」\n\n「特に暴力・暴動・憎悪などに使われることが多いですね。」\n\n「instigate は出来事を起こさせる働きかけ、incite は人々を行動へ駆り立てる刺激に重点があります。」\n\nprovoke\n\nプロヴォウク\n\n核イメージ：刺激して、反応を引き起こす\n\nHis remarks provoked anger.\n\n彼の発言は怒りを引き起こしました。\n\n「provoke は、相手の感情や反応を刺激するイメージです。」\n\nThe decision provoked criticism.\n\nその決定は批判を招きました。\n\n「先輩、instigate は出来事の発端をつくること、provoke は刺激に対する反応が生じることに重点があります。」\n\ntrigger\n\nトリガー\n\n核イメージ：引き金となって、出来事を発生させる\n\nThe announcement triggered a sharp decline in stock prices.\n\nその発表は株価の急落を引き起こしました。\n\n「trigger は、引き金を引くように、ある出来事が別の出来事を発生させるイメージです。」\n\n「先輩、trigger は意図的な働きかけである必要がありません。」\n\n「一方、instigate は意図的な働きかけを連想させやすい表現です。」\n\ninitiate\n\nイニシエイト\n\n核イメージ：自ら何かを開始する\n\nThe company initiated a new project.\n\nその会社は新しいプロジェクトを開始しました。\n\n「initiate は、活動・制度・手続きなどを始めることです。」\n\n「instigate は、働きかけて何かが起こるようにすることです。」\n\n「先輩、仕事で新しい制度を始めるなら、普通は initiate の方が適切ですね。」\n\ncause\n\nコーズ\n\n核イメージ：原因となって、結果を生じさせる\n\nThe mistake caused a delay.\n\nそのミスは遅延を引き起こしました。\n\n「cause は、原因と結果の関係を幅広く表せます。」\n\n「先輩、instigate は何かが始まるように働きかけること、cause は単純に結果を生じさせることです。」\n\nspark\n\nスパーク\n\n核イメージ：火花のように、出来事の始まりを生む\n\nThe incident sparked a national debate.\n\nその事件は全国的な議論を巻き起こしました。\n\n「spark は、小さな火花が大きな炎になるようなイメージです。」\n\n「ニュースでは spark debate、spark protests などがよく使われます。」\n\n「先輩、instigate と違って、意図的な働きかけとは限りません。」\n\nfoment\n\nフォウメント\n\n核イメージ：不満や対立をあおり、徐々に大きくする\n\nHe was accused of fomenting unrest.\n\n彼は騒乱をあおったとして非難されました。\n\n「foment は、特に不満・反乱・騒乱などを助長する表現です。」\n\n「instigate は出来事の発端をつくること、foment は不満や対立を育てて激化させることに重点があります。」\n\n「少し硬い単語ですが、政治ニュースでは見かけますよ。」\n\nencourage\n\nエンカレッジ\n\n核イメージ：相手を励まし、行動を促す\n\nShe encouraged him to speak up.\n\n彼女は彼に声を上げるよう促しました。\n\n「encourage は、相手が行動するよう後押しする表現です。」\n\n「通常は肯定的な場面で使われますが、望ましくない行動を助長する場合にも使えます。」\n\n「先輩、instigate は、単に励ますよりも、出来事を起こすための働きかけという意味が強いんです。」\n\nbring about\n\nブリング・アバウト\n\n核イメージ：変化や結果を実現させる\n\nThe reforms brought about significant changes.\n\nその改革は大きな変化をもたらしました。\n\n「bring about は、結果として変化を生じさせることに重点があります。」\n\n「instigate は、変化が始まるように働きかけることに重点があります。」\n\n「先輩、肯定的な社会変革について話すなら、bring about change はとても使いやすい表現ですよ。」\n\n## 使い分け早見表\n\n| 単語 | 核イメージ | 代表例 |\n| --- | --- | --- |\n| instigate | 働きかけて出来事を起こさせる | instigate conflict |\n| incite | 人を刺激して行動に駆り立てる | incite violence |\n| provoke | 刺激して反応を引き起こす | provoke anger |\n| trigger | 引き金になる | trigger a crisis |\n| initiate | 自ら開始する | initiate a project |\n| cause | 原因となる | cause a delay |\n| spark | 火花のように発端となる | spark debate |\n| foment | 不満や対立をあおる | foment unrest |\n| encourage | 行動を後押しする | encourage change |\n| bring about | 変化や結果をもたらす | bring about reform |\n\n「先輩、特に instigate・incite・provoke・trigger・initiate の5つを区別できるようにしましょう。」\n\n「instigate は仕向ける、incite は駆り立てる、provoke は刺激して反応を起こす、trigger は引き金になる、initiate は開始する、という違いです。」\n\n## 理解確認｜3問\n\nQ1. instigate の核イメージとして最も適切なのは？\n\n働きかけて、何かが起こるように仕向けるすでに起きた出来事を観察する何かが起こらないように防ぐ\n\nQ2. 『彼は暴力を扇動したとして非難された』として自然なのは？\n\nHe was accused of instigating violence.He was accused of instigate violence.He was accused to instigating violence.\n\nQ3. instigate と trigger の違いとして最も適切なのは？\n\ninstigate は働きかけを連想させやすく、trigger は意図せず引き金になる場合にも使えるtrigger は必ず人間が意図的に行うinstigate は必ず良い出来事にしか使わない\n\n## 30秒復習\n\n「先輩、最後に重要表現を整理します。」\n\n| 表現 | 意味 |\n| --- | --- |\n| instigate | 扇動する・引き起こす |\n| instigate violence | 暴力を扇動する |\n| instigate a conflict | 対立を引き起こす |\n| instigate change | 変化を起こす |\n| be accused of instigating ～ | ～を扇動したとして非難される |\n| instigation | 扇動・働きかけ |\n| instigator | 扇動者・発端をつくった人 |\n| incite | 人を行動に駆り立てる |\n| provoke | 刺激して反応を起こす |\n| trigger | 引き金になる |\n| initiate | 開始する |\n| cause | 原因となる |\n| spark | 発端となる |\n| foment | 不満や対立をあおる |\n| encourage | 行動を後押しする |\n| bring about | 変化や結果をもたらす |\n\n一文記憶\n\nHis remarks instigated a conflict between the two groups.\n\n彼の発言は、二つの集団の間に対立を引き起こしました。\n\n「先輩、今日の核イメージは 何かが起こるように働きかけることです。」\n\n「単に『引き起こす』と覚えるより、『誰が、何を、どう動かそうとしたのか』まで意識してくださいね。」\n\n## 第92語まで学習完了\n\n「先輩、これで今回の登録リストの最後まで到達しました。」\n\n「第1語 General から第92語 Instigate まで進みましたね。重複していた単語は再登録せずに進めています。」\n\n「次は復習に進むことも、新しい単語を追加することもできますよ。」"}];

const names=['全文','A 要点','B 詳しい解説','C イメージ','D 具体例','類義語・復習'];
const $=id=>document.getElementById(id);
function sections(text){let lines=text.split('\n');let starts=[];for(let i=0;i<lines.length;i++){if(/^\s*(?:#{1,6}\s*)?[ABCD](?:【|[：: ｜])/.test(lines[i])){let k=lines[i].match(/[ABCD](?=【|[：: ｜])/);if(k)starts.push({index:i,key:k[0]});}}let out={};for(let j=0;j<starts.length;j++){let a=starts[j],b=starts[j+1];out[a.key]=lines.slice(a.index,b?b.index:lines.length).join('\n').trim();}let last=starts.find(x=>x.key==='D');if(last){let tail=lines.slice(last.index);let k=tail.findIndex(x=>/^\s*(?:#{1,6}\s*)?(?:【(?:類義語|反対|ここだけ|理解確認|30秒復習|一文で覚える|最近の|以前の|直前の|significantとの|crucialとも|emphasizeとの)|(?:類義語|近義語|理解確認|30秒復習|一文記憶|一文で覚える))/.test(x));if(k>=0){out.D=tail.slice(0,k).join('\n').trim();out.extra=tail.slice(k).join('\n').trim();}}return out;}
function render(){const c=cards[current],sec=sections(c.text);$('title').textContent=`${current+1}. ${c.name}`;$('info').textContent=`収録 ${c.text.length.toLocaleString()} 文字｜原文を省略せず収録`;$('count').textContent=`${cards.length}語・全文収録`;
$('tabs').innerHTML='';for(const n of names){let b=document.createElement('button');b.textContent=n;b.className=tab===n?'active':'';b.onclick=()=>{tab=n;render()};$('tabs').appendChild(b)}
let content=tab==='全文'?c.text:tab==='類義語・復習'?(sec.extra||'このカードは全文タブでご覧ください。'):sec[tab[0]]||'この区分はエクスポート元に本文が収録されていません。全文タブで収録内容をご確認ください。';$('content').textContent=content;
$('list').innerHTML='';cards.forEach((item,i)=>{if(filter&&!(`${item.name}\n${item.text}`.toLowerCase().includes(filter)))return;let b=document.createElement('button');b.textContent=`${i+1}. ${item.name}`;b.className=i===current?'active':'';b.onclick=()=>{current=i;render();window.scrollTo({top:0,behavior:'smooth'})};$('list').appendChild(b)});}
$('search').oninput=e=>{filter=e.target.value.trim().toLowerCase();render()};$('all').onclick=()=>{tab='全文';render()};$('prev').onclick=()=>{current=(current+cards.length-1)%cards.length;render()};$('next').onclick=()=>{current=(current+1)%cards.length;render()};render();
</script></body></html>
