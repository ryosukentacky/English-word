 は、物事がどのようなものかを言葉で表すことです。」\n\nCan you give me a description of the person?\n\nその人物がどんな人だったか説明してもらえますか？\n\n「先輩、detail は細部そのもの、description は特徴や様子を言葉で説明した内容です。」\n\n「detailed description は『詳細な描写・説明』ですね。」\n\nexplanation\n\nエクスプラネイション\n\n核イメージ：意味や理由を分かるように説明すること\n\nI need a clear explanation of the problem.\n\nその問題について分かりやすい説明が必要です。\n\n「explanation は、物事の意味や原因、仕組みなどを理解できるように説明することです。」\n\nThe teacher gave a detailed explanation.\n\n先生は詳しい説明をしました。\n\n「先輩、detail は具体的な部分、explanation は理解できるように説明することに注目します。」\n\n「細かい情報がたくさんあっても、説明として分かりやすいとは限りませんよね。」\n\nfeature\n\nフィーチャー\n\n核イメージ：物事を特徴づける要素\n\nThis phone has several useful features.\n\nこのスマートフォンには便利な機能がいくつかあります。\n\n「feature は、特徴や機能を表します。」\n\nOne important feature is its long battery life.\n\n重要な特徴の一つはバッテリーの持ちが長いことです。\n\n「先輩、detail は細部、feature はそのものを特徴づける部分です。」\n\n「すべての細部が、その製品の特徴になるわけではありません。」\n\naspect\n\nアスペクト\n\n核イメージ：物事をある方向から見た側面\n\nWe need to consider every aspect of the problem.\n\n私たちはその問題のあらゆる側面を検討する必要があります。\n\n「aspect は、物事を分析するときの視点や側面です。」\n\nThe financial aspect is particularly important.\n\n財務面は特に重要です。\n\n「先輩、detail は細かな具体的事項、aspect は物事を捉える側面です。」\n\n「例えば、会社の経営を財務・人事・販売という側面から見るのが aspects。その中の具体的な数字や条件が details です。」\n\n### 同じ場面で比較\n\n「先輩、新しいシステムの導入について説明する場面を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| detail | Please check the details. | 細かな具体的事項 |\n| information | We need more information. | 情報全般 |\n| specifics | Let's discuss the specifics. | 具体的な決定事項 |\n| particulars | Please provide the particulars. | 個別の事実・詳細 |\n| description | Read the system description. | 特徴や内容の描写 |\n| explanation | I need an explanation. | 理由や仕組みの説明 |\n| feature | This system has useful features. | 特徴・機能 |\n| aspect | Consider the security aspect. | セキュリティという側面 |\n\n「先輩、特に detail・information・explanation の違いを覚えてください。」\n\nI need more information.\n\nもっと情報が必要です。\n\nI need more details.\n\nもっと具体的な詳細が必要です。\n\nI need a clearer explanation.\n\nもっと分かりやすい説明が必要です。\n\n「情報の量が足りないのか、具体的な事項が足りないのか、説明が分かりにくいのか。この違いによって使う単語が変わるんです。」\n\n## 理解確認｜3問\n\nQ1. 『手順を詳しく説明してください』として自然なのは？\n\nPlease explain the procedure in detail.Please explain the procedure in details.Please explain the procedure detailed.\n\nQ2. detail と information の違いとして適切なのは？\n\ndetail は具体的な細部、information は情報全般detail は情報全般、information は会議の議題だけ完全に同じ意味で、常に置き換えられる\n\nQ3. 『この仕事には細部への注意力が必要です』として自然なのは？\n\nThis job requires attention to detail.This job requires attention to details only.This job requires detailed to attention.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- detail：詳細・細部・詳しく説明する\n- details：複数の詳細事項\n- in detail：詳しく\n- in more detail：さらに詳しく\n- in great detail：非常に詳しく\n- detailed：詳細な\n- detailed report：詳細な報告書\n- pay attention to detail：細部に注意を払う\n- go into detail：詳しく説明する\n- minor detail：ささいな点\n- information：情報全般\n- specifics：具体的な事項\n- particulars：個別の事実・詳細\n- description：描写・内容説明\n- explanation：意味や理由の説明\n- feature：特徴・機能\n- aspect：側面・観点\n\n一文記憶\n\nPlease review the details carefully and explain any problems in detail.\n\n詳細を注意深く確認し、問題があれば詳しく説明してください。\n\n「先輩、今日のポイントは detail = 全体を構成する細かな部分 という感覚です。」\n\n「そして、information は情報全般、specifics は具体的な事項、explanation は理解できるように説明すること。」\n\n「特に in detail と attention to detail は仕事でも非常に使いやすい表現です。」\n\n「細かい部分を確認するときは、ただ見るだけではなく、『全体の中で何を意味する細部なのか』まで考えられると、理解が深まりますよ。」\n\n次は 第59語｜Raffle です。"}, {"name": "Raffle", "text": "# 第59語｜Raffle\n\n発音：/ˈræfəl/（ラッフル）｜名詞・動詞\n\n「先輩、今日の単語は raffle です。」\n\n「意味は 『景品が当たる抽選』『抽選会』『抽選で景品を提供する』 ですね。」\n\nI won a prize in a raffle.\n\n私は抽選会で景品が当たりました。\n\nThe school is holding a raffle to raise money.\n\nその学校は資金を集めるために抽選会を開催しています。\n\n「先輩、lottery も『宝くじ・抽選』ですよね。では、raffle と何が違うのでしょう？」\n\n「raffle は、参加者が抽選券などを手に入れ、その中から当選者を選んで景品を渡す形式を指します。特にチャリティーや地域イベントで使われることが多いんです。」\n\n「ただし、必ず有料とは限りません。無料の抽選にも raffle を使う場合がありますよ。」\n\n「今日は lottery、drawing、sweepstakes、giveaway、contest、tombola との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つのポイントを押さえましょう。」\n\n① 景品が当たる抽選会（名詞）\n\nThere will be a raffle at the festival.\n\nお祭りで抽選会が開催されます。\n\n「イベントの参加者が抽選に参加する場面ですね。」\n\n② 抽選券・抽選チケット\n\nI bought three raffle tickets.\n\n私は抽選券を3枚買いました。\n\n「raffle ticket は頻出表現です。」\n\n③ 抽選で景品を当てる\n\nShe won a gift basket in the raffle.\n\n彼女は抽選会でギフトバスケットを当てました。\n\n「先輩、win a prize in a raffle という組み合わせで覚えると便利ですよ。」\n\n④ 抽選で景品を提供する（動詞）\n\nThey raffled off a bicycle.\n\n彼らは自転車を抽選で提供しました。\n\n「動詞では特に raffle off ～ がよく使われます。」\n\n核イメージ：抽選券を集めて、運によって景品の当選者を決める\n\n「先輩、抽選券が箱に入っていて、その中から1枚を引く場面を想像してください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「抽選に関係する英語は多いですが、景品をどう配るのか、参加に条件があるのか、勝者をどう決めるのかで使い分けます。」\n\nraffle\n\nラッフル\n\n核イメージ：抽選券などを使って景品を当てる抽選会\n\nI bought a raffle ticket.\n\n私は抽選券を買いました。\n\n「先輩、慈善イベントや地域のお祭りなどでよく使われます。」\n\nlottery\n\nラタリー\n\n核イメージ：番号などを使って当選者を決めるくじ・宝くじ\n\nHe won the lottery.\n\n彼は宝くじに当選しました。\n\n「lottery は、特に宝くじや大規模なくじを表す場合によく使います。」\n\nThe lottery jackpot is enormous.\n\n宝くじの最高賞金は非常に高額です。\n\n「先輩、raffle はイベントで景品を配る抽選、lottery は宝くじなどのくじ制度に注目します。」\n\n「ただし、どちらも運による当選という点では共通しています。」\n\ndrawing\n\nドローイング\n\n核イメージ：くじを引いて当選者を選ぶ行為\n\nThe prize drawing will take place at noon.\n\n景品の抽選は正午に行われます。\n\n「drawing は、抽選という行為そのものを表します。」\n\nThe winner was selected in a random drawing.\n\n当選者は無作為抽選で選ばれました。\n\n「先輩、raffle は抽選イベント全体、drawing は当選者を選ぶ行為に注目します。」\n\n「なお、drawing には『絵を描くこと』『絵』という意味もありますよ。」\n\nsweepstakes\n\nスウィープステイクス\n\n核イメージ：懸賞・賞品が当たる販促キャンペーン\n\nI entered an online sweepstakes.\n\n私はオンラインの懸賞に応募しました。\n\n「sweepstakes は、特にアメリカ英語で、企業の懸賞キャンペーンなどによく使われます。」\n\nThe company launched a sweepstakes to promote its new product.\n\nその会社は新製品の宣伝のために懸賞キャンペーンを開始しました。\n\n「先輩、raffle は抽選券を使うイベント、sweepstakes は販促などの懸賞企画という違いがあります。」\n\n「アメリカの法律上、sweepstakes は購入不要の懸賞として扱われることが多いですが、具体的なルールは地域や企画によって異なります。」\n\ngiveaway\n\nギヴアウェイ\n\n核イメージ：無料で物や景品を配ること\n\nThe store is hosting a giveaway.\n\nその店は無料プレゼント企画を開催しています。\n\n「giveaway は、無料で物を配ることやプレゼント企画を表します。」\n\nFollow our account to enter the giveaway.\n\nプレゼント企画に応募するには、私たちのアカウントをフォローしてください。\n\n「先輩、raffle は抽選の仕組みに注目し、giveaway は無料で配ることに注目します。」\n\n「giveaway でも抽選で当選者を選ぶことがありますが、必ず抽選とは限りません。」\n\ncontest\n\nコンテスト\n\n核イメージ：参加者が競い合う企画・競技\n\nShe won the photography contest.\n\n彼女は写真コンテストで優勝しました。\n\n「contest は、作品や能力などを比較して勝者を決める場合によく使います。」\n\nThe company organized a design contest.\n\nその会社はデザインコンテストを開催しました。\n\n「先輩、raffle は運による抽選、contest は競争や審査による勝敗に注目することが多いです。」\n\n「ただし、contest は広い言葉なので、抽選型のキャンペーンを指す場合もあります。」\n\ntombola\n\nトンボウラ\n\n核イメージ：番号付きの券などで景品を当てる抽選\n\nThey organized a tombola at the school fair.\n\n彼らは学校のバザーで抽選会を開催しました。\n\n「tombola は、特にイギリス英語で、バザーや慈善イベントなどの抽選を指します。」\n\nI won a small prize in the tombola.\n\n私はその抽選で小さな景品を当てました。\n\n「先輩、raffle と似ていますが、tombola はイギリスの地域イベントなどで使われることが多い表現です。」\n\n「一般的な英語学習では、まず raffle を優先して覚えれば十分ですよ。」\n\n### 同じイベントで比較\n\n「先輩、学校のお祭りで景品が当たる企画を考えてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| raffle | We held a raffle. | 抽選会 |\n| lottery | He won the lottery. | 宝くじ・くじ制度 |\n| drawing | The drawing starts at noon. | 抽選する行為 |\n| sweepstakes | Enter our sweepstakes. | 懸賞キャンペーン |\n| giveaway | Join our giveaway. | 無料プレゼント企画 |\n| contest | She won the contest. | 競争・審査 |\n| tombola | We held a tombola. | 英国式のイベント抽選 |\n\n「先輩、特に raffle・lottery・giveaway の違いを覚えてください。」\n\nI entered a raffle.\n\n私は抽選会に参加しました。\n\nI bought a lottery ticket.\n\n私は宝くじを買いました。\n\nI entered a giveaway.\n\n私は無料プレゼント企画に応募しました。\n\n「raffle は抽選券を使う景品抽選、lottery は宝くじなど、giveaway は無料で配る企画という違いです。」\n\n## 理解確認｜3問\n\nQ1. 『私は抽選会で景品を当てました』として自然なのは？\n\nI won a prize in the raffle.I won a raffle to the prize.I raffled a prize to win.\n\nQ2. raffle と contest の違いとして最も適切なのは？\n\nraffle は運による抽選、contest は競争や審査を伴う企画を指すことが多いraffle は必ずスポーツ競技を意味するcontest は必ず宝くじを意味する\n\nQ3. 『その団体は自転車を抽選で提供しました』として自然なのは？\n\nThe organization raffled off a bicycle.The organization raffled on a bicycle.The organization was raffle a bicycle.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- raffle：景品が当たる抽選会・抽選する\n- raffle ticket：抽選券\n- raffle prize：抽選会の景品\n- hold a raffle：抽選会を開催する\n- enter a raffle：抽選に参加する\n- win a prize in a raffle：抽選会で景品を当てる\n- raffle off ～：～を抽選で景品として提供する\n- fundraising raffle：資金集めの抽選会\n- charity raffle：慈善目的の抽選会\n- lottery：宝くじ・くじ制度\n- drawing：抽選する行為\n- sweepstakes：懸賞キャンペーン\n- giveaway：無料プレゼント企画\n- contest：競争・コンテスト\n- tombola：英国などのイベント抽選\n\n一文記憶\n\nI bought a raffle ticket at the charity event and won a prize.\n\n私は慈善イベントで抽選券を買い、景品を当てました。\n\n「先輩、今日のポイントは raffle = 抽選券などを使って、運によって景品の当選者を決めること です。」\n\n「lottery は宝くじなど、drawing は抽選する行為、giveaway は無料プレゼント企画。」\n\n「特に raffle ticket、enter a raffle、raffle off は、そのまま覚えておくと便利ですよ。」\n\n次は 第60語｜Clarify です。"}, {"name": "Clarify", "text": "# 第60語｜Clarify\n\n発音：/ˈklærəfaɪ/（クラリファイ）｜動詞\n\n「先輩、今日の単語は clarify です。」\n\n「意味は 『明確にする』『はっきり説明する』『曖昧な点を解消する』 ですね。」\n\nCould you clarify what you mean?\n\nどういう意味なのか、もう少しはっきり説明していただけますか？\n\nWe need to clarify the requirements.\n\n私たちは要件を明確にする必要があります。\n\n「先輩、ここで質問です。explain も『説明する』ですよね。では、なぜ clarify を使うのでしょう？」\n\n「explain は、相手に物事を理解してもらうために説明することです。一方、clarify は、すでにある説明や状況の曖昧さを取り除き、はっきりさせることに重点があります。」\n\n「例えば、上司から『この資料、適切に処理しておいて』と言われたら、先輩は何をすればいいか迷いますよね。」\n\n「そのときに『適切とは、具体的に何をすればよいのでしょうか？』と確認して、指示を明確にする。それが clarify です。」\n\n「今日は explain、confirm、specify、define、elaborate、clear up、verify との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 曖昧な説明を明確にする\n\nCould you clarify your statement?\n\nあなたの発言をもう少し明確にしていただけますか？\n\n「発言の意味が曖昧なので、はっきりさせてほしいということですね。」\n\n② 誤解を解消する\n\nI'd like to clarify a misunderstanding.\n\n誤解を解いておきたいと思います。\n\n「先輩、clarify は、誤った解釈が生じないようにする場合にも使います。」\n\n③ 条件や要件を明確にする\n\nWe need to clarify the conditions.\n\n私たちは条件を明確にする必要があります。\n\n「仕事では、何が必要なのかを具体的にする場面で便利です。」\n\n④ 不明点をはっきりさせる\n\nLet me clarify one point.\n\n一点、明確にさせてください。\n\n「会議やメールでよく使える表現ですよ。」\n\n核イメージ：曇って見えなかったものを、はっきり見える状態にする\n\n「先輩、clarify は情報を単に増やすのではなく、曖昧さを取り除くことに注目してくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「clarify と似た単語は、どれも理解や確認に関係します。でも、説明するのか、曖昧さをなくすのか、事実を確かめるのかによって使い分けるんです。」\n\nclarify\n\nクラリファイ\n\n核イメージ：曖昧なものをはっきりさせる\n\nCould you clarify your instructions?\n\n指示を明確にしていただけますか？\n\n「先輩、曖昧さや誤解を解消することに注目します。」\n\nexplain\n\nイクスプレイン\n\n核イメージ：物事の意味や理由を理解できるように説明する\n\nCould you explain how this system works?\n\nこのシステムがどのように動くのか説明していただけますか？\n\n「explain は、相手に理解してもらうための説明全般に使います。」\n\nShe explained the reason for the delay.\n\n彼女は遅延の理由を説明しました。\n\n「先輩、clarify は曖昧さをなくすこと、explain は意味や仕組みを理解できるように説明することです。」\n\n「例えば、初めて聞く仕組みなら explain、すでに聞いた説明の一部が曖昧なら clarify が自然です。」\n\nconfirm\n\nコンファーム\n\n核イメージ：情報や認識が正しいことを確かめる\n\nCould you confirm the meeting time?\n\n会議の時間を確認していただけますか？\n\n「confirm は、予定や情報が正しいかを確かめる場合によく使います。」\n\nPlease confirm that you received the email.\n\nメールを受信したことを確認してください。\n\n「先輩、clarify は曖昧な内容を明確にすること、confirm は内容が正しいか確かめることです。」\n\n「締め切りが分からないなら clarify the deadline、締め切りが金曜日で合っているか確かめたいなら confirm the deadline が自然ですね。」\n\nspecify\n\nスペスィファイ\n\n核イメージ：具体的な内容を明示・指定する\n\nPlease specify the required format.\n\n必要な形式を具体的に指定してください。\n\n「specify は、何をどうするのかを具体的に示すことです。」\n\nThe contract specifies the payment terms.\n\n契約書には支払条件が明記されています。\n\n「先輩、clarify は曖昧さを取り除くこと、specify は具体的な条件や内容を明示することです。」\n\n「specify することで clarify できる場合もありますが、重点が少し違います。」\n\ndefine\n\nディファイン\n\n核イメージ：意味・範囲・基準を定義する\n\nWe need to define the project's goals.\n\n私たちはプロジェクトの目標を定義する必要があります。\n\n「define は、言葉の意味や対象の範囲を明確に決めることです。」\n\nThe policy clearly defines employee responsibilities.\n\nその方針は従業員の責任を明確に定めています。\n\n「先輩、clarify は曖昧さを解消すること、define は意味や範囲を定めることです。」\n\n「例えば、『成功とは何を意味するのか』を決めるなら define success ですね。」\n\nelaborate\n\nイラボレイト\n\n核イメージ：説明に詳しい情報を加えて掘り下げる\n\nCould you elaborate on that point?\n\nその点について、もう少し詳しく説明していただけますか？\n\n「elaborate は、すでに話した内容に説明を付け加える場合によく使います。」\n\nShe elaborated on her proposal.\n\n彼女は提案についてさらに詳しく説明しました。\n\n「先輩、clarify は曖昧さをなくすこと、elaborate は情報や説明を追加して詳しくすることです。」\n\n「詳しく話すことで曖昧さがなくなる場合もありますが、elaborate 自体は『詳しく述べる』ことに注目します。」\n\nclear up\n\nクリア アップ\n\n核イメージ：混乱・疑問・誤解を解消する\n\nLet's clear up the misunderstanding.\n\nその誤解を解消しましょう。\n\n「clear up は、問題や混乱を解消するという意味です。」\n\nI hope this clears up your confusion.\n\nこれであなたの混乱が解消されればと思います。\n\n「先輩、clarify と非常に近いですが、clear up は日常会話でも使いやすく、混乱や疑問が解消されることに注目します。」\n\n「clarify the instructions は自然ですが、clear up the confusion もよく使いますよ。」\n\nverify\n\nヴェリファイ\n\n核イメージ：証拠や資料に照らして正しいことを確かめる\n\nPlease verify the figures against the bank statement.\n\n数字を銀行明細と照合して確認してください。\n\n「verify は、情報の正確さを証拠や資料で確かめる場合によく使います。」\n\nWe need to verify the customer's identity.\n\n私たちは顧客の本人確認を行う必要があります。\n\n「先輩、clarify は意味や内容を明確にすること、verify は事実や情報の正しさを検証することです。」\n\n「例えば、請求書の数字が何を表すのか分からないなら clarify、その数字が銀行明細と一致するか確かめるなら verify です。」\n\n### 同じ仕事で比較してみましょう\n\n「先輩、上司から新しい業務を任された場面です。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| clarify | Please clarify the instructions. | 曖昧な指示を明確にする |\n| explain | Please explain the procedure. | 手順を説明する |\n| confirm | Please confirm the deadline. | 締め切りが正しいか確かめる |\n| specify | Please specify the format. | 形式を具体的に指定する |\n| define | Let's define the scope. | 業務範囲を定義する |\n| elaborate | Could you elaborate on that? | さらに詳しく説明する |\n| clear up | Let's clear up the confusion. | 混乱を解消する |\n| verify | Please verify the figures. | 数字の正しさを検証する |\n\n「先輩、特に clarify・confirm・verify は仕事で重要です。」\n\nCould you clarify what this number represents?\n\nこの数字が何を表しているのか明確にしていただけますか？\n\nCould you confirm that the total is 50,000 yen?\n\n合計が5万円であることを確認していただけますか？\n\nCould you verify the total against the bank statement?\n\n合計金額を銀行明細と照合して検証していただけますか？\n\n「先輩、順番に考えてください。」\n\n「数字の意味が分からないなら clarify。認識が正しいか確かめるなら confirm。証拠と照合して正確性を検証するなら verify です。」\n\n「この違いは、英語だけでなく、実際の仕事の進め方を考えるときにも役立ちますね。」\n\n## 理解確認｜3問\n\nQ1. 『どういう意味なのか明確にしていただけますか？』として自然なのは？\n\nCould you clarify what you mean?Could you clarify what do you mean?Could you clarify to what you mean?\n\nQ2. clarify と confirm の違いとして最も適切なのは？\n\nclarify は曖昧さをなくす、confirm は情報が正しいか確かめるclarify は数字を計算する、confirm は説明を追加する完全に同じ意味で、常に置き換えられる\n\nQ3. 『数字を銀行明細と照合して確認してください』に最も適切なのは？\n\nPlease verify the figures against the bank statement.Please clarify the figures into the bank statement.Please elaborate the figures against the bank statement.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- clarify：明確にする、曖昧さを解消する\n- clarification：明確化・説明\n- clarify the instructions：指示を明確にする\n- clarify the requirements：要件を明確にする\n- clarify the situation：状況を明確にする\n- clarify a misunderstanding：誤解を解消する\n- clarify what ～：何が～なのか明確にする\n- clarify whether ～：～かどうか明確にする\n- ask for clarification：説明を求める\n- explain：理解できるように説明する\n- confirm：正しいか確かめる\n- specify：具体的に指定する\n- define：意味や範囲を定義する\n- elaborate：さらに詳しく説明する\n- clear up：混乱や誤解を解消する\n- verify：証拠や資料で正しさを検証する\n\n一文記憶\n\nBefore starting the task, I asked my manager to clarify the instructions and confirm the deadline.\n\n作業を始める前に、私は上司に指示を明確にしてもらい、締め切りを確認しました。\n\n「先輩、今日のポイントは clarify = 曖昧なものを、はっきりした状態に変える という感覚です。」\n\n「explain は説明する、confirm は正しいか確かめる、verify は証拠と照合して検証する。」\n\n「特に Could you clarify ～? は、指示が曖昧なときに非常に便利です。」\n\n「分からないまま進めるより、何が曖昧なのかを特定して質問する。先輩、そこまでできれば、単に英単語を覚える以上の力になりますよ。」\n\n次は 第61語｜Confirm です。"}, {"name": "Confirm", "text": "# 第61語｜Confirm\n\n発音：/kənˈfɝːm/（コンファーム）｜動詞\n\n「先輩、今日の単語は confirm です。」\n\n「基本の意味は 『確認する』『確定する』『裏付ける』 ですね。」\n\nCould you confirm the meeting time?\n\n会議の時間を確認していただけますか？\n\nThe manager confirmed the schedule.\n\n上司は予定を確定しました。\n\n「先輩、前回の clarify と似ていますが、違いは覚えていますか？」\n\n「clarify は曖昧な内容を明確にすること。一方、confirm は、情報や認識が正しいかを確かめたり、予定などを正式に確定させたりすることです。」\n\n「そして、confirm は『確認する』だけでなく、証拠が何かを裏付ける場合にも使います。」\n\n「今日は check、verify、clarify、make sure、validate、approve、acknowledge との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を整理しましょう。」\n\n① 情報が正しいことを確認する\n\nPlease confirm your email address.\n\nメールアドレスを確認してください。\n\n「入力された情報が正しいか確かめるという意味です。」\n\n② 予定や予約を確定する\n\nI'd like to confirm my reservation.\n\n予約を確認・確定したいのですが。\n\n「先輩、予約が有効か確かめたり、正式に確定させたりする場面です。」\n\n③ 事実を裏付ける\n\nThe evidence confirmed his story.\n\nその証拠は彼の話が事実であることを裏付けました。\n\n「単なる確認作業ではなく、証拠によって正しさが示される場合にも使います。」\n\n④ 相手に確認結果を伝える\n\nI can confirm that the payment was received.\n\n支払いを受領したことを確認できます。\n\n「仕事では『確認した結果、確かにそうです』と伝える表現にもなります。」\n\n核イメージ：不確かだった情報を『確かにそうだ』という状態にする\n\n「先輩、confirm は、確かさを強めるイメージで覚えてくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「日本語では全部『確認する』と訳されることがありますが、何をどのように確かめるのかで単語が変わるんです。」\n\nconfirm\n\nコンファーム\n\n核イメージ：情報が正しいと確かめる・正式に確定する\n\nPlease confirm the deadline.\n\n締め切りを確認してください。\n\n「先輩、情報の正しさや予定の確定に注目します。」\n\ncheck\n\nチェック\n\n核イメージ：問題がないか調べる・確認する\n\nPlease check the figures.\n\n数字を確認してください。\n\n「check は、調べる・点検するという行動に注目します。」\n\nI checked the document for errors.\n\n私は書類に誤りがないか確認しました。\n\n「先輩、check は調べる行為、confirm は正しいことを確かめることです。」\n\n「ただし、check the time と confirm the time のように、どちらも使える場面があります。」\n\nverify\n\nヴェリファイ\n\n核イメージ：証拠や資料に照らして正しさを検証する\n\nPlease verify the figures against the bank statement.\n\n数字を銀行明細と照合して確認してください。\n\n「verify は、根拠となる資料などを使って正確性を確かめる場合によく使います。」\n\nThe system verifies the user's identity.\n\nそのシステムは利用者の本人確認を行います。\n\n「先輩、confirm は正しいと確かめること、verify は証拠や照合によって検証することに重点があります。」\n\n「verify した結果として confirm できる、という関係にもなりますね。」\n\nclarify\n\nクラリファイ\n\n核イメージ：曖昧な内容を明確にする\n\nCould you clarify the instructions?\n\n指示を明確にしていただけますか？\n\n「clarify は、意味や内容が曖昧な場合に使います。」\n\nPlease clarify what you mean.\n\nどういう意味なのか明確にしてください。\n\n「先輩、confirm は正しいか確かめること、clarify は曖昧さを取り除くことです。」\n\n「締め切りが不明なら clarify、締め切りが金曜日で合っているか確かめるなら confirm ですね。」\n\nmake sure\n\nメイク シュア\n\n核イメージ：確実にそうなるようにする・念のため確かめる\n\nMake sure the door is locked.\n\nドアに鍵がかかっていることを確かめてください。\n\n「make sure は、何かが確実な状態になるようにする場合に使います。」\n\nPlease make sure all the documents are ready.\n\nすべての書類が準備できていることを確認してください。\n\n「先輩、confirm は情報の正しさを確かめること、make sure は確認だけでなく、必要な状態が確実に実現するようにすることも含みます。」\n\n「日常会話では make sure の方が自然な場面も多いですよ。」\n\nvalidate\n\nヴァリデイト\n\n核イメージ：基準や規則に照らして有効性・妥当性を確認する\n\nThe system validates the entered data.\n\nそのシステムは入力されたデータが条件を満たしているか検証します。\n\n「validate は、データや方法などが決められた条件に適合しているか確認する場合によく使います。」\n\nWe need to validate the results.\n\n私たちは結果の妥当性を検証する必要があります。\n\n「先輩、confirm は正しいと確かめること、validate は基準に照らして有効性や妥当性を確かめることです。」\n\n「ITやデータ分析でよく見かける単語ですね。」\n\napprove\n\nアプルーヴ\n\n核イメージ：内容を審査して、よいと認める\n\nThe manager approved the purchase.\n\n上司はその購入を承認しました。\n\n「approve は、正式な承認を与える場合に使います。」\n\nThe proposal was approved yesterday.\n\nその提案は昨日承認されました。\n\n「先輩、confirm は確認・確定、approve は承認です。」\n\n「confirmed と書かれていても、必ずしも approved という意味ではありません。何が確認されたのかを見て判断してくださいね。」\n\nacknowledge\n\nアクナリッジ\n\n核イメージ：受け取ったことや事実を認める\n\nPlease acknowledge receipt of this email.\n\nこのメールを受信したことをご連絡ください。\n\n「acknowledge は、受領したことや事実を認める場合に使います。」\n\nHe acknowledged his mistake.\n\n彼は自分の間違いを認めました。\n\n「先輩、confirm は正しさを確かめること、acknowledge は受け取ったことや事実を認めることです。」\n\n「メールで Please acknowledge receipt. とあれば、『受け取ったことを知らせてください』という意味ですね。」\n\n### 同じ業務で比較してみましょう\n\n「先輩、請求書と支払いを扱う場面で比べます。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| check | Check the invoice. | 請求書を調べる |\n| verify | Verify the amount against the records. | 記録と照合して検証 |\n| clarify | Clarify what the charge is for. | 請求内容の意味を明確化 |\n| confirm | Confirm that the payment was made. | 支払い済みだと確かめる |\n| make sure | Make sure the payment is made on time. | 期限どおり支払われるよう確実にする |\n| validate | Validate the entered data. | 入力データが条件を満たすか検証 |\n| approve | Approve the payment. | 支払いを承認する |\n| acknowledge | Acknowledge receipt of the invoice. | 請求書の受領を知らせる |\n\n「先輩、特に check・verify・confirm は混同しやすいですね。」\n\n「check は調べる、verify は根拠と照合する、confirm は正しいと確かめる。」\n\n「この3つを区別できれば、英語の業務指示を読むときにも、何を求められているのか判断しやすくなりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『会議の時間を確認していただけますか？』として自然なのは？\n\nCould you confirm the meeting time?Could you confirm to the meeting time?Could you confirmation the meeting time?\n\nQ2. confirm と approve の違いとして適切なのは？\n\nconfirm は正しさの確認や確定、approve は承認することconfirm は必ず承認を意味するapprove は情報を受け取ることだけを意味する\n\nQ3. 『数字を銀行明細と照合して検証してください』として最も自然なのは？\n\nPlease verify the figures against the bank statement.Please approve the figures against the bank statement.Please acknowledge the figures against the bank statement.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- confirm：確認する、確定する、裏付ける\n- confirmation：確認・確定・確認通知\n- confirmed：確認済みの・確定した\n- confirm the details：詳細を確認する\n- confirm the schedule：日程を確認・確定する\n- confirm a reservation：予約を確認・確定する\n- confirm with someone：人に確認する\n- confirm whether ～：～かどうか確認する\n- confirm receipt：受領を確認する\n- confirmation email：確認メール\n- check：調べる・点検する\n- verify：根拠と照合して検証する\n- clarify：曖昧さを解消する\n- make sure：確実にする・念のため確かめる\n- validate：有効性・妥当性を検証する\n- approve：承認する\n- acknowledge：受領や事実を認める\n\n一文記憶\n\nI checked the records and confirmed that the payment had been made.\n\n私は記録を調べ、支払いが行われていたことを確認しました。\n\n「先輩、今日のポイントは confirm = 不確かな情報を、確かな状態にする という感覚です。」\n\n「clarify は曖昧さをなくす、check は調べる、verify は根拠と照合する、confirm は正しさを確かめる。」\n\n「それぞれ似ていますが、注目する部分が違います。」\n\n「そして、前に学んだ approval や obtain ともつながりますね。confirm the details → obtain approval → proceed with the task という流れで覚えておくと、仕事でも使いやすいですよ。」\n\n次は 第62語｜Make sure です。"}, {"name": "Make sure", "text": "# 第62語｜Make sure\n\n発音：/meɪk ʃʊr/（メイク・シュア）｜動詞句\n\n「先輩、今日の表現は make sure です。」\n\n「意味は 『必ず～する』『～であることを確かめる』『確実にする』 ですね。」\n\nMake sure you lock the door.\n\n必ずドアに鍵をかけてください。\n\nPlease make sure the numbers are correct.\n\n数字が正しいことを確認してください。\n\n「先輩、前回の confirm も『確認する』でしたよね。」\n\n「でも、make sure は単に確認するだけではありません。必要な状態が確実に実現するようにするという意味でも使えるんです。」\n\n「例えば、上司から『明日までに資料を提出して』と言われたとします。」\n\nMake sure you submit the report by tomorrow.\n\n明日までに必ず報告書を提出してください。\n\n「これは『提出されたか確認して』というだけではなく、実際に提出を完了させてくださいという指示ですね。」\n\n「今日は、この違いをしっかり理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの中心的な使い方を整理しましょう。」\n\n① ～であることを確認する\n\nMake sure the information is correct.\n\n情報が正しいことを確認してください。\n\n「情報の正しさを確かめる使い方です。」\n\n② 必ず～する\n\nMake sure you arrive on time.\n\n必ず時間どおりに到着してください。\n\n「こちらは、相手に確実な行動を求めています。」\n\n③ ～が確実に起こるようにする\n\nWe need to make sure everyone understands the rules.\n\n全員がルールを理解できるようにする必要があります。\n\n「先輩、ただ理解しているか確認するだけでなく、必要なら説明して理解してもらうところまで含められるんです。」\n\n核イメージ：不確かな状態を、確かな状態にする\n\n「make は『～にする』、sure は『確かな』という感覚です。」\n\n「つまり、確かな状態を作るというイメージですね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「似た表現でも、確認する行為なのか、正しさの確定なのか、確実な実行なのかで意味が変わります。」\n\nmake sure\n\nメイク シュア\n\n核イメージ：確かな状態にする\n\nMake sure everything is ready.\n\nすべて準備できていることを確認してください。\n\n「先輩、必要な状態が実現しているか確認し、必要なら実現させる表現です。」\n\ncheck\n\nチェック\n\n核イメージ：問題がないか調べる\n\nPlease check the document.\n\n書類を確認してください。\n\n「check は、何かを調べる・点検する行為に注目します。」\n\nCheck whether the payment has been made.\n\n支払いが行われたか調べてください。\n\n「先輩、make sure は必要な状態を確実にすることまで含められますが、check は基本的に調べる行為です。」\n\nconfirm\n\nコンファーム\n\n核イメージ：情報が正しいと確かめる・確定する\n\nPlease confirm the meeting time.\n\n会議の時間を確認してください。\n\n「confirm は、情報の正しさや予定の確定に注目します。」\n\nThe hotel confirmed my reservation.\n\nホテルは私の予約を確定しました。\n\n「先輩、make sure は幅広く『確実にする』、confirm は『正しいと確認する・正式に確定する』という違いです。」\n\nensure\n\nインシュア\n\n核イメージ：必要な結果が確実に実現するようにする\n\nWe must ensure that all employees receive proper training.\n\nすべての従業員が適切な研修を受けられるようにしなければなりません。\n\n「ensure は make sure と非常に近い意味です。」\n\nThe company implemented measures to ensure safety.\n\n会社は安全を確保するための対策を実施しました。\n\n「先輩、make sure は会話でもよく使い、ensure はよりフォーマルな文書や説明でよく使われます。」\n\n「ただし、どちらも確実性に注目する点では共通しています。」\n\nverify\n\nヴェリファイ\n\n核イメージ：根拠と照合して正しさを検証する\n\nPlease verify the figures against the bank statement.\n\n数字を銀行明細と照合して検証してください。\n\n「verify は、証拠や記録に照らして確かめる場合によく使います。」\n\nWe need to verify the customer's identity.\n\n顧客の本人確認を行う必要があります。\n\n「先輩、make sure は確実な状態にすること、verify は証拠や資料で正しさを検証することです。」\n\ndouble-check\n\nダブルチェック\n\n核イメージ：念のためもう一度確認する\n\nPlease double-check the amount.\n\n念のため金額をもう一度確認してください。\n\n「double-check は、間違いを防ぐために再確認することです。」\n\nI double-checked the email address before sending the message.\n\nメッセージを送る前にメールアドレスを再確認しました。\n\n「先輩、make sure は確実にすること、double-check は再確認という行為に注目します。」\n\n「再確認することで確実性を高める、という関係ですね。」\n\nbe sure to\n\nビー シュア トゥ\n\n核イメージ：忘れずに必ず～する\n\nBe sure to bring your ID.\n\n必ず身分証明書を持参してください。\n\n「be sure to は、相手に忘れずに行動してほしいときに使います。」\n\nBe sure to read the instructions carefully.\n\n必ず指示を注意深く読んでください。\n\n「先輩、make sure to と非常に近いですが、be sure to は『必ず～して』という指示として覚えると使いやすいですよ。」\n\nguarantee\n\nギャランティー\n\n核イメージ：結果や品質を保証する\n\nThe company guarantees the quality of its products.\n\nその会社は製品の品質を保証しています。\n\n「guarantee は、結果や品質について保証する場合に使います。」\n\nWe cannot guarantee delivery by tomorrow.\n\n明日までの配送を保証することはできません。\n\n「先輩、make sure は必要な結果を確実にすること、guarantee は結果について保証・約束することです。」\n\n「特に、相手に対して責任を持って保証する場面で使われます。」\n\n### 同じ業務で比較\n\n「先輩、報告書を提出する場面で比べましょう。」\n\n| 表現 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| check | Check the report. | 内容を調べる |\n| confirm | Confirm the deadline. | 締め切りを確認する |\n| make sure | Make sure the report is submitted. | 提出を確実にする |\n| ensure | Ensure timely submission. | 期限内の提出を確実にする |\n| verify | Verify the figures. | 数字を検証する |\n| double-check | Double-check the figures. | 数字を再確認する |\n| be sure to | Be sure to submit the report. | 忘れずに提出する |\n| guarantee | We guarantee timely delivery. | 期限内の納品を保証する |\n\n「先輩、特に make sure・confirm・ensure の違いを押さえてください。」\n\nPlease confirm that the report was submitted.\n\n報告書が提出されたことを確認してください。\n\nPlease make sure the report is submitted.\n\n報告書が確実に提出されるようにしてください。\n\nPlease ensure that the report is submitted.\n\n報告書が確実に提出されるようにしてください。\n\n「confirm は提出済みという事実を確認すること、make sure と ensure は提出という結果を確実にすることに注目します。」\n\n## 理解確認｜3問\n\nQ1. 『必ずファイルを保存してください』として自然なのは？\n\nMake sure to save the file.Make sure to the file.Make sure saving to the file.\n\nQ2. make sure と confirm の違いとして最も適切なのは？\n\nmake sure は確実な状態にすること、confirm は正しいと確認・確定することmake sure は必ず正式な承認を意味するconfirm は何かを保証することだけを意味する\n\nQ3. 『念のため確認ですが、これは最新版ですか？』として自然なのは？\n\nJust to make sure, is this the latest version?Just make sure to this the latest version?Make sure of is this latest version?\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- make sure：必ず～する・確かめる・確実にする\n- make sure that ～：～であることを確認する・確実にする\n- make sure to ～：必ず～する\n- make sure of ～：～を確かめる\n- just to make sure：念のため確認すると\n- make absolutely sure：絶対に確実にする\n- make sure everything is ready：すべて準備できていることを確認する\n- check：調べる・点検する\n- confirm：正しいと確認する・確定する\n- ensure：確実にする（ややフォーマル）\n- verify：根拠と照合して検証する\n- double-check：再確認する\n- be sure to：忘れずに必ず～する\n- guarantee：保証する\n\n一文記憶\n\nMake sure to check the figures carefully before submitting the report.\n\n報告書を提出する前に、必ず数字を注意深く確認してください。\n\n「先輩、今日のポイントは make sure = 確かな状態を作る という感覚です。」\n\n「check は調べる、confirm は正しさを確かめる、make sure は必要な状態を確実にする。」\n\n「特に make sure to ～ は『必ず～する』という意味で頻繁に使います。」\n\n「そして、先輩。確認すること自体が目的ではありません。何を確実にしたいのかまで考えると、この表現の意味がずっと分かりやすくなりますよ。」\n\n次は 第63語｜Collaborate です。"}, {"name": "Collaborate", "text": "# 第63語｜Collaborate\n\n発音：/kəˈlæbəreɪt/（コラボレイト）｜動詞\n\n「先輩、今日の単語は collaborate です。」\n\n「意味は 『協力する』『共同で取り組む』『協働する』 ですね。」\n\nWe collaborated on the project.\n\n私たちはそのプロジェクトに共同で取り組みました。\n\nOur team collaborated with the sales department.\n\n私たちのチームは営業部門と協力しました。\n\n「先輩、work together も『一緒に働く』ですよね。では、どうして collaborate を使うのでしょう？」\n\n「それは、collaborate が、共通の目標に向かって、それぞれの知識や能力を持ち寄り、一緒に成果を生み出すという意味を持つからです。」\n\n「ただ同じ場所で働いているだけではなく、互いに関わり合いながら進めることが重要なんです。」\n\n「今日は cooperate、work together、coordinate、team up、partner、contribute、join forces との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 人や組織と協力する\n\nWe collaborate with other departments.\n\n私たちは他の部署と協力しています。\n\n「部署を越えて一緒に仕事を進める場合ですね。」\n\n② プロジェクトに共同で取り組む\n\nThey collaborated on a new product.\n\n彼らは新製品の開発に共同で取り組みました。\n\n「先輩、一つの成果を一緒に作り上げるイメージです。」\n\n③ 専門知識を持ち寄る\n\nEngineers and designers collaborated to improve the product.\n\nエンジニアとデザイナーは製品を改善するために協働しました。\n\n「異なる専門性を組み合わせる場面でも使います。」\n\n④ 共同制作する\n\nThe two artists collaborated on an album.\n\nその2人のアーティストはアルバムを共同制作しました。\n\n「日本語の『コラボする』に近い使い方ですね。」\n\n核イメージ：共通の成果に向けて、互いの力を持ち寄る\n\n「先輩、collaborate は『一緒に何かを生み出す』という感覚を中心に覚えてください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが重要です。」\n\n「『協力する』という言葉にも、共同で作る・助け合う・調整する・提携するなど、さまざまな形があるんです。」\n\ncollaborate\n\nコラボレイト\n\n核イメージ：共通の成果を生み出すために協働する\n\nWe collaborated on the project.\n\n私たちはそのプロジェクトに共同で取り組みました。\n\n「先輩、互いの知識や能力を持ち寄って一緒に進めることに注目します。」\n\ncooperate\n\nコウオペレイト\n\n核イメージ：共通の目的のために協力する・協力的に行動する\n\nPlease cooperate with the investigation.\n\n調査にご協力ください。\n\n「cooperate は、相手の活動を妨げず、協力的に行動する場合にも使えます。」\n\nThe two departments cooperated to resolve the issue.\n\n2つの部署は問題を解決するために協力しました。\n\n「先輩、collaborate は共同で仕事や成果を作ること、cooperate は目的達成のために協力することです。」\n\n「どちらも一緒に仕事をする意味で使えますが、collaborate の方が共同作業のニュアンスが強いですね。」\n\nwork together\n\nワーク トゥゲザー\n\n核イメージ：一緒に働く・力を合わせる\n\nLet's work together to solve this problem.\n\nこの問題を解決するために一緒に取り組みましょう。\n\n「work together は、非常に幅広く使える日常的な表現です。」\n\nWe worked together on the presentation.\n\n私たちはプレゼンテーションを一緒に作成しました。\n\n「先輩、collaborate はややフォーマルで、共同で成果を生み出すことに注目します。」\n\n「work together はもっとシンプルに『一緒に取り組む』と伝えたいときに便利です。」\n\ncoordinate\n\nコウオーディネイト\n\n核イメージ：複数の人や作業を調整して、うまく連携させる\n\nShe coordinated the schedules of three departments.\n\n彼女は3つの部署の予定を調整しました。\n\n「coordinate は、日程・役割・作業などを調整する場合によく使います。」\n\nWe need to coordinate our efforts.\n\n私たちは取り組みを調整する必要があります。\n\n「先輩、collaborate は共同で取り組むこと、coordinate は各人の活動がうまくかみ合うように調整することです。」\n\n「例えば、各部署が共同で新商品を開発するのは collaborate。会議の日程や担当範囲を調整するのは coordinate ですね。」\n\nteam up\n\nチーム アップ\n\n核イメージ：チームを組んで協力する\n\nWe teamed up with another company.\n\n私たちは別の会社とチームを組みました。\n\n「team up は、共通の目的のためにチームを組む場合に使います。」\n\nThe two students teamed up for the assignment.\n\nその2人の学生は課題のためにチームを組みました。\n\n「先輩、collaborate は共同作業そのもの、team up は協力するためにチームを組むことに注目します。」\n\n「team up は会話でも使いやすい表現です。」\n\npartner\n\nパートナー\n\n核イメージ：相手と提携・協力関係を結ぶ\n\nThe company partnered with a technology firm.\n\nその会社はテクノロジー企業と提携しました。\n\n「partner は名詞だけでなく、動詞としても使えます。」\n\nWe partnered with a local organization to support the event.\n\n私たちはイベントを支援するために地元団体と提携しました。\n\n「先輩、collaborate は一緒に取り組むこと、partner は協力関係を築くことに注目します。」\n\n「特に企業間の提携では partner with ～ がよく使われます。」\n\ncontribute\n\nコントリビュート\n\n核イメージ：成果や目的のために、自分の力や資源を提供する\n\nEveryone contributed ideas to the project.\n\n全員がプロジェクトにアイデアを提供しました。\n\n「contribute は、知識・時間・お金・努力などを提供する場合に使います。」\n\nHer experience contributed to the project's success.\n\n彼女の経験はプロジェクトの成功に貢献しました。\n\n「先輩、collaborate は互いに共同で取り組むこと、contribute は自分が何かを提供して貢献することです。」\n\n「共同作業に参加していなくても、資金や情報を提供して contribute することはできます。」\n\njoin forces\n\nジョイン フォースィズ\n\n核イメージ：力を結集する・手を組む\n\nThe two companies joined forces to develop new technology.\n\nその2社は新技術を開発するために力を結集しました。\n\n「join forces は、別々の人や組織が力を合わせる場合に使います。」\n\nLocal businesses joined forces to support the community.\n\n地元企業は地域を支援するために力を合わせました。\n\n「先輩、collaborate は共同作業、join forces は力を結集することに注目します。」\n\n「特に、共通の目的のために協力関係を作る場面で自然です。」\n\n### 同じ仕事で比較してみましょう\n\n「先輩、新商品を開発する場面です。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| collaborate | We collaborated on the product. | 共同で開発する |\n| cooperate | The departments cooperated. | 協力し合う |\n| work together | We worked together. | 一緒に取り組む |\n| coordinate | We coordinated the schedules. | 日程を調整する |\n| team up | We teamed up with designers. | チームを組む |\n| partner | We partnered with a supplier. | 取引先と提携する |\n| contribute | Everyone contributed ideas. | アイデアを提供する |\n| join forces | The companies joined forces. | 力を結集する |\n\n「先輩、特に collaborate・cooperate・coordinate の違いは重要です。」\n\nWe collaborated with the sales team.\n\n私たちは営業チームと共同で取り組みました。\n\nWe cooperated with the sales team.\n\n私たちは営業チームに協力しました。\n\nWe coordinated with the sales team.\n\n私たちは営業チームと連絡・調整を行いました。\n\n「先輩、collaborate は共同作業、cooperate は協力、coordinate は調整です。」\n\n「同じ『他部署と連携する』という場面でも、何をしているのかによって適切な動詞が変わりますね。」\n\n## 理解確認｜3問\n\nQ1. 『私たちは営業部門と協働しました』として自然なのは？\n\nWe collaborated with the sales department.We collaborated the sales department.We collaborated to the sales department.\n\nQ2. collaborate と coordinate の違いとして最も適切なのは？\n\ncollaborate は共同で取り組む、coordinate は活動や日程を調整するcollaborate は必ず競争する、coordinate は共同制作する完全に同じ意味で、常に置き換えられる\n\nQ3. 『私は同僚と報告書を共同で作成しました』として自然なのは？\n\nI collaborated with my colleague on the report.I collaborated on my colleague with the report.I collaborated my colleague to the report.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- collaborate：協力する・共同で取り組む\n- collaborate with ～：～と協働する\n- collaborate on ～：～に共同で取り組む\n- collaborate with A on B：AとBに共同で取り組む\n- collaborate to do ～：～するために協働する\n- collaborate closely：緊密に協力する\n- collaborate across departments：部署を越えて協力する\n- collaboration：協働・共同作業\n- collaborative：協働的な\n- collaborator：協力者\n- cooperate：協力する\n- work together：一緒に取り組む\n- coordinate：調整する\n- team up：チームを組む\n- partner：提携する\n- contribute：貢献する\n- join forces：力を結集する\n\n一文記憶\n\nWe collaborated with other departments to improve the efficiency of the production process.\n\n私たちは生産工程の効率を改善するために、他の部署と協働しました。\n\n「先輩、今日のポイントは collaborate = 互いの力を持ち寄り、共通の成果を生み出す という感覚です。」\n\n「cooperate は協力、coordinate は調整、contribute は貢献。似ていますが、それぞれ注目する部分が違います。」\n\n「そして、collaborate with A on B は、そのまま覚えておくと便利ですよ。」\n\n「誰と、何に取り組むのか。この2つを意識すれば、仕事でも自然に使えるようになります。」\n\n次は 第64語｜Vivid です。"}, {"name": "Vivid", "text": "# 第64語｜Vivid\n\n発音：/ˈvɪvɪd/（ヴィヴィッド）｜形容詞\n\n「先輩、今日の単語は vivid です。」\n\n「基本の意味は 『鮮やかな』『生き生きとした』『鮮明な』 ですね。」\n\nShe has vivid memories of her childhood.\n\n彼女には子どもの頃の鮮明な記憶があります。\n\nThe painting uses vivid colors.\n\nその絵には鮮やかな色が使われています。\n\n「先輩、ここで一つ質問です。」\n\n「色が鮮やかなことと、記憶が鮮明なこと。一見すると別の意味に思えませんか？」\n\n「でも、実は共通点があるんです。」\n\n「どちらも、ぼんやりしているのではなく、目の前にあるようにはっきりと感じられるということです。」\n\n「つまり vivid の核となるイメージは、まるで生きているように、強く、はっきりと感じられることなんですよ。」\n\n「今日は bright、vibrant、colorful、clear、detailed、graphic、lively、striking との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえましょう。」\n\n① 鮮やかな：色や見た目\n\nThe flowers have vivid colors.\n\nその花々は鮮やかな色をしています。\n\n「色が強く、はっきりと目に飛び込んでくる感覚ですね。」\n\n② 鮮明な：記憶や想像\n\nI have a vivid memory of that day.\n\n私にはあの日の鮮明な記憶があります。\n\n「先輩、昔のことなのに、まるで昨日の出来事のように思い出せる。そんな記憶です。」\n\n③ 生き生きとした：描写や説明\n\nThe author gives a vivid description of the city.\n\nその作家は街の様子を生き生きと描写しています。\n\n「読んでいるだけで、街の光景が目に浮かぶような説明ですね。」\n\n④ 強烈で鮮明な：夢や想像\n\nI had a vivid dream last night.\n\n昨夜、とても鮮明な夢を見ました。\n\n「現実のように感じられる夢にも使います。」\n\n核イメージ：頭の中や目の前に、はっきりと生き生き浮かび上がる\n\n「先輩、vivid は単に『明るい』だけではありません。感じられる印象の鮮明さが大切なんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「vivid に似た言葉は多いですが、色の明るさなのか、活気なのか、記憶の明確さなのか、印象の強さなのかで違いが生まれます。」\n\nvivid\n\nヴィヴィッド\n\n核イメージ：まるで目の前にあるように鮮明で、生き生きしている\n\nI have vivid memories of the trip.\n\n私にはその旅行の鮮明な思い出があります。\n\n「先輩、色・記憶・描写などの鮮明さに注目します。」\n\nbright\n\nブライト\n\n核イメージ：光や色が明るい\n\nThe room is bright and comfortable.\n\nその部屋は明るく快適です。\n\n「bright は、光の強さや明るさに注目します。」\n\nShe wore a bright yellow dress.\n\n彼女は明るい黄色のドレスを着ていました。\n\n「先輩、vivid は鮮やかさ、bright は明るさです。」\n\n「例えば、暗い赤でも強く鮮やかなら vivid red と言えます。必ずしも明るい色とは限らないんです。」\n\nvibrant\n\nヴァイブラント\n\n核イメージ：エネルギーや活気に満ちている\n\nThe city has a vibrant atmosphere.\n\nその街には活気のある雰囲気があります。\n\n「vibrant は、生命力やエネルギーを感じさせる言葉です。」\n\nThe painting is full of vibrant colors.\n\nその絵は生き生きとした鮮やかな色彩にあふれています。\n\n「先輩、vivid は鮮明さ、vibrant は活気やエネルギーに注目します。」\n\n「色については意味が重なりますが、vibrant city は自然でも、vivid city は一般的ではありません。」\n\ncolorful\n\nカラフル\n\n核イメージ：多くの色が使われている・色彩豊かな\n\nThe market was full of colorful flowers.\n\nその市場は色とりどりの花でいっぱいでした。\n\n「colorful は、さまざまな色があることに注目します。」\n\nShe wore a colorful scarf.\n\n彼女は色彩豊かなスカーフを身に着けていました。\n\n「先輩、vivid は一つの色でも使えますが、colorful は色の豊かさや多彩さに注目します。」\n\n「a vivid red curtain は鮮やかな赤いカーテン、a colorful curtain は色彩豊かなカーテンです。」\n\nclear\n\nクリア\n\n核イメージ：曖昧さや障害がなく、はっきりしている\n\nI have a clear memory of the event.\n\n私はその出来事をはっきり覚えています。\n\n「clear は、記憶や説明などが曖昧ではないことに注目します。」\n\nThe instructions were clear.\n\n指示は明確でした。\n\n「先輩、vivid は鮮明で生き生きと感じられること、clear は明確で分かりやすいことです。」\n\n「説明が clear でも、必ずしも情景が浮かぶような vivid な説明とは限りません。」\n\ndetailed\n\nディーテイルド\n\n核イメージ：細かな情報まで含まれている\n\nShe gave a detailed explanation of the process.\n\n彼女はその工程について詳細な説明をしました。\n\n「detailed は、情報の細かさや量に注目します。」\n\nThe report contains a detailed analysis.\n\nその報告書には詳細な分析が含まれています。\n\n「先輩、vivid は情景が浮かぶような鮮明さ、detailed は細部まで説明されていることです。」\n\n「細かな情報が多い説明でも、情景が浮かぶとは限りません。逆に、短い描写でも vivid になることがあります。」\n\ngraphic\n\nグラフィック\n\n核イメージ：細部まで目に浮かぶほど具体的で、生々しい\n\nThe witness gave a graphic description of the accident.\n\n目撃者は事故の様子を生々しく描写しました。\n\n「graphic は、描写が非常に具体的で、視覚的に強い印象を与える場合に使います。」\n\nThe documentary contains graphic images.\n\nそのドキュメンタリーには生々しい映像が含まれています。\n\n「先輩、vivid は鮮明で生き生きとした描写全般、graphic は特に視覚的で生々しい描写に注目します。」\n\n「graphic は事故や暴力など、不快感を与えるほど具体的な内容に使われることも多いので注意してくださいね。」\n\nlively\n\nライヴリー\n\n核イメージ：動きや活気があって、生き生きしている\n\nThe discussion was lively.\n\nその議論は活発でした。\n\n「lively は、人や場所、活動などに活気があることを表します。」\n\nShe has a lively personality.\n\n彼女は活発な性格です。\n\n「先輩、vivid は鮮明さ、lively は実際の活気や動きに注目します。」\n\n「vivid description は鮮明な描写、lively discussion は活発な議論です。」\n\nstriking\n\nストライキング\n\n核イメージ：強い印象を与え、目を引く\n\nThe building has a striking design.\n\nその建物は非常に印象的なデザインをしています。\n\n「striking は、目立つ特徴や強い印象に注目します。」\n\nThere is a striking difference between the two results.\n\nその2つの結果には際立った違いがあります。\n\n「先輩、vivid は鮮明さ、striking は目を引くほどの印象の強さです。」\n\n「striking difference は自然ですが、vivid difference は一般的ではありません。」\n\n## 同じ場面で比較\n\n「先輩、旅行先の街を説明する場面で比べましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| vivid | I have vivid memories of the city. | 鮮明な記憶 |\n| bright | The streets were bright. | 明るさ |\n| vibrant | The city was vibrant. | 活気・エネルギー |\n| colorful | The market was colorful. | 色彩の豊かさ |\n| clear | I have a clear memory of it. | 記憶の明確さ |\n| detailed | She gave a detailed description. | 情報の細かさ |\n| graphic | He gave a graphic account. | 生々しい具体性 |\n| lively | The market was lively. | 活発さ |\n| striking | The architecture was striking. | 強い印象 |\n\n「先輩、特に vivid・clear・detailed の違いは重要です。」\n\nI clearly remember the trip.\n\n私はその旅行をはっきり覚えています。\n\nI vividly remember the trip.\n\n私はその旅行を鮮明に覚えています。\n\nI remember many details of the trip.\n\n私はその旅行の細かなことをたくさん覚えています。\n\n「clearly は曖昧ではないこと、vividly は情景が生き生きと浮かぶこと、details は具体的な細部です。」\n\n「先輩、似ていますが、注目する部分が違うんですよ。」\n\n## 理解確認｜3問\n\nQ1. 『私にはその旅行の鮮明な思い出があります』として自然なのは？\n\nI have vivid memories of the trip.I have vividly memories of the trip.I have vividness memories of the trip.\n\nQ2. vivid と detailed の違いとして最も適切なのは？\n\nvivid は鮮明な印象、detailed は細かな情報まで含むことvivid は情報量が多いことだけを意味するdetailed は必ず色が鮮やかなことを意味する\n\nQ3. 『私はその日のことを鮮明に覚えています』として自然なのは？\n\nI vividly remember that day.I vivid remember that day.I vividness remember that day.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- vivid：鮮やかな・鮮明な・生き生きとした\n- vividly：鮮明に・生き生きと\n- vividness：鮮明さ\n- vivid memory：鮮明な記憶\n- vivid colors：鮮やかな色彩\n- vivid description：生き生きとした描写\n- vivid imagination：豊かな想像力\n- vivid dream：鮮明な夢\n- vividly remember：鮮明に覚えている\n- bright：明るい\n- vibrant：活気に満ちた\n- colorful：色彩豊かな\n- clear：明確な\n- detailed：詳細な\n- graphic：生々しい・視覚的に具体的な\n- lively：活発な\n- striking：印象的な・目を引く\n\n一文記憶\n\nI still vividly remember the colorful streets and the vibrant atmosphere of the city.\n\n私は今でも、その街の色彩豊かな通りと活気ある雰囲気を鮮明に覚えています。\n\n「先輩、今日のポイントは vivid = まるで目の前にあるように、はっきりと生き生き感じられる という感覚です。」\n\n「色なら鮮やか、記憶なら鮮明、描写なら生き生きとした、という訳になります。」\n\n「でも、全部別々に暗記する必要はありません。」\n\n「頭の中に、くっきりと情景が浮かぶ。この一つのイメージでつなげて覚えてくださいね。」\n\n次は 第65語｜Revive です。"}, {"name": "Revive", "text": "# 第65語｜Revive\n\n発音：/rɪˈvaɪv/（リヴァイヴ）｜動詞\n\n「先輩、今日の単語は revive です。」\n\n「基本の意味は 『生き返らせる』『回復させる』『復活させる』 ですね。」\n\nThe company is trying to revive its struggling business.\n\nその会社は経営が苦しい事業を立て直そうとしています。\n\nThe smell of the sea revived memories of my childhood.\n\n海の匂いが、子どもの頃の記憶をよみがえらせました。\n\n「先輩、ここで質問です。revive と recover は、どちらも『回復する』と訳せますよね。では、何が違うのでしょう？」\n\n「recover は、悪くなった状態から回復すること。一方、revive は、弱まったり、失われかけたりした生命力・活気・活動などが、再び戻ってくることに重点があります。」\n\n「つまり、ただ元に戻るのではなく、一度弱くなったものに、もう一度命や勢いが吹き込まれるようなイメージなんです。」\n\n「今日は recover、restore、revitalize、resurrect、renew、rejuvenate、rekindle との違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえましょう。」\n\n① 意識・生命を取り戻させる\n\nThe paramedics tried to revive the patient.\n\n救急隊員たちは患者を蘇生させようとしました。\n\n「人の生命や意識を取り戻させるという、文字どおりの意味です。」\n\n② 事業・経済・地域を復活させる\n\nThe government introduced measures to revive the economy.\n\n政府は経済を回復させるための対策を導入しました。\n\n「弱っていた経済に、再び活気を取り戻させるという意味ですね。」\n\n③ 記憶・感情をよみがえらせる\n\nThe song revived old memories.\n\nその曲は昔の記憶をよみがえらせました。\n\n「先輩、忘れかけていた記憶が、再び鮮明になるような感覚です。」\n\n④ 伝統・活動・関心を復活させる\n\nThe town is trying to revive an old festival.\n\nその町は昔の祭りを復活させようとしています。\n\n「以前は行われていたものが衰退・中断し、もう一度始まるという意味です。」\n\n核イメージ：弱まったもの、失われかけたものに、再び生命力を与える\n\n「先輩、revive は『再び生き生きとさせる』という一つのイメージで覚えてくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『回復する』『復活する』『元に戻す』という言葉は似ていますが、何が失われていて、何を取り戻すのかによって使い分けるんです。」\n\nrevive\n\nリヴァイヴ\n\n核イメージ：弱まった生命力や活気を、再び取り戻す\n\nThe company revived the old brand.\n\nその会社は昔のブランドを復活させました。\n\n「先輩、一度弱まったり途絶えたりしたものが、再び生き生きとすることに注目します。」\n\nrecover\n\nリカヴァー\n\n核イメージ：悪くなった状態から回復する\n\nThe economy is gradually recovering.\n\n経済は徐々に回復しています。\n\n「recover は、病気・損失・不況などから回復する場合に使います。」\n\nShe recovered from her illness.\n\n彼女は病気から回復しました。\n\n「先輩、revive は生命力や活気が再び戻ること、recover は悪化した状態から回復することです。」\n\n「経済については両方使えますが、revive the economy は経済に再び活気を与えること、the economy recovers は経済そのものが回復することに注目します。」\n\nrestore\n\nリストア\n\n核イメージ：以前の状態・機能・状態の良さに戻す\n\nThey restored the historic building.\n\n彼らは歴史的建造物を修復しました。\n\n「restore は、元の状態に戻すことに注目します。」\n\nThe company restored customer confidence.\n\nその会社は顧客の信頼を回復しました。\n\n「先輩、revive は活気を再び与えること、restore は以前の状態に戻すことです。」\n\n「建物やデータの復元などでは restore が自然です。」\n\nrevitalize\n\nリヴァイタライズ\n\n核イメージ：新しい活力を与えて活性化する\n\nThe city launched a plan to revitalize the downtown area.\n\n市は中心市街地を活性化する計画を始めました。\n\n「revitalize は、衰退したものに新たな活力を与えることです。」\n\nThe new strategy revitalized the company.\n\n新しい戦略は会社に活力を取り戻させました。\n\n「先輩、revive は再び生き返らせること、revitalize は活力を与えて元気にすることに注目します。」\n\n「地域活性化や企業再生などでは、どちらも使える場合があります。」\n\nresurrect\n\nレザレクト\n\n核イメージ：死んだもの・完全に終わったものを復活させる\n\nThe company resurrected a discontinued product.\n\nその会社は販売終了となった製品を復活させました。\n\n「resurrect は、いったん完全に終わったものを復活させる強い表現です。」\n\nThe novel tells the story of a man who is resurrected.\n\nその小説は、死からよみがえった男性の物語です。\n\n「先輩、revive は弱まったものや途絶えたものの復活、resurrect は死や完全な終了からの復活という強いイメージです。」\n\n「宗教やファンタジー作品でも使われます。」\n\nrenew\n\nリニュー\n\n核イメージ：新しくする・更新する・再び始める\n\nI need to renew my passport.\n\nパスポートを更新する必要があります。\n\n「renew は、期限のあるものを更新したり、活動や関係を新たにしたりする場合に使います。」\n\nThe company renewed its efforts to reduce costs.\n\nその会社はコスト削減への取り組みを新たにしました。\n\n「先輩、revive は失われた活気を戻すこと、renew は新しくする・更新することです。」\n\n「契約や免許の更新には renew が自然ですね。」\n\nrejuvenate\n\nリジューヴィネイト\n\n核イメージ：若々しさや元気を取り戻させる\n\nA good night's sleep can rejuvenate you.\n\n十分な睡眠は元気を取り戻す助けになります。\n\n「rejuvenate は、疲れた人や古くなったものに若々しい活力を与えることです。」\n\nThe company hopes to rejuvenate its brand.\n\nその会社はブランドを若返らせたいと考えています。\n\n「先輩、revive は復活、rejuvenate は若返りやリフレッシュに注目します。」\n\n「人の元気やブランドイメージを新しくする場面で使われます。」\n\nrekindle\n\nリーキンドル\n\n核イメージ：消えかけた火を再び燃やす\n\nThe trip rekindled my interest in history.\n\nその旅行は歴史への関心を再び呼び起こしました。\n\n「rekindle は、感情・情熱・関心などが再び燃え上がるイメージです。」\n\nThey rekindled their friendship after many years.\n\n彼らは何年も経ってから友情を再び深めました。\n\n「先輩、revive は広く復活させること、rekindle は感情や関心の火を再びつけることです。」\n\n「rekindle interest や rekindle hope は特に覚えやすい表現ですよ。」\n\n## 同じ場面で比較\n\n「先輩、衰退した地域を立て直す場面で比べましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| revive | Revive the local economy. | 経済に再び活気を与える |\n| recover | The economy is recovering. | 経済が回復する |\n| restore | Restore the old buildings. | 建物を元の状態に戻す |\n| revitalize | Revitalize the downtown area. | 地域に新しい活力を与える |\n| resurrect | Resurrect the discontinued service. | 終了したサービスを復活させる |\n| renew | Renew the development plan. | 計画を更新する |\n| rejuvenate | Rejuvenate the brand. | ブランドを若返らせる |\n| rekindle | Rekindle interest in the town. | 町への関心を再燃させる |\n\n「先輩、特に revive・recover・restore の違いを押さえてください。」\n\nThe company revived the business.\n\nその会社は事業を再生させました。\n\nThe business recovered from the downturn.\n\nその事業は不況から回復しました。\n\nThe company restored its former reputation.\n\nその会社は以前の評判を取り戻しました。\n\n「revive は再び活気を与える、recover は悪化から回復する、restore は元の状態に戻す。」\n\n「この3つを区別できれば、経済ニュースや企業の再建に関する文章も読みやすくなりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『その曲は昔の記憶をよみがえらせました』として自然なのは？\n\nThe song revived old memories.The song recovered old memories.The song renewed old memories.\n\nQ2. revive と restore の違いとして最も適切なのは？\n\nrevive は活気を取り戻させる、restore は元の状態に戻すrevive は必ず契約を更新するrestore は必ず生命を蘇生させる\n\nQ3. 『政府は経済を回復させるための対策を導入しました』として自然なのは？\n\nThe government introduced measures to revive the economy.The government introduced measures to revive for the economy.The government introduced measures to revival the economy.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- revive：復活させる・回復させる・よみがえらせる\n- revival：復活・再興\n- revived：復活した・元気を取り戻した\n- revive the economy：経済を回復させる\n- revive a business：事業を再生する\n- revive memories：記憶をよみがえらせる\n- revive interest in ～：～への関心を再び高める\n- revive a tradition：伝統を復活させる\n- revive a debate：議論を再燃させる\n- recover：悪化した状態から回復する\n- restore：元の状態に戻す\n- revitalize：活性化する\n- resurrect：死や完全な終了から復活させる\n- renew：新しくする・更新する\n- rejuvenate：若返らせる・元気を取り戻させる\n- rekindle：関心や情熱を再燃させる\n\n一文記憶\n\nThe old photographs revived vivid memories of my childhood.\n\n古い写真は、子どもの頃の鮮明な記憶をよみがえらせました。\n\n「先輩、今日のポイントは revive = 弱まったものに、再び生命力や活気を与える という感覚です。」\n\n「recover は悪化から回復する、restore は元の状態に戻す、revitalize は新たな活力を与える。」\n\n「そして、前回の vivid と組み合わせた revive vivid memories は、記憶のイメージがつながるので覚えやすいですよ。」\n\n「一つの単語を独立して暗記するのではなく、以前に学んだ単語と結びつける。先輩、そうやって語彙を増やしていきましょう。」\n\n次は 第66語｜Dispense です。"}, {"name": "Dispense", "text": "# 第66語｜Dispense\n\n発音：/dɪˈspens/（ディスペンス）｜動詞\n\n「先輩、今日の単語は dispense です。」\n\n「少し難しい単語ですが、実は日常生活で見かけるものともつながっています。」\n\nThe machine dispenses drinks.\n\nその機械は飲み物を供給します。\n\nThe pharmacist dispensed the medicine.\n\n薬剤師は薬を調剤して渡しました。\n\n「先輩、自動販売機やソープディスペンサーを思い浮かべてください。」\n\n「どちらも、中にあるものを必要な量だけ外に出しますよね。」\n\n「これが dispense の基本イメージです。」\n\n「ただし、dispense with ～ になると『～を省く』『～なしで済ませる』という別の意味になるんです。」\n\n「どうしてそうなるのかも含めて、今日は丁寧に理解していきましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を押さえましょう。」\n\n① 物を一定量ずつ出す・供給する\n\nThis machine dispenses coffee.\n\nこの機械はコーヒーを供給します。\n\n「機械の中にあるものを、必要な量だけ取り出せるようにするイメージですね。」\n\n② 薬を調剤して渡す\n\nThe pharmacist dispensed the prescription medication.\n\n薬剤師は処方薬を調剤して渡しました。\n\n「薬局などで使われる、専門的な意味です。」\n\n③ お金・物資・助言などを配る、与える\n\nThe organization dispensed aid to families in need.\n\nその団体は支援を必要とする家庭に援助を提供しました。\n\n「先輩、物理的な機械だけでなく、組織や人が何かを分配する場合にも使えます。」\n\n④ dispense with ～：～を省く・～なしで済ませる\n\nWe can dispense with the formalities.\n\n形式的な手続きは省略できます。\n\n「ここが重要です。dispense with は、物を出すという意味ではありません。」\n\n核イメージ\n\n「dispense = 管理しているものを、必要に応じて外へ出す・分配する。」\n\n「そして、dispense with = あるものを使わずに済ませる。この2つを区別して覚えてください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが重要です。」\n\n「dispense に似た表現には『配る』『提供する』『支給する』という意味のものがあります。」\n\n「でも、どのように渡すのか、何を渡すのか、何を目的とするのかで違いが生まれます。」\n\ndispense\n\nディスペンス\n\n核イメージ：管理されているものを、必要に応じて供給・分配する\n\nThe machine dispenses tickets.\n\nその機械はチケットを発行します。\n\n「先輩、機械・薬・支援物資などの供給に使われます。」\n\ndistribute\n\nディストリビュート\n\n核イメージ：複数の人や場所に広く分配する\n\nThe company distributed samples to customers.\n\nその会社は顧客に試供品を配布しました。\n\n「distribute は、物を複数の相手へ行き渡らせることに注目します。」\n\nThe organization distributed food to the affected areas.\n\nその団体は被災地域に食料を配布しました。\n\n「先輩、dispense は必要に応じて供給すること、distribute は広く分配することです。」\n\n「支援物資については両方使える場合がありますが、distribute の方が一般的な『配布する』として使いやすいですね。」\n\nprovide\n\nプロヴァイド\n\n核イメージ：必要なものを提供する\n\nThe company provides training to employees.\n\nその会社は従業員に研修を提供しています。\n\n「provide は、物・情報・サービス・機会など、幅広いものに使えます。」\n\nThe hotel provides free Wi-Fi.\n\nそのホテルは無料Wi-Fiを提供しています。\n\n「先輩、dispense は供給・分配の動作に注目し、provide は相手が利用できるように提供することに注目します。」\n\n「サービスの提供なら provide が自然です。」\n\nsupply\n\nサプライ\n\n核イメージ：必要なものを継続的・安定的に供給する\n\nThe factory supplies parts to car manufacturers.\n\nその工場は自動車メーカーに部品を供給しています。\n\n「supply は、必要な量を供給することに注目します。」\n\nThe company supplies electricity to local businesses.\n\nその会社は地元企業に電力を供給しています。\n\n「先輩、dispense は装置や人が物を出す・渡す動作、supply は必要な物資や資源を供給することです。」\n\n「電力や原材料などでは supply が自然ですね。」\n\nadminister\n\nアドミニスター\n\n核イメージ：薬や治療を実際に投与・実施する\n\nThe nurse administered the medication.\n\n看護師はその薬を投与しました。\n\n「administer は、薬を患者に投与することを表せます。」\n\nThe doctor administered an injection.\n\n医師は注射を行いました。\n\n「先輩、dispense medication は薬を調剤して渡すこと、administer medication は薬を実際に投与することです。」\n\n「医療の文章では、この違いが特に重要ですよ。」\n\nhand out\n\nハンド アウト\n\n核イメージ：人に直接手渡して配る\n\nThe teacher handed out worksheets.\n\n先生はプリントを配りました。\n\n「hand out は、紙や物を人に配る日常的な表現です。」\n\nVolunteers handed out water bottles.\n\nボランティアは水のボトルを配りました。\n\n「先輩、dispense はややフォーマルで、供給・分配の仕組みを感じさせます。」\n\n「hand out は、実際に手渡すような配布にぴったりです。」\n\nissue\n\nイシュー\n\n核イメージ：権限を持つ組織が正式に発行・交付する\n\nThe government issued new passports.\n\n政府は新しいパスポートを発行しました。\n\n「issue は、書類・許可証・チケットなどを正式に発行する場合に使います。」\n\nThe bank issued a new card.\n\n銀行は新しいカードを発行しました。\n\n「先輩、dispense は機械などがチケットを出す動作にも使えますが、issue は正式な発行に注目します。」\n\n「パスポートや許可証には issue が自然ですね。」\n\n## 「省く」の類義語も区別しましょう\n\n「先輩、dispense with は意味が大きく変わるので、こちらも別に比較します。」\n\n| 表現 | 核イメージ | 英文・日本語訳 |\n| --- | --- | --- |\n| dispense with | 不要なものとして使わずに済ませる | We can dispense with the paperwork. 書類作業を省けます。 |\n| omit | 内容の一部を省略する | Please omit unnecessary details. 不必要な詳細は省略してください。 |\n| skip | 手順や順番を飛ばす | Let's skip this step. この手順は飛ばしましょう。 |\n| eliminate | 不要なものを取り除く | We need to eliminate waste. 無駄をなくす必要があります。 |\n| do without | ～なしでやっていく | We can do without extra equipment. 追加の機材なしで済ませられます。 |\n\n「先輩、違いを整理すると、omit は内容の省略、skip は手順を飛ばすこと、eliminate は取り除くことです。」\n\n「そして、dispense with と do without は『それがなくても済む』という感覚が近いですね。」\n\n「ただし、dispense with は少しフォーマルで、制度・手続き・慣習などを省く場面でもよく使われます。」\n\n## 理解確認｜3問\n\nQ1. 『その機械は飲み物を供給します』として自然なのは？\n\nThe machine dispenses drinks.The machine dispenses with drinks.The machine is dispensing of drinks.\n\nQ2. dispense medication と administer medication の違いは？\n\ndispense は薬を調剤して渡す、administer は薬を投与するdispense は薬を廃棄する、administer は薬を販売する両方とも必ず薬を製造することを意味する\n\nQ3. 『不必要な手続きは省けます』として自然なのは？\n\nWe can dispense with unnecessary procedures.We can dispense unnecessary procedures to.We can dispense for unnecessary procedures.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- dispense：供給する・分配する・調剤して渡す\n- dispense with ～：～を省く・～なしで済ませる\n- dispenser：供給装置・ディスペンサー\n- dispense medication：薬を調剤して渡す\n- dispense drinks：飲み物を供給する\n- dispense tickets：チケットを発行する\n- dispense advice：助言を与える\n- dispense with formalities：形式的な手続きを省く\n- distribute：広く分配する\n- provide：提供する\n- supply：供給する\n- administer：薬を投与する\n- hand out：手渡して配る\n- issue：正式に発行する\n- omit：省略する\n- skip：飛ばす\n- eliminate：取り除く\n- do without：～なしで済ませる\n\n一文記憶\n\nThe new system dispenses tickets automatically, allowing us to dispense with manual procedures.\n\n新しいシステムはチケットを自動発行するため、手作業の手続きを省くことができます。\n\n「先輩、この一文には、今日の2つの重要な意味が両方入っています。」\n\n「dispense tickets は『チケットを発行する』。」\n\n「dispense with manual procedures は『手作業の手続きを省く』。」\n\n「同じ dispense でも、with が付くかどうかで意味が大きく変わるんです。」\n\n「先輩、今日の最重要ポイントはここですよ。必ず区別して覚えてくださいね。」\n\n次は 第67語｜Signify です。"}, {"name": "Signify", "text": "# 第67語｜Signify\n\n発音：/ˈsɪɡnɪfaɪ/（スィグニファイ）｜動詞\n\n「先輩、今日の単語は signify です。」\n\n「基本の意味は 『意味する』『示す』『表す』 ですね。」\n\nWhat does this symbol signify?\n\nこの記号は何を意味しているのですか？\n\nThe increase in sales signifies growing demand.\n\n売上の増加は、需要が高まっていることを示しています。\n\n「先輩、ここで質問です。mean も『意味する』ですよね。では、どうして signify を使うのでしょう？」\n\n「mean は『意味する』という幅広い表現ですが、signify は、目に見える事実・行動・記号などが、その背後にある意味や変化を示しているという場面で特によく使います。」\n\n「例えば、売上が20％増えたとします。それは単なる数字の変化でしょうか？」\n\n「もちろん、売上が増えたという事実です。でも、その数字が『需要の拡大』を示している可能性もありますよね。」\n\n「このように、ある事実から、その背後にある意味を読み取る。それが signify の大切な感覚です。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を整理しましょう。」\n\n① 記号・行動などが何かを意味する\n\nA red light signifies danger.\n\n赤いランプは危険を意味します。\n\n「赤い光そのものが危険なのではなく、危険という意味を伝える合図なんです。」\n\n② 事実が何かを示す\n\nThe decline in sales may signify a change in consumer behavior.\n\n売上の減少は、消費者行動の変化を示している可能性があります。\n\n「先輩、数字という事実が、その背後にある変化を示しているわけですね。」\n\n③ 行動によって意思を表す\n\nPlease signify your agreement by raising your hand.\n\n賛成の場合は挙手で意思を示してください。\n\n「言葉で説明する代わりに、行動で意思を表す場合です。」\n\n④ 重要な変化や節目を意味する\n\nThe agreement signifies a major step forward.\n\nその合意は大きな前進を意味します。\n\n「単なる合意ではなく、物事が進展したことを象徴しているんですね。」\n\n核イメージ：目に見えるものが、その背後にある意味を伝える\n\n「先輩、signify は sign（しるし） と関連する単語です。『何かのしるしとして意味を示す』と考えると覚えやすいですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「signify と似た単語はたくさんあります。でも、直接意味するのか、証拠として示すのか、象徴するのか、暗に示すのかで違いがあるんです。」\n\nsignify\n\nスィグニファイ\n\n核イメージ：ある事実や記号が、背後にある意味を示す\n\nThe agreement signifies progress.\n\nその合意は進展を意味します。\n\n「先輩、目に見えるものが、どんな意味を持つかに注目します。」\n\nmean\n\nミーン\n\n核イメージ：言葉や物事が、ある意味を持つ\n\nWhat does this word mean?\n\nこの単語はどういう意味ですか？\n\n「mean は、意味を表す最も基本的で幅広い動詞です。」\n\nThis means we need to change our plan.\n\nこれは、私たちが計画を変更する必要があることを意味します。\n\n「先輩、signify は『何かのしるしとして意味を示す』というややフォーマルな響きがあります。」\n\n「日常会話で単純に『どういう意味？』と聞くなら、mean の方が自然な場合が多いですね。」\n\nindicate\n\nインディケイト\n\n核イメージ：情報や兆候が、ある方向・状態を指し示す\n\nThe data indicates a decline in demand.\n\nそのデータは需要の減少を示しています。\n\n「indicate は、データや兆候が何らかの状態を示している場合によく使います。」\n\nThe sign indicates the direction of the exit.\n\nその標識は出口の方向を示しています。\n\n「先輩、signify は『それが何を意味するか』、indicate は『何を指し示しているか』に重点があります。」\n\n「経済指標の説明では、indicate の方が一般的な場合も多いですよ。」\n\nrepresent\n\nレプリゼント\n\n核イメージ：何かの代わりとなって表す・代表する\n\nThe dove represents peace.\n\nハトは平和を象徴しています。\n\n「represent は、あるものが別のものを表す・代表する場合に使います。」\n\nThis figure represents total annual sales.\n\nこの数字は年間売上高の合計を表しています。\n\n「先輩、signify は意味を示すこと、represent は何かを表現・代表することです。」\n\n「図表で『この棒グラフは何を表すか』というときにも represent が使えます。」\n\nsymbolize\n\nスィンボライズ\n\n核イメージ：象徴として抽象的な意味を表す\n\nThe olive branch symbolizes peace.\n\nオリーブの枝は平和を象徴しています。\n\n「symbolize は、物や行動が抽象的な概念を象徴する場合に使います。」\n\nThe ceremony symbolizes unity.\n\nその式典は団結を象徴しています。\n\n「先輩、signify は幅広く意味を示すこと、symbolize は特に象徴として意味を表すことです。」\n\n「平和・希望・自由・団結などの象徴を説明するときに便利ですね。」\n\nimply\n\nインプライ\n\n核イメージ：直接言わずに、暗に意味する\n\nHis silence implied disagreement.\n\n彼の沈黙は反対を暗に示していました。\n\n「imply は、明確に言葉にしなくても、何かを示唆する場合に使います。」\n\nAre you implying that I made a mistake?\n\n私が間違えたと言いたいのですか？\n\n「先輩、signify は事実や記号が意味を示すこと、imply は明言せずに意味を含ませることです。」\n\n「ただし、imply も必ずしも意図的な遠回しの発言だけを指すわけではありません。状況が何かを示唆する場合にも使えます。」\n\nsuggest\n\nサジェスト\n\n核イメージ：ある可能性や解釈を示唆する\n\nThe results suggest that demand is increasing.\n\nその結果は、需要が増加していることを示唆しています。\n\n「suggest は『提案する』だけでなく、『示唆する』という意味もあります。」\n\nThe evidence suggests a different explanation.\n\nその証拠は別の説明が考えられることを示唆しています。\n\n「先輩、signify は何を意味するか、suggest は何が考えられるかに重点があります。」\n\n「分析では、結論を断定できないときに suggest が便利です。」\n\ndemonstrate\n\nデモンストレイト\n\n核イメージ：証拠や実例によって明確に示す\n\nThe experiment demonstrated the effectiveness of the method.\n\nその実験は方法の有効性を実証しました。\n\n「demonstrate は、証拠や実演によって何かをはっきり示す場合に使います。」\n\nThe report demonstrates the need for reform.\n\nその報告書は改革の必要性を明確に示しています。\n\n「先輩、signify は意味を示すこと、demonstrate は根拠や実例によって明確に示すことです。」\n\n「単なる兆候よりも、証拠として示すことに重点があります。」\n\ndenote\n\nディノウト\n\n核イメージ：記号や語が、特定の意味を指す\n\nThe symbol °C denotes degrees Celsius.\n\n記号「°C」は摂氏温度を表します。\n\n「denote は、記号・用語・表記が何を指すかを説明するときによく使います。」\n\nIn this formula, x denotes the number of items.\n\nこの数式では、x は品目数を表します。\n\n「先輩、signify は広く意味を示すこと、denote は特定の意味や対象を指すことです。」\n\n「数式・定義・専門文書などで見かける表現ですね。」\n\n## 同じ場面で比較してみましょう\n\n「先輩、売上が増加したというニュースを例にしましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| signify | The increase signifies progress. | 増加が何を意味するか |\n| mean | This means sales are higher. | 何を意味するか |\n| indicate | The data indicates growth. | データが示す傾向 |\n| represent | The figure represents total sales. | 数字が何を表すか |\n| symbolize | The launch symbolizes a new era. | 何を象徴するか |\n| imply | The statement implies concern. | 暗に何を示すか |\n| suggest | The results suggest stronger demand. | どんな可能性を示唆するか |\n| demonstrate | The results demonstrate improvement. | 根拠によって何を示すか |\n| denote | The letter S denotes sales. | 記号が何を指すか |\n\n「先輩、特に signify・indicate・suggest の違いを意識してください。」\n\nThe increase in sales signifies a positive change.\n\n売上の増加は前向きな変化を意味します。\n\nThe data indicates that sales are increasing.\n\nデータは売上が増加していることを示しています。\n\nThe results suggest that demand may be growing.\n\nその結果は、需要が高まっている可能性を示唆しています。\n\n「signify は意味、indicate は指し示す情報、suggest は考えられる解釈。」\n\n「ただし、これらの単語だけで証拠の強さが自動的に決まるわけではありません。先輩、実際の根拠も一緒に確認してくださいね。」\n\n## 理解確認｜3問\n\nQ1. 『この記号は何を意味しますか？』として自然なのは？\n\nWhat does this symbol signify?What does this symbol signifies?What is this symbol signify?\n\nQ2. signify と symbolize の違いとして最も適切なのは？\n\nsignify は広く意味を示す、symbolize は象徴として表すsignify は必ず数字だけに使うsymbolize は必ず数量を計算する\n\nQ3. 『結果は需要が増えている可能性を示唆しています』として最も自然なのは？\n\nThe results suggest that demand may be increasing.The results denote that demand may be increasing.The results symbolize that demand may be increasing.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- signify：意味する・示す・表す\n- signify a change：変化を意味する\n- signify progress：進展を意味する\n- signify agreement：賛意を示す\n- signify that ～：～であることを示す\n- significance：重要性・意義\n- significant：重要な・著しい\n- mean：意味する\n- indicate：指し示す\n- represent：表す・代表する\n- symbolize：象徴する\n- imply：暗に意味する\n- suggest：示唆する\n- demonstrate：実証する・明確に示す\n- denote：特定の意味を指す\n\n一文記憶\n\nThe increase in sales may signify growing demand, but we need more data to confirm it.\n\n売上の増加は需要の高まりを示している可能性がありますが、それを確認するにはさらにデータが必要です。\n\n「先輩、今日のポイントは signify = 目に見える事実や記号が、その背後にある意味を示す という感覚です。」\n\n「そして、前に学んだ significance ともつながります。」\n\n「signify は『何を意味するか』、significance は『どんな意義・重要性があるか』。」\n\n「先輩、数字や出来事を見たときに、What does this signify?（これは何を意味するのだろう？） と考える習慣をつけると、英語の読解だけでなく、情報を分析する練習にもなりますよ。」\n\n次は 第68語｜Realm です。"}, {"name": "Realm", "text": "# 第68語｜Realm\n\n発音：/relm/（レルム）｜名詞\n\n「先輩、今日の単語は realm です。」\n\n「基本の意味は 『領域』『分野』『世界』『王国』 ですね。」\n\nThis problem is outside the realm of my expertise.\n\nこの問題は私の専門分野の範囲外です。\n\nThe novel takes place in a magical realm.\n\nその小説は魔法の王国を舞台にしています。\n\n「先輩、『専門分野』と『魔法の王国』では、ずいぶん意味が違うように見えますよね？」\n\n「でも、実はどちらにも共通するイメージがあるんです。」\n\n「それは、ある範囲が一つのまとまった世界として存在しているということです。」\n\n「例えば、会計には会計の世界、法律には法律の世界があります。そこには、それぞれ専門知識やルールがありますよね。」\n\n「realm は、そうした独自の性質を持つ一つの世界・領域を表すんです。」\n\n「今日は field、area、domain、sphere、scope、territory、kingdom、world との違いまで理解していきましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえましょう。」\n\n① 専門分野・活動領域\n\nHe works in the realm of finance.\n\n彼は金融の分野で働いています。\n\n「金融という一つの専門的な世界ですね。」\n\n② 思考・想像などの世界\n\nThe story takes us into the realm of imagination.\n\nその物語は私たちを想像の世界へ連れていきます。\n\n「現実の場所ではなく、頭の中に広がる世界にも使えます。」\n\n③ 王国・領土\n\nThe king ruled over a vast realm.\n\nその王は広大な王国を統治していました。\n\n「先輩、こちらは realm の歴史的・文字どおりの意味です。」\n\n④ 可能性や理解の範囲\n\nThe idea is within the realm of possibility.\n\nその考えは実現する可能性の範囲内にあります。\n\n「これは『実現する可能性がある』という意味ですね。」\n\n核イメージ：独自の範囲や性質を持つ、一つのまとまった世界\n\n「先輩、realm は単なる場所ではありません。あるものが属する世界や領域という感覚で覚えてください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。」\n\n「『領域』『分野』『世界』と訳せる単語はたくさんあります。でも、何を基準に範囲を区切っているかが違うんです。」\n\nrealm\n\nレルム\n\n核イメージ：独自の性質を持つ、一つのまとまった世界\n\nThis issue belongs to the realm of politics.\n\nこの問題は政治の領域に属します。\n\n「先輩、抽象的な分野を一つの世界として捉える表現です。」\n\nfield\n\nフィールド\n\n核イメージ：専門的な活動や研究が行われる分野\n\nShe works in the field of accounting.\n\n彼女は会計分野で働いています。\n\n「field は、仕事・研究・専門知識などの分野を表す最も一般的な単語の一つです。」\n\nHe is an expert in the field of economics.\n\n彼は経済学の分野の専門家です。\n\n「先輩、realm は一つの世界という抽象的なイメージ、field は専門的な活動分野というイメージです。」\n\n「履歴書や仕事の紹介では field が使いやすいですよ。」\n\narea\n\nエリア\n\n核イメージ：ある範囲として区切られた場所・分野\n\nThis is an important area of research.\n\nこれは重要な研究分野です。\n\n「area は、物理的な場所にも、抽象的な分野にも使える幅広い単語です。」\n\nWe need to improve this area of our business.\n\n私たちは事業のこの部分を改善する必要があります。\n\n「先輩、realm は独自の世界、area は単純に区切られた範囲という違いです。」\n\n「特に area of improvement など、業務の一部分を示すときにも便利です。」\n\ndomain\n\nドメイン\n\n核イメージ：特定の知識・権限・活動が属する領域\n\nThis issue falls within the domain of computer science.\n\nこの問題はコンピューター科学の領域に属します。\n\n「domain は、専門知識や権限が及ぶ範囲を表すことができます。」\n\nCybersecurity is a specialized domain.\n\nサイバーセキュリティは専門性の高い領域です。\n\n「先輩、realm は一つの世界というイメージ、domain は専門知識や権限によって区切られた領域というイメージです。」\n\n「ITでは domain name（ドメイン名）のような専門用語にも使われますね。」\n\nsphere\n\nスフィア\n\n核イメージ：人や活動の影響が及ぶ範囲\n\nThe decision belongs to the political sphere.\n\nその決定は政治の領域に属します。\n\n「sphere は、活動・影響・関心などが及ぶ範囲を表します。」\n\nThe company expanded its sphere of influence.\n\nその会社は影響力の及ぶ範囲を広げました。\n\n「先輩、realm はまとまった世界、sphere は影響や活動が及ぶ範囲という違いです。」\n\n「特に sphere of influence（勢力圏・影響圏）はよく使われる表現です。」\n\nscope\n\nスコウプ\n\n核イメージ：仕事・計画・調査などが対象とする範囲\n\nThis task is outside the scope of the project.\n\nこの作業はプロジェクトの対象範囲外です。\n\n「scope は、何を含み、何を含まないかという範囲に注目します。」\n\nWe need to define the scope of the investigation.\n\n私たちは調査の範囲を明確にする必要があります。\n\n「先輩、realm は一つの世界、scope は対象となる範囲です。」\n\n「仕事の担当範囲やプロジェクトの対象範囲には scope がとても便利です。」\n\nterritory\n\nテリトリー\n\n核イメージ：所有・支配・活動の対象となる土地や領域\n\nThe company expanded into new territory.\n\nその会社は新しい地域へ進出しました。\n\n「territory は、物理的な領土や営業地域などを表します。」\n\nThis is unfamiliar territory for me.\n\nこれは私にとって未知の分野です。\n\n「先輩、territory は土地や活動領域から発展した表現で、比喩的に『未知の領域』という意味でも使えます。」\n\n「realm は、より抽象的な世界を表すことが多いですね。」\n\nkingdom\n\nキングダム\n\n核イメージ：王や女王が統治する国\n\nThe king ruled the kingdom for many years.\n\nその王は長年その王国を統治しました。\n\n「kingdom は、王国という政治的なまとまりを表します。」\n\nThe story is set in a fictional kingdom.\n\nその物語は架空の王国を舞台にしています。\n\n「先輩、realm にも王国という意味がありますが、kingdom は王国そのものを直接表す一般的な単語です。」\n\n「realm は文学的な表現として使われることもあります。」\n\nworld\n\nワールド\n\n核イメージ：一つの広い世界・社会・活動の場\n\nHe works in the world of finance.\n\n彼は金融の世界で働いています。\n\n「world は、物理的な世界だけでなく、特定の業界や社会にも使えます。」\n\nThe world of technology is changing rapidly.\n\nテクノロジーの世界は急速に変化しています。\n\n「先輩、realm は抽象的・文学的な響きがあり、world はより一般的で日常的な表現です。」\n\n「迷ったときは、日常会話なら world、専門分野なら field、抽象的な領域を強調したいなら realm と考えると使い分けやすいですよ。」\n\n## 同じ場面で比較してみましょう\n\n「先輩、会社で新しい業務を担当する場面を考えてください。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| realm | This belongs to the realm of finance. | 金融という世界・領域 |\n| field | I work in the field of finance. | 専門分野 |\n| area | This is an important area of finance. | 分野の一部分 |\n| domain | This falls within the domain of finance. | 専門知識が及ぶ領域 |\n| sphere | This belongs to the financial sphere. | 活動・影響の領域 |\n| scope | This is outside the scope of my work. | 担当する対象範囲 |\n| territory | This is unfamiliar territory for me. | 未知の領域 |\n| kingdom | The kingdom had a strong economy. | 王国 |\n| world | I work in the world of finance. | 金融の世界 |\n\n「先輩、特に realm・field・scope の違いを押さえてください。」\n\nThis is outside the realm of accounting.\n\nこれは会計の領域の外にあります。\n\nThis is outside my field of expertise.\n\nこれは私の専門分野の範囲外です。\n\nThis is outside the scope of my responsibilities.\n\nこれは私の責任範囲外です。\n\n「realm は世界としての領域、field は専門分野、scope は担当・対象範囲。」\n\n「仕事で『それは私の専門外です』と言うのか、『私の担当範囲外です』と言うのかで、使う単語も変わってきますね。」\n\n## 理解確認｜3問\n\nQ1. 『それは実現する可能性があります』として自然なのは？\n\nIt's within the realm of possibility.It's within the realm of possible.It's within the realm for possibility.\n\nQ2. realm と scope の違いとして最も適切なのは？\n\nrealm は一つの世界・領域、scope は対象となる範囲realm は必ず数値を意味するscope は必ず王国を意味する\n\nQ3. 『この問題は私の専門分野の範囲外です』として自然なのは？\n\nThis problem is outside the realm of my expertise.This problem is outside the realm to my expertise.This problem is outside the realm for my expertise.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- realm：領域・分野・世界・王国\n- the realm of ～：～の領域・世界\n- in the realm of ～：～の分野で\n- within the realm of ～：～の範囲内で\n- outside the realm of ～：～の範囲外で\n- beyond the realm of ～：～の領域を超えて\n- within the realm of possibility：実現する可能性がある\n- the realm of imagination：想像の世界\n- the realm of politics：政治の世界\n- field：専門分野\n- area：範囲・分野\n- domain：専門知識や権限の領域\n- sphere：活動・影響の及ぶ範囲\n- scope：対象範囲\n- territory：領土・活動領域\n- kingdom：王国\n- world：世界\n\n一文記憶\n\nWhat once seemed beyond the realm of possibility may become reality through technological progress.\n\nかつては実現不可能と思われていたことも、技術の進歩によって現実になるかもしれません。\n\n「先輩、今日のポイントは realm = 独自の性質を持つ、一つのまとまった世界 という感覚です。」\n\n「専門分野も、想像の世界も、王国も、すべてこのイメージでつながります。」\n\n「そして、within the realm of possibility は特に覚えておいてください。」\n\n「『今は難しそうだけれど、実現する可能性はある』。そんな場面で使える便利な表現ですよ。」\n\n次は 第69語｜Strike です。"}, {"name": "Strike", "text": "# 第69語｜Strike\n\n発音：/straɪk/（ストライク）｜動詞・名詞\n\n「先輩、今日の単語は strike です。」\n\n「野球の『ストライク』なら聞いたことがありますよね。でも、英語の strike は、それだけではないんです。」\n\nLightning struck the tree.\n\n雷がその木に落ちました。\n\nThe workers went on strike.\n\n労働者たちはストライキに入りました。\n\nAn idea suddenly struck me.\n\n突然、ある考えが頭に浮かびました。\n\n「先輩、どうでしょう。『雷が落ちる』『ストライキをする』『考えが浮かぶ』……意味がバラバラに見えませんか？」\n\n「でも、中心には共通する感覚があります。」\n\nStrike の核イメージは『勢いよく当たる・強い影響を与える』です。\n\n「雷が木に当たる。ある出来事が人の心に強い印象を与える。考えが突然頭に飛び込んでくる。」\n\n「そこから、さまざまな意味に広がっているんです。」\n\n「ただし、労働争議の strike など、すべての意味を単純に『打つ』へ置き換えられるわけではありません。実際に使うときは、決まった表現も一緒に覚えましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは6つの代表的な意味を覚えてください。」\n\n① 打つ・たたく・ぶつかる\n\nHe struck the ball with a bat.\n\n彼はバットでボールを打ちました。\n\n「これが基本的な意味です。」\n\n② 雷・災害などが襲う\n\nA powerful earthquake struck the region.\n\n強い地震がその地域を襲いました。\n\n「災害が突然、地域に大きな影響を与えるイメージです。」\n\n③ 突然思い浮かぶ・気づく\n\nIt suddenly struck me that I had forgotten my wallet.\n\n財布を忘れたことに突然気づきました。\n\n「先輩、これは重要な使い方です。考えが突然頭に飛び込んでくる感覚ですね。」\n\n④ 強い印象を与える\n\nHer honesty struck me.\n\n彼女の誠実さが私の心に強く残りました。\n\n⑤ ストライキをする\n\nThe employees decided to strike.\n\n従業員たちはストライキをすることに決めました。\n\n「労働条件などの改善を求めて、集団で仕事を停止することです。」\n\n⑥ 合意・均衡などを成立させる\n\nThe two companies struck a deal.\n\nその2社は取引について合意しました。\n\n「先輩、strike a deal はビジネスでも使われる重要表現ですよ。」\n\n核イメージ：強く当たる・突然影響を与える\n\n「まずこのイメージを持ち、そこから各表現の意味を区別して覚えましょう。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが重要です。」\n\n「strike は意味が多いので、似た単語も意味ごとに分けて比較しましょう。」\n\n### ①「打つ・衝撃を与える」の類義語\n\nstrike\n\nストライク\n\n核イメージ：勢いよく打つ・衝撃を与える\n\nLightning struck the building.\n\n雷がその建物に落ちました。\n\n「先輩、物理的な打撃だけでなく、災害や抽象的な影響にも使えます。」\n\nhit\n\nヒット\n\n核イメージ：何かに当たる・ぶつける\n\nThe ball hit the window.\n\nボールが窓に当たりました。\n\n「hit は『当たる・打つ』という最も一般的な表現の一つです。」\n\nThe car hit a tree.\n\n車が木に衝突しました。\n\n「先輩、strike はやや強い衝撃や突然の出来事を表すことが多く、hit は日常的に幅広く使えます。」\n\n「ただし、強い打撃にも hit は使えます。強さだけで完全に区別するわけではありません。」\n\nbeat\n\nビート\n\n核イメージ：繰り返したたく・打ち負かす\n\nHe beat the drum.\n\n彼は太鼓をたたきました。\n\n「beat は、繰り返してたたく動作に使えます。」\n\nOur team beat the defending champions.\n\n私たちのチームは前回の優勝チームに勝ちました。\n\n「先輩、strike は一回の打撃にも使えますが、beat は反復的な打撃や勝利の意味が特徴的です。」\n\npunch\n\nパンチ\n\n核イメージ：こぶしで殴る\n\nHe punched the punching bag.\n\n彼はサンドバッグをこぶしで打ちました。\n\n「punch は、こぶしを使う打撃です。」\n\n「先輩、strike は手・道具・雷など幅広いものに使えますが、punch はこぶしによる打撃が中心です。」\n\nsmash\n\nスマッシュ\n\n核イメージ：強く打って壊す・粉砕する\n\nThe glass smashed against the floor.\n\nグラスが床にぶつかって粉々になりました。\n\n「smash は、破壊や激しい衝突を強く感じさせます。」\n\nThe wave smashed against the rocks.\n\n波が岩に激しく打ちつけました。\n\n「先輩、strike は衝撃を与えること、smash は強い衝突や破壊に重点があります。」\n\n### ②「突然気づく・印象を与える」の類義語\n\noccur to\n\nアカー トゥ\n\n核イメージ：考えが頭に浮かぶ\n\nIt occurred to me that I had forgotten something.\n\n何かを忘れたことに気づきました。\n\n「occur to someone は、考えや気づきが自然に頭に浮かぶ表現です。」\n\nIt struck me that I had forgotten something.\n\n何かを忘れたことに突然気づきました。\n\n「先輩、strike は突然の強い気づきを感じさせ、occur to は考えが浮かぶことに重点があります。」\n\nrealize\n\nリアライズ\n\n核イメージ：事実や状況を理解して気づく\n\nI realized that I had made a mistake.\n\n自分が間違えたことに気づきました。\n\n「realize は、何かを理解して認識することです。」\n\n「先輩、strike は気づきが突然訪れる感覚、realize は気づいて理解することに重点があります。」\n\n「日常会話では realize の方が幅広く使いやすいですね。」\n\nimpress\n\nインプレス\n\n核イメージ：人に強い印象を与える\n\nHer presentation impressed me.\n\n彼女のプレゼンテーションは私に強い印象を与えました。\n\n「impress は、能力や行動などによって相手に感銘を与える場合によく使います。」\n\nI was struck by her confidence.\n\n私は彼女の自信に強い印象を受けました。\n\n「先輩、strike は良い印象にも悪い印象にも使えますが、impress は肯定的な感銘を表すことが多いです。」\n\nastonish\n\nアストニッシュ\n\n核イメージ：非常に驚かせる\n\nThe results astonished everyone.\n\nその結果は全員を非常に驚かせました。\n\n「astonish は、驚きの強さが中心です。」\n\n「先輩、strike は強い印象を与えること、astonish は予想外のことに驚かせることです。」\n\n「必ずしも strike に驚きが含まれるわけではありません。」\n\n### ③「合意する・バランスを取る」の類義語\n\nreach\n\nリーチ\n\n核イメージ：交渉や努力の末に到達する\n\nThe two sides reached an agreement.\n\n双方は合意に達しました。\n\n「reach an agreement は、交渉の結果として合意に到達したことを表します。」\n\nThe companies struck a deal.\n\n両社は取引を成立させました。\n\n「先輩、strike a deal は取引をまとめること、reach an agreement は合意に到達することです。」\n\n「前者はビジネス上の取引、後者はより幅広い合意に使えます。」\n\nnegotiate\n\nニゴウシエイト\n\n核イメージ：条件について話し合い、交渉する\n\nThe companies negotiated the terms of the contract.\n\n両社は契約条件について交渉しました。\n\n「negotiate は合意に至るまでの交渉過程に注目します。」\n\n「先輩、negotiate は交渉する、strike a deal は取引を成立させるという違いです。」\n\n「交渉しても合意できない場合はありますからね。」\n\nbalance\n\nバランス\n\n核イメージ：複数の要素を釣り合わせる\n\nWe need to balance cost and quality.\n\n私たちはコストと品質を両立させる必要があります。\n\n「balance は動詞として『釣り合わせる』という意味があります。」\n\nWe need to strike a balance between cost and quality.\n\n私たちはコストと品質のバランスを取る必要があります。\n\n「先輩、どちらも自然ですが、strike a balance は適切な均衡点を見つけて成立させるという響きがあります。」\n\n## 使い分け早見表\n\n| 単語・表現 | 核イメージ | よく使う場面 |\n| --- | --- | --- |\n| strike | 強く当たる・影響を与える | 打撃、災害、印象、気づき |\n| hit | 当たる・ぶつける | 日常的な衝突・打撃 |\n| beat | 繰り返し打つ・打ち負かす | 太鼓、勝負 |\n| punch | こぶしで打つ | 格闘技 |\n| smash | 激しくぶつかる・壊す | 破壊、強い衝突 |\n| occur to | 考えが浮かぶ | ひらめき |\n| realize | 理解して気づく | 認識・理解 |\n| impress | 感銘を与える | 好印象 |\n| astonish | 非常に驚かせる | 驚き |\n| reach an agreement | 合意に達する | 交渉結果 |\n| negotiate | 交渉する | 話し合いの過程 |\n| balance | 釣り合わせる | 両立・調整 |\n\n「先輩、strike は意味が多いので、単語一つで覚えようとするより、表現のまとまりで覚える方が効果的です。」\n\n## 理解確認｜3問\n\nQ1. 『突然、自分が間違えていたことに気づきました』として自然なのは？\n\nIt suddenly struck me that I was wrong.I suddenly struck that I was wrong.It suddenly strike me that I was wrong.\n\nQ2. strike a balance between A and B の意味は？\n\nAとBのバランスを取るAとBを激しくたたくAとBの取引を拒否する\n\nQ3. 『労働者たちはストライキに入りました』として自然なのは？\n\nThe workers went on strike.The workers went in strike.The workers made on strike.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を確認しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| strike | 打つ・襲う・強い印象を与える |\n| struck | strike の過去形・過去分詞 |\n| It struck me that ～ | ～だと突然気づいた |\n| strike someone as ～ | 人に～という印象を与える |\n| be struck by ～ | ～に強い印象を受ける |\n| go on strike | ストライキに入る |\n| be on strike | ストライキ中である |\n| strike a deal | 取引を成立させる |\n| strike a balance | バランスを取る |\n| strike down | 無効と判断する・打ち倒す |\n| strike out | 削除する・三振する |\n| striking | 印象的な・著しい |\n\n一文記憶\n\nIt suddenly struck me that we needed to strike a balance between speed and accuracy.\n\nスピードと正確性のバランスを取る必要があると、突然気づきました。\n\n「先輩、今日の一文には2つの strike が入っています。」\n\n「最初の struck me は『突然気づいた』。」\n\n「次の strike a balance は『バランスを取る』。」\n\n「strike = 強い衝撃や影響が加わるという基本イメージを持ちながら、よく使う表現はそのまま覚えてくださいね。」\n\n「特に It struck me that ～ は、英語の会話や文章で出てきたときに、物理的な『打つ』と勘違いしないようにしましょう。」\n\n次は 第70語｜Owe です。"}, {"name": "Owe", "text": "# 第70語｜Owe\n\n発音：/oʊ/（オウ）｜動詞\n\n「先輩、今日の単語は owe です。」\n\n「この単語、意味は『借りている』『恩義がある』『～のおかげである』なんですが……実は、全部一つのイメージでつながっているんです。」\n\nI owe you $100.\n\n私はあなたに100ドル借りています。\n\nI owe you an apology.\n\n私はあなたに謝らなければなりません。\n\nI owe my success to my parents.\n\n私が成功できたのは両親のおかげです。\n\n「先輩、どうして『お金を借りている』という単語が、『謝る必要がある』『成功は両親のおかげ』という意味になるのでしょう？」\n\n「それは、owe の中心が、単に借金をすることではないからです。」\n\nOwe の核イメージは『相手に返すべきものがある・相手のおかげで今の状態がある』です。\n\n「お金を返す義務も、謝罪する必要も、誰かへの恩義も、相手に対して何かを負っているという点でつながるんです。」\n\n「先輩、今日は borrow、lend、debt、be indebted to、be grateful to、attribute、credit との違いまで理解していきましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは4つの使い方を覚えましょう。」\n\n① お金を借りている・支払う義務がある\n\nI owe him 5,000 yen.\n\n私は彼に5,000円借りています。\n\n「相手にまだ返していないお金がある状態ですね。」\n\n② 謝罪・説明・感謝などをする義務がある\n\nI owe you an apology.\n\nあなたに謝らなければなりません。\n\n「先輩、お金だけではありません。相手に対して、謝罪という『まだ果たしていないこと』があるんです。」\n\n③ 恩義がある\n\nI owe you a lot.\n\nあなたにはとてもお世話になっています。\n\n「これは金銭的な借金とは限りません。相手から受けた助けや恩恵を強く感じている表現です。」\n\n④ ～のおかげである\n\nI owe my success to my family.\n\n私の成功は家族のおかげです。\n\n「自分の成功の一部、あるいは全部を、家族の支えによるものだと考えているんですね。」\n\n核イメージ：相手に対して、まだ返していないもの・認めるべき恩義がある\n\n「先輩、これを覚えれば、owe の意味が自然につながりますよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが重要です。」\n\n「owe は『借りている』という意味ですが、borrow や lend と混同しやすいんです。」\n\n「さらに、『恩義がある』『～のおかげである』という意味では、感謝や原因を表す単語とも関係します。」\n\n### ① お金・物の貸し借りに関する単語\n\nowe\n\nオウ\n\n核イメージ：返すべきお金・義務が残っている\n\nI owe Tom $100.\n\n私はトムに100ドル借りています。\n\n「先輩、owe は『借りた瞬間』ではなく、まだ返していない状態に注目します。」\n\nborrow\n\nボロウ\n\n核イメージ：相手から一時的に借りる\n\nI borrowed $100 from Tom.\n\n私はトムから100ドル借りました。\n\n「borrow は、借り手が何かを受け取る動作に注目します。」\n\nCan I borrow your pen?\n\nペンを借りてもいいですか？\n\n「先輩、borrow は借りる行為、owe は返す義務が残っている状態です。」\n\n「借りたお金を返した後なら、I borrowed money とは言えても、I owe money とは言えませんね。」\n\nlend\n\nレンド\n\n核イメージ：相手に一時的に貸す\n\nTom lent me $100.\n\nトムは私に100ドル貸してくれました。\n\n「lend は、貸し手から見た動作です。」\n\nCould you lend me your umbrella?\n\n傘を貸してもらえますか？\n\n「先輩、同じ出来事でも視点が変わります。」\n\nI borrowed $100 from Tom.\n\n私はトムから100ドル借りました。\n\nTom lent me $100.\n\nトムは私に100ドル貸しました。\n\nI owe Tom $100.\n\n私はトムに100ドル返す義務があります。\n\n「borrow は借りる側、lend は貸す側、owe は返す義務。この3つを必ず区別しましょう。」\n\ndebt\n\nデット\n\n核イメージ：返済すべき借金・負債そのもの\n\nHe has a large amount of debt.\n\n彼には多額の借金があります。\n\n「debt は名詞です。owe は動詞ですね。」\n\nThe company is trying to reduce its debt.\n\nその会社は負債を減らそうとしています。\n\n「先輩、owe money は『お金を返す義務がある』、have debt は『借金を抱えている』という違いです。」\n\n「なお、debt の b は発音しません。/det/ です。」\n\nbe indebted to\n\nインデティド\n\n核イメージ：借りや恩義を負っている\n\nI am deeply indebted to my mentor.\n\n私は恩師に深く恩義を感じています。\n\n「indebted は、金銭的な負債にも、精神的な恩義にも使えます。」\n\nThe company is heavily indebted to banks.\n\nその会社は銀行に多額の借金を抱えています。\n\n「先輩、owe は日常的に使える動詞、be indebted to はややフォーマルで、強い負債や恩義を表す表現です。」\n\n### ② 恩義・感謝・原因に関する単語\n\nbe grateful to\n\nグレイトフル\n\n核イメージ：相手への感謝の気持ちを持っている\n\nI am grateful to my parents for their support.\n\n私は両親の支えに感謝しています。\n\n「grateful は感謝という感情に注目します。」\n\nI owe a lot to my parents.\n\n私は両親に大きな恩があります。\n\n「先輩、owe は『相手から受けた恩義』、be grateful to は『相手への感謝の気持ち』が中心です。」\n\n「両方使える場面もありますが、意味の重点が違います。」\n\nattribute\n\nアトリビュート\n\n核イメージ：結果の原因を何かに求める\n\nShe attributes her success to hard work.\n\n彼女は自分の成功を努力によるものだと考えています。\n\n「attribute A to B は『AをBに起因すると考える』です。」\n\nShe owes her success to hard work.\n\n彼女の成功は努力のおかげです。\n\n「先輩、owe A to B は恩恵や貢献を認める響きがあり、attribute A to B は結果の原因を説明する、より分析的な表現です。」\n\n「attribute は良い結果だけでなく、問題の原因にも使えます。」\n\nThe delay was attributed to bad weather.\n\n遅延は悪天候によるものとされました。\n\ncredit\n\nクレディット\n\n核イメージ：成果の功績を誰かに認める\n\nShe credits her team for the success.\n\n彼女はその成功をチームの功績だと認めています。\n\n「credit someone for something は『何かの功績を人に認める』です。」\n\nHe credits his success to his teachers.\n\n彼は自分の成功を教師たちのおかげだと考えています。\n\n「先輩、owe A to B は『AはBのおかげ』、credit A to B は『Aの功績をBに帰する』という違いです。」\n\n「credit は功績の評価に注目するんですね。」\n\nbe due to\n\nデュー トゥ\n\n核イメージ：ある結果が特定の原因による\n\nThe delay was due to heavy rain.\n\n遅延は大雨が原因でした。\n\n「be due to は、原因を説明する表現です。」\n\nThe improvement was due to better management.\n\n改善は経営管理の向上によるものでした。\n\n「先輩、owe A to B は恩恵や貢献を認める意味でよく使われますが、be due to は良いことにも悪いことにも使える中立的な原因表現です。」\n\n## 同じ場面で比較してみましょう\n\n「先輩、友人からお金を借りた場面と、誰かのおかげで成功した場面を比べます。」\n\n| 単語・表現 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| owe | I owe him $100. | 返済義務が残っている |\n| borrow | I borrowed $100 from him. | 借りる行為 |\n| lend | He lent me $100. | 貸す行為 |\n| debt | I have debt. | 借金という負債 |\n| be indebted to | I am indebted to him. | 借り・恩義を負っている |\n| be grateful to | I am grateful to him. | 感謝している |\n| attribute | I attribute my success to him. | 成功の原因を彼に求める |\n| credit | I credit him for my success. | 成功の功績を彼に認める |\n| be due to | The success was due to his help. | 成功の原因が彼の助けにある |\n\n「先輩、特に owe・borrow・lend は、語順も含めて確実に区別してください。」\n\n## 理解確認｜3問\n\nQ1. 『私はトムに100ドル借りています』として自然なのは？\n\nI owe Tom $100.I lend Tom $100.I borrow Tom $100.\n\nQ2. 『私の成功は両親のおかげです』として自然なのは？\n\nI owe my success to my parents.I owe my parents to my success.I owe to my success my parents.\n\nQ3. 『あなたに謝らなければなりません』として自然なのは？\n\nI owe you an apology.I borrow you an apology.I owe an apology you.\n\n## 30秒復習\n\n「先輩、最後に重要表現を確認しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| owe | 借りている・義務がある・恩義がある |\n| owe someone money | 人にお金を借りている |\n| owe someone an apology | 人に謝る義務がある |\n| owe someone an explanation | 人に説明する責任がある |\n| owe someone a favor | 人に借りがある |\n| I owe you one. | 今度お返しするよ |\n| owe A to B | AはBのおかげである |\n| owe it to yourself to do ～ | 自分自身のためにも～するべきだ |\n| owing to ～ | ～のために |\n| borrow | 借りる |\n| lend | 貸す |\n| debt | 借金・負債 |\n| be indebted to | 恩義・負債を負っている |\n| be grateful to | 感謝している |\n| attribute A to B | AをBに起因すると考える |\n| credit A to B | Aの功績をBに帰する |\n\n一文記憶\n\nI owe my success to the people who supported me when I was struggling.\n\n私が成功できたのは、苦しいときに支えてくれた人たちのおかげです。\n\n「先輩、今日のポイントは owe = 相手に返すべきものがある・恩義を負っている という感覚です。」\n\n「お金なら返済義務、失礼なことをしたなら謝罪、助けてもらったなら恩義。」\n\n「すべて、相手に対して何かを負っているという点でつながっています。」\n\n「そして、borrow は借りる、lend は貸す、owe は借りが残っている。」\n\n「先輩、この3つは会話でも頻繁に使いますから、しっかり覚えてくださいね。」\n\n次は 第71語｜Would rather です。"}, {"name": "Would rather", "text": "# 第71語｜Would rather\n\n発音：/wʊd ˈræðər/（ウッド・ラザー）｜助動詞を含む表現\n\n意味：むしろ～したい／どちらかといえば～の方がいい\n\n「先輩、今日の would rather は、英会話で自分の希望を伝えるときに、とても役立つ表現です。」\n\n「ただし、単純に『～したい』と覚えるだけでは不十分ですよ。want to と何が違うのか、しっかり理解してもらいますからね。」\n\nI'd rather stay home tonight.\n\n今夜はどちらかといえば家にいたいです。\n\nI'd rather walk than take a taxi.\n\nタクシーに乗るより歩きたいです。\n\n「先輩、ここで注目してほしいのは、何かと比べて、こちらの方がいいと感じていることです。」\n\n「つまり、would rather の核イメージは……」\n\nいくつかの選択肢を頭の中で比べて、自分はこちらを選びたいと思うこと。\n\n「それでは、4つの方向から理解していきましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの基本パターンを覚えてください。」\n\n① would rather + 動詞の原形\n\nI'd rather wait.\n\nどちらかといえば待ちたいです。\n\n「ここでの I'd は I would の短縮形ですよ。」\n\n② would rather A than B\n\nI'd rather read than watch TV.\n\nテレビを見るより読書をしたいです。\n\n「AとBを比較して、Aを選びたいという意味です。」\n\n③ would rather + 人 + 過去形\n\nI'd rather you stayed here.\n\nあなたにはここにいてほしいです。\n\n「先輩、これは少し難しいですね。自分ではなく、ほかの人にどうしてほしいかを伝える表現です。」\n\n「しかも、現在や未来の希望なのに stayed という過去形を使うんです。」\n\n今日の最重要ポイント\n\n| 表現 | 意味 |\n| --- | --- |\n| I'd rather go. | 私はむしろ行きたい |\n| I'd rather not go. | 私はできれば行きたくない |\n| I'd rather go than stay. | 残るより行きたい |\n| I'd rather you went. | あなたには行ってほしい |\n\n「先輩、まずは I'd rather + 動詞の原形 を口から自然に出せるようにしましょう。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現との違いを理解しましょう。」\n\n「全部『～したい』と訳してしまうと、英語の微妙な気持ちの違いが見えなくなってしまいますからね。」\n\nwould rather\n\nウッド・ラザー\n\n核イメージ：選択肢を比較して、こちらの方がいい\n\nI'd rather stay home.\n\nどちらかといえば家にいたいです。\n\n「先輩、選択や比較の感覚が中心です。」\n\nwant to\n\nウォント・トゥ\n\n核イメージ：自分の欲求・願望を直接表す\n\nI want to travel abroad.\n\n海外旅行に行きたいです。\n\n「want to は、単純に何かをしたいという気持ちを表します。」\n\nI want to eat sushi.\n\n寿司を食べたいです。\n\n「先輩、would rather は比較して選びたい、want to はしたいという欲求そのものです。」\n\n「普段の会話では want to が非常に幅広く使えます。」\n\nprefer\n\nプリファー\n\n核イメージ：複数のものの中で、あるものをより好む\n\nI prefer tea to coffee.\n\n私はコーヒーより紅茶が好きです。\n\n「prefer は、一般的な好みを表すときによく使います。」\n\nI'd prefer to leave early.\n\nできれば早めに出発したいです。\n\n「先輩、prefer は一般的な好みにも、その場の希望にも使えます。」\n\n「would rather は、会話で『今はこちらがいい』と伝えるときに特に自然ですね。」\n\n文法の違い\n\nI'd rather go.\n\nI'd prefer to go.\n\n「rather の後ろは原形、prefer の後ろは to不定詞 を使えます。」\n\nwould like to\n\nウッド・ライク・トゥ\n\n核イメージ：丁寧に希望を伝える\n\nI'd like to ask a question.\n\n質問をしたいのですが。\n\n「would like to は、丁寧に自分の希望を表す表現です。」\n\nI'd like to make a reservation.\n\n予約をしたいのですが。\n\n「先輩、would rather は選択の好み、would like to は丁寧な希望です。」\n\n「レストランや仕事で希望を伝えるときは、would like to が便利ですね。」\n\nwould sooner\n\nウッド・スーナー\n\n核イメージ：むしろこちらを選びたい\n\nI'd sooner walk than wait for the bus.\n\nバスを待つくらいなら歩きたいです。\n\n「would sooner は would rather に近い意味です。」\n\n「先輩、ただし、日常会話では would rather の方が一般的です。」\n\n「would sooner は地域や文脈によって使われ方が異なります。」\n\nfeel like\n\nフィール・ライク\n\n核イメージ：今、そうしたい気分である\n\nI feel like going for a walk.\n\n散歩に行きたい気分です。\n\n「feel like は、気分や感覚に重点があります。」\n\nI don't feel like cooking tonight.\n\n今夜は料理をする気分ではありません。\n\n「先輩、would rather は選択の好み、feel like はそのときの気分です。」\n\n文法の違い\n\nI'd rather walk.\n\nI feel like walking.\n\n「rather の後ろは原形、feel like の後ろは動名詞ですね。」\n\nchoose to\n\nチューズ・トゥ\n\n核イメージ：複数の可能性から、意識的に選択する\n\nI chose to study instead of watching TV.\n\nテレビを見る代わりに勉強することを選びました。\n\n「choose to は、実際に選択する行為に重点があります。」\n\n「先輩、would rather は『こちらがいい』という希望、choose to は『こちらを選ぶ』という決定です。」\n\n「希望と実際の選択は、必ずしも同じではありませんよね。」\n\nbe willing to\n\nウィリング・トゥ\n\n核イメージ：必要なら、喜んで・進んで行う意思がある\n\nI'm willing to help you.\n\nあなたを手伝うつもりがあります。\n\n「be willing to は、何かをする意思があることを表します。」\n\nI'm willing to work overtime if necessary.\n\n必要なら残業するつもりがあります。\n\n「先輩、would rather は好み、be willing to は行う意思です。」\n\n「やりたいことと、必要ならやるつもりのことは違いますよね。」\n\n## 同じ場面で比較しましょう\n\n「先輩、仕事が終わった後の予定を例にします。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| would rather | I'd rather go home. | ほかの選択肢より帰宅したい |\n| want to | I want to go home. | 帰りたい |\n| prefer | I prefer going home early. | 早く帰る方を好む |\n| would like to | I'd like to go home. | 丁寧に帰宅の希望を伝える |\n| would sooner | I'd sooner go home. | むしろ帰宅を選びたい |\n| feel like | I feel like going home. | 帰りたい気分 |\n| choose to | I choose to go home. | 帰宅することを選ぶ |\n| be willing to | I'm willing to stay. | 必要なら残る意思がある |\n\n「先輩、全部似ていますが、希望・好み・気分・決定・意思という違いがあるんです。」\n\n## 理解確認｜3問\n\nQ1. 『私はむしろ家にいたいです』として正しいのは？\n\nI'd rather stay home.I'd rather to stay home.I'd rather staying home.\n\nQ2. 『あなたには本当のことを話してほしい』として自然なのは？\n\nI'd rather you told me the truth.I'd rather you tell me the truth.I'd rather you to tell me the truth.\n\nQ3. would rather と feel like の違いは？\n\nwould rather は選択の好み、feel like はそのときの気分would rather は過去の出来事にしか使えないfeel like は必ず比較を表す\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理します。」\n\n| 表現 | 意味 |\n| --- | --- |\n| would rather + 原形 | むしろ～したい |\n| would rather not + 原形 | できれば～したくない |\n| would rather A than B | BよりAしたい |\n| Would you rather A or B? | AとBならどちらがいい？ |\n| would rather + 人 + 過去形 | 人に～してほしい |\n| would rather have + 過去分詞 | ～した方がよかった |\n| want to | ～したい |\n| prefer | ～の方を好む |\n| would like to | ～したい（丁寧） |\n| feel like + -ing | ～したい気分 |\n| choose to | ～することを選ぶ |\n| be willing to | ～する意思がある |\n\n一文記憶\n\nI'd rather take my time and do it properly than rush and make mistakes.\n\n急いでミスをするくらいなら、時間をかけてきちんとやりたいです。\n\n「先輩、今日のポイントは would rather = 比較したうえで、こちらを選びたい という感覚です。」\n\n「そして、文法は必ず押さえてください。」\n\n「I'd rather go. は正しいですが、I'd rather to go. は間違いです。」\n\n「さらに、ほかの人への希望なら I'd rather you went. という形になるんです。」\n\n「この3つを覚えれば、英会話で自分の希望をかなり自然に伝えられるようになりますよ。」\n\n次は 第72語｜Resign です。"}, {"name": "Resign", "text": "# 第72語｜Resign\n\n発音：/rɪˈzaɪn/（リザイン）｜動詞\n\n意味：辞職する・辞任する・（望ましくない状況を）受け入れる\n\n「先輩、今日の単語は resign です。」\n\n「ニュースで政治家が辞任したり、会社の経営者が退任したりするときによく登場します。」\n\nThe CEO resigned yesterday.\n\nそのCEOは昨日辞任しました。\n\nShe resigned from her position.\n\n彼女は役職を辞任しました。\n\n「ここまでは分かりやすいですね。でも、次の英文はどうでしょう？」\n\nHe resigned himself to the situation.\n\n彼はその状況を仕方なく受け入れました。\n\n「先輩、辞職していませんよね？」\n\n「実は resign には、自分が持っていた地位や、状況を変えようとする抵抗を手放すという共通した感覚があるんです。」\n\n「ただし、『辞職する』と『仕方なく受け入れる』では文法が違います。そこを混同しないように、一緒に確認しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの使い方を押さえてください。」\n\n① 辞職する・辞任する\n\nHe decided to resign.\n\n彼は辞職することを決めました。\n\n「自分の意思で職務や役職から退くことですね。」\n\n② 役職・地位を辞する\n\nShe resigned as president.\n\n彼女は社長を辞任しました。\n\n「resign as ～ で『～の役職を辞任する』です。」\n\n③ 仕方なく受け入れる\n\nHe resigned himself to defeat.\n\n彼は敗北を仕方なく受け入れました。\n\n「先輩、こちらは resign ones
