elf to ～ という形で使います。」\n\n核イメージ\n\n「自分が持っていた立場や、何かに抵抗する姿勢を手放す。」\n\n「辞任では役職を手放し、resign oneself to ～ では状況を変えようとする抵抗を手放す、と考えてください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語を比較しましょう。」\n\n「『辞める』と訳せる単語でも、自分の意思で辞めるのか、退職するのか、解雇されるのかによって違います。」\n\nresign\n\nリザイン\n\n核イメージ：正式に職務・役職を辞する\n\nThe director resigned from his position.\n\nその取締役は役職を辞任しました。\n\n「先輩、役職や職務を自ら退く、ややフォーマルな表現です。」\n\nquit\n\nクウィット\n\n核イメージ：続けていたことをやめる\n\nI quit my job.\n\n私は仕事を辞めました。\n\n「quit は、仕事だけでなく習慣や活動をやめる場合にも使えます。」\n\nHe quit smoking.\n\n彼は喫煙をやめました。\n\n「先輩、resign は正式な辞職、quit はもっと幅広く『やめる』という意味です。」\n\n「日常会話なら quit my job が自然なことも多いですね。」\n\nretire\n\nリタイア\n\n核イメージ：仕事や職業生活から引退する\n\nMy father retired last year.\n\n私の父は昨年退職しました。\n\n「retire は、年齢や人生の段階に応じて仕事から引退する場合によく使います。」\n\nShe retired from professional tennis.\n\n彼女はプロテニスから引退しました。\n\n「先輩、resign は役職や仕事を辞めること、retire は職業生活や活動から引退することです。」\n\n「ただし、役職からの退任を retire と表現する場合もあります。」\n\nstep down\n\nステップ・ダウン\n\n核イメージ：高い地位・役職から退く\n\nThe CEO stepped down after ten years.\n\nそのCEOは10年務めた後、退任しました。\n\n「step down は、経営者・政治家などが役職を退く場面でよく使います。」\n\nThe minister stepped down following criticism.\n\nその大臣は批判を受けて辞任しました。\n\n「先輩、resign と step down は非常に近いですが、step down は高い地位から退くというイメージが特に強いです。」\n\n「ニュースではどちらもよく登場しますよ。」\n\nleave\n\nリーヴ\n\n核イメージ：ある場所・組織から離れる\n\nShe left the company last month.\n\n彼女は先月その会社を辞めました。\n\n「leave は、退職理由を特定しない中立的な表現です。」\n\nHe left his job to start a business.\n\n彼は起業するために仕事を辞めました。\n\n「先輩、resign は自ら辞職すること、leave は会社を離れること自体を表します。」\n\n「leave だけでは、自主退職かどうかは必ずしも分かりません。」\n\nbe fired\n\nファイアード\n\n核イメージ：雇用主から解雇される\n\nHe was fired for violating company rules.\n\n彼は会社の規則に違反したため解雇されました。\n\n「先輩、これは resign と明確に違います。」\n\n「resign は本人が辞める、be fired は雇用主によって解雇されるという違いです。」\n\n「ただし、辞任が外部からの圧力によって事実上強いられることもあるため、現実の事情は別に確認する必要があります。」\n\nbe laid off\n\nレイド・オフ\n\n核イメージ：人員削減など会社側の事情で職を失う\n\nHundreds of workers were laid off.\n\n数百人の労働者が人員削減によって職を失いました。\n\n「be laid off は、経営上の理由などによる人員削減でよく使います。」\n\n「先輩、be fired は個人の行動や業績などを理由とする解雇に使われることが多く、be laid off は会社側の事情による雇用削減に重点があります。」\n\n「ただし、実際の雇用制度や用語の使われ方は国や地域によって異なります。」\n\n## 「仕方なく受け入れる」の類義語\n\n「先輩、resign oneself to ～ に似た表現も整理しておきましょう。」\n\naccept\n\nアクセプト\n\n核イメージ：事実・提案・状況を受け入れる\n\nShe accepted the decision.\n\n彼女はその決定を受け入れました。\n\n「accept は、必ずしも不本意とは限りません。」\n\n「resign oneself to は、仕方なく受け入れるという諦めの感覚が強いんです。」\n\ngive up\n\nギヴ・アップ\n\n核イメージ：努力・挑戦・希望などを諦める\n\nHe gave up trying to change her mind.\n\n彼は彼女の考えを変えようとするのを諦めました。\n\n「give up は、何かを続けることをやめる動作に重点があります。」\n\n「先輩、resign oneself to は、望ましくない現実を受け入れることに重点があります。」\n\ncome to terms with\n\nカム・トゥ・タームズ・ウィズ\n\n核イメージ：つらい現実を時間をかけて受け止める\n\nShe gradually came to terms with the loss.\n\n彼女は徐々にその喪失を受け止められるようになりました。\n\n「come to terms with は、感情的に難しい現実を受け止める過程を表すことが多いです。」\n\n「先輩、resign oneself to は諦め、come to terms with は現実を受け止めて折り合いをつける感覚ですね。」\n\n## 同じ場面で比較しましょう\n\n「先輩、会社の経営者が役職を離れる場面を考えてください。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| resign | The CEO resigned. | CEOが辞任した |\n| quit | The CEO quit his job. | 仕事を辞めた |\n| retire | The CEO retired. | 引退・退職した |\n| step down | The CEO stepped down. | CEOの地位から退いた |\n| leave | The CEO left the company. | 会社を離れた |\n| be fired | The CEO was fired. | 解雇された |\n| be laid off | The employee was laid off. | 会社側の事情で職を失った |\n\n「先輩、ニュースでは resign・step down・be fired を区別することが大切です。」\n\n「特に resign と be fired は、辞める側と辞めさせる側が違いますからね。」\n\n## 理解確認｜3問\n\nQ1. 『彼女はCEOを辞任しました』として自然なのは？\n\nShe resigned as CEO.She resigned to CEO.She resigned for CEO.\n\nQ2. resign と be fired の違いは？\n\nresign は自ら辞める、be fired は解雇されるresign は必ず定年退職するbe fired は必ず昇進する\n\nQ3. 『彼は敗北を仕方なく受け入れました』として自然なのは？\n\nHe resigned himself to defeat.He resigned himself for defeat.He resigned to defeat himself.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| resign | 辞職する・辞任する |\n| resign from ～ | ～を辞職する |\n| resign as ～ | ～の役職を辞任する |\n| resign over ～ | ～を理由に辞任する |\n| resign in protest | 抗議して辞任する |\n| resign oneself to ～ | ～を仕方なく受け入れる |\n| be resigned to ～ | ～を仕方なく受け入れている |\n| resignation | 辞職・辞任・諦め |\n| quit | やめる |\n| retire | 引退・退職する |\n| step down | 役職から退く |\n| leave | 離れる・辞める |\n| be fired | 解雇される |\n| be laid off | 人員削減で職を失う |\n| accept | 受け入れる |\n| give up | 諦める |\n| come to terms with | 現実を受け止める |\n\n一文記憶\n\nThe CEO resigned from his position after the scandal, but he refused to resign himself to defeat.\n\nそのCEOは不祥事の後に役職を辞任しましたが、敗北を仕方なく受け入れることは拒みました。\n\n「先輩、この一文には resign の2つの意味が入っています。」\n\n「最初の resigned from his position は『役職を辞任した』。」\n\n「次の resign himself to defeat は『敗北を仕方なく受け入れる』。」\n\n「resign は役職を手放す、resign oneself to は抵抗を手放して受け入れる。この違いを覚えてくださいね。」\n\n次は 第73語｜Weigh in です。"}, {"name": "Weigh in", "text": "# 第73語｜Weigh in\n\n発音：/weɪ ɪn/（ウェイ・イン）｜句動詞\n\n意味：議論に加わって意見を述べる／計量する・体重を量る\n\n「先輩、今日の weigh in は、ニュースや会議、英語のポッドキャストでよく出てくる表現です。」\n\n「まず、次の英文を読んでみてください。」\n\nThe CEO weighed in on the debate.\n\nそのCEOは議論に加わり、意見を述べました。\n\n「先輩、weigh は『重さを量る』ですよね。なのに、どうして『意見を述べる』という意味になるのでしょう？」\n\n「実は weigh in には、もともと計量に関係する意味があり、そこから議論に参加して自分の意見を示すという意味でも使われるようになったんです。」\n\n「ただし、単に say と同じだと思ってはいけません。」\n\nWeigh in の核イメージは『議論の場に自分の意見を持ち込み、発言する』ことです。\n\n「特に、すでに話題になっている問題について、誰かが意見を表明するときによく使います。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの使い方を覚えましょう。」\n\n① 議論に加わって意見を述べる\n\nSeveral experts weighed in on the issue.\n\n複数の専門家がその問題について意見を述べました。\n\n「これがニュースやビジネスで重要な使い方です。」\n\n② 自分の考えを述べるよう求める\n\nWould you like to weigh in?\n\nあなたも意見を述べませんか？\n\n「会議などで、まだ発言していない人に意見を求めるときにも使えます。」\n\n③ 体重を量る・計量する\n\nThe boxer weighed in at 70 kilograms.\n\nそのボクサーは計量で70キログラムでした。\n\n「格闘技などの公式計量で使われます。」\n\n核イメージ\n\n「自分の意見を議論に持ち込む／計量の場で重さを示す。」\n\n「先輩、現代の英語では、特に weigh in on ～ = ～について意見を述べる を優先して覚えてくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現との違いです。」\n\n「weigh in を単純に『意見を言う』と覚えるだけでは、comment や contribute との違いが分かりませんからね。」\n\nweigh in\n\nウェイ・イン\n\n核イメージ：進行中の議論に自分の意見を持ち込む\n\nThe expert weighed in on the debate.\n\nその専門家は議論について意見を述べました。\n\n「先輩、議論への参加・意見表明が中心です。」\n\ncomment\n\nコメント\n\n核イメージ：ある話題について発言・論評する\n\nThe minister commented on the new policy.\n\n大臣は新しい政策についてコメントしました。\n\n「comment は、ある事柄について発言することです。」\n\nShe refused to comment on the incident.\n\n彼女はその事件についてコメントを拒否しました。\n\n「先輩、weigh in は議論に意見を加える感覚、comment は発言や論評そのものに重点があります。」\n\ncontribute\n\nコントリビュート\n\n核イメージ：議論や活動に役立つものを提供する\n\nShe contributed several useful ideas to the discussion.\n\n彼女は議論にいくつかの有益なアイデアを提供しました。\n\n「contribute は、意見や知識を提供して議論に貢献することです。」\n\nEveryone contributed to the project.\n\n全員がそのプロジェクトに貢献しました。\n\n「先輩、weigh in は意見表明、contribute は何かを提供して貢献することに重点があります。」\n\n「ただし、contribute to a discussion は、発言して議論に参加する意味でも使えます。」\n\nchime in\n\nチャイム・イン\n\n核イメージ：会話の途中に加わって発言する\n\nShe chimed in with a funny story.\n\n彼女は面白い話をして会話に加わりました。\n\n「chime in は、会話の途中で発言することです。」\n\nCan I chime in for a second?\n\nちょっと発言してもいいですか？\n\n「先輩、weigh in は議論について意見を述べる、chime in は会話に加わって一言発する、という違いがあります。」\n\n「chime in の方が会話的で、軽い雰囲気にも使いやすいですね。」\n\nspeak up\n\nスピーク・アップ\n\n核イメージ：ためらわず声を上げる・はっきり発言する\n\nShe spoke up against the unfair decision.\n\n彼女は不公平な決定に反対して声を上げました。\n\n「speak up は、黙っていないで発言することです。」\n\nDon't be afraid to speak up.\n\n遠慮せずに発言してください。\n\n「先輩、weigh in は議論に意見を加えること、speak up は声を上げる行動そのものに重点があります。」\n\n「なお、speak up には『もっと大きな声で話す』という意味もあります。」\n\nintervene\n\nインターヴィーン\n\n核イメージ：進行中の出来事に介入する\n\nThe manager intervened in the dispute.\n\nマネージャーはその争いに介入しました。\n\n「intervene は、争いや問題などに介入して状況に関わることです。」\n\nThe government intervened to stabilize the market.\n\n政府は市場を安定させるために介入しました。\n\n「先輩、weigh in は意見を述べること、intervene は状況に介入することです。」\n\n「発言するだけなのか、実際に問題へ介入するのかが違いますね。」\n\nvoice\n\nヴォイス\n\n核イメージ：考え・懸念・意見を言葉にして表明する\n\nEmployees voiced concerns about the new system.\n\n従業員たちは新しいシステムについて懸念を表明しました。\n\n「voice は動詞としても使えます。」\n\nShe voiced her opposition to the plan.\n\n彼女はその計画への反対を表明しました。\n\n「先輩、weigh in は議論への参加、voice は自分の考えや懸念を表に出すことに重点があります。」\n\nexpress\n\nイクスプレス\n\n核イメージ：考え・感情・意見を外に表す\n\nHe expressed his opinion clearly.\n\n彼は自分の意見を明確に表現しました。\n\n「express は、考えや感情を表現することです。」\n\nShe expressed concern about the delay.\n\n彼女は遅延について懸念を表明しました。\n\n「先輩、weigh in は議論に参加すること、express は自分の内側にある考えや感情を表現することです。」\n\n## 使い分け早見表\n\n| 表現 | 核イメージ | よく使う場面 |\n| --- | --- | --- |\n| weigh in | 議論に意見を加える | ニュース・会議・論争 |\n| comment | コメントする | 報道・発言 |\n| contribute | 役立つものを提供する | 会議・共同作業 |\n| chime in | 会話に途中参加する | 日常会話 |\n| speak up | 声を上げる | 会議・問題提起 |\n| intervene | 介入する | 争い・問題 |\n| voice | 意見・懸念を表明する | 職場・ニュース |\n| express | 考え・感情を表現する | 幅広い場面 |\n\n「先輩、特に weigh in と chime in は似ています。」\n\n「ただし、weigh in は議論への意見表明、chime in は会話の途中に加わることに重点があります。」\n\n## 理解確認｜3問\n\nQ1. 『専門家たちはその問題について意見を述べました』として自然なのは？\n\nExperts weighed in on the issue.Experts weighed in to the issue.Experts weighed on in the issue.\n\nQ2. weigh in と chime in の違いは？\n\nweigh in は議論への意見表明、chime in は会話への途中参加weigh in は必ず体重を量るchime in は必ず反対意見を述べる\n\nQ3. 『そのボクサーは計量で70kgでした』として自然なのは？\n\nThe boxer weighed in at 70 kilograms.The boxer weighed in on 70 kilograms.The boxer weighed in with 70 kilograms.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理します。」\n\n| 表現 | 意味 |\n| --- | --- |\n| weigh in | 議論に加わって意見を述べる・計量する |\n| weigh in on ～ | ～について意見を述べる |\n| weigh in with ～ | ～という意見・提案を持って議論に加わる |\n| weigh in at ～ | 計量で～の重さを示す |\n| weigh-in | 公式計量 |\n| comment | コメントする |\n| contribute | 貢献する・意見を提供する |\n| chime in | 会話の途中に加わる |\n| speak up | 声を上げる |\n| intervene | 介入する |\n| voice | 意見・懸念を表明する |\n| express | 考え・感情を表現する |\n\n一文記憶\n\nThe manager asked me to weigh in on the proposal, so I shared my concerns and suggestions.\n\nマネージャーからその提案について意見を求められたので、私は懸念点と提案を伝えました。\n\n「先輩、今日のポイントは weigh in = 議論に自分の意見を持ち込む です。」\n\n「ただ話すのではなく、ある問題について自分の考えを示すことに重点があります。」\n\n「そして、前置詞にも注意してくださいね。」\n\n「weigh in on ～ は『～について意見を述べる』。」\n\n「weigh in with ～ は『～という意見や提案を持って議論に加わる』。」\n\n「この違いを覚えれば、ニュースや会議の英語がさらに理解しやすくなりますよ。」\n\n次は 第74語｜Feel free to です。"}, {"name": "Feel free to", "text": "# 第74語｜Feel free to\n\n発音：/fiːl friː tə/（フィール・フリー・トゥ）｜慣用表現\n\n意味：遠慮なく～してください／気軽に～してください／自由に～して構いません\n\n「先輩、今日の feel free to は、英会話でもビジネスメールでも、とても使いやすい表現です。」\n\n「まずは、こちらの英文を見てください。」\n\nFeel free to ask me any questions.\n\n遠慮なく何でも質問してください。\n\nFeel free to contact me anytime.\n\nいつでもお気軽にご連絡ください。\n\n「先輩、ここで気になることはありませんか？」\n\n「feel は『感じる』、free は『自由な』ですよね。それなのに、どうして『遠慮なく～してください』になるのでしょう？」\n\n「実は、これにはきちんとしたイメージがあるんです。」\n\nFeel free to の核イメージは『気兼ねや心理的な制約を感じず、自由に行動してよい』です。\n\n「相手が『こんなことを聞いたら迷惑かな』『勝手に使ってもいいのかな』とためらっているとき、その心理的な壁を取り除く表現なんです。」\n\n「ただし、先輩。feel free to は必ずしも『何でも無条件に許可する』という意味ではありません。文脈によって、親切な申し出にも、単なる許可にも、少し突き放した言い方にもなるんですよ。」\n\n「今日はそのニュアンスまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの代表的な使い方を押さえてください。」\n\n① 遠慮なく～してください\n\nFeel free to ask questions.\n\n遠慮なく質問してください。\n\n「相手が質問することをためらわなくてよい、と伝えています。」\n\n② 気軽に～してください\n\nFeel free to reach out.\n\nお気軽にご連絡ください。\n\n「先輩、ビジネスメールの結びでもよく使います。」\n\n③ 自由に～して構いません\n\nFeel free to use this room.\n\nこの部屋は自由に使って構いません。\n\n「これは行動の許可に近い意味ですね。」\n\n基本構文\n\n## Feel free to + 動詞の原形\n\n遠慮なく・気軽に～してください\n\n「先輩、to の後ろは動詞の原形です。」\n\nFeel free to call me.\n\n気軽に電話してください。\n\nFeel free to join us.\n\n遠慮なく私たちに加わってください。\n\n核イメージ：心理的な遠慮を取り除き、自由に行動してよいと伝える\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現との違いです。」\n\n「どれも『遠慮なく』『自由に』と訳せることがありますが、実際には少しずつ重点が違います。」\n\nfeel free to\n\nフィール・フリー・トゥ\n\n核イメージ：気兼ねなく自由に行動してよい\n\nFeel free to ask questions.\n\n遠慮なく質問してください。\n\n「先輩、相手の心理的な遠慮を取り除く表現です。」\n\ndon't hesitate to\n\nドント・ヘズィテイト・トゥ\n\n核イメージ：ためらわずに行動する\n\nDon't hesitate to contact us.\n\n遠慮なくお問い合わせください。\n\n「hesitate は『ためらう』です。」\n\nDon't hesitate to ask for help.\n\n助けが必要なら遠慮なく頼んでください。\n\n「先輩、feel free to は自由にしてよいという雰囲気を作り、don't hesitate to はためらわず行動するよう直接促します。」\n\n「どちらもビジネスメールで自然に使えます。」\n\nbe free to\n\nビー・フリー・トゥ\n\n核イメージ：行動する自由・許可がある\n\nYou are free to leave whenever you want.\n\n好きなときに退出して構いません。\n\n「be free to は、行動する自由や許可そのものを表します。」\n\nYou are free to choose your own schedule.\n\n自分のスケジュールを自由に選べます。\n\n「先輩、feel free to は心理的な遠慮を和らげる、be free to は自由・許可を示すという違いです。」\n\ngo ahead and\n\nゴウ・アヘッド・アンド\n\n核イメージ：そのまま進めてよい・実行してよい\n\nGo ahead and start without me.\n\n私を待たずに始めてください。\n\n「go ahead は、行動を進める許可や後押しを表します。」\n\nGo ahead and use my desk.\n\nどうぞ私の机を使ってください。\n\n「先輩、feel free to は気兼ねなくしてよい、go ahead and は実際に行動を始めてよい、という違いがあります。」\n\nyou're welcome to\n\nユア・ウェルカム・トゥ\n\n核イメージ：喜んで受け入れる・利用してよい\n\nYou're welcome to join us.\n\nどうぞ私たちに加わってください。\n\n「相手の参加や行動を歓迎する表現です。」\n\nYou're welcome to use my notes.\n\n私のノートを使っても構いませんよ。\n\n「先輩、feel free to は遠慮しなくてよい、you're welcome to は歓迎・受け入れの気持ちが感じられます。」\n\n「ただし、You're welcome to leave などは、文脈によって冷たく聞こえる場合もあります。」\n\nplease do\n\nプリーズ・ドゥ\n\n核イメージ：ぜひそうしてください\n\nIf you have any suggestions, please do share them.\n\n何か提案があれば、ぜひ共有してください。\n\n「do を使うことで、相手の行動を強く歓迎・促すことがあります。」\n\nPlease do let me know.\n\nぜひ知らせてください。\n\n「先輩、feel free to は遠慮を取り除く、please do は行動を積極的に促す感覚です。」\n\nhelp yourself to\n\nヘルプ・ユアセルフ・トゥ\n\n核イメージ：食べ物や飲み物などを自分で自由に取る\n\nHelp yourself to some snacks.\n\nお菓子はご自由にどうぞ。\n\n「help yourself to は、食べ物や飲み物などを自由に取ってよいと伝える表現です。」\n\nPlease help yourself to coffee.\n\nコーヒーはご自由にお取りください。\n\n「先輩、feel free to は幅広い行動に使えますが、help yourself to は食べ物・飲み物などを自由に取る場面でよく使います。」\n\ndon't be afraid to\n\nドント・ビー・アフレイド・トゥ\n\n核イメージ：怖がらずに行動する\n\nDon't be afraid to make mistakes.\n\n間違えることを恐れないでください。\n\n「don't be afraid to は、不安や恐怖を取り除く表現です。」\n\nDon't be afraid to speak up.\n\n怖がらずに発言してください。\n\n「先輩、feel free to は遠慮を取り除く、don't be afraid to は不安や恐怖を取り除くという違いがあります。」\n\n## 同じ場面で比較しましょう\n\n「先輩、職場で後輩に『質問してもいいよ』と伝える場面です。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| feel free to | Feel free to ask. | 気兼ねなく質問して |\n| don't hesitate to | Don't hesitate to ask. | ためらわず質問して |\n| be free to | You're free to ask. | 質問する自由がある |\n| go ahead and | Go ahead and ask. | どうぞ質問して |\n| you're welcome to | You're welcome to ask. | 質問しても構わないよ |\n| please do | Please do ask. | ぜひ質問して |\n| don't be afraid to | Don't be afraid to ask. | 怖がらず質問して |\n\n「先輩、特に feel free to・don't hesitate to・go ahead and は、日常会話でも仕事でも使いやすい表現です。」\n\n## 理解確認｜3問\n\nQ1. 『遠慮なく質問してください』として自然なのは？\n\nFeel free to ask questions.Feel free asking questions.Feel free to asking questions.\n\nQ2. feel free to と don't hesitate to の違いとして適切なのは？\n\nfeel free to は気兼ねなくしてよい、don't hesitate to はためらわず行動してfeel free to は必ず命令するdon't hesitate to は必ず禁止する\n\nQ3. 『変更があれば遠慮なく知らせてください』として自然なのは？\n\nFeel free to let me know if anything changes.Feel free to know me if anything changes.Feel free let me know if anything changes.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| feel free to ～ | 遠慮なく～してください |\n| please feel free to ～ | どうぞお気軽に～してください |\n| feel free to ask | 遠慮なく質問してください |\n| feel free to contact me | お気軽にご連絡ください |\n| feel free to let me know | 遠慮なく知らせてください |\n| feel free to use ～ | ～を自由に使って構いません |\n| don't hesitate to | ためらわず～してください |\n| be free to | ～する自由・許可がある |\n| go ahead and | どうぞ～してください |\n| you're welcome to | ～しても構いません・歓迎します |\n| please do | ぜひ～してください |\n| help yourself to | ～をご自由にどうぞ |\n| don't be afraid to | 怖がらずに～してください |\n\n一文記憶\n\nIf you have any questions or concerns, please feel free to contact me anytime.\n\nご質問やご不明な点がございましたら、いつでもお気軽にご連絡ください。\n\n「先輩、今日のポイントは feel free to = 心理的な遠慮を取り除き、気軽に行動してよいと伝える ということです。」\n\n「特に仕事では、Please feel free to contact me と Feel free to let me know が役立ちます。」\n\n「そして、to の後ろは動詞の原形ですよ。ここは間違えないでくださいね。」\n\n次は 第75語｜Not long after です。"}, {"name": "Not long after", "text": "# 第75語｜Not long after\n\n発音：/nɑːt lɔːŋ ˈæftər/（ナット・ロング・アフター）｜副詞句・時間を表す表現\n\n意味：その後まもなく／～してから間もなく／それほど時間がたたないうちに\n\n「先輩、今日の not long after は、出来事の順番を説明するときに、とても便利な表現です。」\n\n「例えば、次の英文を見てください。」\n\nI moved to a new city. Not long after, I found a job.\n\n私は新しい街に引っ越しました。その後まもなく仕事が見つかりました。\n\n「先輩、ここで大切なのは、単に『その後』ではないということです。」\n\n「最初の出来事が起きてから、あまり時間がたたないうちに次の出来事が起きた。この時間的な近さを表しているんです。」\n\n「ただし、immediately のように『直後』と断定するわけではありません。」\n\n「今日は soon after、shortly after、right after、immediately after、not long before などとの違いも整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは基本の3パターンです。」\n\n① Not long after, + 文\n\nNot long after, he changed his mind.\n\nその後まもなく、彼は考えを変えました。\n\n「前の文章で説明した出来事を基準にしています。」\n\n② Not long after + 名詞\n\nNot long after the meeting, she called me.\n\n会議が終わって間もなく、彼女は私に電話しました。\n\n「何の後なのかを、名詞で示しています。」\n\n③ Not long after + 主語 + 動詞\n\nNot long after I arrived, it started raining.\n\n私が到着して間もなく、雨が降り始めました。\n\n「先輩、after の後ろに文章を置くこともできるんです。」\n\n核イメージ\n\n出来事A\n\n短い時間\n\n出来事B\n\nA → あまり時間がたたず → B\n\n「先輩、not long after の not long は、『長い時間ではない』という意味です。」\n\n「だから、『それほど時間がたたないうちに』となるんですね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現を比較しましょう。」\n\n「どれも『その後』と訳せることがありますが、時間の短さや文体に違いがあります。」\n\nnot long after\n\nナット・ロング・アフター\n\n核イメージ：長い時間がたたないうちに\n\nNot long after the meeting, he left.\n\n会議の後まもなく、彼は帰りました。\n\n「先輩、時間が比較的短かったことを自然に伝える表現です。」\n\nsoon after\n\nスーン・アフター\n\n核イメージ：ある出来事の後、早い段階で\n\nSoon after the announcement, the market reacted.\n\n発表後まもなく、市場が反応しました。\n\n「soon after は not long after と非常に近い意味です。」\n\nShe got married soon after graduation.\n\n彼女は卒業後まもなく結婚しました。\n\n「先輩、soon after は『早い時期に』、not long after は『長い時間がたたずに』という表現上の違いがあります。」\n\n「ただし、実際の会話ではかなり置き換え可能です。」\n\nshortly after\n\nショートリー・アフター\n\n核イメージ：短い時間の後に\n\nThe company issued a statement shortly after the incident.\n\nその会社は事件後まもなく声明を発表しました。\n\n「shortly after はニュースやビジネス文書でもよく使います。」\n\nShortly after the meeting, the decision was announced.\n\n会議の後まもなく、決定が発表されました。\n\n「先輩、not long after よりも、やや簡潔でフォーマルに感じられることがあります。」\n\n「ただし、どちらも自然な英語です。」\n\nright after\n\nライト・アフター\n\n核イメージ：ほとんど間を置かずに\n\nI'll call you right after work.\n\n仕事が終わったらすぐに電話します。\n\n「right after は、時間的な近さを強く表します。」\n\nShe left right after the meeting.\n\n彼女は会議が終わるとすぐに帰りました。\n\n「先輩、not long after は多少の時間がたっていても自然ですが、right after は『すぐ後』という感覚が強いです。」\n\n「日常会話でもよく使われます。」\n\nimmediately after\n\nイミーディアトリー・アフター\n\n核イメージ：時間をほとんど置かず、直後に\n\nThe system restarted immediately after the update.\n\nシステムは更新の直後に再起動しました。\n\n「immediately after は、『直後』であることを明確に表します。」\n\nHe contacted the police immediately after the accident.\n\n彼は事故の直後に警察へ連絡しました。\n\n「先輩、not long after よりも時間的な近さを強く示します。」\n\n「手順書や報告書などでも便利な表現ですね。」\n\na little later\n\nア・リトル・レイター\n\n核イメージ：少し時間がたってから\n\nA little later, he returned.\n\n少ししてから、彼は戻ってきました。\n\n「a little later は、前の出来事から少し時間がたったことを表します。」\n\nShe called me a little later.\n\n彼女は少ししてから電話してきました。\n\n「先輩、not long after は『長くはたっていない』、a little later は『少し後に』という違いです。」\n\n「どちらも短い間隔を表せますが、a little later は経過時間そのものに意識が向きやすいですね。」\n\nsubsequently\n\nサブシクウェントリー\n\n核イメージ：その後に・続いて\n\nThe company subsequently revised its policy.\n\nその会社はその後、方針を改定しました。\n\n「subsequently は、出来事の順序を示すフォーマルな表現です。」\n\nHe joined the company and subsequently became CEO.\n\n彼はその会社に入社し、その後CEOになりました。\n\n「先輩、subsequently は必ずしも短い時間を意味しません。」\n\n「not long after は時間の短さ、subsequently は出来事の順序に重点があります。」\n\nnot long before\n\nナット・ロング・ビフォー\n\n核イメージ：ある出来事の少し前に\n\nNot long before the meeting, he received an email.\n\n会議の少し前に、彼はメールを受け取りました。\n\n「先輩、これは not long after の反対方向です。」\n\nShe moved abroad not long before the pandemic.\n\n彼女はパンデミックの少し前に海外へ移りました。\n\n「after は後、before は前。基準となる出来事のどちら側なのかを意識してください。」\n\n## 時間的な距離を比較しましょう\n\n「先輩、ここは特に重要です。」\n\n出来事Aの後に、出来事Bが起こるまでの時間\n\nimmediately after\n\n直後・ほぼ間を置かず\n\nright after\n\nすぐ後\n\nshortly after\n\n短い時間の後\n\nsoon after\n\n比較的早い段階\n\nnot long after\n\n長い時間がたたないうちに※棒の長さはニュアンスを理解するための模式図です。実際の時間や厳密な順位を示すものではありません。特に soon after・shortly after・not long after は文脈によって重なります。\n\n「先輩、not long after は『短い時間の後』ですが、具体的な長さは決まっていません。」\n\n「ですから、時間を正確に伝えたいときは five minutes later や two days after the meeting のように、数字を使う方が明確です。」\n\n## 理解確認｜3問\n\nQ1. 『会議の後まもなく、彼女は電話しました』として自然なのは？\n\nNot long after the meeting, she called.Not long before the meeting, she called.Not long after to the meeting, she called.\n\nQ2. not long after と immediately after の違いは？\n\nnot long after は比較的短い時間の後、immediately after はほぼ直後not long after は必ず1秒以内immediately after は必ず数年後\n\nQ3. 『彼は入社し、その後まもなく昇進しました』として自然なのは？\n\nHe joined the company and was promoted not long after.He joined the company and was promoted not long before.He joined the company and was promoted not long to after.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| not long after | その後まもなく |\n| not long after + 名詞 | ～の後まもなく |\n| not long after + 文 | ～してから間もなく |\n| not long after that | その後まもなく |\n| soon after | その後すぐに・まもなく |\n| shortly after | その後まもなく |\n| right after | すぐ後に |\n| immediately after | 直後に |\n| a little later | 少ししてから |\n| subsequently | その後・続いて |\n| not long before | ～の少し前に |\n\n一文記憶\n\nNot long after I started my new job, I realized how much I still had to learn.\n\n新しい仕事を始めて間もなく、まだ学ぶべきことがたくさんあると気づきました。\n\n「先輩、今日のポイントは not long after = 出来事Aの後、あまり時間がたたないうちに出来事Bが起こる ということです。」\n\n「after だけなら順番を示しますが、not long after なら時間的な近さまで伝えられます。」\n\n「そして、immediately after のように直後とは限りません。」\n\n「先輩、英語の記事を読むときは、こうした時間表現を手がかりに、出来事の順番を頭の中で組み立ててくださいね。」\n\n次は 第76語｜Lay off です。"}, {"name": "Lay off", "text": "# 第76語｜Lay off\n\n発音：/leɪ ɔːf/（レイ・オフ）｜句動詞\n\n意味：人員削減のために解雇する／～するのをやめる／人に構うのをやめる\n\n「先輩、今日の lay off は、経済ニュースや企業の経営に関する記事で非常によく登場する表現です。」\n\nThe company laid off 500 employees.\n\nその会社は500人の従業員を人員削減のために解雇しました。\n\n「先輩、これは単に『会社を辞めた』という意味ではありません。」\n\n「会社側の経営上の事情によって、従業員の雇用を打ち切ったという意味なんです。」\n\n「では、次の英文はどうでしょう？」\n\nLay off the coffee.\n\nコーヒーを飲むのは控えなさい。\n\n「えっ、コーヒーを解雇するんですか？……なんて、先輩、まさか思っていませんよね？」\n\n「実は lay off には、対象から手を引く・離れるというイメージもあるんです。」\n\n「今日は特に lay off・fire・dismiss・terminate・furlough・resign の違いを詳しく理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、lay off には大きく3つの意味があります。」\n\n① 人員削減のために解雇する\n\nThe company laid off 200 workers.\n\nその会社は200人の労働者を人員削減のために解雇しました。\n\n「企業の業績悪化や組織再編などが理由になることが多いですね。」\n\n② ～するのをやめる・控える\n\nYou should lay off the junk food.\n\nジャンクフードを控えた方がいいですよ。\n\n「何かをやめる、あるいは距離を置くという意味です。」\n\n③ 人に構うのをやめる\n\nLay off him!\n\n彼に構うのはやめなさい！\n\n「先輩、これは相手を責めたり、しつこく干渉したりするのをやめるよう求める、かなり直接的な表現です。」\n\n核イメージ\n\n「ある対象から手を引く・離れる。」\n\n「雇用関係から人を外す、ある行動をやめる、人への干渉をやめる。これらがつながっているんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここが今日の重要部分です。」\n\n「lay off と似た表現はたくさんありますが、誰の意思で雇用が終わるのか、なぜ終わるのかを意識してください。」\n\n### ① 雇用・退職に関する表現\n\nlay off\n\nレイ・オフ\n\n核イメージ：会社側の事情で雇用を削減する\n\nThe company laid off 300 workers.\n\nその会社は300人の労働者を人員削減のために解雇しました。\n\n「先輩、業績悪化・事業縮小・組織再編などが背景になることが多いです。」\n\nfire\n\nファイア\n\n核イメージ：雇用主が従業員を解雇する\n\nHe was fired for repeatedly breaking company rules.\n\n彼は会社の規則に繰り返し違反したため解雇されました。\n\n「fire は、会社が従業員を解雇することです。」\n\n「lay off と違い、本人の問題が理由になることも多いですが、必ずしもそうとは限りません。」\n\n「先輩、fire は広く解雇、lay off は会社側の事情による人員削減という違いです。」\n\ndismiss\n\nディスミス\n\n核イメージ：職務・地位から正式に退かせる\n\nThe manager was dismissed for misconduct.\n\nそのマネージャーは不正行為を理由に解雇されました。\n\n「dismiss は、fire よりフォーマルな表現として使われることがあります。」\n\nThe company dismissed several senior executives.\n\nその会社は複数の上級幹部を解任しました。\n\n「先輩、dismiss は『解雇する』『解任する』という正式な処分や決定に使いやすい単語です。」\n\n「なお、dismiss には『考えや主張を退ける』という意味もあります。」\n\nterminate\n\nターミネイト\n\n核イメージ：契約・雇用などを正式に終了させる\n\nThe company terminated his employment.\n\nその会社は彼の雇用を終了させました。\n\n「terminate は、契約や雇用関係を正式に終了させる表現です。」\n\nThe contract was terminated early.\n\nその契約は予定より早く終了しました。\n\n「先輩、lay off は人員削減という事情に重点がありますが、terminate は関係や契約を終了させることに重点があります。」\n\n「法務・人事関係の文書でよく使われます。」\n\nfurlough\n\nファーロウ\n\n核イメージ：雇用関係を維持したまま、一時的に休業させる\n\nThe company furloughed hundreds of employees.\n\nその会社は数百人の従業員を一時休業させました。\n\n「先輩、これは lay off と混同しやすい表現です。」\n\n「furlough は、一般に雇用関係を維持したまま、従業員を一時的に休ませることを表します。」\n\n「給与や福利厚生の扱いは制度や地域によって異なります。」\n\n「lay off は雇用の終了を伴う場合がありますが、furlough は一時的な休業という違いがあります。」\n\ndownsize\n\nダウンサイズ\n\n核イメージ：組織や事業の規模を縮小する\n\nThe company downsized its workforce.\n\nその会社は従業員数を削減しました。\n\n「downsize は、会社や組織を小さくすることです。」\n\nThe company is downsizing to reduce costs.\n\nその会社はコスト削減のために事業規模を縮小しています。\n\n「先輩、lay off は従業員を解雇する行為、downsize は組織や人員の規模を縮小することです。」\n\n「人員削減は downsizing の手段の一つになり得ます。」\n\nmake redundant\n\nメイク・リダンダント\n\n核イメージ：職務が不要になったために雇用を終了する\n\nThe company made 100 employees redundant.\n\nその会社は100人の従業員を人員整理しました。\n\n「make redundant は、特にイギリス英語でよく使われる表現です。」\n\nHe was made redundant after the merger.\n\n彼は合併後の人員整理で職を失いました。\n\n「先輩、lay off と意味が近いですが、make redundant は仕事や職務自体が不要になったという理由を強く示します。」\n\nresign\n\nリザイン\n\n核イメージ：本人が自ら職務・役職を辞する\n\nShe resigned from the company.\n\n彼女はその会社を辞職しました。\n\n「先輩、前回学習した単語ですね。」\n\n「resign は本人が辞める、lay off は会社側が人員削減するという違いがあります。」\n\n「ただし、辞職が外部からの圧力によって事実上強いられる場合もあります。」\n\n### ② 「やめる・控える」に関する表現\n\ncut back on\n\nカット・バック・オン\n\n核イメージ：量や頻度を減らす\n\nI'm trying to cut back on coffee.\n\n私はコーヒーを飲む量を減らそうとしています。\n\n「cut back on は、完全にやめるのではなく、量を減らすことです。」\n\n「先輩、lay off coffee はコーヒーを控える・やめるという意味ですが、cut back on coffee は量を減らすことが中心です。」\n\ngive up\n\nギヴ・アップ\n\n核イメージ：習慣や活動をやめる・諦める\n\nHe gave up smoking.\n\n彼は喫煙をやめました。\n\n「give up は、習慣や活動をやめることです。」\n\nShe gave up trying to convince him.\n\n彼女は彼を説得しようとするのを諦めました。\n\n「先輩、lay off は『しばらく控える』という意味にも使えますが、give up は完全にやめることを表す場合が多いです。」\n\nrefrain from\n\nリフレイン・フロム\n\n核イメージ：意識的に行動を控える\n\nPlease refrain from smoking.\n\n喫煙はご遠慮ください。\n\n「refrain from は、フォーマルな場面で使われることが多い表現です。」\n\nEmployees should refrain from sharing confidential information.\n\n従業員は機密情報を共有することを控えるべきです。\n\n「先輩、lay off は口語的、refrain from は規則や案内などでも使われるフォーマルな表現です。」\n\nleave someone alone\n\nリーヴ・サムワン・アローン\n\n核イメージ：人に干渉せず、そっとしておく\n\nLeave me alone.\n\n私を放っておいて。\n\n「leave someone alone は、相手に構わないでほしいという表現です。」\n\nPlease leave him alone.\n\n彼をそっとしておいてください。\n\n「先輩、Lay off him! は相手への批判や干渉をやめるよう強く求める響きがあり、Leave him alone はより広く『彼を放っておいて』という意味です。」\n\n## 使い分け早見表\n\n「先輩、雇用関係の単語は、次のように整理すると覚えやすいですよ。」\n\n| 表現 | 誰の事情・意思？ | 中心となる意味 |\n| --- | --- | --- |\n| lay off | 主に会社側 | 人員削減のために解雇する |\n| fire | 雇用主側 | 解雇する |\n| dismiss | 雇用主側 | 正式に解雇・解任する |\n| terminate employment | 雇用関係の終了 | 雇用を終了させる |\n| furlough | 主に会社側 | 一時的に休業させる |\n| downsize | 会社側 | 組織・人員規模を縮小する |\n| make redundant | 会社側 | 職務が不要になり人員整理する |\n| resign | 本人側 | 辞職・辞任する |\n\n「先輩、ニュースで layoffs と出てきたら、まずは『会社側の事情による人員削減』を思い浮かべてください。」\n\n## 理解確認｜3問\n\nQ1. 『その会社は500人の従業員を人員削減のために解雇しました』として自然なのは？\n\nThe company laid off 500 employees.The company resigned 500 employees.The company retired 500 employees.\n\nQ2. lay off と resign の違いは？\n\nlay off は会社側の人員削減、resign は本人の辞職・辞任lay off は必ず昇進するresign は会社が従業員を解雇する\n\nQ3. 『彼は先月、人員削減で職を失いました』として自然なのは？\n\nHe was laid off last month.He was lay off last month.He was laid on last month.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| lay off | 人員削減する・控える・干渉をやめる |\n| lay someone off | 人を人員削減のために解雇する |\n| be laid off | 人員削減によって職を失う |\n| layoffs | 人員削減 |\n| mass layoffs | 大規模な人員削減 |\n| lay off coffee | コーヒーを控える |\n| Lay off! | もうやめて！ |\n| fire | 解雇する |\n| dismiss | 正式に解雇・解任する |\n| terminate | 契約・雇用を終了させる |\n| furlough | 一時休業させる |\n| downsize | 規模を縮小する |\n| make redundant | 人員整理する |\n| resign | 辞職・辞任する |\n| cut back on | 量・頻度を減らす |\n| give up | やめる・諦める |\n| refrain from | ～を控える |\n| leave someone alone | 人を放っておく |\n\n一文記憶\n\nThe company laid off hundreds of workers as part of its restructuring plan.\n\nその会社は組織再編計画の一環として、数百人の従業員を人員削減のために解雇しました。\n\n「先輩、今日のポイントは lay off = 会社側の事情で人員削減する という意味です。」\n\n「そして、be laid off は『人員削減で職を失う』という受動態です。」\n\n「ただし、lay off には『控える』『人に構うのをやめる』という意味もあります。」\n\n「ニュースでは人員削減、日常会話では控える・干渉をやめる。このように文脈から判断してくださいね。」\n\n次は 第77語｜Occur です。"}, {"name": "Occur", "text": "# 第77語｜Occur\n\n発音：/əˈkɝː/（アカー）｜動詞\n\n意味：起こる・発生する／（考えが）頭に浮かぶ／存在する・見られる\n\n「先輩、今日の単語は occur です。」\n\n「この単語はニュース、ビジネス文書、日常会話で使われます。でも、ただ『起こる』と覚えてしまうのは、少しもったいないですね。」\n\nAn accident occurred yesterday.\n\n昨日、事故が発生しました。\n\nIt never occurred to me.\n\nそんなことは思いもつきませんでした。\n\n「先輩、同じ occur なのに、最初は『事故が起こる』、次は『考えが浮かぶ』ですよね。」\n\n「どうしてでしょう？」\n\n「それは、occur の中心に 何かが現れる・生じる というイメージがあるからです。」\n\n「現実の世界に事故が生じれば『発生する』。頭の中に考えが生じれば『思いつく』になるんです。」\n\n「今日は happen、take place、arise、emerge、come up、strike などとの違いも丁寧に確認しますよ。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの意味を押さえましょう。」\n\n① 出来事が起こる・発生する\n\nThe problem occurred during the meeting.\n\n会議中に問題が発生しました。\n\n「何かの出来事が現実に生じることですね。」\n\n② 考えが頭に浮かぶ\n\nAn idea occurred to me.\n\nある考えが私の頭に浮かびました。\n\n「先輩、ここでは occur to + 人 が重要です。」\n\n③ 自然界などに存在する・見られる\n\nThis plant occurs naturally in Japan.\n\nこの植物は日本に自然に生育しています。\n\n「これは『ある場所に自然に存在する・見られる』という意味です。」\n\n核イメージ：何かが生じる・現れる\n\n現実に生じる → 出来事が発生する\n\n頭の中に生じる → 考えが浮かぶ\n\n自然界に見られる → 存在する\n\n「先輩、この3つを一つのイメージでつなげてくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語との比較です。」\n\n「occur の意味は大きく『出来事が起こる』と『考えが浮かぶ』に分かれます。」\n\n「それぞれに分けて理解しましょう。」\n\n### ① 「起こる・発生する」の類義語\n\noccur\n\nアカー\n\n核イメージ：出来事・現象が生じる\n\nA problem occurred.\n\n問題が発生しました。\n\n「先輩、occur はややフォーマルで、ニュース・報告書・説明文などでよく使われます。」\n\nhappen\n\nハプン\n\n核イメージ：何かが起こる\n\nWhat happened?\n\n何が起こったの？\n\n「happen は日常会話で非常によく使われます。」\n\nSomething strange happened yesterday.\n\n昨日、何か奇妙なことが起こりました。\n\n「先輩、occur と happen は多くの場合置き換えられます。」\n\n「ただし、happen は日常的、occur はややフォーマルという違いがあります。」\n\n「友人との会話では What happened? が自然ですね。」\n\ntake place\n\nテイク・プレイス\n\n核イメージ：出来事や行事が実施される・行われる\n\nThe meeting will take place tomorrow.\n\n会議は明日行われます。\n\n「take place は、会議・式典・イベントなどの開催によく使います。」\n\nThe festival takes place every summer.\n\nその祭りは毎年夏に開催されます。\n\n「先輩、occur は事故や問題にも使いやすいですが、take place は予定された行事や出来事に特に自然です。」\n\n「ただし、take place も予定外の出来事に使える場合があります。」\n\narise\n\nアライズ\n\n核イメージ：問題・必要性・状況などが生じる\n\nA problem arose during the project.\n\nプロジェクト中に問題が生じました。\n\n「arise は、問題や困難、機会、必要性などが現れるときによく使います。」\n\nNew opportunities may arise.\n\n新しい機会が生まれるかもしれません。\n\n「先輩、occur は出来事が起こること、arise は問題や状況などが新たに生じることに重点があります。」\n\n「arise の過去形は arose、過去分詞は arisen です。」\n\nemerge\n\nイマージ\n\n核イメージ：隠れていたものが表面に現れる\n\nNew evidence emerged during the investigation.\n\n調査中に新しい証拠が明らかになりました。\n\n「emerge は、今まで見えなかったものが現れる感覚です。」\n\nSeveral problems emerged after the launch.\n\n開始後、いくつかの問題が表面化しました。\n\n「先輩、occur は発生、emerge は表面化・出現です。」\n\n「問題が以前から存在していたのか、新たに発生したのかという違いにも関係します。」\n\ncome up\n\nカム・アップ\n\n核イメージ：話題・問題・機会などが出てくる\n\nA problem came up at work.\n\n仕事で問題が起きました。\n\n「come up は、会話でとても自然な表現です。」\n\nSomething important came up.\n\n重要な用事ができました。\n\n「先輩、occur は出来事の発生をやや客観的に表し、come up は問題や用事などが新たに出てくる感覚です。」\n\n「特に Something came up. は、予定変更の理由を説明するときによく使います。」\n\nbreak out\n\nブレイク・アウト\n\n核イメージ：戦争・火災・争いなどが突然始まる\n\nA fire broke out in the building.\n\nその建物で火災が発生しました。\n\n「break out は、突然始まるという感覚が強いです。」\n\nFighting broke out between the two groups.\n\n2つの集団の間で戦闘が始まりました。\n\n「先輩、occur は幅広い出来事に使えますが、break out は火災・戦争・争いなどの突然の発生によく使います。」\n\n### ② 「考えが浮かぶ・気づく」の類義語\n\noccur to\n\nアカー・トゥ\n\n核イメージ：考えがふと頭に現れる\n\nIt occurred to me that I was wrong.\n\n自分が間違っていたことに、ふと気づきました。\n\n「先輩、考えや気づきが自然に浮かぶ感覚です。」\n\nthink of\n\nシンク・オヴ\n\n核イメージ：何かを思いつく・思い浮かべる\n\nI thought of a good idea.\n\nよいアイデアを思いつきました。\n\n「think of は、自分が考えを思いつくことです。」\n\nCan you think of a solution?\n\n解決策を思いつけますか？\n\n「先輩、occur to は考えが頭に浮かぶこと、think of は自分が考えを思いつくことに視点があります。」\n\n「think of は意識的に考える場合にも、自然に思いつく場合にも使えます。」\n\ncome to mind\n\nカム・トゥ・マインド\n\n核イメージ：考えや記憶が頭に浮かぶ\n\nA few ideas came to mind.\n\nいくつかのアイデアが頭に浮かびました。\n\n「come to mind は、occur to と非常に近い表現です。」\n\nHer name suddenly came to mind.\n\n彼女の名前が突然頭に浮かびました。\n\n「先輩、occur to は考えや気づき、come to mind は考えだけでなく記憶や名前などが浮かぶ場面でも自然です。」\n\nstrike\n\nストライク\n\n核イメージ：考えや気づきが突然、強く頭に入ってくる\n\nIt suddenly struck me that I had forgotten something.\n\n何かを忘れていたことに、突然気づきました。\n\n「先輩、以前学習した strike ですね。」\n\n「occur to は考えが浮かぶこと、strike は突然の気づきや強い印象を表すことが多いです。」\n\nIt struck me as strange.\n\nそれは私には奇妙に思えました。\n\n「strike には『～という印象を与える』という使い方もあります。」\n\nrealize\n\nリアライズ\n\n核イメージ：事実を理解する・気づく\n\nI realized that I had made a mistake.\n\n自分が間違いを犯したことに気づきました。\n\n「realize は、何かが事実だと理解することです。」\n\nShe realized how serious the problem was.\n\n彼女はその問題がどれほど深刻かを理解しました。\n\n「先輩、occur to は考えが頭に浮かぶこと、realize は事実を理解することです。」\n\n「It occurred to me that ～ は『～という考えが浮かんだ』、I realized that ～ は『～だと分かった』という違いがあります。」\n\ndawn on\n\nドーン・オン\n\n核イメージ：理解が徐々に明らかになる\n\nIt slowly dawned on me that he was right.\n\n彼が正しいのだと、徐々に分かってきました。\n\n「dawn は『夜が明ける』という意味もあります。」\n\n「暗かった空が少しずつ明るくなるように、理解が徐々に生まれるイメージです。」\n\nIt finally dawned on her what had happened.\n\n何が起こったのか、彼女はようやく理解しました。\n\n「先輩、occur to は考えが浮かぶこと、dawn on は理解が次第に明らかになることに重点があります。」\n\n## 使い分け早見表\n\n「先輩、似た表現を一度整理しましょう。」\n\n| 表現 | 核イメージ | 例 |\n| --- | --- | --- |\n| occur | 出来事が発生する | An error occurred. |\n| happen | 何かが起こる | What happened? |\n| take place | 行事などが行われる | The meeting took place. |\n| arise | 問題・機会などが生じる | A problem arose. |\n| emerge | 隠れていたものが現れる | New evidence emerged. |\n| come up | 問題・用事が出てくる | Something came up. |\n| break out | 突然始まる | A fire broke out. |\n| occur to | 考えが頭に浮かぶ | It occurred to me. |\n| think of | 思いつく | I thought of an idea. |\n| come to mind | 頭に浮かぶ | A name came to mind. |\n| strike | 突然気づく・印象を与える | It struck me. |\n| realize | 事実を理解する | I realized my mistake. |\n| dawn on | 徐々に理解する | It dawned on me. |\n\n「先輩、特に occur・happen・arise・emerge はニュースでよく登場します。」\n\n「『何かが起きた』のか、『問題が新たに生じた』のか、『隠れていた問題が表面化した』のか。この違いを意識すると、英文の理解が深まりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『システム内でエラーが発生しました』として正しいのは？\n\nAn error occurred in the system.The system occurred an error.An error was occurred in the system.\n\nQ2. 『解決策が私の頭に浮かびました』として正しいのは？\n\nA solution occurred to me.I occurred a solution.A solution occurred me.\n\nQ3. occur と emerge の違いとして適切なのは？\n\noccur は発生、emerge は表面化・出現occur は必ず計画された行事を表すemerge は必ず事故を表す\n\n## 30秒復習\n\n「先輩、最後に重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| occur | 起こる・発生する |\n| occur in ～ | ～で発生する |\n| occur during ～ | ～の間に発生する |\n| occur when ～ | ～するときに起こる |\n| occur to 人 | 人の頭に浮かぶ |\n| It occurred to me that ～ | ～という考えが浮かんだ |\n| It never occurred to me that ～ | ～とは思いもしなかった |\n| occur naturally | 自然に存在する |\n| occurrence | 発生・出来事 |\n| happen | 起こる |\n| take place | 行われる |\n| arise | 生じる |\n| emerge | 表面化する |\n| come up | 出てくる |\n| break out | 突然始まる |\n| think of | 思いつく |\n| come to mind | 頭に浮かぶ |\n| strike | 突然気づく |\n| realize | 理解する・気づく |\n| dawn on | 徐々に理解する |\n\n一文記憶\n\nWhen a problem occurred at work, it occurred to me that we could solve it by checking the previous month's data.\n\n仕事で問題が発生したとき、前月のデータを確認すれば解決できるのではないかと、ふと思いつきました。\n\n「先輩、この一文には occur の2つの意味が入っています。」\n\n「最初の a problem occurred は『問題が発生した』。」\n\n「次の it occurred to me that ～ は『～という考えが頭に浮かんだ』。」\n\n「現実の世界に何かが生じるのか、頭の中に考えが生じるのか。この違いを覚えてくださいね。」\n\n次は 第78語｜Plan on です。"}, {"name": "Plan on", "text": "# 第78語｜Plan on\n\n発音：/plæn ɑːn/（プラン・オン）｜句動詞\n\n意味：～するつもりでいる／～を予定している／～を見込む\n\n「先輩、今日の plan on は、将来の予定や行動について話すときに、とても便利な表現です。」\n\nI plan on studying English tonight.\n\n今夜は英語を勉強するつもりです。\n\nWe plan on expanding our business.\n\n私たちは事業を拡大する予定です。\n\n「先輩、ここで一つ質問です。plan to study と plan on studying は、何が違うと思いますか？」\n\n「……どちらも『勉強するつもり』ですよね。そうです。実は、この2つは意味がかなり近いんです。」\n\n「ただし、文法が違います。」\n\nplan to + 動詞の原形\n\nplan on + 動詞のing形\n\n「そして plan on には、単なる予定だけでなく、あることが起こると見込んで、それを前提に考えるという使い方もあるんです。」\n\n「今日は plan to、intend to、be going to、count on、expect などとの違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは3つの使い方を覚えましょう。」\n\n① ～するつもりでいる\n\nI plan on waking up early tomorrow.\n\n明日は早起きするつもりです。\n\n「すでに自分の中で、その行動を予定しているんですね。」\n\n② ～を予定している\n\nWe plan on launching a new product next year.\n\n私たちは来年、新製品を発売する予定です。\n\n「仕事の予定や計画にも使えます。」\n\n③ ～を見込む・当てにして予定を立てる\n\nWe're planning on about 30 guests.\n\n私たちは約30人の来客を見込んでいます。\n\n「先輩、これは『30人が来る』という見込みを前提に準備しているんです。」\n\n核イメージ\n\nある行動や出来事を予定・前提に組み込む\n\n自分の行動を予定する → ～するつもり\n\n計画に組み込む → ～を予定する\n\nある条件を前提にする → ～を見込む\n\n「先輩、plan on は『予定に入れる』『そうなるものとして考える』という感覚で覚えると理解しやすいですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現との比較です。」\n\n「『予定する』『つもりでいる』と訳せる表現でも、意思の強さや計画の具体性、見込みの意味に違いがあります。」\n\nplan on\n\nプラン・オン\n\n核イメージ：行動や状況を予定・前提に組み込む\n\nI plan on studying tonight.\n\n今夜は勉強するつもりです。\n\n「先輩、予定だけでなく、見込みを前提に考える場合にも使えます。」\n\nplan to\n\nプラン・トゥ\n\n核イメージ：将来の行動を計画する\n\nI plan to study abroad.\n\n私は留学する予定です。\n\n「plan to は、将来の行動について計画していることを表します。」\n\nWe plan to launch a new service.\n\n私たちは新しいサービスを開始する予定です。\n\n「先輩、plan on と plan to は予定を表すときにはほぼ同じ意味です。」\n\n「ただし、plan to do / plan on doing という文法の違いがあります。」\n\n「plan to の方が、ややフォーマルな文章でも使いやすいですね。」\n\nintend to\n\nインテンド・トゥ\n\n核イメージ：ある行動をする意思・意図がある\n\nI intend to improve my English.\n\n私は英語力を向上させるつもりです。\n\n「intend to は、本人の意思や意図に重点があります。」\n\nThe company intends to reduce costs.\n\nその会社はコストを削減する意向です。\n\n「先輩、plan on は予定・計画、intend to は意思・意図という違いがあります。」\n\n「intend to は、少しフォーマルな印象を与えることもあります。」\n\nbe going to\n\nビー・ゴウイング・トゥ\n\n核イメージ：すでに決めた予定・未来の見通し\n\nI'm going to study tonight.\n\n今夜は勉強するつもりです。\n\n「be going to は日常会話で非常によく使われます。」\n\nIt's going to rain.\n\n雨が降りそうです。\n\n「先輩、be going to は予定だけでなく、現在の状況から判断した未来の予測にも使えます。」\n\n「plan on は予定や見込みを組み込むことに重点があります。」\n\nexpect\n\nイクスペクト\n\n核イメージ：何かが起こると予想・期待する\n\nWe expect 100 participants.\n\n私たちは100人の参加者を見込んでいます。\n\n「expect は、何かが起こると予想することです。」\n\nI expect the project to finish on time.\n\nそのプロジェクトは予定どおりに終わると予想しています。\n\n「先輩、plan on はその見込みを前提に計画する感覚、expect は予測そのものに重点があります。」\n\n「expect には『期待する』という意味もあります。」\n\ncount on\n\nカウント・オン\n\n核イメージ：人や物事を信頼して当てにする\n\nI'm counting on you.\n\nあなたを頼りにしています。\n\n「count on は、相手が期待どおりに行動してくれると信頼することです。」\n\nWe count on his support.\n\n私たちは彼の支援を当てにしています。\n\n「先輩、plan on は予定・見込み、count on は信頼・依存が中心です。」\n\n「ただし、plan on にも『～を見込んでいる』という意味があるため、文脈によって近くなる場合があります。」\n\naim to\n\nエイム・トゥ\n\n核イメージ：目標に向かって行動する\n\nWe aim to increase sales by 20%.\n\n私たちは売上を20％増やすことを目指しています。\n\n「aim to は、目標を達成しようとすることです。」\n\nI aim to pass the exam this year.\n\n私は今年、その試験に合格することを目指しています。\n\n「先輩、plan on は予定、aim to は目標に重点があります。」\n\n「予定と目標は似ていますが、必ずしも同じではありません。」\n\nhope to\n\nホウプ・トゥ\n\n核イメージ：実現してほしいと望む\n\nI hope to visit Canada someday.\n\nいつかカナダを訪れたいと思っています。\n\n「hope to は希望を表します。」\n\nWe hope to finish the project soon.\n\n私たちはそのプロジェクトを近いうちに終えたいと思っています。\n\n「先輩、plan on は実際に予定していること、hope to は実現を望んでいることです。」\n\n「希望はあっても、まだ具体的な計画がない場合がありますね。」\n\narrange to\n\nアレインジ・トゥ\n\n核イメージ：必要な手配を整える\n\nWe arranged to meet at 10 a.m.\n\n私たちは午前10時に会う約束をしました。\n\n「arrange to は、予定を実行するための手配を整えることです。」\n\nShe arranged to have the documents delivered.\n\n彼女は書類を届けてもらう手配をしました。\n\n「先輩、plan on は予定していること、arrange to はそのための手配をしたことに重点があります。」\n\n## 同じ場面で比較しましょう\n\n「先輩、『来年、英語を勉強する』という場面で比べてみましょう。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| plan on | I plan on studying English. | 勉強する予定 |\n| plan to | I plan to study English. | 勉強する計画 |\n| intend to | I intend to study English. | 勉強する意思 |\n| be going to | I'm going to study English. | 勉強するつもり |\n| aim to | I aim to improve my English. | 英語力向上を目指す |\n| hope to | I hope to improve my English. | 英語力を向上させたい |\n| arrange to | I arranged to study with a tutor. | 講師と勉強する手配をした |\n\n「先輩、特に plan on・plan to・intend to・be going to は似ています。」\n\n「ですが、無理に厳密な違いを付ける必要はありません。」\n\n「まずは、plan on doing と plan to do の文法の違いを確実に覚えることが大切です。」\n\n## 理解確認｜3問\n\nQ1. 『私は今夜勉強するつもりです』として自然なのは？\n\nI plan on studying tonight.I plan on study tonight.I plan on to study tonight.\n\nQ2. plan on と count on の違いは？\n\nplan on は予定・見込み、count on は信頼して当てにするplan on は必ず過去を表すcount on は必ず旅行の予定を表す\n\nQ3. 『そんなにお金を使うつもりはありませんでした』として自然なのは？\n\nI hadn't planned on spending so much money.I hadn't planned on spend so much money.I hadn't planned to spending so much money.\n\n## 30秒復習\n\n「先輩、最後に今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| plan on ～ | ～を予定する・見込む |\n| plan on doing ～ | ～するつもりでいる |\n| be planning on doing ～ | ～する予定でいる |\n| plan on + 名詞 | ～を予定・見込む |\n| hadn't planned on ～ | ～を想定していなかった |\n| plan to do | ～する計画である |\n| intend to do | ～する意思がある |\n| be going to do | ～するつもりである |\n| expect | 予想・期待する |\n| count on | 信頼して当てにする |\n| aim to do | ～することを目指す |\n| hope to do | ～することを望む |\n| arrange to do | ～する手配をする |\n\n一文記憶\n\nI plan on improving my English by studying a little every day.\n\n私は毎日少しずつ勉強して、英語力を向上させるつもりです。\n\n「先輩、今日のポイントは plan on = ある行動や出来事を予定・前提に組み込む ということです。」\n\n「そして、文法では plan on doing と plan to do を区別してください。」\n\n「予定を表すときは意味がかなり近いですが、on の後ろは動名詞です。」\n\n「ここを正確に使えるようになれば、日常会話でも仕事でも自然な英語が話せますよ。」\n\n次は 第79語｜Intensity です。"}, {"name": "Intensity", "text": "# 第79語｜Intensity\n\n発音：/ɪnˈten.sə.ti/（インテンシティ）｜名詞\n\n意味：強さ・激しさ・強度・集中度\n\n「先輩、今日の単語は intensity です。」\n\n「この単語、運動でも、仕事でも、感情でも使えるんですよ。でも、単に『強さ』と覚えるだけでは、strength や power との違いが分からなくなってしまいます。」\n\nThe intensity of the workout was too high.\n\nそのトレーニングの強度は高すぎました。\n\nThe intensity of the competition is increasing.\n\n競争の激しさが増しています。\n\n「先輩、この2つの英文に共通するものは何でしょう？」\n\n「……そうです。どちらも、ある活動や現象が、どれほど強く・激しく現れているかを表しているんです。」\n\n「今日は特に、intensity と strength、power、severity、magnitude の違いまで、しっかり区別しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、intensity は大きく4つの場面で使われます。」\n\n① 運動・活動の強度\n\nYou should gradually increase the intensity of your workouts.\n\nトレーニングの強度を徐々に上げるべきです。\n\n「どれほど激しく運動するか、ということですね。」\n\n② 感情の激しさ\n\nI was surprised by the intensity of his anger.\n\n私は彼の怒りの激しさに驚きました。\n\n「怒りがどれほど強く表れているかを示しています。」\n\n③ 光・音・熱などの強さ\n\nThe intensity of the light increased.\n\n光の強さが増しました。\n\n「先輩、物理的な現象にも使えるんです。」\n\n④ 競争・議論などの激しさ\n\nThe intensity of the debate increased.\n\n議論の激しさが増しました。\n\n「議論がどれほど熱を帯びているか、という意味ですね。」\n\n核イメージ：現象・活動・感情がどれほど強く現れているか\n\n運動 → 強度\n\n感情・競争 → 激しさ\n\n光・音・熱 → 強さ\n\n「先輩、単に『力がある』というより、その力や活動がどれほど強く表れているかを表す単語なんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語との違いを整理しましょう。」\n\n「intensity を『強さ』とだけ覚えてしまうと、strength、power、severity との違いが曖昧になります。」\n\n「それぞれの核イメージを押さえてくださいね。」\n\nintensity\n\nインテンシティ\n\n核イメージ：現象や活動がどれほど強く現れているか\n\nThe intensity of the workout increased.\n\nトレーニングの強度が上がりました。\n\n「先輩、運動・感情・競争・光・音など、幅広い対象に使えます。」\n\nstrength\n\nストレングス\n\n核イメージ：内側に備わっている力・強さ\n\nHe has great physical strength.\n\n彼には優れた身体的な筋力があります。\n\n「strength は、筋力や能力、物の強度など、備わっている力を表します。」\n\nThe strength of the material is impressive.\n\nその材料の強度は優れています。\n\n「先輩、intensity は活動や現象の強さ、strength は力そのものや備わった強さに重点があります。」\n\n「例えば、筋力が強い人でも、いつも高強度の運動をしているとは限りませんよね。」\n\npower\n\nパワー\n\n核イメージ：何かを動かす・作用させる力\n\nThe engine produces a lot of power.\n\nそのエンジンは大きな出力を生み出します。\n\n「power は、機械の出力、影響力、権力などを表します。」\n\nThe company has significant market power.\n\nその会社は大きな市場支配力を持っています。\n\n「先輩、intensity はどれほど強く現れているか、power は何かに作用する力や能力に重点があります。」\n\n「物理学では power は単位時間当たりのエネルギー移動や仕事の割合という意味もあります。」\n\nseverity\n\nセヴェリティ\n\n核イメージ：問題・被害・症状などの深刻さ\n\nThe severity of the damage was unexpected.\n\n被害の深刻さは予想外でした。\n\n「severity は、問題や被害、病気などがどれほど深刻かを表します。」\n\nThe severity of the symptoms increased.\n\n症状の重さが増しました。\n\n「先輩、intensity は強さ・激しさ、severity は深刻さ・重大さに重点があります。」\n\n「例えば、雨が非常に激しくても、必ずしも被害が深刻になるとは限りません。」\n\n「雨の激しさは intensity、被害の深刻さは severity という区別ができますね。」\n\nmagnitude\n\nマグニチュード\n\n核イメージ：規模・大きさ\n\nThe magnitude of the earthquake was 7.0.\n\nその地震のマグニチュードは7.0でした。\n\n「magnitude は、出来事や現象の規模・大きさを表します。」\n\nWe underestimated the magnitude of the problem.\n\n私たちはその問題の規模を過小評価していました。\n\n「先輩、intensity は強さ、magnitude は規模・大きさです。」\n\n「地震では特に注意が必要です。マグニチュードは地震そのものの規模、震度はある地点での揺れの強さを表します。」\n\n「英語でも magnitude と seismic intensity は別の概念です。」\n\nforce\n\nフォース\n\n核イメージ：物体などに働く力・作用\n\nThe force of the impact damaged the vehicle.\n\n衝突の力によって車両が損傷しました。\n\n「force は、物理的な力や強制力などを表します。」\n\nThe government used force to stop the violence.\n\n政府は暴力を止めるために実力を行使しました。\n\n「先輩、intensity は強さの程度、force は実際に作用する力そのものです。」\n\ndegree\n\nディグリー\n\n核イメージ：程度・度合い\n\nThe degree of difficulty varies.\n\n難しさの程度はさまざまです。\n\n「degree は、何かの程度を広く表す単語です。」\n\nThe degree of risk depends on the situation.\n\nリスクの程度は状況によって異なります。\n\n「先輩、intensity は強さや激しさに特化していますが、degree は難しさ・危険性・重要性など、幅広い程度を表します。」\n\nconcentration\n\nコンセントレイション\n\n核イメージ：注意や成分が一点に集まること\n\nThis task requires a high level of concentration.\n\nこの作業には高い集中力が必要です。\n\n「concentration は、注意を集中させることです。」\n\nThe concentration of salt in the water is high.\n\n水中の塩分濃度が高いです。\n\n「先輩、intensity は活動や感情の強さ、concentration は注意や物質が集中している度合いです。」\n\n「work with intensity は『熱心に・強い集中で取り組む』という意味になり得ますが、concentration とは完全に同じではありません。」\n\npassion\n\nパッション\n\n核イメージ：強い情熱・熱意\n\nShe has a passion for learning.\n\n彼女は学ぶことに強い情熱を持っています。\n\n「passion は、何かに対する強い気持ちや熱意です。」\n\nHe spoke with passion.\n\n彼は情熱を込めて話しました。\n\n「先輩、intensity は強さの程度、passion は情熱という感情の性質に重点があります。」\n\n「情熱が強ければ intensity を感じることもありますが、意味は同じではありません。」\n\n## 比較表｜どの「強さ」を表すのか\n\n「先輩、最後に似た単語を一度整理しましょう。」\n\n| 単語 | 核イメージ | 代表的な組み合わせ |\n| --- | --- | --- |\n| intensity | 強く現れる程度 | exercise intensity |\n| strength | 備わっている力 | physical strength |\n| power | 作用する力・出力 | engine power |\n| severity | 深刻さ・重大さ | severity of damage |\n| magnitude | 規模・大きさ | earthquake magnitude |\n| force | 作用する力 | force of impact |\n| degree | 程度・度合い | degree of difficulty |\n| concentration | 集中・濃度 | level of concentration |\n| passion | 情熱・熱意 | passion for learning |\n\n「先輩、特に intensity・strength・severity・magnitude は区別できるようにしてください。」\n\n## 理解確認｜3問\n\nQ1. 『トレーニングの強度を上げる』に最も適切なのは？\n\nIncrease the intensity of the workout.Increase the duration of the workout.Increase the severity of the workout.\n\nQ2. intensity と strength の違いは？\n\nintensity は現象・活動の強さ、strength は備わった力intensity は必ず筋力を表すstrength は必ず時間を表す\n\nQ3. 『被害の深刻さ』に最も適切なのは？\n\nThe severity of the damageThe intensity of the durationThe concentration of the duration\n\n## 30秒復習\n\n「先輩、今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| intensity | 強度・激しさ |\n| high intensity | 高い強度 |\n| low intensity | 低い強度 |\n| increase the intensity | 強度を上げる |\n| reduce the intensity | 強度を下げる |\n| the intensity of ～ | ～の強さ・激しさ |\n| intense | 激しい・強烈な |\n| intensify | 強まる・強める |\n| strength | 備わっている力 |\n| power | 作用する力・出力 |\n| severity | 深刻さ |\n| magnitude | 規模・大きさ |\n| force | 作用する力 |\n| degree | 程度 |\n| concentration | 集中・濃度 |\n| passion | 情熱 |\n\n一文記憶\n\nThe intensity of the workout increased, but the duration remained the same.\n\nトレーニングの強度は上がりましたが、時間は変わりませんでした。\n\n「先輩、この一文は intensity と duration の違いを同時に覚えられます。」\n\n「Intensity はどれほど激しいか、duration はどれほど長いか。 この2つを混同しないでくださいね。」\n\n「そして strength は備わった力、severity は深刻さ、magnitude は規模です。」\n\n「先輩、単語を覚えるときは日本語訳だけでなく、『何の強さなのか』まで意識してください。それが、似た単語を使い分けるための近道です。」\n\n次は 第80語｜I mean です。"}, {"name": "I mean", "text": "# 第80語｜I mean\n\n発音：/aɪ miːn/（アイ・ミーン）｜会話表現・談話標識\n\n意味：つまり／というか／いや、そうじゃなくて／だって／私が言いたいのは\n\n「先輩、今日の I mean は、英語の日常会話で本当によく登場する表現です。」\n\n「でも、辞書にある『私は意味する』という訳だけで理解しようとすると、会話の流れがつかめなくなるんです。」\n\n例えば、こちらを見てください。\n\nI mean, it's not a bad idea.\n\nいや、悪い考えではないんですけどね。\n\nHe's a good person. I mean, he always tries to help others.\n\n彼はいい人なんです。というのも、いつも人を助けようとするからです。\n\nI mean, what else could I do?\n\nだって、ほかにどうすればよかったんですか？\n\n「先輩、同じ I mean なのに、日本語訳が違いますよね。」\n\n「これは I mean が、特定の意味を表すだけでなく、自分の発言を補足したり、言い直したり、相手に意図を理解してもらったりするための表現だからなんです。」\n\n「今日は会話の中での役割を中心に、you know、like、actually、in other words などとの違いまで確認しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な5つの使い方です。」\n\n① 言い直す：というか／いや\n\nIt was Tuesday—I mean, Wednesday.\n\n火曜日でした。いや、水曜日でした。\n\n「間違えた内容を訂正しています。」\n\n② 補足する：つまり／というのも\n\nIt's expensive. I mean, it costs almost $1,000.\n\nそれは高いんです。というのも、1,000ドル近くするんですよ。\n\n「自分の発言を具体的に説明しています。」\n\n③ 本当に言いたいことを明確にする\n\nI mean, we need to think about the long-term consequences.\n\nつまり、私たちは長期的な影響を考える必要があるんです。\n\n「自分の主張の中心を伝えています。」\n\n④ 気持ち・主張を強める\n\nI mean, that's just unfair!\n\nだって、それはあまりにも不公平でしょう！\n\n「驚きや不満を込めて、主張を強調することがあります。」\n\n⑤ 考えながら話す\n\nI mean... I guess you're right.\n\nというか……たぶん、あなたの言うとおりだと思います。\n\n「先輩、話しながら考えを整理するときにも使われるんです。」\n\n核イメージ：今の発言を調整して、本当に伝えたい意味へ近づける\n\n間違えた → 訂正する\n\n説明が足りない → 補足する\n\n意図が伝わりにくい → 明確にする\n\n「先輩、I mean が出てきたら、『この人は今、自分の発言を調整しようとしているんだな』と考えてみてください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た会話表現との比較です。」\n\n「I mean は日本語訳だけでなく、会話の中でどんな役割を果たすかで区別すると分かりやすいですよ。」\n\nI mean\n\nアイ・ミーン\n\n核イメージ：自分の発言を補足・訂正・明確化する\n\nI mean, it's not that simple.\n\nというか、そんなに単純ではないんです。\n\n「先輩、今の発言を調整することが中心です。」\n\nyou know\n\nユー・ノウ\n\n核イメージ：相手と認識を共有する・理解を求める\n\nIt's difficult, you know?\n\n難しいんですよ、分かりますよね？\n\n「you know は、相手が理解しているか、共感してくれるかを意識した表現です。」\n\nI was, you know, really nervous.\n\n私は、その、本当に緊張していたんです。\n\n「先輩、考えながら話すときのつなぎ言葉にもなります。」\n\n「I mean は自分の発言を調整、you know は相手との共有という違いがあります。」\n\nlike\n\nライク\n\n核イメージ：例示・近似・考える間を作る\n\nIt was, like, really expensive.\n\nそれは、なんというか、すごく高かったんです。\n\n「会話中の like は、正確な表現を探したり、発言を和らげたりするときに使われます。」\n\nThere were, like, 20 people.\n\n20人くらいいました。\n\n「先輩、I mean は言い直しや補足、like は近似・例示・つなぎ言葉として使われることが多いです。」\n\n「ただし、like を使いすぎると、場面によってはくだけすぎた印象になることがあります。」\n\nactually\n\nアクチュアリー\n\n核イメージ：実際には・予想や認識と違って\n\nActually, I don't agree.\n\n実は、私は賛成ではありません。\n\n「actually は、相手の認識や予想と違う事実を伝えるときによく使います。」\n\nI thought it was easy, but actually it was difficult.\n\n簡単だと思いましたが、実際には難しかったです。\n\n「先輩、I mean は自分の発言の補足・訂正、actually は実際の事実や認識の修正に重点があります。」\n\n「ただし、どちらも言い直しに使われることがあるので、文脈で判断しましょう。」\n\nin other words\n\nイン・アザー・ワーズ\n\n核イメージ：同じ内容を別の言葉で言い換える\n\nIn other words, we need more time.\n\n言い換えれば、私たちにはもっと時間が必要です。\n\n「in other words は、内容を分かりやすく言い換える表現です。」\n\nThe project is behind schedule. In other words, we're running late.\n\nプロジェクトは予定より遅れています。つまり、進行が遅れているんです。\n\n「先輩、I mean は会話で幅広く使われますが、in other words は『言い換え』という役割が明確です。」\n\n「文章や説明でも使いやすいですね。」\n\nwhat I'm saying is\n\nワット・アイム・セイイング・イズ\n\n核イメージ：自分の主張の中心を明確にする\n\nWhat I'm saying is that we need to be careful.\n\n私が言いたいのは、慎重になる必要があるということです。\n\n「先輩、I mean よりも、自分の主張を明確に打ち出す表現です。」\n\nWhat I'm saying is that the plan needs improvement.\n\n私が言いたいのは、その計画には改善が必要だということです。\n\n「特に誤解を解きたいときや、議論の中心を整理したいときに便利です。」\n\nto be clear\n\nトゥ・ビー・クリア\n\n核イメージ：誤解がないよう明確にする\n\nTo be clear, I'm not criticizing your work.\n\n誤解のないように言うと、私はあなたの仕事を批判しているわけではありません。\n\n「to be clear は、誤解を避けるために内容をはっきりさせる表現です。」\n\nTo be clear, the deadline hasn't changed.\n\nはっきりさせておくと、締め切りは変わっていません。\n\n「先輩、I mean は自然な会話の流れで補足する表現ですが、to be clear は意図的に内容を明確化する表現です。」\n\nbasically\n\nベイシカリー\n\n核イメージ：細部を省いて要点をまとめる\n\nBasically, we need to start over.\n\n要するに、最初からやり直す必要があります。\n\n「basically は、細かい部分を省いて全体の要点を伝える表現です。」\n\nBasically, the system works the same way.\n\n基本的には、そのシステムは同じ仕組みで動きます。\n\n「先輩、I mean は発言の調整、basically は要点の整理という違いがあります。」\n\nwell\n\nウェル\n\n核イメージ：考える間を作る・返答を和らげる\n\nWell, I'm not sure.\n\nうーん、よく分かりません。\n\n「well は、すぐに答えずに考える間を作ったり、反対意見を柔らかく伝えたりするときに使います。」\n\nWell, I see your point, but I disagree.\n\nそうですね、言いたいことは分かりますが、私は反対です。\n\n「先輩、I mean は自分の発言を補足・修正すること、well は返答の始まりや話の切り替えを調整することが多いです。」\n\n## 同じ場面で比較しましょう\n\n「先輩、会議で自分の意見を伝える場面です。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| I mean | I mean, we need more time. | つまり、もっと時間が必要 |\n| you know | It's difficult, you know. | 難しいですよね |\n| like | It's, like, really complicated. | なんというか、とても複雑 |\n| actually | Actually, we need more time. | 実は、もっと時間が必要 |\n| in other words | In other words, we need more time. | 言い換えれば、もっと時間が必要 |\n| what I'm saying is | What I'm saying is that we need more time. | 私が言いたいのは、もっと時間が必要ということ |\n| to be clear | To be clear, we need more time. | 誤解のないように言うと、もっと時間が必要 |\n| basically | Basically, we need more time. | 要するに、もっと時間が必要 |\n| well | Well, we need more time. | そうですね、もっと時間が必要です |\n\n「先輩、特に I mean、you know、like は、自然な英会話で頻繁に出てきます。」\n\n「ただし、これらは会話の流れを整える言葉なので、毎回日本語に訳す必要はありません。」\n\n## 理解確認｜3問\n\nQ1. 『火曜日でした。いや、水曜日でした』の言い直しに最も自然なのは？\n\nIt was Tuesday—I mean, Wednesday.It was Tuesday—I power, Wednesday.It was Tuesday—I intensity, Wednesday.\n\nQ2. I mean と in other words の違いは？\n\nI mean は発言の補足・訂正など幅広く使い、in other words は言い換えを明確に示すI mean は必ず未来を表すin other words は必ず反対意見を表す\n\nQ3. 『あなたを傷つけるつもりはありませんでした』として自然なのは？\n\nI didn't mean to hurt you.I didn't mean hurting you.I didn't mean to hurting you.\n\n## 30秒復習\n\n「先輩、今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| I mean | つまり・というか・いや |\n| What I mean is ～ | 私が言いたいのは～ |\n| I mean to say ～ | 私が言いたいのは～ |\n| I didn't mean to ～ | ～するつもりはなかった |\n| I mean it | 本気で言っている |\n| Do you know what I mean? | 言いたいことが分かりますか？ |\n| If you know what I mean | 言いたいことが分かると思いますが |\n| you know | 分かりますよね・その |\n| like | なんというか・～くらい |\n| actually | 実は・実際には |\n| in other words | 言い換えれば |\n| what I'm saying is | 私が言いたいのは |\n| to be clear | 誤解のないように言うと |\n| basically | 要するに・基本的には |\n| well | そうですね・うーん |\n\n一文記憶\n\nI mean, it's not that I disagree with you. I just think we need more information.\n\nというか、あなたに反対しているわけではないんです。ただ、もっと情報が必要だと思うんです。\n\n「先輩、この英文では I mean を使って、自分の立場を丁寧に説明しています。」\n\n「最初に『反対しているわけではない』と誤解を解き、その後に『情報が必要だ』と本当に言いたいことを伝えているんです。」\n\n「I mean = 今の発言を調整して、本当に伝えたい意味へ近づける。」\n\n「このイメージを覚えておけば、英語の会話がずっと理解しやすくなりますよ。」\n\n次は 第81語｜Describe です。"}, {"name": "Describe", "text": "# 第81語｜Describe\n\n発音：/dɪˈskraɪb/（ディスクライブ）｜動詞\n\n意味：説明する・描写する・言葉で表現する\n\n「先輩、今日の単語は describe です。」\n\n「describe を『説明する』とだけ覚えていませんか？ それだと、explain との違いが分からなくなってしまいますよ。」\n\nまず、こちらの2つを比べてください。\n\nCan you describe the problem?\n\nその問題がどんなものか説明してもらえますか？\n\nCan you explain why the problem occurred?\n\nなぜその問題が起きたのか説明してもらえますか？\n\n「先輩、違いに気づきましたか？」\n\n「最初の describe は、問題がどんな状態なのかを知りたいんです。」\n\n「一方、explain は、なぜその問題が起きたのかを知りたいんですね。」\n\n「つまり、describe は『相手が頭の中で対象を思い描けるように、特徴や状態を言葉にする』ことが中心なんです。」\n\n「今日は explain、depict、portray、illustrate、define などとの違いも整理していきます。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、describe の中心は、特徴・状態・様子を言葉で伝えることです。」\n\n① 人や物の特徴を描写する\n\nCan you describe the person?\n\nその人がどんな人物だったか説明してもらえますか？\n\n「例えば、背が高い、黒い服を着ている、眼鏡をかけている、といった特徴ですね。」\n\n② 状況や出来事の様子を説明する\n\nPlease describe what happened.\n\n何が起こったのか、その様子を説明してください。\n\n「出来事を相手が理解できるように言葉で伝えています。」\n\n③ 感情や経験を表現する\n\nIt's hard to describe how I feel.\n\n自分の気持ちを言葉で表すのは難しいです。\n\n「先輩、目に見えない感情にも使えるんですよ。」\n\n④ ～を…だと表現する\n\nShe described the experience as unforgettable.\n\n彼女はその経験を忘れられないものだったと表現しました。\n\n「これは describe A as B という重要な形です。」\n\n核イメージ：言葉で相手の頭の中に対象の姿を描く\n\n対象を見る・経験する\n\n特徴・状態・様子を言葉にする\n\n相手がその姿を思い描ける\n\n「先輩、これが describe の本質です。必ずしも理由や仕組みまで説明する必要はありません。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが大切です。」\n\n「日本語ではどれも『説明する』『表現する』と訳せることがあります。でも、英語ではそれぞれ何を伝えようとしているのかが違うんです。」\n\ndescribe\n\nディスクライブ\n\n核イメージ：特徴や様子を言葉で描く\n\nShe described the room as spacious.\n\n彼女はその部屋を広々としていると表現しました。\n\n「先輩、相手が対象を頭に思い描けるようにすることが中心です。」\n\nexplain\n\nイクスプレイン\n\n核イメージ：理由や仕組みを理解できるようにする\n\nCan you explain why the machine stopped?\n\nなぜその機械が止まったのか説明できますか？\n\n「explain は、理由・仕組み・意味などを理解させることに重点があります。」\n\nHe explained how the system works.\n\n彼はそのシステムがどのように動くのか説明しました。\n\n「先輩、describe は『どんな状態か』、explain は『なぜ・どういう仕組みか』です。」\n\n「ただし、手順の説明などでは両方使える場合もあります。」\n\ndepict\n\nディピクト\n\n核イメージ：絵・文章・映像などで姿を表現する\n\nThe painting depicts a peaceful village.\n\nその絵は平和な村を描いています。\n\n「depict は、視覚的な描写によく使われます。」\n\nThe film depicts life in the 19th century.\n\nその映画は19世紀の生活を描いています。\n\n「先輩、describe は主に言葉で描写すること、depict は絵や映像などを含めて表現することです。」\n\n「文学作品の描写にも depict を使えますよ。」\n\nportray\n\nポートレイ\n\n核イメージ：人物や物事をある印象・解釈で描く\n\nThe movie portrays him as a hero.\n\nその映画は彼を英雄として描いています。\n\n「portray は、対象をどのような人物・存在として表現するかに重点があります。」\n\nThe media portrayed the decision as a failure.\n\nメディアはその決定を失敗として描きました。\n\n「先輩、describe は特徴や様子の説明、portray はある印象や人物像を作り出す描写です。」\n\n「portray A as B も重要な形ですね。」\n\nillustrate\n\nイラストレイト\n\n核イメージ：例や図を使って分かりやすく示す\n\nLet me illustrate this point with an example.\n\nこの点を例を使って説明しましょう。\n\n「illustrate は、抽象的な内容を例・図・事例で明確にすることです。」\n\nThe chart illustrates the increase in sales.\n\nそのグラフは売上の増加を示しています。\n\n「先輩、describe は対象の特徴を伝えること、illustrate は例や図で理解を助けることに重点があります。」\n\ndefine\n\nディファイン\n\n核イメージ：意味や範囲を明確に定める\n\nHow do you define success?\n\nあなたは成功をどのように定義しますか？\n\n「define は、言葉や概念が何を意味するのかを明確にすることです。」\n\nThe contract clearly defines each party's responsibilities.\n\nその契約書は各当事者の責任を明確に定めています。\n\n「先輩、describe は特徴を述べること、define は意味や範囲を決めることです。」\n\n「例えば『椅子を描写する』ことと『椅子とは何かを定義する』ことは違いますよね。」\n\nexpress\n\nイクスプレス\n\n核イメージ：感情・考えを外に表す\n\nShe expressed her gratitude.\n\n彼女は感謝の気持ちを表しました。\n\n「express は、内側にある感情や考えを外に出すことです。」\n\nIt's difficult to express my feelings.\n\n自分の気持ちを表現するのは難しいです。\n\n「先輩、describe は感情がどんなものか描写すること、express は感情そのものを表に出すことです。」\n\n「describe my feelings と express my feelings の違いは、ここにあります。」\n\noutline\n\nアウトライン\n\n核イメージ：主要な点だけを簡潔に示す\n\nPlease outline your proposal.\n\n提案の概要を説明してください。\n\n「outline は、細かい部分より全体の骨組みを伝えることです。」\n\nThe manager outlined the new strategy.\n\n管理者は新しい戦略の概要を説明しました。\n\n「先輩、describe は詳しい特徴まで伝えられますが、outline は要点を整理して簡潔に伝えることに重点があります。」\n\nsummarize\n\nサマライズ\n\n核イメージ：内容を短くまとめる\n\nCan you summarize the report?\n\nその報告書を要約してもらえますか？\n\n「summarize は、長い内容から重要な点を抜き出して短くすることです。」\n\nShe summarized the discussion in three sentences.\n\n彼女は議論を3文で要約しました。\n\n「先輩、describe は対象の特徴や様子を伝えること、summarize は情報を圧縮することです。」\n\n「詳しく描写することと、短くまとめることは、目的が違うんですね。」\n\ncharacterize\n\nキャラクタライズ\n\n核イメージ：特徴を捉えて、～という性質のものだと位置づける\n\nThe report characterizes the market as highly competitive.\n\nその報告書は、その市場を競争が非常に激しいものと位置づけています。\n\n「characterize は、対象の本質的な特徴や性質を示すときに使います。」\n\nThe period was characterized by rapid economic growth.\n\nその時代は急速な経済成長を特徴としていました。\n\n「先輩、describe は広く描写すること、characterize は特徴づけることに重点があります。」\n\n「be characterized by ～ もよく使われますよ。」\n\n## 使い分け早見表\n\n「先輩、一度整理しましょう。」\n\n| 単語 | 核イメージ | 代表例 |\n| --- | --- | --- |\n| describe | 特徴・様子を言葉で描く | Describe the situation. |\n| explain | 理由・仕組みを理解させる | Explain why it happened. |\n| depict | 絵・文章・映像で描く | The painting depicts a village. |\n| portray | ある印象・人物像として描く | Portray him as a hero. |\n| illustrate | 例・図などで示す | Illustrate with an example. |\n| define | 意味・範囲を定める | Define the term. |\n| express | 感情・考えを表に出す | Express your feelings. |\n| outline | 概要を示す | Outline the plan. |\n| summarize | 短くまとめる | Summarize the report. |\n| characterize | 特徴づける | Characterize the market. |\n\n「先輩、特に describe・explain・illustrate・define は、仕事の資料や英語の問題文でも頻繁に使われます。」\n\n「どんな説明を求められているのかを読み取れるようにしましょう。」\n\n## 理解確認｜3問\n\nQ1. 『その部屋がどんな様子か説明してください』に最も自然なのは？\n\nPlease describe the room.Please define the room.Please summarize the room.\n\nQ2. 『彼女はその仕事を難しいものだと表現した』として正しいのは？\n\nShe described the task as difficult.She described the task to difficult.She described as the task difficult.\n\nQ3. describe と explain の違いとして適切なのは？\n\ndescribe は特徴・状態の描写、explain は理由・仕組みの説明に重点があるdescribe は必ず絵を描くことを意味するexplain は必ず感情を表現することを意味する\n\n## 30秒復習\n\n「先輩、最後に重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| describe | 描写する・説明する |\n| describe A to B | BにAを説明する |\n| describe A as B | AをBだと表現する |\n| describe in detail | 詳しく説明する |\n| describe accurately | 正確に描写する |\n| be described as ～ | ～だと表現される |\n| description | 描写・説明 |\n| descriptive | 描写的な |\n| indescribable | 言葉では表現できない |\n| explain | 理由・仕組みを説明する |\n| depict | 絵・文章・映像で描く |\n| portray | ある印象として描く |\n| illustrate | 例や図で示す |\n| define | 定義する |\n| express | 感情・考えを表現する |\n| outline | 概要を示す |\n| summarize | 要約する |\n| characterize | 特徴づける |\n\n一文記憶\n\nFirst, describe what happened. Then, explain why it happened.\n\nまず何が起こったのかを説明してください。その後、なぜそれが起こったのかを説明してください。\n\n「先輩、この一文には describe と explain の違いが凝縮されています。」\n\n「Describe は『何が、どんな状態か』。Explain は『なぜ、どういう仕組みか』。」\n\n「仕事で問題を報告するときにも、まず状況を描写し、それから原因を説明すると、相手に伝わりやすくなりますよ。」\n\n次は 第82語｜Consequence です。"}, {"name": "Consequence", "text": "# 第82語｜Consequence\n\n発音：/ˈkɑːn.sə.kwens/（カンサクウェンス）｜名詞\n\n意味：結果・影響・重大な結果・行動に伴う報い\n\n「先輩、今日の単語は consequence です。」\n\n「この単語はニュース、ビジネス、日常会話で非常によく登場します。特に、何かの行動が後からどんな影響をもたらすのかを考えるときに重要なんです。」\n\nEvery decision has consequences.\n\nあらゆる決断には結果が伴います。\n\nThe company failed to respond quickly, and the consequences were serious.\n\nその会社は迅速な対応を怠り、その結果、深刻な影響が生じました。\n\n「先輩、ここで考えてみてください。」\n\n「result も『結果』ですよね。では、どうして consequence という別の単語があるのでしょう？」\n\n「それは、consequence が単なる結果だけでなく、ある行動や出来事が原因となって、その後に生じる影響に注目する単語だからです。」\n\n「しかも、悪い影響や重大な結果を表すことが多いんですよ。」\n\n「今日は result、outcome、effect、impact、repercussion などとの違いまで、しっかり理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、consequence はまず3つの使い方を覚えましょう。」\n\n① 行動や出来事がもたらす結果\n\nEvery action has consequences.\n\nすべての行動には結果が伴います。\n\n「自分の行動が、後になって何らかの結果につながるという意味ですね。」\n\n② 悪い影響・重大な結果\n\nThe mistake had serious consequences.\n\nそのミスは深刻な結果を招きました。\n\n「consequence は特に、望ましくない影響を表す場面でよく使われます。」\n\n③ 自分の行動に伴う報い・責任\n\nYou have to face the consequences of your actions.\n\n自分の行動の結果を受け止めなければなりません。\n\n「先輩、これは『自分のしたことには責任が伴う』というニュアンスですね。」\n\n核イメージ：ある原因の後を追って生じる結果・影響\n\n行動・決断・出来事がある\n\nそこから変化が生じる\n\n後から結果・影響が現れる\n\n「先輩、consequence は『結果』ですが、その結果が何から生じたのかという因果関係を意識してくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語との比較です。」\n\n「日本語ではどれも『結果』『影響』と訳せることがあります。でも、英語ではそれぞれ注目している部分が違うんです。」\n\nconsequence\n\nカンサクウェンス\n\n核イメージ：原因となる行動・出来事から後に生じる結果\n\nThe decision had serious consequences.\n\nその決定は深刻な結果を招きました。\n\n「先輩、特に悪い影響や重大な結果に使われることが多いです。ただし、良い結果にも使えます。」\n\nresult\n\nリザルト\n\n核イメージ：何かを行った後に得られた結果\n\nThe results of the experiment were surprising.\n\n実験の結果は驚くべきものでした。\n\n「result は、行動や過程の後に得られた結果そのものを表します。」\n\nThe result was better than expected.\n\n結果は予想より良かったです。\n\n「先輩、consequence は因果関係から生じる影響、result は得られた結果そのものに重点があります。」\n\n「result は良い結果にも悪い結果にも中立的に使えます。」\n\noutcome\n\nアウトカム\n\n核イメージ：ある過程を経て最終的に得られた結末\n\nThe outcome of the negotiations was positive.\n\n交渉の結果は良好でした。\n\n「outcome は、交渉・試験・治療・プロジェクトなどの最終的な結果によく使われます。」\n\nWe are waiting for the outcome of the election.\n\n私たちは選挙の結果を待っています。\n\n「先輩、result と outcome はかなり近い単語です。」\n\n「ただし、outcome は一連の過程の最終的な結末に重点があります。」\n\n「consequence は、その後に生じる影響を表すことが多いですね。」\n\neffect\n\nイフェクト\n\n核イメージ：何かが別のものに及ぼす作用・変化\n\nThe new policy had a positive effect on employment.\n\nその新しい政策は雇用に良い影響を与えました。\n\n「effect は、ある原因が対象に与える影響です。」\n\nThe medicine had little effect.\n\nその薬はほとんど効果がありませんでした。\n\n「先輩、consequence は行動の結果として生じること、effect は対象に及ぼす作用や変化に重点があります。」\n\n「effect は薬の効果などにも使えます。」\n\nimpact\n\nインパクト\n\n核イメージ：何かに与える強い影響・衝撃\n\nThe pandemic had a major impact on the economy.\n\nパンデミックは経済に大きな影響を与えました。\n\n「impact は、強い影響や衝撃を表すことが多いです。」\n\nThe decision had a significant impact on employees.\n\nその決定は従業員に大きな影響を与えました。\n\n「先輩、effect は広く影響、impact は大きな影響や強い作用を表すことが多いです。」\n\n「ただし、ビジネス英語では impact が一般的な『影響』として使われることもあります。」\n\nrepercussion\n\nリーパーカッション\n\n核イメージ：ある行動が引き起こす、後に続く悪影響\n\nThe scandal had serious repercussions for the company.\n\nその不祥事は会社に深刻な悪影響をもたらしました。\n\n「repercussion は、ある出来事が波及して生じる悪影響を表すことが多いです。」\n\nThe decision could have political repercussions.\n\nその決定は政治的な余波を引き起こす可能性があります。\n\n「先輩、consequence よりも、波及する悪影響や余波というニュアンスが強いことがあります。」\n\n「通常は repercussions と複数形で使われることが多いです。」\n\naftermath\n\nアフターマス\n\n核イメージ：大きな出来事の後に残る状況・余波\n\nThe city struggled in the aftermath of the earthquake.\n\nその都市は地震の余波の中で苦しみました。\n\n「aftermath は、災害・戦争・危機などの後に残る状況を表します。」\n\nThe company faced difficulties in the aftermath of the scandal.\n\nその会社は不祥事の余波で困難に直面しました。\n\n「先輩、consequence は結果そのもの、aftermath は出来事の後に続く状況や影響に重点があります。」\n\n「in the aftermath of ～ という形でよく使われます。」\n\nimplication\n\nインプリケイション\n\n核イメージ：ある事実・決定から考えられる意味や影響\n\nThe decision has important implications for the industry.\n\nその決定は業界に重要な意味・影響を持ちます。\n\n「implication は、直接述べられていない意味や、そこから推測される影響を表します。」\n\nWe need to consider the implications of the new law.\n\n私たちは新しい法律がもたらす意味や影響を考える必要があります。\n\n「先輩、consequence は実際に生じる結果や予想される結果、implication はそこから導かれる意味や潜在的な影響に重点があります。」\n\n「政策・経済・ビジネスの記事でよく登場しますよ。」\n\nramification\n\nラミフィケイション\n\n核イメージ：複雑に枝分かれして広がる影響\n\nThe decision could have far-reaching ramifications.\n\nその決定は広範囲に及ぶ影響をもたらす可能性があります。\n\n「ramification は、ある決定から派生して広がる影響を表します。」\n\nThe policy has economic and social ramifications.\n\nその政策は経済的・社会的な波及的影響を持ちます。\n\n「先輩、consequence は結果、ramification はそこから枝分かれして広がる複雑な影響というイメージです。」\n\n「こちらも通常、ramifications と複数形で使われることが多いですね。」\n\n## 比較表｜どの「結果・影響」を表すのか\n\n「先輩、似た単語を一度整理しましょう。」\n\n| 単語 | 核イメージ | 代表例 |\n| --- | --- | --- |\n| consequence | 原因から生じる結果・影響 | serious consequences |\n| result | 得られた結果 | test results |\n| outcome | 過程の最終的な結末 | outcome of negotiations |\n| effect | 対象に及ぼす作用・変化 | effect on health |\n| impact | 強い影響・衝撃 | impact on the economy |\n| repercussion | 後に波及する悪影響 | political repercussions |\n| aftermath | 出来事の後に残る状況 | aftermath of a disaster |\n| implication | 導かれる意味・潜在的影響 | implications of a policy |\n| ramification | 枝分かれして広がる影響 | far-reaching ramifications |\n\n「先輩、特に consequence・result・outcome・effect・impact は頻出です。」\n\n「『結果』という日本語訳だけでなく、原因からのつながり、最終的な結末、対象への作用など、注目点の違いを意識してください。」\n\n## 理解確認｜3問\n\nQ1. 『その決定は深刻な結果を招く可能性があります』として自然なのは？\n\nThe decision could have serious consequences.The decision could have serious descriptions.The decision could have serious procedures.\n\nQ2. unintended consequences の意味は？\n\n意図しない結果最初から計画された結果必ず良い結果\n\nQ3. consequence と outcome の違いとして適切なのは？\n\nconsequence は原因から生じる影響、outcome は過程の最終的な結末に重点があるconsequence は必ず良い結果を表すoutcome は必ず事故の影響を表す\n\n## 30秒復習\n\n「先輩、最後に重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| consequence | 結果・影響・重大な結果 |\n| consequences of ～ | ～の結果・影響 |\n| serious consequences | 深刻な結果 |\n| unintended consequences | 意図しない結果 |\n| long-term consequences | 長期的な影響 |\n| immediate consequences | 即時的な結果 |\n| face the consequences | 結果を受け止める |\n| suffer the consequences | 悪い結果を被る |\n| as a consequence | その結果 |\n| consequently | その結果 |\n| of little consequence | あまり重要でない |\n| result | 結果 |\n| outcome | 最終的な結末 |\n| effect | 作用・影響 |\n| impact | 大きな影響 |\n| repercussion | 波及する悪影響 |\n| aftermath | 出来事の余波 |\n| implication | 潜在的な意味・影響 |\n| ramification | 枝分かれする波及的影響 |\n\n一文記憶\n\nEvery decision has consequences, so we need to consider both the immediate and long-term effects.\n\nあらゆる決断には結果が伴うため、私たちは短期的な影響と長期的な影響の両方を考える必要があります。\n\n「先輩、今日のポイントは consequence = ある原因から後に生じる結果・影響 です。」\n\n「特に unintended consequences は、政策や経営判断を考えるときに重要な表現ですよ。」\n\n「何かを決めるときには、目の前の結果だけでなく、その後にどんな影響が広がるかまで考える必要があります。」\n\n「先輩、英語の単語を覚えることと、因果関係を理解することは、実はつながっているんです。」\n\n次は 第83語｜On a very human level です。"}, {"name": "On a very human level", "text": "# 第83語｜On a very human level\n\n発音：/ɑːn ə ˈver.i ˈhjuː.mən ˈlev.əl/（オン・ア・ヴェリー・ヒューマン・レヴェル）｜慣用的な表現\n\n意味：人間としての自然な感情からすると／人間的な感覚では／理屈ではなく感情の面では\n\n「先輩、今日の表現は on a very human level です。」\n\n「これは単なる『人間のレベルで』ではありませんよ。そんなふうに直訳すると、意味がつかみにくくなってしまいます。」\n\n例えば、こちらの英文です。\n\nOn a very human level, I understand why she's upset.\n\n人間としての自然な感情からすると、彼女が腹を立てる理由は理解できます。\n\n「先輩、この人は『彼女の行動が正しい』と言っているのでしょうか？」\n\n「……いいえ。そうとは限りません。」\n\n「言っているのは、正しいか間違っているかという判断とは別に、人間の感情としては理解できるということなんです。」\n\n「ここが今日の一番大切なポイントですよ。」\n\n## A｜要点：何を表す表現なのか\n\n「先輩、まず on a very human level を分解しましょう。」\n\n| 部分 | 意味 | 役割 |\n| --- | --- | --- |\n| on | ～という観点で | 視点を示す |\n| a | ある一つの | level につく冠詞 |\n| very | とても・非常に | human を強調 |\n| human | 人間的な | 感情や人間らしさ |\n| level | 側面・次元 | 物事を見る観点 |\n\n「先輩、ここでの level は『高さ』ではなく、物事を見る側面や観点です。」\n\n「つまり、全体としては『非常に人間的な側面から見ると』という意味になるんですね。」\n\n核イメージ：理屈や制度の話から、人間の感情という視点へ切り替える\n\n理屈・規則・正しさによる判断\n\n人間として自然に感じることへの理解\n\n「ただし先輩、注意してください。on a very human level は必ずしも理屈を否定する表現ではありません。」\n\n「理屈による判断と、人間としての感情的な理解を区別する表現なんです。」\n\n## B｜詳しい解説：なぜこの表現を使うのか\n\n「先輩、以前の英文で扱っていた cancel culture の話題を使って考えてみましょう。」\n\nOn a very human level, people want there to be serious consequences for people who do terrible things.\n\n人間としての自然な感情からすると、ひどいことをした人には重大な報いがあってほしいと人々は思うものです。\n\n「この英文には、先ほど勉強した consequences（行動に伴う結果・報い） も登場していますね。」\n\n「では、話し手は何を伝えたいのでしょう？」\n\n「ひどい行動を見た人が『相応の責任を取ってほしい』と思うのは、人間の感情として理解できる、ということです。」\n\n「でも、そこから『だからどんな罰でも正しい』とはなりません。」\n\n「先輩、ここを混同しないでくださいね。」\n\n感情を理解することと、行動を正当化することは別です。\n\nUnderstand\n\nなぜそう感じるか理解する\n\n感情への共感\n\nJustify\n\nその行動を正しいと認める\n\n行動への評価\n\n「例えば、友人が怒っている理由は理解できても、怒りに任せて相手を傷つける行動まで認める必要はありませんよね。」\n\nI understand his anger on a human level, but I don't agree with his actions.\n\n人間的な感情として彼の怒りは理解できますが、彼の行動には賛成できません。\n\n「先輩、この英文は on a human level の使い方をよく表しています。」\n\n## C｜イメージ理解：3つの視点を切り替える\n\n「先輩、会社が経営上の理由で従業員を解雇する場面を考えてください。」\n\n「会社側には、人件費を削減しなければならない事情があるかもしれません。」\n\n「でも、解雇される従業員には生活があります。」\n\n「同じ出来事でも、どの側面から見るかによって、注目することが違うんです。」\n\nOn a business level\n\nビジネスの観点では\n\nThe decision may be necessary.\n\nその決定は必要かもしれません。\n\nOn a legal level\n\n法的な観点では\n\nThe company must follow the law.\n\n会社は法律を守らなければなりません。\n\nOn a very human level\n\n人間としての感情からすると\n\nIt's heartbreaking to see people lose their jobs.\n\n人々が仕事を失う姿を見るのは胸が痛みます。\n\n「先輩、どの視点も同時に成立し得ます。」\n\n「on a very human level は、ビジネスや法律の視点では見落としがちな、人間の気持ちに注目させる表現なんです。」\n\n## D｜具体例：自然な英会話で使ってみましょう\n\n「先輩、使う場面ごとに例文を確認しますよ。」\n\n① 相手の怒りを理解する\n\nOn a very human level, I understand why he's angry.\n\n人間的な感情として、彼が怒っている理由は理解できます。\n\n② 失敗した人への共感\n\nOn a human level, I feel sorry for her.\n\n一人の人間として、彼女を気の毒に思います。\n\n③ 相手の行動を正当化しない\n\nI understand his frustration on a human level, but that doesn't justify his behavior.\n\n人間的な感情として彼のいら立ちは理解できますが、それで彼の行動が正当化されるわけではありません。\n\n④ 職場での判断\n\nOn a business level, the decision makes sense. But on a human level, it's difficult to accept.\n\nビジネスの観点ではその決定は合理的です。しかし、人間的な感情としては受け入れがたいものです。\n\n⑤ 悲しみへの共感\n\nOn a very human level, we all understand the pain of losing someone.\n\n人間として、誰かを失う悲しみは誰もが理解できるものです。\n\n⑥ 不公平への反応\n\nOn a human level, it's natural to feel upset when you're treated unfairly.\n\n不公平な扱いを受けたときに腹が立つのは、人間として自然なことです。\n\n⑦ 社会問題\n\nOn a very human level, people want to feel safe and respected.\n\n人間として、人々は安全で尊重されていると感じたいものです。\n\n⑧ 相手への理解\n\nEven if I disagree with her, I can relate to her on a human level.\n\n彼女に賛成できなくても、人間的な感情として共感できます。\n\n⑨ 政策への反応\n\nThe policy may be economically effective, but on a human level, it raises difficult questions.\n\nその政策は経済的には効果的かもしれませんが、人間的な観点では難しい問題を提起します。\n\n⑩ 自然な感情\n\nOn a very human level, it's understandable that people want justice.\n\n人間としての自然な感情からすると、人々が正義を求めるのは理解できます。\n\n「先輩、この表現は、意見を単純な賛成・反対で終わらせず、別の視点から考えるときに役立つんです。」\n\n## 類義語・近い表現との違い\n\n「先輩、ここからは似た表現を比較しましょう。全部『人間的に』と訳してしまわないようにしてくださいね。」\n\non a human level\n\nオン・ア・ヒューマン・レヴェル\n\n核イメージ：人間としての感情や経験という側面から\n\nOn a human level, I understand her decision.\n\n人間的な感情として、彼女の決断は理解できます。\n\n「今日の中心表現です。very を加えると、人間的な側面をさらに強調します。」\n\nfrom a human perspective\n\nフロム・ア・ヒューマン・パースペクティヴ\n\n核イメージ：人間の立場・観点から考える\n\nFrom a human perspective, the decision is difficult.\n\n人間の立場から見ると、その決定は難しいものです。\n\n「perspective は『視点・見方』です。on a human level よりも、分析上の観点として使われることがあります。」\n\nemotionally\n\nイモウショナリー\n\n核イメージ：感情面では\n\nEmotionally, I understand why she's upset.\n\n感情面では、彼女が腹を立てる理由を理解できます。\n\n「先輩、emotionally は感情に直接焦点を当てます。on a human level は感情だけでなく、人間らしい経験や共感も含められます。」\n\npersonally\n\nパーソナリー\n\n核イメージ：私個人としては\n\nPersonally, I think the decision was unfair.\n\n個人的には、その決定は不公平だったと思います。\n\n「personally は自分自身の意見を表します。on a human level は、人間として共有し得る感情に注目することが多いんです。」\n\nas a human being\n\nアズ・ア・ヒューマン・ビーイング\n\n核イメージ：一人の人間として\n\nAs a human being, I can't ignore their suffering.\n\n一人の人間として、彼らの苦しみを無視することはできません。\n\n「こちらは『自分も一人の人間である』という立場を強調します。on a human level は判断する側面を示す表現ですね。」\n\non an emotional level\n\nオン・アン・イモウショナル・レヴェル\n\n核イメージ：感情という次元では\n\nOn an emotional level, I know how she feels.\n\n感情面では、彼女の気持ちが分かります。\n\n「on a human level と近いですが、こちらは特に感情の側面に限定して話すときに適しています。」\n\nI can relate to ～\n\nアイ・キャン・リレイト・トゥ\n\n核イメージ：自分の経験や感情と重ねて共感できる\n\nI can relate to what you're going through.\n\nあなたが経験していることには共感できます。\n\n「先輩、こちらは相手の経験や気持ちに直接共感する表現です。on a human level は、どの観点から理解しているかを示します。」\n\nfrom a moral standpoint\n\nフロム・ア・モラル・スタンドポイント\n\n核イメージ：道徳的な観点から\n\nFrom a moral standpoint, the decision is questionable.\n\n道徳的な観点からすると、その決定には疑問があります。\n\n「先輩、これは善悪や倫理の判断です。on a human level は人間的な感情への理解なので、同じではありません。」\n\n## 使い分け早見表\n\n| 表現 | 核イメージ |\n| --- | --- |\n| on a very human level | 人間としての自然な感情・経験の側面から |\n| on a human level | 人間的な側面から |\n| from a human perspective | 人間の視点から |\n| emotionally | 感情面では |\n| personally | 私個人としては |\n| as a human being | 一人の人間として |\n| on an emotional level | 感情という次元では |\n| I can relate to ～ | ～に共感できる |\n| from a moral standpoint | 道徳的な観点から |\n\n「先輩、特に personally と on a human level の違いは押さえてください。」\n\n「前者は『私個人の意見』、後者は『人間としての感情や経験という観点』です。」\n\n## 理解確認｜3問\n\nQ1. on a very human level の意味として最も適切なのは？\n\n人間としての自然な感情や経験の面では人間の能力が非常に高い段階では法律上の判断としては\n\nQ2. 『彼の怒りは理解できるが、行動には賛成しない』に最も自然なのは？\n\nI understand his anger on a human level, but I don't agree with his actions.I justify his actions because I understand his anger.I don't understand his anger or his actions.\n\nQ3. personally と on a human level の主な違いは？\n\npersonally は個人の意見、on a human level は人間的な感情や経験という側面personally は法律用語であるon a human level は必ず会社の立場を表す\n\n## 30秒復習\n\n「先輩、最後に重要なポイントを整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| on a very human level | 人間としての自然な感情の面では |\n| on a human level | 人間的な側面から |\n| on an emotional level | 感情面では |\n| from a human perspective | 人間の視点から |\n| as a human being | 一人の人間として |\n| I can relate to ～ | ～に共感できる |\n| understand someone's feelings | 誰かの感情を理解する |\n| justify someone's actions | 誰かの行動を正当化する |\n\n一文記憶\n\nOn a very human level, I understand how she feels, even though I don't agree with what she did.\n\n人間としての自然な感情からすると、彼女がどう感じているかは理解できます。たとえ彼女のしたことには賛成できなくても。\n\n「先輩、今日のポイントは 感情への理解と、行動への賛成は別ということです。」\n\n「on a very human level は、その違いを自然に表現できる便利な言い方なんですよ。」\n\n「ただ英語を訳すだけでなく、話し手がどの視点から物事を見ているのかまで意識してみてくださいね。」\n\n次は 第84語｜Feel like です。"}, {"name": "Feel like", "text": "# 第84語｜Feel like\n\n発音：/fiːl laɪk/（フィール・ライク）｜会話表現\n\n意味：～したい気分／～のように感じる／～のような気がする\n\n「先輩、今日の feel like は、英会話で本当によく使われる表現です。」\n\n「ただし、『～したい』という意味だけで覚えるのは危険ですよ。実は、後ろに何が続くかによって意味が変わるんです。」\n\nI feel like going for a walk.\n\n散歩に行きたい気分です。\n\nI feel like I'm forgetting something.\n\n何か忘れているような気がします。\n\nIt feels like a dream.\n\nまるで夢のように感じます。\n\n「先輩、同じ feel like でも、最初は『何かをしたい気分』、2番目は『そういう気がする』、3番目は『～のように感じる』ですね。」\n\n「今日はこの3つを軸に、want to、would like to、seem、feel as if などとの違いまで整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な4つの使い方を覚えましょう。」\n\n① feel like + -ing：～したい気分\n\nI feel like watching a movie.\n\n映画を見たい気分です。\n\n「今の気持ちとして、映画を見たいということですね。」\n\n② feel like + 名詞：～が欲しい気分／～のように感じる\n\nI feel like some coffee.\n\nコーヒーを飲みたい気分です。\n\nI feel like a beginner.\n\n初心者になったような気分です。\n\n「先輩、名詞が続く場合は、文脈によって『欲しい気分』にも『～のように感じる』にもなります。」\n\n③ feel like + 文：～のような気がする\n\nI feel like something is wrong.\n\n何かがおかしい気がします。\n\n「自分の感覚や印象を伝えています。」\n\n④ It feels like ～：まるで～のようだ\n\nIt feels like summer already.\n\nもう夏のように感じます。\n\n「周囲の状況から受ける感覚ですね。」\n\n核イメージ：自分が今感じている気分・感覚を言葉にする\n\n欲求 → ～したい気分\n\n直感 → ～のような気がする\n\n印象 → ～のように感じる\n\n「先輩、feel like は『自分の内側にある感覚』を表す表現だと覚えてください。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た表現との比較です。」\n\n「feel like は『欲求』と『感覚的な判断』の両方を表すので、比較する単語も2つのグループに分けると分かりやすいですよ。」\n\n### ① 「～したい」という意味の近い表現\n\nfeel like\n\nフィール・ライク\n\n核イメージ：今の気分として何かをしたい\n\nI feel like watching a movie.\n\n映画を見たい気分です。\n\n「先輩、今の感情や気分が中心です。」\n\nwant to\n\nウォント・トゥ\n\n核イメージ：何かをしたいという欲求・意思\n\nI want to watch a movie.\n\n映画を見たいです。\n\n「want to は最も基本的な希望の表現です。」\n\n「先輩、feel like は今の気分、want to はより広く欲求や希望を表します。」\n\n「例えば、将来の夢なら I want to become a doctor. が自然ですが、I feel like becoming a doctor. は『今、医者になりたい気分』という一時的な響きになりやすいです。」\n\nwould like to\n\nウッド・ライク・トゥ\n\n核イメージ：丁寧に希望を伝える\n\nI would like to ask a question.\n\n質問をしたいのですが。\n\n「would like to は丁寧な希望を表します。」\n\nI would like to have some coffee.\n\nコーヒーをいただきたいです。\n\n「先輩、feel like は気分、would like to は丁寧な希望という違いがあります。」\n\n「ビジネスや接客の場面では would like to が使いやすいですね。」\n\nbe in the mood for\n\nビー・イン・ザ・ムード・フォー\n\n核イメージ：あることを楽しみたい気分になっている\n\nI'm in the mood for pizza.\n\nピザが食べたい気分です。\n\n「先輩、これは feel like と非常に近い表現です。」\n\nI'm in the mood for a movie.\n\n映画を見たい気分です。\n\n「be in the mood for + 名詞、be in the mood to do、be in the mood for doing などの形があります。」\n\n「特に食べ物や娯楽について自然に使えます。」\n\ncrave\n\nクレイヴ\n\n核イメージ：何かを強く欲する\n\nI'm craving chocolate.\n\n無性にチョコレートが食べたいです。\n\n「crave は、強い欲求を表します。」\n\nShe craves attention.\n\n彼女は注目されることを強く求めています。\n\n「先輩、feel like は軽い気分でも使えますが、crave はもっと強い欲求です。」\n\n「『無性に～したい』という感覚ですね。」\n\nbe up for\n\nビー・アップ・フォー\n\n核イメージ：何かをする気がある・乗り気である\n\nAre you up for a walk?\n\n散歩に行く気はありますか？\n\n「be up for は、誘いに応じる気持ちや、何かをする意欲を表します。」\n\nI'm up for trying something new.\n\n何か新しいことを試してみる気があります。\n\n「先輩、feel like は今の気分、be up for は何かに参加する気持ちや意欲に重点があります。」\n\n### ② 「～のような気がする」という意味の近い表現\n\nfeel like\n\nフィール・ライク\n\n核イメージ：感覚的にそう思う\n\nI feel like something is wrong.\n\n何かがおかしい気がします。\n\n「先輩、はっきりした証拠がなくても、自分の感覚を伝えられます。」\n\nthink\n\nシンク\n\n核イメージ：考え・判断としてそう思う\n\nI think he's right.\n\n彼は正しいと思います。\n\n「think は、考えや判断を表す基本的な動詞です。」\n\nI think we need more time.\n\n私たちにはもっと時間が必要だと思います。\n\n「先輩、feel like は感覚的な印象を強調し、think は判断を表すことが多いです。」\n\n「ただし、日常会話では両者が近い意味になることもあります。」\n\nseem\n\nスィーム\n\n核イメージ：外から見て～のように思われる\n\nHe seems tired.\n\n彼は疲れているように見えます。\n\n「seem は、見聞きした情報や状況から受ける印象を表します。」\n\nIt seems like something is wrong.\n\n何かがおかしいようです。\n\n「先輩、feel like は自分の内側の感覚、seem は外から観察した印象に重点があることが多いです。」\n\n「ただし、必ずしも明確に分かれるわけではありません。」\n\nfeel as if\n\nフィール・アズ・イフ\n\n核イメージ：まるで～であるかのように感じる\n\nI feel as if I'm dreaming.\n\nまるで夢を見ているかのように感じます。\n\n「feel as if は、feel like + 文 と近い意味です。」\n\nShe felt as if the world had stopped.\n\n彼女はまるで世界が止まったかのように感じました。\n\n「先輩、feel as if は少し改まった文章でも使いやすく、比喩的な表現にもよく使われます。」\n\nhave a feeling\n\nハヴ・ア・フィーリング\n\n核イメージ：なんとなくそういう予感がある\n\nI have a feeling that something good will happen.\n\n何か良いことが起こる予感がします。\n\n「have a feeling は、直感や予感を表します。」\n\nI have a feeling he's hiding something.\n\n彼は何かを隠している気がします。\n\n「先輩、feel like よりも『予感がある』という意味がはっきりする場合があります。」\n\nsense\n\nセンス\n\n核イメージ：感覚的に察知する\n\nI sensed that something was wrong.\n\n何かがおかしいと感じ取りました。\n\n「sense は、言葉にならない情報や雰囲気を察知することです。」\n\nShe sensed his hesitation.\n\n彼女は彼のためらいを感じ取りました。\n\n「先輩、feel like は自分の印象を述べること、sense は何かを感覚的に察知することに重点があります。」\n\n## 同じ場面で比較しましょう\n\n「先輩、まず『今夜、映画を見たい』という場面です。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| feel like | I feel like watching a movie. | 今、映画を見たい気分 |\n| want to | I want to watch a movie. | 映画を見たい |\n| would like to | I'd like to watch a movie. | 映画を見たいです（丁寧） |\n| be in the mood for | I'm in the mood for a movie. | 映画を見る気分 |\n| crave | I'm craving a good movie. | 良い映画が無性に見たい |\n| be up for | I'm up for watching a movie. | 映画を見る気がある |\n\n「次は『何かがおかしい気がする』という場面です。」\n\n| 表現 | 英文 | ニュアンス |\n| --- | --- | --- |\n| feel like | I feel like something is wrong. | 感覚的におかしい気がする |\n| think | I think something is wrong. | おかしいと思う |\n| seem | It seems like something is wrong. | 状況からおかしいように思われる |\n| feel as if | I feel as if something is wrong. | おかしいように感じる |\n| have a feeling | I have a feeling something is wrong. | おかしいという予感がある |\n| sense | I sense that something is wrong. | おかしさを感じ取る |\n\n「先輩、feel like は非常に便利ですが、すべての場面で want to や think と交換できるわけではありません。」\n\n「今の気分なのか、将来の希望なのか、考えなのか、直感なのかを意識して選びましょう。」\n\n## 理解確認｜3問\n\nQ1. 『今日は外出する気分ではありません』として自然なのは？\n\nI don't feel like going out today.I don't feel like to go out today.I don't feel like go out today.\n\nQ2. 『何かがおかしい気がします』として自然なのは？\n\nI feel like something is wrong.I feel like to something is wrong.I feel like wrong something.\n\nQ3. feel like と plan on の違いは？\n\nfeel like は今の気分・感覚、plan on は予定・計画feel like は必ず過去を表すplan on は必ず感情を表す\n\n## 30秒復習\n\n「先輩、今日の重要表現を整理しましょう。」\n\n| 表現 | 意味 |\n| --- | --- |\n| feel like doing ～ | ～したい気分 |\n| don't feel like doing ～ | ～する気分ではない |\n| feel like + 名詞 | ～が欲しい気分／～のように感じる |\n| feel like + 文 | ～のような気がする |\n| It feels like ～ | まるで～のようだ |\n| Do you feel like ～? | ～したい気分ですか？ |\n| I just feel like it. | ただそうしたい気分 |\n| feel like oneself | いつもの自分らしく感じる |\n| want to | ～したい |\n| would like to | ～したい（丁寧） |\n| be in the mood for | ～の気分である |\n| crave | 強く欲する |\n| be up for | ～する気がある |\n| think | 考え・判断として思う |\n| seem | ～のように見える・思われる |\n| feel as if | まるで～のように感じる |\n| have a feeling | 予感がある |\n| sense | 感覚的に察知する |\n\n一文記憶\n\nI feel like studying English, but I don't feel like doing anything too difficult today.\n\n英語を勉強したい気分ですが、今日はあまり難しいことをする気分ではありません。\n\n「先輩、今日のポイントは feel like = 自分が今感じている気分・感覚を表すということです。」\n\n「そして、文法では feel like doing を確実に覚えてください。」\n\n「want to は広く『～したい』、feel like は『今、そういう気分』です。」\n\n「この違いを意識するだけで、日常会話で自分の気持ちをずっと自然に伝えられるようになりますよ。」\n\n次は 第85語｜Certain です。"}, {"name": "Certain", "text": "# 第85語｜Certain\n\n発音：/ˈsɝː.tən/（サートゥン）｜形容詞・限定詞\n\n意味：確信している／確実な／ある特定の／ある程度の\n\n「先輩、今日の単語は certain です。」\n\n「この単語、実は少し厄介なんですよ。『確かな』と覚えるだけでは、英文によって意味が分からなくなってしまいます。」\n\nまず、次の3文を比べてください。\n\nI'm certain that he's telling the truth.\n\n彼が本当のことを言っていると確信しています。\n\nCertain people disagree with the decision.\n\nある特定の人々は、その決定に反対しています。\n\nThere's a certain risk involved.\n\nそこにはある程度のリスクが伴います。\n\n「先輩、気づきましたか？ 同じ certain なのに、意味が違いますよね。」\n\n「でも、バラバラに暗記する必要はありません。曖昧なものの中から、何かをはっきりさせるというイメージでつながるんです。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、certain には大きく4つの意味があります。」\n\n① 確信している\n\nI'm certain that I made the right decision.\n\n自分が正しい決断をしたと確信しています。\n\n「話し手の中で、疑いがほとんどない状態ですね。」\n\n② 確実な・必ず起こる\n\nSuccess is not certain.\n\n成功するとは限りません。\n\n「今度は、人の気持ちではなく、出来事の確実性について話しています。」\n\n③ ある特定の・一部の\n\nCertain employees have access to this information.\n\n一部の特定の従業員は、この情報にアクセスできます。\n\n「先輩、ここでは『確信している従業員』ではありませんよ。」\n\n「certain + 複数名詞 で『ある特定の～』『一部の～』という意味です。」\n\n④ ある程度の・多少の\n\nThe job requires a certain level of experience.\n\nその仕事には、ある程度の経験が必要です。\n\n「これは程度や水準を表しています。」\n\n核イメージ：不明確なものの中から、何かを定める\n\n判断が定まる → 確信している\n\n対象が定まる → ある特定の\n\n水準を示す → ある程度の\n\n「ただし、先輩。これは覚えるためのイメージです。『ある特定の』という意味では、具体的に誰なのかを明かさず、あえてぼかすこともあります。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが大切です。」\n\n「certain の類義語は、『確信している』という意味と、『特定の』という意味で分けて考えましょう。」\n\n### ① 「確信している・確実な」の類義語\n\ncertain\n\nサートゥン\n\n核イメージ：疑いがなく、確信している\n\nI'm certain that he's right.\n\n彼が正しいと確信しています。\n\n「先輩、判断がはっきり定まっている状態です。」\n\nsure\n\nシュア\n\n核イメージ：自分の中で確信がある\n\nI'm sure he'll come.\n\n彼は来ると思います。\n\n「sure は日常会話で非常によく使われます。」\n\nAre you sure?\n\n本当にそうですか？\n\n「先輩、certain と sure はかなり近いですが、sure の方が会話的で、certain は少し改まった響きになることがあります。」\n\n「ただし、確信の強さに明確な上下関係があるわけではありません。」\n\nconfident\n\nコンフィデント\n\n核イメージ：自信を持っている\n\nI'm confident that we can finish on time.\n\n私たちは時間どおりに終えられると自信を持っています。\n\n「confident は、能力・経験・根拠などに基づく自信を表すことが多いです。」\n\nShe is confident in her abilities.\n\n彼女は自分の能力に自信を持っています。\n\n「先輩、certain は確実だと確信すること、confident は自信を持っていることに重点があります。」\n\ndefinite\n\nデフィニット\n\n核イメージ：はっきり定まっている・明確な\n\nWe need a definite answer.\n\n私たちには明確な答えが必要です。\n\n「definite は、曖昧さがなく、内容がはっきりしていることに重点があります。」\n\nThere is a definite improvement.\n\n明らかな改善があります。\n\n「先輩、certain は確信や確実性、definite は明確さや確定していることに重点があります。」\n\nguaranteed\n\nギャランティード\n\n核イメージ：保証されている\n\nSuccess is not guaranteed.\n\n成功が保証されているわけではありません。\n\n「guaranteed は、保証や確約があることを表します。」\n\nThe product comes with a guaranteed refund.\n\nその商品には返金保証が付いています。\n\n「先輩、certain は確実性、guaranteed は保証されていることに重点があります。」\n\ninevitable\n\nイネヴィタブル\n\n核イメージ：避けられない・必然的な\n\nSome mistakes are inevitable.\n\nある程度のミスは避けられません。\n\n「inevitable は、状況や因果関係から避けられないことを表します。」\n\nChange is inevitable.\n\n変化は避けられません。\n\n「先輩、certain は起こることが確実、inevitable は起こることを避けられない、という違いです。」\n\n### ② 「特定の・ある程度の」の類義語\n\ncertain\n\nサートゥン\n\n核イメージ：対象を限定するが、具体的には明かさないこともある\n\nCertain employees can access t
