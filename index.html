 の違いは？\n\n……\n\n**vague 🌫️**\n→ **ぼんやりして具体性がない**\n\n**ambiguous ↔️**\n→ **複数の解釈ができる**\n\nです。\n\n### Q3\n\n> **I have a vague memory of him.**\n\nなら？\n\n……\n\n**「彼についてぼんやりとした記憶があります。」**\n\nつまり、\n\n「覚えてはいるんです。でも細かいところまでは……」\n\nですね。\n\n# 【30秒復習】\n\n① **vague**  \n→ 曖昧な・漠然とした\n\n② 発音  \n→ **ヴェイグ**\n\n③ 核イメージ  \n→ 🌫️ **輪郭・内容がぼんやり**\n\n④ **vague answer**  \n→ 曖昧な返事\n\n⑤ **vague idea**  \n→ 漠然とした考え\n\n⑥ **vague memory**  \n→ ぼんやりした記憶\n\n⑦ **ambiguous ↔️**  \n→ 複数の解釈ができる\n\n⑧ **unclear ❓**  \n→ はっきり分からない\n\n⑨ **obscure 🌑**  \n→ 分かりにくい・あまり知られていない\n\n⑩ **definite 📌**  \n→ はっきり定まっている\n\n# 【一文で覚える】\n\n> **vague =「何となくは分かるんですけど……輪郭がぼんやりしてるんですよね」🌫️**\n\n「先輩、ここは対比で一気に覚えましょう。」\n\n**definite 📌 → ピンを刺せるほど定まっている**  \n**vague 🌫️ → 霧がかかってぼんやり**  \n**ambiguous ↔️ → AにもBにも解釈できる**  \n**obscure 🌑 → 意味が見えにくい**\n\n「全部『曖昧』と訳されることがありますけど、頭の中の景色はちゃんと違いますからね。」"}, {"name": "obvious", "text": "obvious /ˈɑːbviəs/\n\n読み方：オブヴィアス\n\n「先輩、obvious = 明らかなだけで終わらせないでくださいね。」\n\n核イメージは、\n\n👀💡 obvious =「隠れていない。見れば・考えれば、誰でもすぐ分かるほど明らか」\n\nです。\n\nA【要点｜「見れば分かるでしょ？」】\n\n「先輩、外を見たらこうだったとします。」\n\n☔☔☔\n🌧️ザーザー\n\nそこで私が、\n\nIt's obvious that it's raining.\n\nと言った。\n\n「……まあ、見れば分かりますよね。」\n\nこれが obvious です。\n\n証拠を集めて難しく推理する必要はありません。\n\n情報を見る\n↓\n答えがほぼそのまま見えている\n↓\n👀「明らかですよね」\n↓\nobvious\n\nです。\n\nB【詳しい解説｜「明らか」ってどういうこと？】\n\nたとえば試験結果を見た人が、\n\n😄「やった！」\n\nと飛び跳ねている。\n\n先輩が、\n\n「あの人、うれしいのかな？」\n\nと言ったら……\n\n「先輩。たぶん、というか……obvious ですよね。」\n\nIt was obvious that she was happy.\n\n「彼女が喜んでいるのは明らかでした。」\n\n表情\n↓\n声\n↓\n行動\n↓\n全部が「うれしい」と示している\n\nだから、\n\n👀 誰が見ても分かるほど明白\n\nなんです。\n\nC【イメージ理解｜答えが丸見え】\n\n「クイズを想像してください。」\n\nQ. 日本の首都は？\n\nA. 東京\nB. パリ\nC. ロンドン\n\n先輩「Aかな……？」\n\n「そこは迷わないでください。」\n\n答えがほぼ丸見えですよね。\n\n💡 The answer is obvious.\n\n「答えは明らかです。」\n\n頭の中では、\n\n❓ → 長く考える\n\nではなく、\n\n👀 → 💡 「見れば分かる」\n\nこれが obvious です。\n\nD【具体例｜頻出表現】\n① It is obvious that ～\n\nこれは重要です。\n\nIt is obvious that something is wrong.\n\n「何かがおかしいのは明らかです。」\n\nIt is obvious that S + V\n→ ～なのは明らかだ\n\nですね。\n\n② obvious difference\n\nThere is an obvious difference between the two products.\n\n「その2つの製品には明らかな違いがあります。」\n\nパッと比較して、\n\nA 🔴　　B 🔵\n\n「違いますよね。」\n\nと分かるレベルです。\n\n③ obvious reason\n\nHe left for an obvious reason.\n\n「彼が去った理由は明らかでした。」\n\n理由が隠れておらず、簡単に理解できる。\n\n④ obviously\n\n副詞も非常によく使います。\n\nShe was obviously nervous.\n\n「彼女は明らかに緊張していました。」\n\n手が震える、声が震える、落ち着かない……\n\n👀「緊張してるな」\n\nと分かる。\n\nobvious\n→ 形容詞「明らかな」\n\nobviously\n→ 副詞「明らかに」\n\nです。\n\n【類義語｜「明らか」を分けます】\n単語\t核イメージ\nobvious\t👀 誰でもすぐ分かるほど明白\nclear\t🔍 曖昧さがなく明確\napparent\t👁️ 見たところ明らか・明らかになった\nevident\t🧾 証拠・状況から明らか\ndistinct\t🔲｜🔳 他と明確に区別できる\nobvious 👀\n\nIt was obvious that he was lying.\n\n「彼が嘘をついているのは明らかでした。」\n\n→ 👀 誰が見ても分かるレベル\n\n「先輩、嘘が下手すぎるんですよ。」\n\nclear 🔍\n\nThe instructions are clear.\n\n「指示は明確です。」\n\nこれは、\n\n🌫️ 曖昧ではない\n↓\n🔍 内容がはっきり理解できる\n\nという意味。\n\nobvious 👀\n\n→ 分かるのが簡単\n\nclear 🔍\n\n→ 内容に曖昧さがない\n\nです。\n\nevident 🧾\n\nIt was evident from the data that sales were falling.\n\n「データから、売上が落ちていることは明らかでした。」\n\nここでは、\n\n📊 データ\n↓\n📉 売上低下\n↓\n🧾 証拠から明らか\n\nという感じです。\n\nobvious 👀\n→ 見ればすぐ分かる\n\nevident 🧾\n→ 証拠・事実から明らか\n\napparent 👁️\n\nIt became apparent that the plan had failed.\n\n「その計画が失敗したことが明らかになりました。」\n\napparent は、\n\n👁️ 見たところ明らかな／状況から明らかになった\n\nという感覚があります。\n\nただし注意。\n\napparent\n\nには文脈によって、\n\n「一見したところの・見かけ上の」\n\nという意味もあります。\n\nHis apparent confidence was actually nervousness.\n\nなら、\n\n「彼の見かけ上の自信は、実は緊張だった。」\n\nつまり、\n\n👁️ そう見える\n\nというニュアンスを持てるんです。\n\nここは obvious との大きな違いですね。\n\n【最近の単語を一本につなげます】\n\n「先輩、かなりきれいなグループができてきました。」\n\nvague 🌫️\n→ ぼんやりしている\n\ndefinite 📌\n→ 内容・決定が定まっている\n\ndistinct 🔲｜🔳\n→ AとBを明確に区別できる\n\nobvious 👀\n→ 誰が見てもすぐ分かる\n\nたとえば、\n\nan obvious difference\n\nなら、\n\n👀 見ればすぐ分かる違い\n\na distinct difference\n\nなら、\n\n🔲｜🔳 明確に区別できる違い\n\nです。\n\nかなり意味は近づきますが、**obvious は「気づきやすさ」**が強い、と考えると分かりやすいですよ。\n\n【理解確認】\nQ1\n\nobvious の核イメージは？\n\nA. 内容がぼんやりしている\nB. 誰でもすぐ分かるほど明らか\nC. 複数の解釈ができる\n\n……\n\nBです。👀\n\nQ2\n\nobvious と clear の違いは？\n\n……\n\nobvious 👀\n→ 見ればすぐ分かる\n\nclear 🔍\n→ 曖昧さがなく明確\n\nです。\n\nQ3\n\nShe was obviously angry.\n\nなら？\n\n……\n\n「彼女が怒っているのは明らかだった。」\n\nですね。\n\n😡💢\n\n「……これは声をかける前に気づいてくださいね、先輩。」\n\n【30秒復習】\n\n① obvious\n→ 明らかな・明白な\n\n② 発音\n→ オブヴィアス\n\n③ 核イメージ\n→ 👀 見ればすぐ分かるほど明白\n\n④ It is obvious that ～\n→ ～なのは明らかだ\n\n⑤ obvious difference\n→ 誰でも分かる明らかな違い\n\n⑥ obviously\n→ 明らかに\n\n⑦ clear 🔍\n→ 曖昧さがなく明確\n\n⑧ evident 🧾\n→ 証拠・状況から明らか\n\n⑨ apparent 👁️\n→ 見たところ明らか／明らかになった\n\n⑩ vague 🌫️\n→ ぼんやりして曖昧\n\n【一文で覚える】\n\nobvious =「先輩、これ……見れば分かりますよね？」👀💡\n\nvague 🌫️ → ぼんやりして分からない\nclear 🔍 → 曖昧さがなく分かる\nevident 🧾 → 証拠から分かる\napparent 👁️ → 見たところ分かる\nobvious 👀 → 誰でもすぐ分かる\n\n「特に **obvious =『明らか』ではなく、『明らかすぎて簡単に気づける』**までイメージしてください。そこまで入れば、もう訳語に頼らなくて済みますよ。」"}, {"name": "respect", "text": "⚠️ **重複チェック：respect は、この「単語」プロジェクト内ですでに登場しています。**  \n特に **respectively** を学習した際にも語源的につながる語として扱っています。今回は **respect = 尊敬** だけでなく、重要な **「点・観点」「尊重する」** までまとめて固めましょう。\n\n## respect /rɪˈspekt/\n**読み方：リスペクト**\n\n「先輩、日本語でも『リスペクトする』って言いますよね。でも英語の **respect** はそれより範囲が広いんです。」\n\n核イメージは、\n\n> 👀 **respect =「相手・物事をきちんと見て、その価値や重要性を認める」**\n\nここから、\n\n**① 尊敬する・尊重する【動詞】**  \n**② 尊敬・尊重【名詞】**  \n**③ 点・観点・面【名詞】**\n\nへ広がります。\n\n# A【要点｜相手をちゃんと見る】\n\nたとえば先輩に、長年努力して技術を身につけた人がいるとします。\n\nその人の、\n\n努力  \n↓  \n能力  \n↓  \n実績\n\nをきちんと認めて、\n\n> 「この人はすごい。」\n\nと思う。\n\nこれが、\n\n> **I respect him.**\n\n**「私は彼を尊敬しています。」**\n\nです。\n\nただ「好き」ということではありません。\n\n> 👀 **その人の価値・能力・考えなどを認めて大切に扱う**\n\nのが **respect** です。\n\n---\n\n# B【詳しい解説｜「尊敬」と「尊重」】\n\n「先輩、ここは日本語訳を分けましょう。」\n\n### 人の能力・人格を認める\n\n> **I respect my teacher.**\n\n**「私は先生を尊敬しています。」**\n\n🏅 **尊敬する**\n\nですね。\n\n一方、\n\n> **We must respect other people's opinions.**\n\nなら、\n\n**「他人の意見を尊重しなければなりません。」**\n\n「他人の意見を尊敬する」だと少し変ですよね。\n\nここでは、\n\n自分とは違う意見がある  \n↓  \nでも、その意見を無価値として扱わない  \n↓  \n相手の考えとしてきちんと認める  \n↓  \n🤝 **尊重する**\n\nです。\n\nつまり **respect** は、\n\n> 👀 **「価値・権利・考えをちゃんと認めて扱う」**\n\nというところで「尊敬」と「尊重」がつながっています。\n\n---\n\n# C【イメージ理解｜「好きじゃなくても respect できる」】\n\n「ここ、かなり重要ですよ。」\n\n先輩とAさんは意見が正反対。\n\n先輩：\n「私はAだと思う。」\n\nAさん：\n「私はBだと思う。」\n\n先輩はAさんに同意できない。\n\nでも、\n\n> 「考えは違う。でも、あなたがそう考える権利は認めます。」\n\nと言える。\n\nこれも、\n\n> **I respect your opinion.**\n\nです。\n\nつまり、\n\n❤️ **like**\n→ 好き\n\n👍 **agree**\n→ 同意する\n\n👀🤝 **respect**\n→ 価値・立場・権利などを認める\n\n「**respect = 好き・同意する、ではない**んですよ。」\n\n---\n\n# D【具体例｜実は「観点」という意味もあります】\n\n### ① respect someone\n\n> **I really respect her.**\n\n**「私は彼女を本当に尊敬しています。」**\n\n---\n\n### ② respect someone's decision\n\n> **I respect your decision.**\n\n**「あなたの決定を尊重します。」**\n\n「私はその決定に賛成です」とは限りません。\n\n**あなた自身が下した決定として認めます**\n\nということです。\n\n---\n\n### ③ show respect for ～\n\n> **We should show respect for others.**\n\n**「私たちは他人に敬意を示すべきです。」**\n\n**show respect for ～**\n→ **～に敬意を示す**\n\nこれはセットで覚えてください。\n\n---\n\n### ④ in this respect\n\n「先輩、これがかなり重要な別の意味です。」\n\n> **The two systems are similar in this respect.**\n\n**「この点では、その2つのシステムは似ています。」**\n\nここでの **respect** は、\n\n❌ 尊敬\n\nではありません。\n\n> 🔎 **点・面・観点**\n\nです。\n\n**in this respect**\n→ **この点では**\n\nこれは文章やニュースでも使いやすい表現です。\n\n---\n\n### ⑤ with respect to ～\n\n> **With respect to cost, this plan is better.**\n\n**「コストに関しては、この計画のほうが優れています。」**\n\n**with respect to ～**\n→ **～に関して**\n\nです。\n\n---\n\n# 【類義語｜respect / admire / appreciate】\n\n「はい先輩。ここを全部『尊敬する』にしないでください。」\n\n| 単語 | 核イメージ |\n|---|---|\n| **respect** | 👀🤝 価値・能力・権利を認める |\n| **admire** | ✨ すごい・素敵だと感心する |\n| **look up to** | 👆 人を尊敬して見上げる |\n| **appreciate** | 💎 価値・ありがたさを理解する |\n| **honor** | 🎖️ 敬意を示し称える |\n\n## respect 👀🤝\n\n> **I respect his honesty.**\n\n**「私は彼の誠実さを尊敬しています。」**\n\n→ その価値を**認めている**\n\n---\n\n## admire ✨\n\n> **I admire her courage.**\n\n**「私は彼女の勇気に感心しています。」**\n\n「すごいなあ」\n\nと**感嘆・称賛する気持ち**が強いです。\n\n### respect 👀\n→ 価値を認める\n\n### admire ✨\n→ 素晴らしいと感心する\n\nですね。\n\n---\n\n## look up to 👆\n\n> **I've always looked up to my father.**\n\n**「私はずっと父を尊敬してきました。」**\n\nこれは文字通り、\n\n👆 **見上げる**\n\nイメージ。\n\n**尊敬する人物・憧れの人物として見る**感じがあります。\n\n---\n\n## appreciate 💎\n\n> **I appreciate your help.**\n\n**「助けてくれて感謝しています。」**\n\nこれは、\n\n💎 **価値・ありがたさをちゃんと理解する**\n\nという感覚です。\n\n**respect a person**\n→ その人の価値・能力を認める\n\n**appreciate someone's help**\n→ 助けのありがたさを認識する\n\nという違いですね。\n\n---\n\n# 【respectivelyとのつながり】\n\n「以前学習した **respectively** ともつなげておきます。」\n\n> **Tom and Mary are 20 and 25, respectively.**\n\n**「トムとメアリーは、それぞれ20歳と25歳です。」**\n\n**respectively**\n→ **それぞれ・各々**\n\nこれは現代英語では一つの副詞として覚えるのが実用的ですが、**respect** には「点・事項・関係」といった意味の広がりがあることも覚えておくと、関連語を整理しやすくなります。\n\n---\n\n# 【理解確認】\n\n### Q1\n\nrespect の核イメージは？\n\nA. 好きになる  \nB. 価値・能力・権利などを認める  \nC. 同意する\n\n……\n\n**Bです。👀🤝**\n\n### Q2\n\n> **I respect your opinion.**\n\nは、\n\n「あなたの意見に賛成です」\n\nでしょうか？\n\n……\n\n**違います。**\n\n**「あなたの意見を尊重します。」**\n\nです。\n\n同意していなくても respect はできます。\n\n### Q3\n\n> **in this respect**\n\nは？\n\n……\n\n**「この点では」🔎**\n\nです。\n\n「ここで『この尊敬では』なんて訳さないでくださいね。」\n\n# 【30秒復習】\n\n① **respect**  \n→ 尊敬する・尊重する／尊敬・敬意／点・観点\n\n② 発音  \n→ **リスペクト**\n\n③ 核イメージ  \n→ 👀 **価値・重要性をきちんと認める**\n\n④ **respect someone**  \n→ 人を尊敬する\n\n⑤ **respect someone's opinion**  \n→ 人の意見を尊重する\n\n⑥ **show respect for ～**  \n→ ～に敬意を示す\n\n⑦ **in this respect**  \n→ この点では\n\n⑧ **with respect to ～**  \n→ ～に関して\n\n⑨ **admire ✨**  \n→ 素晴らしいと感心する\n\n⑩ **look up to 👆**  \n→ 人を尊敬して見上げる\n\n# 【一文で覚える】\n\n> **respect =「自分と違ってもいいんです。その人・考えの価値を、ちゃんと認めて扱います」👀🤝**\n\n「先輩、**respect = 尊敬する**だけで終わらせないでください。」\n\n**respect 👀🤝 → 価値を認める**  \n**admire ✨ → すごいと感心する**  \n**look up to 👆 → 人を尊敬・敬愛する**  \n**agree 👍 → 意見に同意する**\n\nこの違いが分かれば、**I respect your opinion, but I disagree.（あなたの意見は尊重しますが、私は反対です）**も自然に理解できますよ。"}, {"name": "aspect", "text": "aspect /ˈæspekt/\n\n読み方：アスペクト\n\n「先輩、aspect = 側面って覚えていると思います。でも日本語の『側面』も少し抽象的ですよね。」\n\n核イメージは、\n\n🔄 aspect =「1つの物事を、ある方向から見たときに見える一面」\n\nです。\n\nA【要点｜見る方向を変える】\n\n「先輩、会社を一つ想像してください。」\n\n同じ会社でも、\n\n💰 お金の面\n👥 人材の面\n💻 技術の面\n📈 成長性の面\n\nがありますよね。\n\n会社そのものは一つです。\n\nでも、\n\nどの方向から見るかによって、注目する面が変わる。\n\nこの一つ一つが aspect です。\n\nWe need to consider every aspect of the problem.\n\n「その問題のあらゆる側面を考える必要があります。」\n\nつまり、\n\n🔄「こっちから見たらどう？」\n🔄「じゃあ、こっちからは？」\n\nという感覚です。\n\nB【詳しい解説｜なぜ「側面」なの？】\n\n「たとえば先輩が転職先を考えるとします。」\n\n給料だけなら、\n\n💰「この会社がいい」\n\nでも、\n\n勤務時間を見ると\n⏰「こっちかな」\n\n仕事内容を見ると\n💼「いや、こっちかも」\n\n勤務地を見ると\n🚃「これは重要だな」\n\nとなります。\n\n全部、\n\ndifferent aspects of a job\n\n「仕事のさまざまな側面」\n\nです。\n\nつまり、\n\n一つの対象がある\n↓\n見るポイントを変える\n↓\n違う特徴が見える\n↓\n🔄 aspect\n\nなんです。\n\n「aspect = 別の物じゃありません。同じ物の“別の面”ですよ。」\n\nC【イメージ理解｜サイコロです】\n\n「サイコロを想像してください。」\n\n🎲\n\n正面から見ると「1」。\n\n横から見ると「3」。\n\n上から見ると「5」。\n\nでも全部、\n\n同じサイコロ\n\nですよね。\n\nこれが aspect のイメージにかなり近いです。\n\n🎲 対象は同じ。でも、見る面が違う。\n\nだから、\n\nfinancial aspect\n→ 💰 金銭面\n\nsocial aspect\n→ 👥 社会的側面\n\ntechnical aspect\n→ 💻 技術面\n\nとなります。\n\nD【具体例｜よく使う形】\n① aspect of ～\n\nThis is an important aspect of the job.\n\n「これはその仕事の重要な側面です。」\n\n仕事全体の中の、\n\n🔄 一つの面\n\nですね。\n\n② every aspect of ～\n\nTechnology affects every aspect of our lives.\n\n「テクノロジーは私たちの生活のあらゆる側面に影響を与えています。」\n\n仕事\n教育\n買い物\nコミュニケーション……\n\n生活をいろいろな面から見ても影響している、ということです。\n\n③ positive / negative aspects\n\nWe should consider both the positive and negative aspects of the plan.\n\n「その計画の良い面と悪い面の両方を検討すべきです。」\n\n👍 positive aspect\n👎 negative aspect\n\n「一方向だけ見て判断しない、ということですね。」\n\n④ financial aspect\n\nLet's consider the financial aspect first.\n\n「まず金銭面を検討しましょう。」\n\n計画全体ではなく、\n\n💰 お金という観点から見る\n\nということです。\n\n【類義語｜aspect / perspective / viewpoint / feature】\n\n「先輩、ここを整理すると一気に使いやすくなります。」\n\n単語\t核イメージ\naspect\t🔄 物事そのものが持つ一つの側面\nperspective\t👓 物事を見る立場・捉え方\nviewpoint\t👁️ 意見・立場としての視点\nfeature\t🔍 その物が持つ特徴\nrespect\t📍 「点・面」の意味でも使う\naspect 🔄\n\nWe examined the economic aspects of the issue.\n\n「その問題の経済的側面を検討しました。」\n\n→ 問題そのものの一つの面\n\nperspective 👓\n\nTry to see it from her perspective.\n\n「彼女の立場から考えてみてください。」\n\nこれは、\n\n👓 誰の目から見るか\n\nです。\n\nだから、\n\naspect 🔄\n→ 何の面を見るか\n\nperspective 👓\n→ どの立場から見るか\n\n「ここ、かなり大事ですよ。」\n\nviewpoint 👁️\n\nFrom my viewpoint, the plan is too risky.\n\n「私の観点では、その計画はリスクが高すぎます。」\n\n→ その人の立場・意見としての見方\n\nperspective とかなり近いですが、**viewpoint は意見・立場としての「視点」**を表しやすいです。\n\nfeature 🔍\n\nSafety is an important feature of this car.\n\n「安全性はこの車の重要な特徴です。」\n\nこれは以前の character / feature 系とつながります。\n\naspect 🔄\n→ ある方向から見た側面\n\nfeature 🔍\n→ その物が備えている特徴\n\nです。\n\n【直前の respect とつなげます】\n\n「先輩、ちょうどいいですね。」\n\n前回、\n\nin this respect\n\n→ この点では\n\nをやりました。\n\nrespect 📍\n→ 特定の「点・観点」\n\naspect 🔄\n→ 物事を構成する「側面」\n\nたとえば、\n\nThe two products are similar in this respect.\n\n「この点では2つの製品は似ています。」\n\n一方、\n\nLet's examine the safety aspect of both products.\n\n「両製品の安全面を検討しましょう。」\n\nとなります。\n\n【理解確認】\n\n「先輩、3問です。」\n\nQ1\n\naspect の核イメージは？\n\nA. 人の意見\nB. 一つの物事をある方向から見た一面\nC. 物の大きさ\n\n……\n\nBです。🔄\n\nQ2\n\naspect と perspective の違いは？\n\n……\n\naspect 🔄\n→ 何の面を見るか\n\nperspective 👓\n→ どの立場から見るか\n\nです。\n\nQ3\n\nWe need to consider all aspects of the problem.\n\nなら？\n\n……\n\n「その問題のあらゆる側面を考慮する必要があります。」\n\nですね。\n\n【30秒復習】\n\n① aspect\n→ 側面・面\n\n② 発音\n→ アスペクト\n\n③ 核イメージ\n→ 🔄 同じ物事を、ある方向から見た一面\n\n④ an aspect of ～\n→ ～の一側面\n\n⑤ every aspect of ～\n→ ～のあらゆる側面\n\n⑥ financial aspect 💰\n→ 金銭面\n\n⑦ positive / negative aspects\n→ 良い面／悪い面\n\n⑧ perspective 👓\n→ 見る人の立場・捉え方\n\n⑨ viewpoint 👁️\n→ 意見・立場としての視点\n\n⑩ feature 🔍\n→ その物が持つ特徴\n\n【一文で覚える】\n\naspect =「同じものですよ、先輩。ただ今度は“こっちの面”から見てみましょう」🔄\n\naspect 🔄 → 物事のどの面？\nperspective 👓 → 誰の立場から見る？\nfeature 🔍 → どんな特徴を持っている？\nrespect 📍 → どの点について？\n\n「aspect = 側面を日本語だけで暗記せず、サイコロをくるっと回して別の面を見る🎲。この映像で覚えてくださいね。」"}, {"name": "Relevant", "text": "# 第24語｜Relevant\n\n発音：/ˈreləvənt/（レラヴァント）｜形容詞\n\n意味：関連がある、関係している、話題や目的にとって重要な\n\n先輩、今回の relevant は、単に「関係がある」と覚えるだけでは不十分です。\\*\\*「今の話や目的に関係があって、考慮する意味がある」\\*\\*という感覚まで押さえましょう。\n\n4分割理解・記憶シート\n\n24 / 100\n\n## D｜具体例で使いこなしましょう\n\n① 仕事・会議\n\nPlease provide any relevant documents.\n\n関連する書類があれば提出してください。\n\n「relevant documents は、業務でも非常によく使います。」\n\n② 就職活動\n\nDo you have any relevant work experience?\n\n関連する職務経験はありますか？\n\n「この場合は、応募している仕事に役立つ経験があるかを聞いています。」\n\n③ 日常会話\n\nThat's not relevant to what we're talking about.\n\nそれは今話していることとは関係ありません。\n\n「少し直接的な表現なので、相手や場面には気を付けましょう。」\n\n④ 情報収集\n\nI couldn't find any relevant information.\n\n関連する情報を何も見つけられませんでした。\n\n⑤ 状況の変化\n\nThat rule is no longer relevant.\n\nそのルールはもはや今の状況に当てはまりません。\n\n「このように relevant は、人の発言、資料、経験、規則など、幅広い対象に使えます。」\n\n## 類義語・近義語の違い\n\n「先輩、ここからが大切です。似た単語を区別できるようになると、英文の意味がずっと正確につかめます。」\n\n| 単語 | 核となるイメージ | ニュアンス |\n| --- | --- | --- |\n| relevant | 目的に結びつく | 今の話題や判断に関係する |\n| related | 線でつながる | 二つの物事の間に関係がある |\n| applicable | 当てはめられる | 規則・知識などが特定の状況に適用できる |\n| pertinent | 論点を突く | その話題に直接関係する。やや硬い |\n| appropriate | 場面に合う | 状況にふさわしい、適切な |\n\nRelevant\n\nThis data is relevant to our research.\n\nこのデータは私たちの研究に関連しています。\n\nRelated\n\nThese two problems are closely related.\n\nこの二つの問題は密接に関係しています。\n\nApplicable\n\nThis rule is applicable to all employees.\n\nこの規則は全従業員に適用されます。\n\nPertinent\n\nShe asked a pertinent question.\n\n彼女は的を射た質問をしました。\n\nAppropriate\n\nThat response was appropriate for the situation.\n\nその対応は状況にふさわしいものでした。\n\n「先輩、appropriate は『関連している』よりも『ふさわしい』という意味が中心です。似ているからといって、何でも置き換えられるわけではありませんよ。」\n\n## 理解確認｜3問\n\nQ1. relevant to の意味として最も適切なのは？\n\n～に関連している～に反対している～を思い出す\n\nQ2. related と relevant の違いは？\n\nまったく同じ意味related はつながり、relevant は話題や目的との関連性relevant は人にしか使えない\n\nQ3. 『その情報は今の議論に関係ありません』に近い英文は？\n\nThat information is relevant to our discussion.That information is not relevant to our discussion.That information is applicable to everyone.\n\n## 30秒復習\n\n「最後に先輩、これだけは忘れないでくださいね。」\n\n- relevant：今の話題や目的に関係がある\n- relevant to ～：～に関連している\n- related：単につながりがある\n- irrelevant：関係がない\n\n一文記憶：\n\nOnly include information relevant to the topic.\n\nその話題に関係する情報だけを含めてください。\n\n「よし、これで第24語は終了です。先輩、関連性を考えるときは、必ず『何に対して？』と問いかけてくださいね。」\n\n次は 第25語｜Pretty です。「次」と入力してください。"}, {"name": "Pretty", "text": "# 第25語｜Pretty\n\n発音：/ˈprɪti/（プリティ）｜形容詞・副詞\n\n先輩、pretty と聞くと「かわいい」を思い浮かべませんか？\n\nもちろん正解です。でも、日常英会話では pretty good（かなりいい） や pretty tired（かなり疲れた） のように、副詞としても頻繁に使われるんです。\n\n「かわいい」だけで覚えてしまうと、会話で出てくる pretty を取り違えてしまいますから、今日は二つの使い方をしっかり区別しましょう。\n\n4分割理解・記憶シート\n\n第25語\n\n## A｜要点\n\n「先輩、pretty には、まず二つの大きな意味があります。」\n\n① 形容詞：かわいい、きれいな\n\nShe has a pretty smile.\n\n彼女はかわいらしい笑顔をしています。\n\n「ここでは見た目の魅力を表しています。beautiful ほど大げさではなく、親しみやすい美しさにも使えます。」\n\n② 副詞：かなり、結構、なかなか\n\nI'm pretty tired.\n\n私はかなり疲れています。\n\n「こちらは疲れている程度を表しています。very より控えめに聞こえることが多いんですよ。」\n\n基本イメージ：思った以上に、ある程度しっかりと\n\n「ただし、副詞の pretty は文脈や声の調子によって強さが変わります。いつも同じ強さだと思わないでくださいね。」\n\n## 類義語・近義語を深く理解しましょう\n\n「ここからは、先輩が希望していた部分ですね。意味だけでなく、頭に浮かぶイメージと、使い分ける理由まで説明します。」\n\n### ① 副詞「かなり」に近い表現\n\n## pretty\n\nプリティ\n\nイメージ：思ったよりしっかり程度がある\n\n「先輩、pretty は会話で自然に『結構～だよ』と言う感覚です。親しみやすく、くだけた響きがあります。」\n\nThe test was pretty difficult.\n\nそのテストはかなり難しかったです。\n\n## quite\n\nクワイト\n\nイメージ：ある程度、はっきりとその性質がある\n\n「quite も『かなり』ですが、イギリス英語では『なかなか』程度、アメリカ英語では『非常に』に近く使われることもあります。」\n\nThe movie was quite interesting.\n\nその映画はかなり面白かったです。\n\n「先輩、地域や文脈で強さが変わる点が重要ですよ。」\n\n## fairly\n\nフェアリー\n\nイメージ：一定の水準には達している\n\n「fairly は『まあまあ』『かなり』という意味ですが、比較的落ち着いた評価に聞こえやすいんです。」\n\nThe instructions were fairly clear.\n\n説明はかなり分かりやすかったです。\n\n「pretty clear よりも少し客観的な響きになる場合があります。」\n\n## rather\n\nラザー\n\nイメージ：予想よりも程度が大きい\n\n「rather は『思ったよりも～だ』という意外さや、少し否定的な評価を伴うことがあります。」\n\nThe meeting was rather long.\n\n会議は思ったより長かったです。\n\n「pretty long より、長さに少し困っている感じが出る場合があります。」\n\n## very\n\nヴェリー\n\nイメージ：程度が高いことを明確に強調する\n\n「very は『とても』です。pretty よりも強く聞こえることが一般的ですが、実際の印象は話し方にも左右されます。」\n\nI'm very tired.\n\n私はとても疲れています。\n\n### ② 形容詞「かわいい・きれいな」に近い表現\n\n| 単語 | 核となるイメージ | 違い |\n| --- | --- | --- |\n| pretty | 見た目がきれいで魅力的 | 親しみやすい美しさ |\n| beautiful | 美しさに心を動かされる | 強い美的な魅力 |\n| cute | 愛らしく感じる | 小ささ、幼さ、しぐさなどのかわいらしさ |\n| attractive | 人を引きつける | 容姿だけでなく魅力全般 |\n| gorgeous | 目を奪うほど華やか | 豪華で印象的な美しさ |\n\n「先輩、例えば同じ人を褒める場合でも、次のように印象が変わります。」\n\nPretty\n\nShe looks pretty in that dress.\n\n彼女はそのドレスを着るときれいに見えます。\n\nBeautiful\n\nThe sunset was beautiful.\n\n夕焼けは美しかったです。\n\nCute\n\nThat puppy is so cute.\n\nその子犬はとてもかわいいです。\n\nAttractive\n\nHe has an attractive personality.\n\n彼は魅力的な性格をしています。\n\nGorgeous\n\nYou look gorgeous tonight.\n\n今夜のあなたはとても華やかできれいです。\n\n「分かりましたか、先輩？ pretty は『かわいい』という訳だけでは収まりません。どんな種類の魅力なのかまで考えると、使い分けが自然になります。」\n\n## 理解確認｜3問\n\nQ1. I'm pretty tired. の pretty は？\n\nかわいいかなりほとんどない\n\nQ2. 『その子犬はとても愛らしい』に最も自然なのは？\n\nThat puppy is very cute.That puppy is very relevant.That puppy is very applicable.\n\nQ3. pretty much done の意味は？\n\nかわいく終わったほぼ終わったとても難しい\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しますよ。」\n\n- pretty（形容詞）：かわいい、きれいな\n- pretty（副詞）：かなり、結構\n- pretty much：ほぼ、だいたい\n- pretty / quite / fairly / rather / very：程度の強さだけでなく、話し手の印象や口調も違う\n\n一文記憶\n\nI'm pretty sure that's right.\n\nそれが正しいとかなり確信しています。\n\n「先輩、今日はここまでです。次に pretty を見たら、まず『かわいい』なのか『かなり』なのかを見分けてくださいね。」\n\n次は 第26語｜End up です。"}, {"name": "End up", "text": "# 第26語｜End up\n\n発音：/end ʌp/（エンド・アップ）｜句動詞（phrasal verb）\n\n「先輩、今日の end up は、日常英会話でも非常によく使われる表現です。単に『終わる』と覚えると、大切なニュアンスを見落としてしまいますよ。」\n\n例えば、先輩が休日に勉強するつもりだったのに、気づいたら一日中動画を見ていたとします。\n\nI ended up watching videos all day.\n\n結局、一日中動画を見てしまいました。\n\n「この『最初はそうするつもりじゃなかったのに、いろいろあって結局そうなった』という感覚が、end up の核心なんです。」\n\n4分割理解・記憶シート\n\n第26語\n\n## A｜要点\n\n「先輩、end up の中心的な意味は 『結局～になる』『最終的に～することになる』 です。」\n\n最初の予定や期待とは違う結果になったときによく使います。ただし、必ずしも予想外の結果である必要はありません。\n\n基本形は3つです。\n\n- end up + 動詞の -ing形：結局～することになる\n- end up + 形容詞：結局～の状態になる\n- end up + 場所・状況を表す表現：最終的に～に行き着く\n\nWe ended up staying home.\n\n私たちは結局、家にいることになりました。\n\nHe ended up alone.\n\n彼は結局、一人になりました。\n\nWe ended up at the wrong station.\n\n私たちは結局、違う駅に着いてしまいました。\n\n「特に end up doing は必須です。end up to do とは普通言いませんから、気を付けてくださいね。」\n\n## 類義語・近義表現のイメージと使い分け\n\n「先輩、ここは少し時間をかけますよ。似た表現の違いを、例文と一緒に確認しましょう。」\n\nend up\n\nエンド・アップ\n\n核イメージ：いろいろあった末の最終結果\n\n「先輩、途中の予定変更や成り行きを背景に、最後にどうなったかを伝えます。」\n\nI ended up staying home.\n\n結局、家にいることになりました。\n\nfinally\n\nファイナリー\n\n核イメージ：長い時間や過程の末に、ついに\n\n「finally は『やっと』という達成感や安堵を表すことがあります。end up のような予定外の結果は必須ではありません。」\n\nI finally passed the exam.\n\nついに試験に合格しました。\n\neventually\n\nイヴェンチュアリー\n\n核イメージ：時間が経過した先に、最終的に\n\n「eventually は時間の経過や過程に注目します。『いつかはそうなった』という感じですね。」\n\nShe eventually found a new job.\n\n彼女は最終的に新しい仕事を見つけました。\n\nturn out\n\nターン・アウト\n\n核イメージ：結果が明らかになる\n\n「turn out は、予想と実際の結果がどうだったかを伝えるときに便利です。」\n\nThe event turned out to be a success.\n\nそのイベントは結果的に成功でした。\n\n「end up は『どういう状態に行き着いたか』、turn out は『実際どうだったと分かったか』という違いを意識してください。」\n\nwind up\n\nワインド・アップ\n\n核イメージ：成り行きで結局そうなる\n\n「wind up は end up にかなり近い表現です。特に会話で使われ、予想外の結果を表すことも多いんです。」\n\nWe wound up eating pizza.\n\n私たちは結局ピザを食べることになりました。\n\n「ここでは wind の過去形が wound /waʊnd/（ワウンド）になる点にも注意してください。」\n\n### 同じ場面で比較\n\n「先輩、試験勉強を例にして、違いを整理しましょう。」\n\n| 表現 | 例文 | 伝わる感覚 |\n| --- | --- | --- |\n| end up | I ended up studying all night. | 成り行きで徹夜勉強になった |\n| finally | I finally finished studying. | やっと勉強が終わった |\n| eventually | I eventually understood it. | 時間をかけて最終的に理解した |\n| turn out | The test turned out to be easy. | 実際には試験が簡単だった |\n| wind up | I wound up studying all night. | 結局、徹夜勉強する羽目になった |\n\n「ほら、先輩。どれも『最後』に関係していますが、何を強調するかが違いますよね。」\n\n## 理解確認｜3問\n\nQ1. 『結局、家にいることになった』として自然なのは？\n\nI ended up staying home.I ended up to stay home.I ended up stay home.\n\nQ2. end up の中心的なイメージは？\n\n何かを始める途中の経緯を経た最終結果同じことを繰り返す\n\nQ3. 『結果的に成功だったと分かった』に特に合うのは？\n\nturn outdepend onlook after\n\n## 30秒復習\n\n「先輩、今日の要点を最後にまとめます。」\n\n- end up：結局～になる、最終的に～することになる\n- end up doing：結局～する\n- end up + 形容詞・場所：最終的にその状態・場所に行き着く\n- finally：ついに、やっと\n- eventually：時間を経て最終的に\n- turn out：結果として～だと分かる\n- wind up：成り行きで結局～になる\n\n一文記憶\n\nI was going to study, but I ended up falling asleep.\n\n勉強するつもりでしたが、結局寝てしまいました。\n\n「先輩、予定と結果の違いを伝えたいときは、ぜひ end up を使ってみてください。覚えるだけでなく、自分の一日の出来事を英語で説明するときにも役立ちますから。」\n\n次は 第27語｜Depend です。"}, {"name": "Depend", "text": "# 第27語｜Depend\n\n発音：/dɪˈpend/（ディペンド）｜動詞\n\n「先輩、今日の depend は『頼る』『依存する』『～次第である』という意味です。でも、この3つを別々に暗記する必要はありません。」\n\n「中心にあるのは、自分だけでは決まらず、何かに支えられたり、左右されたりするというイメージなんです。」\n\n例えば、友達に『明日、遊びに行ける？』と聞かれて、天気によって決めたい場合。\n\nIt depends on the weather.\n\n天気次第です。\n\n「先輩、これが depend の代表的な使い方ですよ。」\n\n4分割理解・記憶シート\n\n第27語\n\n## A｜要点\n\n「先輩、まずは3つの意味を押さえましょう。」\n\n① ～次第である\n\nIt depends on the situation.\n\n状況次第です。\n\n「状況が変われば結果も変わる、という意味です。」\n\n② ～に頼る\n\nYou can depend on me.\n\n私を頼っていいですよ。\n\n「こちらは、相手を信頼して頼りにできるという意味です。」\n\n③ ～に依存する\n\nMany people depend on public transportation.\n\n多くの人が公共交通機関に頼っています。\n\n「生活や行動が何かによって支えられている感覚ですね。」\n\n基本形：depend on ～\n\n「先輩、depend は特に on とセットで覚えてください。depend to ではありませんよ。」\n\n## 類義語・近義表現のイメージと使い分け\n\n「先輩、ここからは似た単語の比較です。今回は『頼る』と『～次第』の両方を扱いますよ。」\n\ndepend on\n\nディペンド・オン\n\n核イメージ：何かに支えられる・左右される\n\n「人を頼る場合にも、条件によって結果が決まる場合にも使える、幅の広い表現です。」\n\nOur plans depend on the weather.\n\n私たちの予定は天気次第です。\n\n「depend on は、結果を左右する条件との関係を示すときに特に便利です。」\n\nrely on\n\nリライ・オン\n\n核イメージ：信頼して頼りにする\n\n「先輩、rely on は depend on とよく似ていますが、相手を信頼して任せる感覚が強く出やすいんです。」\n\nI rely on my team to meet deadlines.\n\n私はチームが期限を守ってくれると信頼しています。\n\n「depend on が『支えが必要』という関係を表せるのに対し、rely on は『頼れると信じている』ことを強調しやすいんですよ。」\n\nただし、実際には両方を使える場面も多くあります。\n\ncount on\n\nカウント・オン\n\n核イメージ：相手が期待どおりにしてくれると当てにする\n\n「count on は、誰かの協力や行動を期待しているときによく使います。」\n\nI'm counting on you.\n\nあなたを頼りにしています。\n\n「先輩、これは相手への期待を直接伝える表現です。I depend on you. よりも『お願いしますね』という気持ちが伝わりやすい場合があります。」\n\nbe based on\n\nビー・ベイスト・オン\n\n核イメージ：判断や考えの土台になっている\n\n「こちらは『依存する』よりも『～を根拠・基礎とする』という意味です。」\n\nThe decision was based on the data.\n\nその決定はデータに基づいていました。\n\n「depend on the data なら、データの内容によって決定が変わるという意味になり得ます。一方、be based on the data は、データを判断の根拠として使ったという意味です。」\n\nbe determined by\n\nビー・ディターミンド・バイ\n\n核イメージ：ある要因によって決定される\n\n「depend on よりも、結果を決める要因を明確に示す響きがあります。」\n\nThe final price is determined by demand.\n\n最終価格は需要によって決まります。\n\n「ただし、価格は需要だけでなく供給などにも左右されます。この英文は、需要が決定要因となる状況を想定した例です。」\n\n### 同じ場面で比較\n\n「先輩、仕事で新しいプロジェクトを進める場面を想像してください。」\n\n| 表現 | 英文 | 伝わる感覚 |\n| --- | --- | --- |\n| depend on | Success depends on teamwork. | 成功はチームワーク次第 |\n| rely on | We rely on our manager. | 上司を信頼して頼る |\n| count on | We're counting on you. | あなたの活躍を期待している |\n| be based on | Our plan is based on research. | 計画は調査を根拠にしている |\n| be determined by | The schedule is determined by availability. | 日程は空き状況によって決定される |\n\n「似ていますが、全部同じではありません。条件に左右されるのか、人を信頼するのか、根拠にするのかを区別してくださいね。」\n\n## 理解確認｜3問\n\nQ1. 『天気次第です』として自然なのは？\n\nIt depends on the weather.It depends to the weather.It relies the weather.\n\nQ2. rely on の中心的なニュアンスは？\n\n信頼して頼る偶然起こる何かを説明する\n\nQ3. 『その決定はデータに基づいていた』に最も合うのは？\n\nThe decision was based on the data.The decision was counted on the data.The decision depended to the data.\n\n## 30秒復習\n\n「先輩、今日の要点を確認しましょう。」\n\n- depend on：～次第である、～に頼る、～に依存する\n- It depends.：場合によります\n- rely on：信頼して頼る\n- count on：期待して当てにする\n- be based on：～に基づく\n- be determined by：～によって決定される\n\n一文記憶\n\nIt depends on what you want to achieve.\n\n何を達成したいかによります。\n\n「先輩、何かを判断するときに『何によって決まるのか』を考えてみてください。そうすれば depend on の感覚が自然に身に付きますよ。」\n\n次は 第28語｜Specimen です。"}, {"name": "Specimen", "text": "# 第28語｜Specimen\n\n発音：/ˈspesɪmən/（スペスィマン）｜名詞\n\n「先輩、今日の specimen は、少し専門的に見える単語ですね。でも、中心のイメージを理解すれば、それほど難しくありません。」\n\n例えば、研究者が森で見つけた珍しい昆虫を研究室に持ち帰ったとします。\n\nThe scientist collected a specimen.\n\n科学者は標本を採集しました。\n\n「ここで大切なのは、ただ昆虫を捕まえたということではありません。その昆虫を観察・研究し、同じ種類の特徴を調べるための対象として扱っていることなんです。」\n\n4分割理解・記憶シート\n\n第28語\n\n## A｜要点\n\n「先輩、specimen には主に3つの意味があります。」\n\n① 標本\n\na butterfly specimen\n\nチョウの標本\n\n「研究や観察のために保存・収集されたものです。」\n\n② 検体\n\na blood specimen\n\n血液検体\n\n「医療検査で調べるために採取された血液などを指します。」\n\n③ 見本・代表例\n\na fine specimen of ancient pottery\n\n古代陶器の優れた一例\n\n「ある種類の特徴を示す実例という意味です。」\n\n核イメージ：全体や種類の特徴を調べるために取り出された一つ\n\n「先輩、specimen は単なる『物』ではなく、観察・検査・研究・例示の対象というところがポイントです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、今回は sample との違いが特に重要です。でも、それだけではありません。似た単語を一つずつ比較しましょう。」\n\nspecimen\n\nスペスィマン\n\n核イメージ：研究・観察するための標本や検体\n\n「先輩、specimen は対象そのものの特徴を調べる感覚が強いんです。」\n\nThe researcher studied a rare specimen.\n\n研究者は珍しい標本を調べました。\n\n「生物学、医学、地質学などでよく使われます。」\n\nsample\n\nサンプル\n\n核イメージ：全体から取り出した一部分\n\n「sample は、全体の性質を調べたり、試したりするために取り出した一部です。」\n\nWe tested a sample of the water.\n\n私たちは水のサンプルを検査しました。\n\n「specimen と違って、食品の試食や商品の試供品にも使えます。」\n\nWould you like a free sample?\n\n無料サンプルはいかがですか？\n\n「この場合、普通は specimen とは言いません。」\n\nexample\n\nイグザンプル\n\n核イメージ：理解を助けるために示す具体例\n\n「example は、何かを説明するときに使う代表的な事例です。」\n\nCan you give me an example?\n\n例を挙げてもらえますか？\n\n「先輩、specimen は実物の標本や検体を指すことが多いですが、example は出来事や行動など、形のないものにも広く使えます。」\n\nmodel\n\nモデル\n\n核イメージ：形や仕組みを示す模型・模範\n\n「model は、実物を小さく再現したものや、参考にすべき模範を指します。」\n\nThe students built a model of the solar system.\n\n生徒たちは太陽系の模型を作りました。\n\n「本物の岩石を採集して調べるなら specimen、岩石の構造を再現した模型なら model という違いがあります。」\n\nexemplar\n\nイグゼンプラー\n\n核イメージ：典型的・模範的な代表例\n\n「exemplar は、ある種類や性質をよく表している代表例です。example より硬い表現で、模範的な意味合いを持つこともあります。」\n\nThis painting is an exemplar of the artist's early style.\n\nこの絵画は、その画家の初期の作風をよく示す代表例です。\n\n「specimen が実物の観察対象に重点を置くのに対して、exemplar は代表性や模範性を強調します。」\n\n### 同じ場面で比較\n\n「先輩、博物館で展示物を説明する場面を考えてみましょう。」\n\n| 単語 | 例文 | 注目するもの |\n| --- | --- | --- |\n| specimen | This is a rare fossil specimen. | 研究対象としての化石標本 |\n| sample | This is a sample of volcanic rock. | 岩石の一部分 |\n| example | This is an example of ancient art. | 古代美術の具体例 |\n| model | This is a model of a dinosaur. | 恐竜を再現した模型 |\n| exemplar | This is an exemplar of early pottery. | 初期陶器の代表的な実例 |\n\n「先輩、同じ展示室にあるものでも、何を伝えたいかによって選ぶ単語が変わるんです。」\n\n## 理解確認｜3問\n\nQ1. 『昆虫標本』として最も自然なのは？\n\nan insect specimenan insect schedulean insect approval\n\nQ2. specimen と sample の違いは？\n\n完全に同じで使い分けはないspecimen は標本・検体、sample は全体から取り出した一部を広く指すsample は人にしか使えない\n\nQ3. 『無料の試供品』として普通に使うのは？\n\nfree specimenfree samplefree exemplar\n\n## 30秒復習\n\n「先輩、最後に整理しましょう。」\n\n- specimen：標本、検体、代表例\n- sample：全体から取り出した一部分、試供品\n- example：説明のための具体例\n- model：模型、模範\n- exemplar：典型的・模範的な代表例\n\n一文記憶\n\nThe scientist examined a rare specimen.\n\n科学者は珍しい標本を調べました。\n\n「先輩、specimen を見たら、研究者が標本を手に取って特徴を調べている場面を思い浮かべてくださいね。そうすれば、sample との違いも自然に理解できるはずです。」\n\n次は 第29語｜Pseudo です。"}, {"name": "Pseudo", "text": "# 第29語｜Pseudo\n\n発音：/ˈsuːdoʊ/（スードウ）｜形容詞・接頭辞\n\n「先輩、今日の pseudo は少し面白い単語ですよ。見た目は本物に似ているのに、実際には本物ではない。そんなものを表します。」\n\n例えば、科学的な言葉をたくさん使っているのに、きちんとした科学的根拠がない説明を見たことはありませんか？\n\nそれを英語では pseudoscience（疑似科学）と呼ぶことがあります。\n\n「つまり、本物らしく見せているけれど、本物ではない。この感覚が pseudo の中心なんです。」\n\n4分割理解・記憶シート\n\n第29語\n\n## A｜要点\n\n「先輩、pseudo の意味は主に 『偽の』『疑似的な』『見せかけの』 です。」\n\n① 偽の・見せかけの\n\na pseudo expert\n\n専門家を装った人、いわゆる専門家\n\n「本当の専門知識があるとは限らないのに、専門家のように振る舞っている人ですね。」\n\n② 疑似的な\n\npseudoscience\n\n疑似科学\n\n「科学のように見えても、科学的な方法や証拠による十分な裏付けがないものを指します。」\n\n③ 接頭辞として使う\n\npseudonym\n\n筆名、仮名\n\n「こちらは本名の代わりに使う名前です。必ずしも人をだますための名前ではありません。」\n\n核イメージ：本物に似た外見や性質を持つが、本物そのものではない\n\n「先輩、pseudo は批判的な意味になることもありますが、専門用語では中立的に『疑似的な』という意味で使われることもあります。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは大切な比較です。今回は『偽物』に関係する言葉ですが、何が偽物なのか、どんな点を強調するのかによって使い分けます。」\n\npseudo\n\nスードウ\n\n核イメージ：本物に似た外観や性質を持つが、本物ではない\n\n「先輩、pseudo は科学、学問、専門性など、ある体系や性質をまねたものに使われることが多いんです。」\n\nHe presented a pseudo-scientific explanation.\n\n彼は疑似科学的な説明をしました。\n\n「科学らしい説明でも、科学としての根拠が不十分な場合ですね。」\n\nfake\n\nフェイク\n\n核イメージ：本物ではない、偽造されたもの\n\n「fake は、偽物そのものを表す、とても一般的な単語です。」\n\nShe bought a fake designer bag.\n\n彼女は偽ブランドバッグを買いました。\n\n「pseudo よりも日常的で、物や情報、人の振る舞いなど幅広く使われます。」\n\nThat news story was fake.\n\nそのニュース記事は偽物でした。\n\nfalse\n\nフォールス\n\n核イメージ：事実や真実と一致していない\n\n「false は『誤った』『事実ではない』という意味が中心です。」\n\nThe report contained false information.\n\nその報告書には誤った情報が含まれていました。\n\n「fake は偽物や作り物、false は情報や主張の正しさに注目することが多いんです。」\n\n「ただし、false identity のように『偽の身元』という意味にもなります。」\n\nartificial\n\nアーティフィシャル\n\n核イメージ：自然のものではなく、人間が作ったもの\n\n「先輩、artificial は『人工の』です。偽物というより、自然にできたものではないことを示します。」\n\nThis flower is artificial.\n\nこの花は造花です。\n\n「造花は本物の花ではありませんが、だからといって必ずしも人をだますためのものではありませんよね。」\n\n「pseudo や fake と違って、人工的であること自体を表す中立的な表現にもなります。」\n\ncounterfeit\n\nカウンターフィット\n\n核イメージ：本物を装うために偽造されたもの\n\n「counterfeit は、特にお金、ブランド品、証明書などを不正に偽造した場合に使います。」\n\nThe police found counterfeit money.\n\n警察は偽札を発見しました。\n\n「fake よりも、違法な偽造や本物として通用させようとする行為が強く感じられる単語です。」\n\nimitation\n\nイミテイション\n\n核イメージ：本物の形や特徴をまねたもの\n\n「imitation は『模倣品』『まね』です。見た目や特徴を再現することが中心です。」\n\nThis necklace is made of imitation pearls.\n\nこのネックレスには模造真珠が使われています。\n\n「模造真珠は、本物の真珠に似せて作られています。でも、模造品であることを明示して売られているなら、それ自体が不正というわけではありません。」\n\n### 同じ場面で比較\n\n「先輩、ある商品や説明が『本物ではない』ときでも、次のように意味が変わります。」\n\n| 単語 | 例文 | 注目するポイント |\n| --- | --- | --- |\n| pseudo | pseudo-scientific claims | 科学らしいが、科学的根拠が不十分 |\n| fake | a fake watch | 本物ではない時計 |\n| false | false information | 事実と異なる情報 |\n| artificial | artificial flowers | 人工的に作られた花 |\n| counterfeit | counterfeit bills | 本物として通用させるための偽札 |\n| imitation | imitation leather | 本革に似せて作った素材 |\n\n「先輩、『偽物』という日本語訳だけで全部を一緒にしないこと。英語では、何がどう本物と違うのかが大切なんです。」\n\n## 理解確認｜3問\n\nQ1. pseudoscience の意味は？\n\n疑似科学人工知能科学者\n\nQ2. counterfeit が特に使われやすいのは？\n\n自然の花偽造された紙幣単なる計算ミス\n\nQ3. artificial と fake の違いとして適切なのは？\n\nどちらも必ず違法という意味artificial は人工的、fake は本物ではないことに注目artificial は人間にしか使えない\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- pseudo：偽の、疑似的な、見せかけの\n- pseudoscience：疑似科学\n- pseudocode：疑似コード\n- pseudonym：筆名、仮名\n- fake：偽物\n- false：事実と異なる\n- artificial：人工的な\n- counterfeit：偽造された\n- imitation：模倣品、模造の\n\n一文記憶\n\nPseudoscience may look scientific, but it lacks sufficient scientific evidence.\n\n疑似科学は科学的に見えることがありますが、十分な科学的根拠を欠いています。\n\n「先輩、pseudo を見たら、『本物のように見えるけれど、本物そのものではない』というイメージを思い浮かべてくださいね。」\n\n次は 第30語｜Brief です。"}, {"name": "Brief", "text": "# 第30語｜Brief\n\n発音：/briːf/（ブリーフ）｜形容詞・動詞・名詞\n\n「先輩、今日の brief は、仕事でも日常会話でもよく使う単語です。」\n\n例えば、上司からこんなことを言われたとします。\n\nPlease give me a brief explanation.\n\n簡潔に説明してください。\n\n「先輩、ここでの brief は、ただ『短い』というだけではありません。必要な情報を残しながら、余計な部分を省いて短くするという感覚があるんです。」\n\n「それに、brief は『短い』という形容詞だけでなく、『手短に説明する』という動詞としても使えるんですよ。今日はそこまで理解してもらいますからね。」\n\n4分割理解・記憶シート\n\n第30語\n\n## A｜要点\n\n「先輩、まずは brief の3つの使い方を整理しましょう。」\n\n① 形容詞：短い、簡潔な\n\nWe had a brief meeting.\n\n私たちは短い会議をしました。\n\n「時間が短いことを表していますね。」\n\nPlease keep your answer brief.\n\n回答は簡潔にしてください。\n\n「こちらは、必要な内容を手短に伝えるという意味です。」\n\n② 動詞：手短に説明する、事前に情報を伝える\n\nThe manager briefed the team.\n\nマネージャーはチームに必要な情報を説明しました。\n\n「会議や仕事の前に、重要事項を共有するイメージです。」\n\n③ 名詞：概要、指示書、要約資料\n\nI received the project brief.\n\n私はプロジェクトの概要資料を受け取りました。\n\n「先輩、名詞の brief は、仕事では『何をするべきかをまとめた資料』を指すことがあります。」\n\n核イメージ：限られた時間・言葉の中に、必要な内容を収める\n\n「まずは、このイメージを頭に置いてくださいね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは、似た単語の違いを一つずつ理解しましょう。今回は short、concise、succinct、compact、summary を比較します。」\n\nbrief\n\nブリーフ\n\n核イメージ：時間や説明が短い\n\n「先輩、brief は『短い』という意味ですが、説明について使うと『手短な』という感覚になります。」\n\nShe gave a brief explanation.\n\n彼女は簡潔な説明をしました。\n\n「説明が長々としていないことを伝えています。」\n\nshort\n\nショート\n\n核イメージ：長さ・時間・距離が短い\n\n「short は最も一般的な『短い』です。物理的な長さにも時間にも使えます。」\n\nThe meeting was short.\n\n会議は短かったです。\n\n「brief と違って、背の高さや髪の長さなどにも使えます。」\n\nShe has short hair.\n\n彼女は髪が短いです。\n\n「ここで brief hair とは普通言いません。」\n\nconcise\n\nコンサイス\n\n核イメージ：無駄を省き、必要な情報だけを残す\n\n「先輩、concise は『簡潔で無駄がない』という意味です。」\n\nPlease write a concise report.\n\n簡潔な報告書を書いてください。\n\n「brief が短さに注目するのに対し、concise は余計な言葉がないことを強調します。」\n\n「短くても必要な情報が抜けていたら、必ずしもよい concise な文章とは言えませんよ。」\n\nsuccinct\n\nサクスィンクト\n\n核イメージ：要点を的確に、無駄なく表現する\n\n「succinct は concise に近いですが、短い中でも内容が明確で的確な印象があります。」\n\nHe gave a succinct answer.\n\n彼は簡潔で的確な回答をしました。\n\n「concise も succinct も、ビジネス文書や説明を評価するときに使えます。ただし、succinct の方がやや硬い表現です。」\n\ncompact\n\nコンパクト\n\n核イメージ：小さな空間にまとまっている\n\n「compact は『小型の』『ぎゅっとまとまった』という意味です。」\n\nThis is a compact camera.\n\nこれは小型カメラです。\n\n「brief は時間や説明の短さ、compact は物の大きさや構造のまとまりに注目します。」\n\nThe guide provides a compact overview of the subject.\n\nそのガイドは、そのテーマをコンパクトに概観しています。\n\n「このように情報が小さくまとまっているという意味でも使えます。」\n\nsummary\n\nサマリー\n\n核イメージ：長い内容の重要部分をまとめたもの\n\n「先輩、summary は名詞で『要約』です。brief のような形容詞ではありません。」\n\nI wrote a summary of the article.\n\n私はその記事の要約を書きました。\n\n「a brief explanation は『短い説明』、a summary は『元の内容をまとめたもの』です。品詞も意味の焦点も違いますよ。」\n\n### 同じ場面で比較\n\n「先輩、上司に報告する場面で比べてみましょう。」\n\n| 表現 | 英文 | 伝わる感覚 |\n| --- | --- | --- |\n| brief | Give me a brief explanation. | 手短に説明して |\n| short | Keep the meeting short. | 会議を短くして |\n| concise | Write a concise report. | 無駄のない報告書を書いて |\n| succinct | Give a succinct answer. | 要点を的確に答えて |\n| compact | Prepare a compact guide. | 小さくまとまったガイドを作って |\n| summary | Send me a summary. | 要約を送って |\n\n「先輩、brief は短さ、concise は無駄のなさ、succinct は要点の的確さ。この3つは特に区別しておきましょう。」\n\n## 理解確認｜3問\n\nQ1. 『簡潔な説明』として自然なのは？\n\na brief explanationa brief haira brief distance\n\nQ2. concise の中心的なニュアンスは？\n\n無駄を省いて簡潔にする物理的に長い非常に感情的\n\nQ3. 『上司は新しい方針について私たちに説明した』に最も合うのは？\n\nThe manager briefed us on the new policy.The manager briefed to us the new policy.The manager brief us yesterday.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- brief：短い、簡潔な\n- brief 人 on ～：人に～について事前説明する\n- briefly：手短に\n- in brief：要するに\n- short：長さや時間が短い\n- concise：無駄がなく簡潔\n- succinct：要点を的確に伝える\n- summary：要約\n\n一文記憶\n\nLet me give you a brief explanation.\n\n手短に説明させてください。\n\n「先輩、brief は、ただ短くすることだけでなく、相手に必要なことを手短に伝える場面でも役立ちます。仕事でもぜひ使ってみてくださいね。」\n\n次は 第31語｜Frame です。"}, {"name": "Frame", "text": "# 第31語｜Frame\n\n発音：/freɪm/（フレイム）｜名詞・動詞\n\n「先輩、今日の frame は『枠』『骨組み』『物事の捉え方』、そして『表現の仕方を決める』という意味を持つ単語です。」\n\n「意味が多くて覚えにくそうですか？ でも心配はいりません。全部、物事を囲み、形を与えるという一つのイメージでつながっているんです。」\n\n例えば、同じ出来事でも、説明の仕方によって相手の印象が変わることがありますよね。\n\nThe way you frame a question matters.\n\n質問をどういう形で投げかけるかが重要です。\n\n「先輩、今日は写真の額縁から、仕事での説明の仕方まで、順番に理解していきましょう。」\n\n4分割理解・記憶シート\n\n第31語\n\n## A｜要点\n\n「先輩、まずは frame の主要な意味を確認しましょう。」\n\n① 名詞：枠、額縁\n\na picture frame\n\n写真立て、額縁\n\n「写真を囲む枠ですね。最も具体的で覚えやすい意味です。」\n\n② 名詞：骨組み、構造\n\nthe frame of a building\n\n建物の骨組み\n\n「建物の形を支える基本構造です。」\n\n③ 名詞：一コマ\n\na frame of a video\n\n動画の一コマ\n\n「映像を構成する一枚一枚の静止画像も frame と呼びます。」\n\n④ 動詞：枠に入れる\n\nShe framed the photograph.\n\n彼女は写真を額縁に入れました。\n\n⑤ 動詞：言葉や考えを組み立てる\n\nHe framed his argument carefully.\n\n彼は自分の主張を慎重に組み立てました。\n\n⑥ 動詞：無実の人に罪を着せる\n\nHe was framed for the crime.\n\n彼はその犯罪の濡れ衣を着せられました。\n\n「先輩、最後は少し意外ですよね。これは『相手が犯人であるかのように仕立てる』という意味なんです。」\n\n核イメージ：枠を作り、その中に物事を収めて形を与える\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは類義語です。今回は、特に『物事をどう表現するか』という意味に近い単語を中心に比較しますね。」\n\nframe\n\nフレイム\n\n核イメージ：物事をある枠組みの中で捉え、提示する\n\n「先輩、frame は、どのような視点や文脈で物事を見せるかに注目します。」\n\nShe framed the issue as a challenge.\n\n彼女はその問題を課題として提示しました。\n\n「同じ出来事でも、どんな意味を持つものとして説明するかが重要なんです。」\n\nstructure\n\nストラクチャー\n\n核イメージ：要素を整理して、全体の構造を作る\n\n「structure は、情報や物事を順序立てて組み立てることです。」\n\nWe need to structure the presentation carefully.\n\n私たちはプレゼンテーションを慎重に構成する必要があります。\n\n「frame は『どの視点から提示するか』、structure は『どの順序や構造で組み立てるか』という違いがあります。」\n\n「例えば、問題を『成長の機会』として frame し、その説明を『原因→対策→結果』の順に structure する、といった使い分けができますよ。」\n\nformulate\n\nフォーミュレイト\n\n核イメージ：考えを整理して、明確な形にまとめる\n\n「formulate は、計画、方針、理論、質問などをよく考えて作り上げることです。」\n\nThe team formulated a new strategy.\n\nチームは新しい戦略を策定しました。\n\n「frame は提示の仕方、formulate は考えを具体的な形に作り上げる過程に重点があります。」\n\nShe carefully formulated her response.\n\n彼女は慎重に回答を組み立てました。\n\n「特にビジネスや学術的な場面で使いやすい表現ですね。」\n\npresent\n\nプリゼント\n\n核イメージ：相手の前に情報や考えを示す\n\n「present は、情報、意見、資料などを相手に提示することです。」\n\nHe presented the results to the manager.\n\n彼は結果をマネージャーに提示しました。\n\n「frame は『どういう見方で提示するか』、present は『相手に示す行為そのもの』を表します。」\n\n「ですから、present した情報が、どのように framed されているかを考えることもできるんです。」\n\nportray\n\nポートレイ\n\n核イメージ：人物や出来事を、ある姿として描写する\n\n「portray は、人や物事を特定のイメージで表現することです。映画、文学、報道などでよく使われます。」\n\nThe movie portrays him as a hero.\n\nその映画は彼を英雄として描いています。\n\n「frame は見方の枠組み、portray は具体的にどんな人物・状況として描くかに注目します。」\n\n「例えば、報道が出来事を『危機』として frame し、ある人物を『責任者』として portray することがあります。」\n\ncontextualize\n\nコンテクスチュアライズ\n\n核イメージ：背景や文脈の中に位置づける\n\n「contextualize は、出来事を単独で見るのではなく、背景事情や前後関係を踏まえて理解できるようにすることです。」\n\nWe need to contextualize these numbers.\n\n私たちはこれらの数字を背景事情と関連づけて考える必要があります。\n\n「先輩、売上が10％減ったと聞くだけでは、状況を十分に理解できませんよね。市場全体が20％縮小していたなら、評価は変わるかもしれません。」\n\n「このように、背景を補って理解するのが contextualize です。」\n\n「frame が注目する視点を設定するのに対して、contextualize は理解に必要な背景を与えることに重点があります。」\n\n### 同じ場面で比較\n\n「先輩、会社の業績を報告する場面で、使い分けを確認しましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| frame | Frame the decline as a challenge. | 減少を課題として位置づける |\n| structure | Structure the report clearly. | 報告書の構成を整える |\n| formulate | Formulate a recovery plan. | 回復計画を策定する |\n| present | Present the results to management. | 結果を経営陣に提示する |\n| portray | The article portrayed the company as struggling. | 会社を苦境にあるものとして描く |\n| contextualize | Contextualize the sales decline. | 売上減少の背景を示す |\n\n「先輩、ここで一番覚えてほしいのは、frame は単に説明することではなく、相手がどう理解するかに関わる『枠組み』を作ることなんです。」\n\n## 理解確認｜3問\n\nQ1. 『質問をどのように表現するか』に最も合うのは？\n\nHow to frame a questionHow to bury a questionHow to shave a question\n\nQ2. frame と structure の違いは？\n\nまったく同じ意味frame は視点や枠組み、structure は構成や順序に注目structure は写真にしか使えない\n\nQ3. 『彼は濡れ衣を着せられた』として自然なのは？\n\nHe was framed.He was structured.He was presented.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- frame（名詞）：枠、額縁、骨組み、映像の一コマ\n- frame（動詞）：枠に入れる、考えを組み立てる、罪を着せる\n- frame A as B：AをBとして位置づける\n- time frame：期間、時間枠\n- structure：構造を組み立てる\n- formulate：考えや計画を具体化する\n- present：相手に提示する\n- portray：ある姿として描写する\n- contextualize：背景や文脈の中に位置づける\n\n一文記憶\n\nThe way you frame a problem affects how people understand it.\n\n問題をどのように提示するかは、人々がそれをどう理解するかに影響します。\n\n「先輩、今日の frame は、単語として覚えるだけでなく、仕事で物事を説明するときにも意識してほしい表現です。同じ事実でも、どこに注目するかによって伝わり方が変わるんですから。」\n\n次は 第32語｜Invent です。"}, {"name": "Invent", "text": "# 第32語｜Invent\n\n発音：/ɪnˈvent/（インヴェント）｜動詞\n\n「先輩、今日の単語は invent です。『発明する』という意味で知っているかもしれませんね。」\n\n「でも、実はもう一つ重要な意味があります。それは\\*\\*『話や言い訳をでっち上げる』\\*\\*です。」\n\nHe invented a new machine.\n\n彼は新しい機械を発明しました。\n\nHe invented an excuse.\n\n彼は言い訳をでっち上げました。\n\n「同じ invent なのに、ずいぶん印象が違いますよね。でも、どちらも『それまで存在しなかったものを頭の中で作り出す』という点でつながっているんです。」\n\n4分割理解・記憶シート\n\n第32語\n\n## A｜要点\n\n「先輩、まずは3つの使い方を押さえましょう。」\n\n① 発明する\n\nWho invented the telephone?\n\n誰が電話を発明したのですか？\n\n「新しい装置や技術などを生み出す意味ですね。」\n\n② 新しい方法や仕組みを考案する\n\nWe need to invent a better way to solve this problem.\n\nこの問題を解決する、もっとよい方法を考案する必要があります。\n\n「物理的な機械だけでなく、方法や仕組みにも使えるんです。」\n\n③ 話・言い訳などを作り上げる\n\nShe invented a story to avoid trouble.\n\n彼女はトラブルを避けるために話をでっち上げました。\n\n「こちらは、事実ではない話を作るという意味です。」\n\n核イメージ：それまでなかったものを新しく作り出す\n\n「先輩、invent は必ずしも『素晴らしい発明』だけを意味するわけではありません。何を作り出すかによって、肯定的にも否定的にもなるんですよ。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語の比較です。『作る』『考え出す』『発見する』は、日本語だと近く感じることがありますが、英語では注目する点が違うんです。」\n\ninvent\n\nインヴェント\n\n核イメージ：これまでなかったものを考案・発明する\n\nShe invented a new type of battery.\n\n彼女は新しい種類の電池を発明しました。\n\n「先輩、invent は新規性が重要です。単に既存の製品を作ることとは違います。」\n\ncreate\n\nクリエイト\n\n核イメージ：何かを生み出す、作り上げる\n\nShe created a beautiful design.\n\n彼女は美しいデザインを作りました。\n\n「create は、芸術作品、文章、仕事、機会など、非常に幅広いものに使えます。」\n\n「invent が『新しい発明・考案』に重点を置くのに対して、create は『生み出すこと』自体に重点があります。」\n\nThe campaign created new jobs.\n\nその施策は新しい雇用を生み出しました。\n\n「この場合は invented new jobs より created new jobs が自然ですよ。」\n\ndevelop\n\nディヴェロップ\n\n核イメージ：時間をかけて発展・開発させる\n\nThe company developed a new software system.\n\nその会社は新しいソフトウェアシステムを開発しました。\n\n「先輩、develop は、アイデアを具体化したり、試行錯誤しながら完成度を高めたりする過程に注目します。」\n\n「例えば、ある技術を invent した後、それを実用化するために develop することがあります。」\n\n「ただし、実際には新しい製品について invent と develop の両方が使える場合もありますよ。」\n\ndevise\n\nディヴァイズ\n\n核イメージ：工夫して方法や計画を考え出す\n\nWe devised a plan to improve efficiency.\n\n私たちは効率を改善する計画を考案しました。\n\n「devise は、特に計画、方法、仕組みなどを頭を使って考え出すときに使います。」\n\n「invent は装置や技術の発明にも使いますが、devise は問題解決のための方法や計画との相性がよいんです。」\n\nShe devised a clever solution.\n\n彼女は巧妙な解決策を考え出しました。\n\ndiscover\n\nディスカヴァー\n\n核イメージ：すでに存在していたものを発見する\n\nScientists discovered a new species.\n\n科学者たちは新種を発見しました。\n\n「先輩、これは invent との違いが非常に重要です。」\n\n「発明は人間が新しいものを作り出すこと。発見は、すでに存在していたものを見つけることです。」\n\nAlexander Fleming discovered penicillin.\n\nアレクサンダー・フレミングはペニシリンを発見しました。\n\n「ペニシリンを『発明した』というより、抗菌作用を持つ物質を『発見した』という表現が適切なんです。」\n\nfabricate\n\nファブリケイト\n\n核イメージ：作り上げる、特に事実でない話や証拠を捏造する\n\nHe fabricated evidence.\n\n彼は証拠を捏造しました。\n\n「fabricate は、製造するという意味もありますが、話や証拠に使うと『捏造する』という強い否定的な意味になります。」\n\nShe invented an excuse.\n\n彼女は言い訳をでっち上げました。\n\nShe fabricated an excuse.\n\n彼女は言い訳を捏造しました。\n\n「両方とも不自然ではありませんが、fabricate の方が、意図的に虚偽を作ったという硬く強い響きになりやすいんです。」\n\n### 同じ場面で比較\n\n「先輩、新しい製品を作る会社を想像してみてください。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| invent | Invent a new device. | 新しい装置を発明する |\n| create | Create a new design. | デザインを生み出す |\n| develop | Develop a new product. | 製品を開発する |\n| devise | Devise a better method. | 方法を工夫して考案する |\n| discover | Discover a new material. | 未知の材料を発見する |\n| fabricate | Fabricate false test results. | 虚偽の試験結果を捏造する |\n\n「先輩、特に invent・develop・discover の3つは、技術や研究の話題で混同しやすいので、しっかり区別してくださいね。」\n\n## 理解確認｜3問\n\nQ1. 『新しい機械を発明した』に最も自然なのは？\n\nHe invented a new machine.He discovered a new machine.He fabricated a new machine.\n\nQ2. invent と discover の違いは？\n\n両方とも必ず同じ意味invent は新しく作り、discover は存在していたものを見つけるdiscover は言い訳を作ること\n\nQ3. 『証拠を捏造した』に最も適切なのは？\n\nHe discovered evidence.He fabricated evidence.He developed evidence.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- invent：発明する、考案する、でっち上げる\n- invention：発明、発明品\n- inventor：発明家\n- inventive：独創的な\n- create：生み出す\n- develop：開発する、発展させる\n- devise：方法や計画を考案する\n- discover：発見する\n- fabricate：製造する、捏造する\n\n一文記憶\n\nYou invent something new, but you discover something that already exists.\n\n新しいものは発明し、すでに存在するものは発見します。\n\n「先輩、今日の invent は、ただ『発明する』と暗記するより、『それまでなかったものを作り出す』というイメージで覚えてください。その方が、言い訳をでっち上げるという意味にも自然につながりますから。」\n\n次は 第33語｜Usual です。"}, {"name": "Usual", "text": "# 第33語｜Usual\n\n発音：/ˈjuːʒuəl/（ユージュアル）｜形容詞\n\n「先輩、今日の usual は『いつもの』『普段の』『通常の』という意味です。」\n\n「簡単そうな単語ですが、normal、ordinary、common と混同しやすいので、今日はそこまでしっかり区別しますよ。」\n\n例えば、先輩が毎朝7時に起きているとします。\n\nI woke up at my usual time.\n\n私はいつもの時間に起きました。\n\n「ここで大切なのは、7時が一般的に普通の時間かどうかではありません。先輩自身が普段から7時に起きているということなんです。」\n\n4分割理解・記憶シート\n\n第33語\n\n## A｜要点\n\n「先輩、まず usual の中心をつかみましょう。」\n\n① いつもの\n\nI'll have my usual coffee.\n\nいつものコーヒーをください。\n\n「毎回よく注文するコーヒー、という意味ですね。」\n\n② 普段の・通常の\n\nShe arrived at her usual time.\n\n彼女はいつもの時間に到着しました。\n\n「過去の習慣と同じ時間だった、ということです。」\n\n③ 例年どおりの・通常どおりの\n\nBusiness is slower than usual.\n\n商売は普段より低調です。\n\n「いつもの状態を基準にして比較しています。」\n\n核イメージ：これまで繰り返されてきた、慣れ親しんだ状態\n\n「先輩、usual は、世間一般の基準よりも、\\*\\*その人や場所にとっての『いつも』\\*\\*を表すことが多いんです。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここが今日の重要部分です。usual、normal、ordinary、common、typical、regular は、日本語ではどれも『普通の』と訳せることがあります。」\n\n「でも、英語では判断の基準が違うんですよ。」\n\nusual\n\nユージュアル\n\n核イメージ：普段から繰り返されている、いつもの状態\n\nI took my usual route to work.\n\n私はいつもの通勤経路を通りました。\n\n「先輩、ここでは世間一般の通勤経路ではなく、その人が普段使っている道を指します。」\n\nnormal\n\nノーマル\n\n核イメージ：基準や期待される状態から外れていない\n\nHis temperature is normal.\n\n彼の体温は正常です。\n\n「normal は、ある基準や期待される範囲に収まっていることを表します。」\n\n「先輩、例えば毎朝5時に起きるのが usual な人でも、一般的な生活時間と比べて早起きかもしれません。」\n\nusual は個人の習慣、normal は基準や期待される状態。この違いです。\n\n「ただし、normal も『その人にとって普段の状態』という意味で使うことがあります。完全に別物ではありませんよ。」\n\nordinary\n\nオーディナリー\n\n核イメージ：特別ではない、平凡な\n\nIt was an ordinary day.\n\nそれは何の変哲もない一日でした。\n\n「先輩、ordinary は、特別な出来事や目立った特徴がないことに注目します。」\n\nmy usual day なら『普段の私の一日』。\n\nan ordinary day なら『特別なことのない一日』。\n\n「似ていますが、注目する部分が違いますね。」\n\ncommon\n\nコモン\n\n核イメージ：多くの人や場所に広く見られる\n\nThis is a common mistake.\n\nこれはよくある間違いです。\n\n「common は、ある集団の中で広く見られることを表します。」\n\n「先輩、usual が『自分にとっていつものこと』なら、common は『多くの人にも見られること』です。」\n\nIt's common to commute by train in Tokyo.\n\n東京では電車通勤が一般的です。\n\n「ある人がいつも車通勤しているなら、その人の usual な通勤方法は車かもしれません。集団全体と個人の習慣は違うんです。」\n\ntypical\n\nティピカル\n\n核イメージ：ある種類の特徴をよく表している、典型的な\n\nThis is a typical example of Japanese architecture.\n\nこれは日本建築の典型的な例です。\n\n「typical は、その種類を代表する特徴があることを表します。」\n\na usual breakfast は『いつもの朝食』。\n\na typical Japanese breakfast は『日本の朝食として典型的なもの』。\n\n「先輩、typical は個人の繰り返しではなく、ある種類の代表的な特徴に注目するんです。」\n\nregular\n\nレギュラー\n\n核イメージ：一定の間隔やパターンで繰り返される\n\nWe have regular meetings every Monday.\n\n私たちは毎週月曜日に定例会議を開きます。\n\n「regular は、繰り返しに一定の規則性があることを強調します。」\n\nmy usual meeting なら『いつもの会議』。\n\na regular meeting なら『定期的に開かれる会議』。\n\n「先輩、regular には『常連の』『正規の』『通常サイズの』など、ほかの意味もあります。文脈で判断しましょう。」\n\n### 同じ場面で比較\n\n「先輩、朝食を例にすると違いが分かりやすいですよ。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| usual | My usual breakfast is toast. | 私が普段食べるもの |\n| normal | That's a normal breakfast. | 基準から見て普通の朝食 |\n| ordinary | It was an ordinary breakfast. | 特別ではない朝食 |\n| common | Rice is a common breakfast food in Japan. | 多くの人に広く見られる |\n| typical | This is a typical Japanese breakfast. | 日本の朝食の特徴をよく表す |\n| regular | I eat breakfast at regular times. | 規則的な時間に食べる |\n\n「先輩、ここでの結論は一つです。」\n\nUsual は『私にとっていつもどうなのか』を表す。\n\n「これを軸にすれば、ほかの単語との違いも整理できますよ。」\n\n## 理解確認｜3問\n\nQ1. 『いつもの時間に起きた』として自然なのは？\n\nI woke up at my usual time.I woke up at my common time.I woke up at my typical of time.\n\nQ2. common と usual の違いとして適切なのは？\n\ncommon は多くの人に広く見られること、usual は普段の習慣usual は必ず珍しいことを表すcommon は時間にしか使えない\n\nQ3. 『普段より疲れている』として自然なのは？\n\nI'm tired as usual than.I'm more tired than usual.I'm more usual than tired.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- usual：いつもの、普段の\n- usually：普段は、通常は\n- as usual：いつものように\n- than usual：普段より\n- the usual：いつものもの\n- unusual：珍しい、いつもと違う\n- normal：基準や期待される状態に合っている\n- ordinary：特別ではない\n- common：多くの人に広く見られる\n- typical：典型的な\n- regular：規則的な、定期的な\n\n一文記憶\n\nI took my usual route to work, as usual.\n\n私はいつもどおり、いつもの道を通って出勤しました。\n\n「先輩、usual は『一般的に普通』ではなく、『その人にとっていつものこと』。ここを忘れなければ、もう common や ordinary と混同しにくくなりますよ。」\n\n次は 第34語｜Occasion です。"}, {"name": "Occasion", "text": "# 第34語｜Occasion\n\n発音：/əˈkeɪʒən/（アケイジャン）｜名詞・動詞\n\n「先輩、今日の occasion は『機会』『特別な行事』『ある出来事が起こったとき』という意味です。」\n\n「ただ、ここで一つ注意してください。occasion を単純に『チャンス』と覚えてしまうと、opportunity との使い分けで迷ってしまいます。」\n\n例えば、こんな英文があります。\n\nIt was a special occasion.\n\nそれは特別な日・行事でした。\n\n「ここでは何かを成功させるチャンスではなく、誕生日や結婚式のような特別な出来事や場面を指しています。」\n\n「先輩、今日の中心イメージは、ある出来事が起こる特定のとき・場面です。ここから意味を広げていきましょう。」\n\n4分割理解・記憶シート\n\n第34語\n\n## A｜要点\n\n「先輩、まずは4つの意味を押さえましょう。」\n\n① 特別な行事・催し\n\nThe wedding was a wonderful occasion.\n\nその結婚式は素晴らしい行事でした。\n\n「お祝いなど、特別な意味を持つ出来事です。」\n\n② あるとき・場合\n\nOn one occasion, I met him at the station.\n\nあるとき、私は駅で彼に会いました。\n\n「特定の出来事が起きた一回の場面を指します。」\n\n③ 機会・好機\n\nThis is an occasion for celebration.\n\nこれはお祝いする機会です。\n\n「何かをするのにふさわしい場面という意味ですね。」\n\n④ 原因となる出来事（動詞・硬い表現）\n\nThe announcement occasioned widespread concern.\n\nその発表は広範な懸念を引き起こしました。\n\n「動詞の occasion は『引き起こす』という意味ですが、日常会話ではあまり使われない硬い表現です。」\n\n核イメージ：ある出来事が起こる、意味を持った特定の場面\n\n「先輩、まずは名詞の使い方を優先して覚えましょう。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語を比較します。特に occasion と opportunity、chance の違いは大切ですよ。」\n\noccasion\n\nアケイジャン\n\n核イメージ：意味を持った特定の場面・出来事\n\nThe graduation ceremony was a memorable occasion.\n\n卒業式は思い出深い行事でした。\n\n「先輩、occasion は、特定の出来事や、それが起こるときに注目します。」\n\nopportunity\n\nオポチューニティ\n\n核イメージ：何かを実現できる有利な機会\n\nThis job is a great opportunity to learn new skills.\n\nこの仕事は新しいスキルを学ぶ絶好の機会です。\n\n「opportunity は、何かを達成したり、成長したりできるチャンスです。」\n\n「occasion が『出来事そのもの』を表すのに対し、opportunity は『その場面で何ができるか』に注目します。」\n\nI had an opportunity to speak with the CEO.\n\n私はCEOと話す機会がありました。\n\n「こちらは、CEOと話せるという有益な機会ですね。」\n\nchance\n\nチャンス\n\n核イメージ：何かが起こる可能性、または機会\n\nI had a chance to meet him.\n\n私は彼に会う機会がありました。\n\n「chance は、opportunity と同じように機会を表せますが、『偶然性』『可能性』の意味も持っています。」\n\nThere is a chance of rain.\n\n雨が降る可能性があります。\n\n「先輩、ここでは opportunity of rain とは普通言いません。chance には『起こる可能性』という意味があるからです。」\n\n「opportunity は有利な機会、chance は機会や可能性を幅広く表す、と考えてくださいね。」\n\nevent\n\nイヴェント\n\n核イメージ：実際に起こる出来事・行事\n\nThe company organized a special event.\n\n会社は特別なイベントを開催しました。\n\n「event は、実際に起こった出来事や、企画された催しを指します。」\n\n「occasion も行事を表せますが、特別な意味や、その出来事が起きた場面に注目することがあります。」\n\nThe wedding was a joyful occasion.\n\nその結婚式は喜ばしい行事でした。\n\n「結婚式は event とも occasion とも呼べます。ただし、occasion の方が『特別な場面』という響きが強くなることがあります。」\n\nincident\n\nインスィデント\n\n核イメージ：特定の出来事、特に問題やトラブル\n\nThe company investigated the incident.\n\n会社はその出来事を調査しました。\n\n「incident は、事故、問題、トラブルなどに使われることが多いんです。」\n\n「occasion は特別な行事や場面にも使えますが、incident は問題となった出来事を指す場合が多い、という違いがあります。」\n\nA minor incident delayed the train.\n\n小さなトラブルによって電車が遅れました。\n\n「ただし、incident が必ず重大な事件を意味するわけではありませんよ。」\n\nmoment\n\nモウメント\n\n核イメージ：時間の中の短い一点・瞬間\n\nIt was a special moment for me.\n\nそれは私にとって特別な瞬間でした。\n\n「moment は、短い時間や特定の瞬間に注目します。」\n\n「occasion は行事や出来事全体を指すことができますが、moment はその中の一瞬を切り取る感覚です。」\n\n例えば結婚式なら、\n\nThe wedding was a special occasion.\n\n結婚式は特別な行事でした。\n\nThe exchange of rings was a special moment.\n\n指輪の交換は特別な瞬間でした。\n\n「先輩、こう比べると分かりやすいでしょう？」\n\n### 同じ場面で比較\n\n「先輩、会社の創立記念パーティーを例にしてみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| occasion | It was a special occasion. | 特別な場面・行事 |\n| opportunity | It was an opportunity to network. | 人脈を作る好機 |\n| chance | I had a chance to meet the president. | 社長と会う機会 |\n| event | The company held an event. | 開催された催し |\n| incident | An incident occurred during the event. | 行事中に起きたトラブル |\n| moment | It was a memorable moment. | 印象的な一瞬 |\n\n「先輩、同じ一日の出来事でも、どこに注目するかで使う単語が変わるんです。」\n\n## 理解確認｜3問\n\nQ1. 『特別な行事』として自然なのは？\n\na special occasiona special possibilitya special chance of rain\n\nQ2. opportunity と occasion の違いは？\n\n完全に同じ意味opportunity は有利な機会、occasion は特定の場面・出来事に注目occasion は雨の可能性だけを表す\n\nQ3. 『私は時々外食します』として自然なのは？\n\nI eat out on occasion.I eat out in occasion.I eat out by occasion.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- occasion：機会、特別な行事、あるとき\n- special occasion：特別な行事・日\n- on occasion：時々\n- on this occasion：今回の場合は\n- on several occasions：何度か\n- occasionally：時々\n- rise to the occasion：大事な場面で期待に応える\n- opportunity：有利な機会\n- chance：機会、可能性\n- event：出来事、催し\n- incident：出来事、特にトラブル\n- moment：瞬間\n\n一文記憶\n\nEvery special occasion is an opportunity to create memories.\n\n特別な行事はどれも、思い出を作る機会です。\n\n「先輩、occasion を見たら、『ある出来事が起こる特定の場面』を思い浮かべてください。そうすれば、特別な行事、あるとき、機会という意味が一つにつながりますよ。」\n\n次は 第35語｜Imperfect です。"}, {"name": "Imperfect", "text": "# 第35語｜Imperfect\n\n発音：/ɪmˈpɝːfɪkt/（インパーフェクト）｜形容詞\n\n「先輩、今日の単語は imperfect です。意味は『不完全な』『欠点のある』『完璧ではない』です。」\n\n「ただし、『不完全』といっても、必ずしも使い物にならないという意味ではありませんよ。」\n\n例えば、\n\nThe plan is imperfect, but it works.\n\nその計画は完璧ではありませんが、うまく機能しています。\n\n「先輩、ここが重要です。imperfect は『欠点がある』ことを表しますが、『価値がない』ことまでは意味しません。」\n\n「今日は incomplete、flawed、defective との違いまで、きちんと理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まず imperfect を分解してみてください。」\n\nim-\n\n否定：～でない\n\nperfect\n\n完璧な\n\nimperfect ＝ 完璧ではない\n\n「perfect の前に否定の im- がついているんです。possible → impossible と似た仕組みですね。」\n\n① 不完全な\n\nWe live in an imperfect world.\n\n私たちは不完全な世界に生きています。\n\n② 欠点のある\n\nThe system is imperfect.\n\nそのシステムには欠点があります。\n\n③ 完璧ではないが、使える・価値がある\n\nIt's an imperfect solution, but it's better than doing nothing.\n\n完璧な解決策ではありませんが、何もしないよりはましです。\n\n「先輩、覚えてほしいのは、完成していないことと、完璧ではないことは別だという点です。」\n\n「完成した製品でも欠点があれば imperfect と言えますからね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここが今日の重要部分です。特に imperfect と incomplete を混同しないようにしましょう。」\n\nimperfect\n\nインパーフェクト\n\n核イメージ：理想的な状態ではなく、欠点がある\n\nThis is an imperfect solution.\n\nこれは完璧ではない解決策です。\n\n「先輩、解決策として機能していても、改善の余地があれば imperfect と言えるんです。」\n\nincomplete\n\nインコンプリート\n\n核イメージ：必要な部分が欠けている、完成していない\n\nThe report is incomplete.\n\nその報告書は未完成です。\n\n「incomplete は、必要な情報や部分がまだそろっていない状態です。」\n\nThe report is complete but imperfect.\n\n報告書は完成していますが、完璧ではありません。\n\n「先輩、この文が両者の違いをよく表しています。完成していても、文章が分かりにくければ imperfect なんです。」\n\nflawed\n\nフロード\n\n核イメージ：明確な欠点・問題点を抱えている\n\nThe argument is flawed.\n\nその主張には欠陥があります。\n\n「flawed は、考え方、計画、性格、製品などに問題点があることを強調します。」\n\n「imperfect は『完璧ではない』という広い意味ですが、flawed は欠点そのものに注目する表現です。」\n\nThe study had a flawed design.\n\nその研究の設計には問題がありました。\n\ndefective\n\nディフェクティヴ\n\n核イメージ：製品や部品に不具合・欠陥がある\n\nThe company recalled defective products.\n\nその会社は欠陥製品を回収しました。\n\n「先輩、defective は製品や機械などが、本来求められる品質や機能を満たしていない場合によく使います。」\n\nThis phone is defective.\n\nこの電話機には不具合があります。\n\n「imperfect な製品が必ずしも故障しているわけではありません。でも、defective なら具体的な品質・機能上の問題があるという意味が強いんです。」\n\nfaulty\n\nフォールティ\n\n核イメージ：誤りや不具合があって、正常に働かない\n\nThe machine stopped because of faulty wiring.\n\n配線の不具合によって機械が停止しました。\n\n「faulty は機械や設備の不具合だけでなく、推論や判断の誤りにも使えます。」\n\nHis conclusion was based on faulty reasoning.\n\n彼の結論は誤った推論に基づいていました。\n\n「defective と重なる場合もありますが、faulty は『正常に機能しない』『考え方に誤りがある』という場面でよく使われます。」\n\nsubstandard\n\nサブスタンダード\n\n核イメージ：求められる基準を下回っている\n\nThe building was constructed with substandard materials.\n\nその建物は基準以下の材料で建設されました。\n\n「substandard は、品質や性能が求められる水準に達していないことを表します。」\n\n「imperfect は完璧でないだけでも使えますが、substandard は基準未満という、より具体的で否定的な評価になります。」\n\n### 同じ場面で比較\n\n「先輩、会社で報告書を作る場面を考えましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| imperfect | The report is imperfect. | 完璧ではない |\n| incomplete | The report is incomplete. | 必要な部分が未完成 |\n| flawed | The analysis is flawed. | 分析に欠点がある |\n| defective | The device is defective. | 製品に欠陥がある |\n| faulty | The calculation is faulty. | 計算に誤りがある |\n| substandard | The work is substandard. | 仕事の品質が基準未満 |\n\n「先輩、imperfect は欠点がある状態を広く表す言葉。ほかの単語は、欠けているものや問題の種類をより具体的に示すことが多いんです。」\n\n## 理解確認｜3問\n\nQ1. 『完成しているが完璧ではない』に最も自然なのは？\n\nIt's complete but imperfect.It's incomplete but complete.It's perfect but incomplete.\n\nQ2. imperfect と incomplete の違いは？\n\n完全に同じ意味imperfect は完璧でない、incomplete は必要な部分が欠けているimperfect は機械にしか使えない\n\nQ3. 『欠陥製品』として自然なのは？\n\ndefective productsoccasional productsusual products\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- imperfect：不完全な、完璧ではない\n- imperfection：欠点、不完全さ\n- imperfectly：不完全に\n- incomplete：必要な部分が欠けている\n- flawed：欠点・問題点がある\n- defective：製品などに欠陥がある\n- faulty：誤りや不具合がある\n- substandard：基準を下回っている\n\n一文記憶\n\nSomething can be complete but still imperfect.\n\n何かが完成していても、なお完璧ではないことがあります。\n\n「先輩、今日の一番大切な違いは、incomplete が『まだそろっていない』、imperfect が『そろっていても欠点がある』という点です。ここを区別できれば、かなり理解が深まりますよ。」\n\n次は 第36語｜Shave です。"}, {"name": "Shave", "text": "# 第36語｜Shave\n\n発音：/ʃeɪv/（シェイヴ）｜動詞・名詞\n\n「先輩、今日の単語は shave です。『ひげを剃る』という意味はご存じかもしれませんね。」\n\n「でも、shave はそれだけではありません。木材の表面を薄く削ったり、費用や時間を少しずつ減らしたりするときにも使うんです。」\n\nI shave every morning.\n\n私は毎朝ひげを剃ります。\n\nWe need to shave costs.\n\n私たちはコストを少し削減する必要があります。\n\n「先輩、なぜ『剃る』が『削減する』になるのでしょう？」\n\n「答えは、表面から薄い部分を削り取るというイメージにあります。今日はこの感覚を身につけましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、shave には主に4つの使い方があります。」\n\n① ひげ・体毛を剃る\n\nHe shaved his beard.\n\n彼はひげを剃りました。\n\n「刃物などで毛を皮膚の近くから取り除くことです。」\n\n② 表面を薄く削る\n\nShe shaved a thin layer off the wood.\n\n彼女は木材の表面を薄く削り取りました。\n\n「ひげだけではなく、木材などにも使えるんですよ。」\n\n③ 費用・時間などを少し削減する\n\nWe shaved ten minutes off the process.\n\n私たちはその工程を10分短縮しました。\n\n「時間を物理的に剃るわけではありません。不要な部分を少し削るイメージです。」\n\n④ 名詞：ひげ剃り、剃ること\n\nI need a shave.\n\nひげを剃らないと。\n\n「先輩、shave は名詞にもなります。」\n\n核イメージ：表面や全体から、薄い部分を削り取る\n\n「このイメージがあれば、ひげ剃りとコスト削減を一つの単語として覚えられますね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが大切です。shave に似た『切る』『削る』『減らす』という単語は、何をどのように取り除くかによって使い分けます。」\n\nshave\n\nシェイヴ\n\n核イメージ：表面を薄く削り取る\n\nHe shaved his beard.\n\n彼はひげを剃りました。\n\n「刃物などで表面の毛や薄い部分を取り除く動作です。時間や費用を少し減らす意味にも広がります。」\n\ncut\n\nカット\n\n核イメージ：刃物などで切る・分ける\n\nHe cut his hair.\n\n彼は髪を切りました。\n\n「先輩、cut は最も幅広い『切る』です。髪を短くする、紙を切る、予算を削るなどに使えます。」\n\nThe company cut its budget.\n\n会社は予算を削減しました。\n\n「shave が表面を薄く削るイメージなのに対し、cut は切る・減らすという動作全般を表せるんです。」\n\ntrim\n\nトリム\n\n核イメージ：余分な部分を切って整える\n\nHe trimmed his beard.\n\n彼はひげを整えました。\n\n「先輩、shave と trim の違いは非常に重要です。」\n\nshave a beard は、ひげを剃る。\n\ntrim a beard は、ひげを短く切って形を整える。\n\n「trim は全部取り除く必要はありません。余分な部分を切って整えることに重点があります。」\n\nWe need to trim unnecessary expenses.\n\n不要な経費を削る必要があります。\n\n「予算や経費を『無駄な部分だけ削る』という意味でも使えますよ。」\n\nscrape\n\nスクレイプ\n\n核イメージ：表面をこすって削り取る\n\nShe scraped the paint off the wall.\n\n彼女は壁の塗料をこすって削り落としました。\n\n「scrape は、表面に刃物や道具を押し当て、こするようにして取り除く動作です。」\n\n「shave は薄い層を切り取る感覚、scrape はこすり取る感覚が強いんです。」\n\nHe scraped the mud off his shoes.\n\n彼は靴についた泥をこすり落としました。\n\n「泥を取るときは shave より scrape が自然ですね。」\n\npeel\n\nピール\n\n核イメージ：表面の皮や層をむく\n\nShe peeled an apple.\n\n彼女はリンゴの皮をむきました。\n\n「先輩、peel は、表面を覆う皮や薄い層をはがす・むくことです。」\n\nPeel off the sticker.\n\nシールをはがしてください。\n\n「shave は薄く削る、peel は皮や層をはがす。この違いですね。」\n\nreduce\n\nリデュース\n\n核イメージ：量・程度・大きさを減らす\n\nWe need to reduce costs.\n\n私たちはコストを削減する必要があります。\n\n「reduce は、減らすことを幅広く表せます。大幅な削減にも、少しの削減にも使えます。」\n\nWe shaved five minutes off the process.\n\n私たちは工程を5分短縮しました。\n\nWe reduced the processing time by five minutes.\n\n私たちは処理時間を5分短縮しました。\n\n「どちらも正しいですが、shave の方が『少し削り取った』という比喩的な印象を与えます。」\n\n### 同じ場面で比較\n\n「先輩、髪やひげの手入れを例にすると違いが分かりやすいですよ。」\n\n| 単語 | 英文 | イメージ |\n| --- | --- | --- |\n| shave | Shave your beard. | ひげを剃る |\n| cut | Cut your hair. | 髪を切る |\n| trim | Trim your beard. | ひげの形を整える |\n| scrape | Scrape off the paint. | 塗料をこすり落とす |\n| peel | Peel an apple. | リンゴの皮をむく |\n| reduce | Reduce costs. | コストを減らす |\n\n「先輩、特に shave と trim は混同しやすいです。ひげを全部剃るのか、長さを整えるのか。この違いを意識してくださいね。」\n\n## 理解確認｜3問\n\nQ1. 『ひげを剃る』として最も自然なのは？\n\nshave a beardpeel a beardscrape a beard\n\nQ2. shave と trim の違いとして適切なのは？\n\n完全に同じ意味shave は剃る、trim は余分な部分を切って整えるtrim は必ず全部取り除く\n\nQ3. 『工程を10分短縮した』として自然なのは？\n\nWe shaved ten minutes off the process.We peeled ten minutes the process.We shaved the process to ten minutes off.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- shave：剃る、薄く削る、少し削減する\n- shave off：剃り落とす、削り取る\n- shave ～ off …：…から～を削減する\n- clean-shaven：ひげをきれいに剃った\n- cut：切る\n- trim：余分な部分を切って整える\n- scrape：こすって削り取る\n- peel：皮や層をむく・はがす\n- reduce：減らす\n\n一文記憶\n\nWe shaved ten minutes off the process.\n\n私たちはその工程を10分短縮しました。\n\n「先輩、今日の shave は、『ひげを剃る』から『表面を薄く削る』、そして『時間や費用を少し削る』へと意味が広がる単語です。」\n\n「この流れを覚えれば、仕事で shave costs という表現を見ても、もう迷いませんね。」\n\n次は 第37語｜Bury です。"}, {"name": "Bury", "text": "# 第37語｜Bury\n\n発音：/ˈberi/（ベリー）｜動詞\n\n「先輩、今日の単語は bury です。意味は『埋める』『埋葬する』『隠す』です。」\n\n「最初に発音を確認しておきますね。つづりは bury ですが、\\*\\*読み方は『ベリー』\\*\\*です。『ビューリー』ではありませんよ。」\n\nThe dog buried a bone.\n\n犬は骨を埋めました。\n\nShe buried her face in her hands.\n\n彼女は両手で顔を覆いました。\n\n「先輩、二つ目の文は、実際に土の中に顔を埋めたわけではありません。」\n\n「bury の核となるイメージは、何かを覆い隠して、外から見えない状態にすることです。ここを理解すると、感情を隠す、仕事に没頭する、過去を葬るといった表現までつながります。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、bury の代表的な意味は5つです。」\n\n① 土などに埋める\n\nThe dog buried a bone in the garden.\n\n犬は庭に骨を埋めました。\n\n「物を土の中に入れて、見えなくすることです。」\n\n② 埋葬する\n\nHe was buried beside his wife.\n\n彼は妻の隣に埋葬されました。\n\n「亡くなった人を埋葬する意味でも使います。」\n\n③ 隠す・押し隠す\n\nShe tried to bury her feelings.\n\n彼女は自分の感情を押し隠そうとしました。\n\n「先輩、感情を土に埋めるわけではありません。外に表れないよう、心の奥に押し込めるイメージです。」\n\n④ 深く没頭する\n\nHe buried himself in his work.\n\n彼は仕事に没頭しました。\n\n「仕事の中に自分を埋めてしまうほど、集中している感覚ですね。」\n\n⑤ 覆い尽くす\n\nThe village was buried under snow.\n\nその村は雪に埋もれました。\n\n「雪に覆われて見えなくなっている状態です。」\n\n核イメージ：何かの内側や下に入れて、外から見えなくする\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た意味の単語を比較します。bury と hide は特に混同しやすいので、しっかり区別しましょう。」\n\nbury\n\nベリー\n\n核イメージ：何かの下や中に入れて、覆い隠す\n\nHe buried the treasure underground.\n\n彼は宝物を地中に埋めました。\n\n「先輩、bury は、物を覆って見えなくするという感覚が強いんです。抽象的な感情や秘密にも使えます。」\n\nhide\n\nハイド\n\n核イメージ：見つからないように隠す\n\nShe hid the key under the mat.\n\n彼女は鍵をマットの下に隠しました。\n\n「hide は最も一般的な『隠す』です。土に埋める必要はありません。」\n\nHe hid his feelings.\n\n彼は自分の感情を隠しました。\n\n「bury his feelings とも言えますが、bury の方が、感情を心の奥に押し込めるような印象になります。」\n\n「つまり、hide は『見えなくする』、bury は『深く押し込んで隠す』という違いがあるんです。」\n\nconceal\n\nコンシール\n\n核イメージ：人に知られないよう、意図的に隠す\n\nThe company concealed important information.\n\nその会社は重要な情報を隠しました。\n\n「conceal は hide より硬い表現で、事実、情報、感情などを意図的に隠す場面でよく使われます。」\n\nShe concealed her disappointment.\n\n彼女は失望を隠しました。\n\n「bury は押し込めるイメージ、conceal は他人に見せない・知られないようにすることに注目します。」\n\ncover\n\nカヴァー\n\n核イメージ：上から覆う\n\nShe covered the table with a cloth.\n\n彼女はテーブルを布で覆いました。\n\n「cover は、何かの表面を覆うことです。」\n\nThe ground was covered with snow.\n\n地面は雪で覆われていました。\n\n「bury は、対象が覆うものの下に埋もれる感覚が強いんです。」\n\nThe car was buried under snow.\n\n車は雪に埋もれていました。\n\n「先輩、covered with snow なら雪が表面を覆っている状態、buried under snow なら雪に深く埋もれている状態が想像しやすいですね。」\n\nsuppress\n\nサプレス\n\n核イメージ：感情・行動・情報などを押さえつける\n\nHe suppressed his anger.\n\n彼は怒りを抑え込みました。\n\n「suppress は、感情や反応が外に出ないよう、力を加えて抑えるイメージです。」\n\n「bury anger は怒りを心の奥に押し込める、suppress anger は怒りの表出を抑えるという違いがあります。」\n\nThe government suppressed the protest.\n\n政府は抗議活動を抑え込みました。\n\n「先輩、suppress は感情だけでなく、抗議や情報などにも使えるんです。」\n\nimmerse\n\nイマース\n\n核イメージ：何かの中に深く浸す・没頭させる\n\nShe immersed herself in her work.\n\n彼女は仕事に没頭しました。\n\n「先輩、immerse oneself in は、活動や経験に深く入り込むことです。」\n\nHe buried himself in his work.\n\n彼は仕事に没頭しました。\n\nHe immersed himself in his work.\n\n彼は仕事に没頭しました。\n\n「両方とも自然ですが、bury oneself in は、周囲から自分を切り離すほど深く入り込む印象を与えることがあります。」\n\n「immerse は、学習や文化体験などに積極的に浸る場合にもよく使われます。」\n\nI immersed myself in English.\n\n私は英語漬けになりました。\n\n### 同じ場面で比較\n\n「先輩、秘密や感情を隠す場面で整理してみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| bury | Bury your feelings. | 心の奥に押し込める |\n| hide | Hide your feelings. | 表に出さず隠す |\n| conceal | Conceal the truth. | 意図的に知られないようにする |\n| cover | Cover the box. | 上から覆う |\n| suppress | Suppress your anger. | 怒りを抑え込む |\n| immerse | Immerse yourself in work. | 仕事に深く没頭する |\n\n「先輩、bury は『深く埋める』という感覚があるので、感情を押し込める意味にも、仕事に没頭する意味にもつながるんです。」\n\n## 理解確認｜3問\n\nQ1. 『犬が骨を埋めた』として自然なのは？\n\nThe dog buried a bone.The dog concealed a bone in the sky.The dog immersed a bone in work.\n\nQ2. 『仕事に没頭している』として自然なのは？\n\nI'm buried in work.I'm buried on work.I'm buried to work.\n\nQ3. bury the hatchet の意味は？\n\nおのを購入する仲直りする、争いをやめる秘密を暴露する\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- bury：埋める、埋葬する、隠す\n- burial：埋葬\n- bury A in B：AをBの中に埋める\n- be buried under ～：～の下に埋もれている\n- bury oneself in ～：～に没頭する\n- be buried in work：仕事に追われている\n- bury the hatchet：仲直りする\n- bury one's head in the sand：現実から目を背ける\n- hide：隠す\n- conceal：意図的に隠す\n- suppress：押さえつける\n- immerse：深く浸る、没頭する\n\n一文記憶\n\nHe buried himself in work to forget his problems.\n\n彼は問題を忘れるために、仕事に没頭しました。\n\n「先輩、bury は『土に埋める』だけで終わらせてはいけませんよ。外から見えないほど深く中に入れるというイメージを持てば、秘密、感情、仕事などにも自然につながります。」\n\n「それから発音は『ベリー』です。ここも忘れないでくださいね。」\n\n次は 第38語｜Saving です。"}, {"name": "Saving", "text": "# 第38語｜Saving\n\n発音：/ˈseɪvɪŋ/（セイヴィング）｜名詞・形容詞・動詞 save の -ing 形\n\n「先輩、今日の単語は saving です。『貯金』という意味で覚えているかもしれませんね。」\n\n「ですが、仕事やニュースでは『節約』『削減額』という意味でも頻繁に登場します。」\n\nWe achieved significant cost savings.\n\n私たちは大幅なコスト削減を実現しました。\n\n「先輩、ここで savings と複数形になっていることに気づきましたか？」\n\n「実は、saving と savings は、形によって使い方が変わるんです。今日は save との関係も含めて整理しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な意味を5つ確認しましょう。」\n\n① 節約すること・削減\n\nSaving money is important.\n\nお金を節約することは大切です。\n\n「ここでは saving は動詞 save の動名詞です。『節約すること』という意味ですね。」\n\n② 節約額・削減額\n\nThe new system produced a saving of $500.\n\n新しいシステムによって500ドルの節約が実現しました。\n\n「数えられる名詞としての saving です。」\n\n③ 貯蓄・貯金\n\nShe has $10,000 in savings.\n\n彼女には1万ドルの貯金があります。\n\n「先輩、『蓄えてあるお金』を指すときは、一般に複数形の savings を使います。」\n\n④ 救助・救済\n\nSaving lives is our priority.\n\n命を救うことが私たちの最優先事項です。\n\n「save には『救う』という意味もありますから、saving にもその意味が引き継がれます。」\n\n⑤ ～を節約する・省く（複合語の一部）\n\nThis is a time-saving tool.\n\nこれは時間を節約できる道具です。\n\n「time-saving、energy-saving、cost-saving などの形で使われます。」\n\n核イメージ：失われるはずだったものを残す・守る\n\n「お金を使わず残すなら節約、将来のために残すなら貯蓄、命を失わないよう守るなら救助。こう考えると意味がつながりますね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、saving に似た『節約』『貯蓄』『削減』の単語を比較します。」\n\nsaving\n\nセイヴィング\n\n核イメージ：使わずに残す・失わずに守る\n\nSaving money is a good habit.\n\nお金を節約したり貯めたりすることはよい習慣です。\n\n「先輩、行為としての節約にも、名詞としての削減額にもつながる言葉です。」\n\nsavings\n\nセイヴィングズ\n\n核イメージ：蓄えられたお金、または節約できた金額\n\nShe has enough savings to cover six months of expenses.\n\n彼女には6か月分の生活費を賄える貯金があります。\n\n「先輩、savings は『蓄えてあるお金』を表すことが多いです。」\n\nThe new process resulted in significant savings.\n\n新しい工程によって大幅な節約が実現しました。\n\n「ただし、このように『削減額・節約効果』も表せます。」\n\neconomy\n\nイコノミー\n\n核イメージ：資源やお金を無駄なく使うこと\n\nThe company is looking for greater economy in its operations.\n\nその会社は業務運営のさらなる効率化・節約を目指しています。\n\n「economy は『経済』という意味が有名ですが、『節約』『効率的な使用』という意味もあります。」\n\n「saving が節約行為や節約額に注目するのに対し、economy は無駄の少ない運用や効率性を表すことがあります。」\n\nEconomy of effort is important.\n\n労力を無駄なく使うことは重要です。\n\nreduction\n\nリダクション\n\n核イメージ：量や程度が減ること・減らすこと\n\nThe company achieved a 10% reduction in costs.\n\nその会社はコストを10％削減しました。\n\n「reduction は、何かが減ることを幅広く表します。」\n\n「saving は節約によって残せたお金や資源に注目する一方、reduction は数量や程度の減少そのものに注目するんです。」\n\nThere was a reduction in traffic accidents.\n\n交通事故が減少しました。\n\n「先輩、交通事故の減少には reduction が自然ですね。」\n\nconservation\n\nコンサーヴェイション\n\n核イメージ：資源や自然を守り、無駄な消費を防ぐ\n\nWater conservation is essential.\n\n水資源の保全は不可欠です。\n\n「conservation は、資源や環境を守りながら使うことに重点があります。」\n\nEnergy conservation helps reduce costs.\n\n省エネルギーはコスト削減に役立ちます。\n\n「saving energy と意味が重なりますが、conservation は資源の保全という観点が強いんです。」\n\ndeposit\n\nディポジット\n\n核イメージ：お金を口座などに預け入れること\n\nI made a deposit of $500.\n\n私は500ドルを預け入れました。\n\n「先輩、deposit は貯金全体ではなく、『預け入れる行為』や『預けた金額』を指すことが多いです。」\n\nI deposited $500 into my savings account.\n\n私は貯蓄用口座に500ドルを入金しました。\n\n「ここで deposit は入金、savings account は貯蓄用口座です。役割が違いますね。」\n\n### 同じ場面で比較\n\n「先輩、会社の経費を減らす場面で整理してみましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| saving | Saving money is important. | 節約する行為 |\n| savings | We achieved cost savings. | 節約額・削減効果 |\n| economy | We need greater economy. | 無駄のない運用 |\n| reduction | We achieved a cost reduction. | コストが減ったこと |\n| conservation | Energy conservation matters. | 資源を守り節約すること |\n| deposit | I made a bank deposit. | 銀行への預け入れ |\n\n「先輩、saving は残すこと、reduction は減らすこと。この違いを意識すると、英文の意味をより正確に捉えられますよ。」\n\n## 理解確認｜3問\n\nQ1. 『彼女には十分な貯金がある』として自然なのは？\n\nShe has enough savings.She has enough saving money.She has enough reductions.\n\nQ2. cost savings と cost-saving の違いは？\n\n完全に同じ使い方cost savings は削減額・効果、cost-saving はコスト削減のためのという形容詞的表現cost-saving は貯金口座だけを意味する\n\nQ3. 『時間を節約する道具』として自然なのは？\n\na time-saving toola time-deposit toola time-conservation account\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- saving：節約すること、節約額\n- savings：貯蓄、削減額\n- save：節約する、貯める、救う\n- cost savings：コスト削減効果\n- cost-saving：コストを削減するための\n- time-saving：時間を節約できる\n- savings account：貯蓄用口座\n- reduction：減少、削減\n- conservation：保全、資源の節約\n- deposit：預け入れ、預金\n\n一文記憶\n\nSaving money every month helps you build your savings.\n\n毎月お金を貯めることで、貯蓄を増やせます。\n\n「先輩、今日のポイントは saving money＝お金を貯める行為、savings＝蓄えたお金 という違いです。」\n\n「そして、仕事では cost savings が『コスト削減効果』という意味になることも忘れないでくださいね。」\n\n次は 第39語｜Tech です。"}, {"name": "Tech", "text": "# 第39語｜Tech\n\n発音：/tek/（テック）｜名詞・形容詞的用法\n\n「先輩、今日の単語は tech です。ニュースや仕事でよく見かける単語ですね。」\n\n「tech は technology の短縮形で、基本的には『技術』『テクノロジー』『技術関連のもの』を意味します。」\n\nThe company invests heavily in tech.\n\nその会社はテクノロジーに多額の投資をしています。\n\n「ただし、先輩。tech は必ずしも最新のAIやロボットだけを意味するわけではありません。IT業界全体を指したり、技術的な製品や仕事を表したりすることもあるんです。」\n\n「今日は特に、tech・technology・technique・technical の違いを理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、tech には大きく3つの使い方があります。」\n\n① テクノロジー・技術\n\nTech is changing our lives.\n\nテクノロジーは私たちの生活を変えています。\n\n「特にコンピューターやデジタル技術などを指すことが多いです。」\n\n② テクノロジー業界\n\nShe works in tech.\n\n彼女はテクノロジー業界で働いています。\n\n「先輩、この in tech は『技術の中で』ではなく、『テクノロジー業界で』という意味ですよ。」\n\n③ 技術関連の（名詞を修飾する用法）\n\nHe works for a tech company.\n\n彼はテクノロジー企業で働いています。\n\nTech companies are investing in AI.\n\nテクノロジー企業はAIに投資しています。\n\n「tech company、tech industry、tech skills のように、別の名詞の前に置いて使えます。」\n\n核イメージ：科学や知識を活用して、実際に役立つ仕組み・製品・サービスを生み出す技術\n\n「先輩、tech は technology よりくだけた短い表現です。ニュースの見出しや日常会話でもよく使われます。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語の違いを詳しく見ていきます。特に technology と technique は、形が似ていても意味の中心が違いますよ。」\n\ntech\n\nテック\n\n核イメージ：技術・テクノロジーを短く表す言葉\n\nThe tech industry is growing.\n\nテクノロジー業界は成長しています。\n\n「先輩、tech は technology の短縮形で、特にデジタル技術や関連業界を表すときによく使います。」\n\ntechnology\n\nテクノロジー\n\n核イメージ：科学や知識を実用化した技術・仕組み\n\nModern technology has changed communication.\n\n現代のテクノロジーはコミュニケーションを変えました。\n\n「technology は tech より正式な響きがあります。」\n\n「また、デジタル分野だけでなく、医療技術、製造技術、農業技術など、広い分野を指すことができます。」\n\nMedical technology is advancing rapidly.\n\n医療技術は急速に進歩しています。\n\n「tech と置き換えられる場合もありますが、正式な文章では technology が適切なことも多いんです。」\n\ntechnique\n\nテクニーク\n\n核イメージ：目的を達成するための具体的な技法・方法\n\nShe developed a new teaching technique.\n\n彼女は新しい教授法を開発しました。\n\n「先輩、technique は技術全体ではなく、『どうやって行うか』という具体的なやり方に注目します。」\n\nThis technique improves accuracy.\n\nこの手法は正確性を高めます。\n\n「例えば、AIは technology、AIを使ってデータを分類する具体的な手法は technique と呼べる場合があります。」\n\ntechnical\n\nテクニカル\n\n核イメージ：技術や専門的な知識に関する\n\nWe encountered a technical problem.\n\n私たちは技術的な問題に直面しました。\n\n「先輩、technical は形容詞です。」\n\n「tech company は『テクノロジー企業』ですが、technical problem は『技術的な問題』です。」\n\nHe has strong technical skills.\n\n彼は高い技術的スキルを持っています。\n\n「専門的な知識や技能を表すときにも使えます。」\n\nengineering\n\nエンジニアリング\n\n核イメージ：科学や数学を使って、実際のものを設計・構築すること\n\nShe studied mechanical engineering.\n\n彼女は機械工学を学びました。\n\n「engineering は工学や技術的な設計・開発の活動を指します。」\n\nEngineering plays an important role in product development.\n\n工学は製品開発に重要な役割を果たします。\n\n「technology は技術やその成果、engineering はそれを設計・実現するための工学的な活動や分野に注目します。」\n\ninnovation\n\nイノヴェイション\n\n核イメージ：新しい発想や方法を実用化し、価値を生み出すこと\n\nInnovation drives economic growth.\n\nイノベーションは経済成長を促進します。\n\n「先輩、innovation は必ずしも新しい機械の発明だけを意味しません。」\n\n「新しいビジネスモデルや業務の仕組みを導入することも、イノベーションになり得ます。」\n\nThe company encourages innovation.\n\nその会社は革新を奨励しています。\n\n「technology は技術そのもの、innovation は新しい価値や変化を生み出すことに注目します。」\n\n### 同じ場面で比較\n\n「先輩、新しい業務システムを導入する会社を想像してください。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| tech | We invest in tech. | 技術・業界 |\n| technology | We use new technology. | 技術や仕組み |\n| technique | We developed a new technique. | 具体的な手法 |\n| technical | We have a technical problem. | 技術的な性質 |\n| engineering | Engineering is essential. | 工学・設計開発 |\n| innovation | We promote innovation. | 新しい価値を生む変革 |\n\n「先輩、全部『技術』に関係していますが、指しているものは違います。ここを区別できれば、ニュースも仕事の英文も読みやすくなりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『彼女はテクノロジー業界で働いている』として自然なのは？\n\nShe works in tech.She works in technique.She works in technical.\n\nQ2. technology と technique の違いは？\n\n完全に同じ意味technology は技術・仕組み、technique は具体的な技法・方法technique は企業の株価だけを意味する\n\nQ3. 『技術的な問題』として自然なのは？\n\na technical problema technique problema technologyly problem\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- tech：技術、テクノロジー、技術関連の\n- technology：技術・テクノロジー\n- technique：技法・手法\n- technical：技術的な・専門的な\n- engineering：工学・設計開発\n- innovation：革新・新しい価値の創出\n- tech company：テクノロジー企業\n- tech industry：テクノロジー業界\n- tech support：技術サポート\n- high-tech：先端技術を使った\n- tech-savvy：テクノロジーに詳しい\n- Big Tech：巨大テクノロジー企業\n\n一文記憶\n\nNew tech can improve the way we work.\n\n新しい技術は、私たちの働き方を改善する可能性があります。\n\n「先輩、今日のポイントは、tech が technology の短縮形だということ。そして、technique は『具体的な技法』であって、technology と同じではないということです。」\n\n「ここまで理解できたら、ニュースで tech industry や tech stocks を見ても、もう迷いませんね。」\n\n次は 第40語｜Silky です。"}, {"name": "Silky", "text": "# 第40語｜Silky\n\n発音：/ˈsɪlki/（スィルキー）｜形容詞\n\n「先輩、今日の単語は silky です。意味は『絹のような』『なめらかな』『すべすべした』です。」\n\n「ただし、silky は本当に絹でできているものだけに使うわけではありませんよ。」\n\nShe has silky hair.\n\n彼女は絹のようになめらかな髪をしています。\n\nThe soup has a silky texture.\n\nそのスープには、絹のようになめらかな舌触りがあります。\n\n「先輩、髪とスープはまったく違うものですよね。それなのに、なぜ両方に silky を使えるのでしょう？」\n\n「答えは、絹に触れたときのように、きめ細かく、抵抗が少なく、心地よくなめらかであるという感覚にあります。」\n\n「今日は smooth、soft、silky、velvety の違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な4つの意味を押さえましょう。」\n\n① 絹のようになめらかな\n\nThe fabric feels silky.\n\nその生地は絹のようになめらかな手触りです。\n\n「実際に絹でできていなくても使えます。」\n\n② 髪や肌がすべすべした\n\nThis conditioner makes my hair silky.\n\nこのコンディショナーは髪を絹のようになめらかにします。\n\n「美容やヘアケアの説明でよく登場する意味ですね。」\n\n③ 食べ物がきめ細かく、なめらかな\n\nThe chocolate has a silky texture.\n\nそのチョコレートは、きめ細かくなめらかな口当たりです。\n\n「先輩、texture は『手触り・舌触り・質感』です。」\n\n④ 声や動きがなめらかで心地よい\n\nHe spoke in a silky voice.\n\n彼はなめらかで柔らかい声で話しました。\n\n「声の響きが柔らかく、滑らかに聞こえるという比喩的な使い方です。」\n\n核イメージ：絹のように、きめ細かく、心地よくなめらか\n\n「単に凹凸がないだけではなく、上質で心地よい感触まで伝えられるのが silky の特徴です。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからが今日の重要部分です。『なめらか』や『柔らかい』を表す単語は、触ったときに何を感じるかで使い分けます。」\n\nsilky\n\nスィルキー\n\n核イメージ：絹のようにきめ細かく、心地よくなめらか\n\nHer hair feels silky.\n\n彼女の髪は絹のようになめらかな手触りです。\n\n「先輩、silky は『上質な絹に触れているような感覚』を伝えます。実際の素材が絹かどうかは問いません。」\n\nsmooth\n\nスムーズ\n\n核イメージ：凹凸や引っかかりがない\n\nThe surface of the table is smooth.\n\nテーブルの表面はなめらかです。\n\n「smooth は、物の表面だけでなく、動作や進行にも使えます。」\n\nThe meeting went smoothly.\n\n会議は円滑に進みました。\n\n「silky は絹のような質感を表すのに対し、smooth は凹凸や障害がないことを広く表すんです。」\n\n「先輩、仕事が円滑に進んだときは smoothly が自然ですよ。」\n\nsoft\n\nソフト\n\n核イメージ：硬くなく、柔らかい\n\nThis pillow is very soft.\n\nこの枕はとても柔らかいです。\n\n「先輩、soft は押したときの柔らかさや、触ったときの優しい感触を表します。」\n\nShe has a soft voice.\n\n彼女は柔らかい声をしています。\n\n「声の場合は『優しい』『強くない』という意味にもなります。」\n\n「silky は表面のなめらかさ、soft は柔らかさ。重なる場合もありますが、注目点が違うんです。」\n\nvelvety\n\nヴェルヴェティ\n\n核イメージ：ベルベットのように柔らかく、しっとりした質感\n\nThe fabric has a velvety texture.\n\nその生地はベルベットのような柔らかい質感です。\n\n「velvet は『ビロード・ベルベット』です。」\n\n「silky がするすると滑るようななめらかさなら、velvety は細かい毛足を感じるような、柔らかく豊かな質感です。」\n\nThe wine has a velvety texture.\n\nそのワインは柔らかく、まろやかな口当たりです。\n\n「食べ物や飲み物の表現でも使えますよ。」\n\nsleek\n\nスリーク\n\n核イメージ：表面がなめらかで、すっきり洗練されている\n\nThe car has a sleek design.\n\nその車は流線的で洗練されたデザインをしています。\n\n「先輩、sleek は外観のなめらかさや、無駄のない洗練された印象を表します。」\n\nShe has sleek, straight hair.\n\n彼女はつややかで、まっすぐ整った髪をしています。\n\n「silky hair は手触り、sleek hair は整った見た目やつやに注目することが多いんです。」\n\nglossy\n\nグロッスィ\n\n核イメージ：光を反射して、つやつやしている\n\nShe has glossy black hair.\n\n彼女はつやのある黒髪をしています。\n\n「glossy は、見た目の光沢に注目します。」\n\nThe magazine has glossy pages.\n\nその雑誌には光沢のあるページが使われています。\n\n「先輩、silky は触覚、glossy は視覚に重点があります。」\n\n「髪が silky and glossy なら、『手触りがなめらかで、見た目にもつやがある』という意味になりますね。」\n\n### 同じ場面で比較\n\n「先輩、髪の状態を説明する場面で考えましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| silky | She has silky hair. | 絹のような手触り |\n| smooth | Her hair feels smooth. | 引っかかりのないなめらかさ |\n| soft | Her hair feels soft. | 柔らかさ |\n| velvety | The fabric feels velvety. | しっとりした柔らかな質感 |\n| sleek | She has sleek hair. | 整った見た目・つや |\n| glossy | She has glossy hair. | 光沢・つや |\n\n「先輩、特に silky・soft・smooth の3つを区別できれば、日常会話で質感をかなり正確に表現できるようになりますよ。」\n\n## 理解確認｜3問\n\nQ1. 『絹のようになめらかな髪』として最も自然なのは？\n\nsilky hairtechnical hairdefective hair\n\nQ2. silky と glossy の違いは？\n\n完全に同じ意味silky は主に絹のような質感、glossy は光沢に注目glossy は柔らかい枕だけを表す\n\nQ3. 『そのスープはなめらかな舌触りです』として自然なのは？\n\nThe soup has a silky texture.The soup has a technical texture.The soup has a buried texture.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- silky：絹のような、なめらかな、すべすべした\n- silk：絹・シルク\n- silky hair：絹のようになめらかな髪\n- silky skin：すべすべした肌\n- silky texture：きめ細かくなめらかな質感・舌触り\n- silky smooth：絹のようにすべすべした\n- smooth：凹凸や引っかかりがない\n- soft：柔らかい\n- velvety：ベルベットのように柔らかい\n- sleek：なめらかで洗練された\n- glossy：光沢のある\n\n一文記憶\n\nHer hair is soft, silky, and glossy.\n\n彼女の髪は柔らかく、絹のようになめらかで、つやがあります。\n\n「先輩、この文では soft が柔らかさ、silky が手触り、glossy が見た目のつやを表しています。」\n\n「同じ髪を説明していても、三つの単語はそれぞれ違う特徴を伝えているんです。ここまで区別できれば、今日の silky はしっかり理解できていますよ。」\n\n次は 第41語｜Fierce です。"}, {"name": "Fierce", "text": "# 第41語｜Fierce\n\n発音：/fɪrs/（フィアース）｜形容詞\n\n「先輩、今日の単語は fierce です。意味は『獰猛な』『激しい』『猛烈な』『闘志の強い』です。」\n\n「ただし、fierce を単に『怖い』と覚えるのは、少しもったいないですよ。」\n\nThe competition is fierce.\n\n競争は非常に激しいです。\n\nShe is a fierce competitor.\n\n彼女は非常に闘志の強い競争相手です。\n\n「先輩、二つの文に共通しているものは何でしょう？」\n\n「それは、相手を圧倒するほどの強い勢いや、簡単には引き下がらない激しさです。」\n\n「fierce は動物だけでなく、競争、怒り、嵐、決意などにも使えます。今日は intense、aggressive、ferocious との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは5つの代表的な使い方を押さえましょう。」\n\n① 獰猛な・どう猛な\n\nA fierce tiger approached.\n\n獰猛なトラが近づいてきました。\n\n「攻撃的で、近づくのが危険なほど激しい様子です。」\n\n② 競争・戦いが激しい\n\nCompetition in the industry is fierce.\n\nその業界の競争は激しいです。\n\n「先輩、ビジネスニュースではこの使い方が非常に重要です。」\n\n③ 怒り・感情が猛烈な\n\nHe felt fierce anger.\n\n彼は激しい怒りを感じました。\n\n「感情の勢いが非常に強いことを表します。」\n\n④ 天候・自然現象が激しい\n\nA fierce storm hit the coast.\n\n激しい嵐が沿岸部を襲いました。\n\n「嵐や風、熱などの強烈さにも使えます。」\n\n⑤ 決意・忠誠心などが非常に強い\n\nShe is fiercely loyal to her friends.\n\n彼女は友人たちに対して非常に強い忠誠心を持っています。\n\n「先輩、fierce は悪い意味だけではありません。強い意志や、何かを守ろうとする姿勢を肯定的に表すこともあるんです。」\n\n核イメージ：相手を圧倒するほど、勢いや意志が激しく強い\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは似た単語を比較します。どれも『激しい』と訳せる場合がありますが、何がどのように強いのかが違うんです。」\n\nfierce\n\nフィアース\n\n核イメージ：相手を圧倒するほど勢いが激しい\n\nThe competition is fierce.\n\n競争は非常に激しいです。\n\n「先輩、fierce は戦い、競争、怒り、意志などの強烈な勢いを表します。」\n\nintense\n\nインテンス\n\n核イメージ：強度・集中度が非常に高い\n\nThe training was intense.\n\nその訓練は非常に厳しいものでした。\n\n「intense は、活動、感情、光、熱、痛みなどの強さを幅広く表します。」\n\nThe competition is intense.\n\n競争は非常に激しいです。\n\n「この文では fierce と意味が重なります。」\n\n「ただし、fierce は争いや対抗する勢いを感じさせやすく、intense は強度そのものに注目します。」\n\nHe felt intense pain.\n\n彼は激しい痛みを感じました。\n\n「痛みなら intense が自然ですね。」\n\naggressive\n\nアグレッシヴ\n\n核イメージ：自分から強く攻める・積極的に仕掛ける\n\nThe company adopted an aggressive pricing strategy.\n\nその会社は積極的な価格戦略を採用しました。\n\n「先輩、aggressive は『攻撃的な』だけでなく、ビジネスでは『積極的な』『強気の』という意味にもなります。」\n\nHe became aggressive during the argument.\n\n彼は口論の最中に攻撃的になりました。\n\n「fierce は勢いの激しさ、aggressive は自分から攻める姿勢に注目します。」\n\n「例えば、競争そのものは fierce、その競争で企業が取る戦略は aggressive と表現できます。」\n\nferocious\n\nフェロウシャス\n\n核イメージ：非常に獰猛で、荒々しく激しい\n\nThe animal launched a ferocious attack.\n\nその動物は猛烈な攻撃を仕掛けました。\n\n「ferocious は fierce と非常に近い単語です。」\n\n「ただし、ferocious は特に荒々しさ、凶暴さ、容赦のなさを強く感じさせることがあります。」\n\nThe team made a ferocious comeback.\n\nそのチームは猛烈な反撃を見せました。\n\n「先輩、スポーツでは比喩的に『猛烈な』という意味でも使えますよ。」\n\nviolent\n\nヴァイオレント\n\n核イメージ：暴力的な、または非常に激しく荒々しい\n\nA violent storm struck the region.\n\n激しい嵐がその地域を襲いました。\n\n「violent は、人に使うと『暴力的な』という意味が強くなります。」\n\nThe protest turned violent.\n\n抗議活動は暴力を伴うものになりました。\n\n「先輩、fierce competition は激しい競争ですが、violent competition とすると、実際の暴力を連想させる場合があります。」\n\n「競争が激しいと言いたいだけなら、fierce や intense の方が自然です。」\n\nstrong\n\nストロング\n\n核イメージ：力・能力・影響力などが大きい\n\nShe is a strong candidate.\n\n彼女は有力な候補者です。\n\n「strong は、実力や能力、影響力などの強さを幅広く表します。」\n\nHe is a fierce competitor.\n\n彼は非常に闘志の強い競争相手です。\n\n「strong competitor なら実力が強い競争相手。」\n\n「fierce competitor なら、簡単には引き下がらず、激しく戦う競争相手という印象です。」\n\n「先輩、strong は力の大きさ、fierce は激しい勢い。この違いを覚えてくださいね。」\n\n### 同じ場面で比較\n\n「先輩、企業同士の競争を例に整理しましょう。」\n\n| 単語 | 英文 | 注目するポイント |\n| --- | --- | --- |\n| fierce | Competition is fierce. | 競争の激しい勢い |\n| intense | Competition is intense. | 競争の強度の高さ |\n| aggressive | They use aggressive tactics. | 積極的に攻める姿勢 |\n| ferocious | They launched a ferocious attack. | 猛烈で荒々しい攻撃 |\n| violent | The conflict turned violent. | 暴力を伴う状態 |\n| strong | They are strong competitors. | 競争相手としての実力 |\n\n「先輩、全部を『強い』『激しい』と訳して終わらせず、どこに注目しているのかまで意識しましょう。」\n\n## 理解確認｜3問\n\nQ1. 『その業界の競争は激しい』として自然なのは？\n\nCompetition in the industry is fierce.Competition in the industry is silky.Competition in the industry is buried.\n\nQ2. fierce と aggressive の違いは？\n\n完全に同じ意味fierce は勢いの激しさ、aggressive は自分から攻める姿勢aggressive は天候にしか使えない\n\nQ3. 『その政策は激しい批判に直面した』として自然なのは？\n\nThe policy faced fierce criticism.The policy faced silky criticism.The policy faced soft technology.\n\n## 30秒復習\n\n「先輩、最後に今日の内容を整理しましょう。」\n\n- fierce：獰猛な、激しい、猛烈な、闘志の強い\n- fiercely：激しく、断固として\n- fierceness：激しさ、獰猛さ\n- fierce competition：激しい競争\n- fierce criticism：激しい批判\n- fierce opposition：激しい反対\n- fierce determination：非常に強い決意\n- intense：強度・集中度が高い\n- aggressive：攻撃的な、積極的な\n- ferocious：猛烈で荒々しい\n- violent：暴力的な、激しく荒々しい\n- strong：力や能力が強い\n\n一文記憶\n\nFierce competition requires strong determination.\n\n激しい競争には強い決意が必要です。\n\n「先輩、fierce を見たら、単に『強い』ではなく、相手を圧倒するほど激しく、簡単には引き下がらない勢いを思い浮かべてください。」\n\n「このイメージがあれば、獰猛な動物、激しい競争、強い決意という意味が一つにつながりますよ。」\n\n次は 第42語｜Parcel です。"}, {"name": "Parcel", "text": "# 第42語｜Parcel\n\n発音：/ˈpɑːr.səl/（パーセル）｜名詞・動詞\n\n「先輩、今日の単語は parcel です。基本的な意味は『小包』『荷物』ですが、実は『土地の一区画』や『分割する』という意味もあるんです。」\n\nI received a parcel yesterday.\n\n私は昨日、小包を受け取りました。\n\nThe company purchased a parcel of land.\n\nその会社は一区画の土地を購入しました。\n\n「先輩、荷物と土地では、ずいぶん意味が違うように感じませんか？」\n\n「でも、共通するイメージがあります。それは、全体から区切られた、ひとまとまりのものです。」\n\n「今日は package、packet、shipment、delivery との違いまで理解しましょう。」\n\n4分割理解・記憶シート\n\n## A｜要点\n\n「先輩、まずは代表的な意味を4つ押さえましょう。」\n\n① 小包・荷物\n\nA parcel arrived this morning.\n\n今朝、小包が届きました。\n\n「郵便や宅配便で送られる、包装された荷物のことです。特にイギリス英語でよく使われます。」\n\n② 土地の一区画\n\nThey bought a parcel of land.\n\n彼らは一区画の土地を購入しました。\n\n「土地全体から区切られた、一つのまとまりを表します。」\n\n③ 分割する・小分けにする（動詞）\n\nThe land was parceled out among the heirs.\n\nその土地は相続人たちの間で分割されました。\n\n「parcel out で『分け与える』『分配する』という意味になります。」\n\n④ ～の一部（決まった表現）\n\nStress is part and parcel of the job.\n\nストレスはその仕事につきものです。\n\n「先輩、part and parcel of ～ は『～に不可欠な一部』『～につきもの』という熟語です。」\n\n核イメージ：区切られた一つのまとまり\n\n「荷物なら包装されたひとまとまり、土地なら区画、分配なら全体を小さなまとまりに分けることですね。」\n\n## 類義語・近義語のイメージと使い分け\n\n「先輩、ここからは『荷物』に関係する単語を比較します。」\n\n「parcel と package は意味が近いですが、shipment や delivery は注目しているものが違います。ここを区別しましょう。」\n\nparcel\n\nパーセル\n\n核イメージ：配送するためにまとめられた小包\n\nI received a parcel from my friend.\n\n私は友人から小包を受け取りました。\n\n「先輩、parcel は特にイギリス英語でよく使われる『小包』です。土地の一区画という意味もあります。」\n\npackage\n\nパッキジ\n\n核イメージ：包装されたひとまとまりのもの\n\nA package arrived at my house.\n\n自宅に荷物が届きました。\n\n「package は、特にアメリカ英語で『小包・荷物』としてよく使われます。」\n\n「parcel とほぼ同じ意味で使える場面も多いんです。」\n\n「ただし、package は商品やサービスの『ひとまとめのセット』という意味もあります。」\n\nThe hotel offers a special package.\n\nそのホテルは特別な宿泊プランを提供しています。\n\n「先輩、package は『まとめられたもの』という意味の広がりが大きいんですね。」\n\npacket\n\nパキット\n\n核イメージ：比較的小さな包み・袋\n\nShe opened a packet of sugar.\n\n彼女は砂糖の小袋を開けました。\n\n「先輩、packet は、小さな袋や包みを指すことが多いです。」\n\n「特にイギリス英語では、お菓子や食品の袋などにもよく使われます。」\n\na packet of biscuits\n
